let minuterie = 0, requeteEnCours = 0;
els.recherche.addEventListener('input', function () {
  clearTimeout(minuterie);
  const q = els.recherche.value.trim();
  if (q.length < 3) { els.resultats.textContent = ''; return; }
  minuterie = setTimeout(function () { chercher(q); }, 320);
});

async function chercher(q) {
  const mien = ++requeteEnCours;
  els.resultats.innerHTML = '<p class="vide">Recherche…</p>';
  try {
    const r = await fetch(GEOCODEUR + '?q=' + encodeURIComponent(q) + '&limit=8&index=address,poi');
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (mien !== requeteEnCours) return;
    els.resultats.textContent = '';
    const lieux = (j.features || []);
    if (!lieux.length) { els.resultats.innerHTML = '<p class="vide">Aucun lieu trouvé.</p>'; return; }
    lieux.forEach(function (f) {
      const c = f.geometry && f.geometry.coordinates;
      if (!c) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choix';
      b.textContent = f.properties.label || f.properties.city || '—';
      b.addEventListener('click', function () {
        centrer(c[1], c[0], 1.4); ouvrirTiroir(false); redessiner();
      });
      els.resultats.appendChild(b);
    });
  } catch (e) {
    if (mien !== requeteEnCours) return;
    els.resultats.innerHTML = '<p class="vide">Recherche indisponible — vérifiez le réseau.</p>';
  }
}

/* ---------- ma position ---------- */
els.btnPosition.addEventListener('click', function () {
  if (!navigator.geolocation) {
    annoncer('Localisation indisponible sur cet appareil.'); return;
  }
  els.btnPosition.setAttribute('aria-busy', 'true');
  annoncer('Localisation en cours…');
  navigator.geolocation.getCurrentPosition(function (pos) {
    els.btnPosition.removeAttribute('aria-busy');
    centrer(pos.coords.latitude, pos.coords.longitude, 1.4);
    annonceJusqu = 0;
    ouvrirTiroir(false);          // on est arrivé : le volet n'a plus rien à dire
    redessiner();
  }, function (err) {
    els.btnPosition.removeAttribute('aria-busy');
    annoncer(err.code === 1
      ? 'Localisation refusée — autorisez-la dans le navigateur.'
      : 'Position introuvable. Cherchez le lieu par son nom.');
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
});

els.btnNord.addEventListener('click', function () { tourner(-vue.cap); });

/* =================================================================
   ON OUVRE LÀ OÙ L'ON EST
   =================================================================
   « Quand on ouvre le site, je veux que la première zone soit celle de la
   position GPS du moniteur. » L'application ouvrait sur la dernière carte
   laissée — ou sur le giratoire de Lagny la première fois. En voiture, c'est
   toujours ailleurs que là où l'on est, et il fallait aller chercher sa rue.

   On demande donc la position dès l'ouverture, et on y va. Trois retenues :

   - SI LE DOIGT A DÉJÀ TOUCHÉ LA CARTE, on ne bouge pas. Le GPS peut mettre
     dix secondes à répondre ; sauter ailleurs pendant qu'on trace serait pire
     que de ne rien faire ;
   - LA VOITURE VIENT AVEC, mais seulement sur une planche sans tracé. Une
     trajectoire laissée la veille part d'elle : la déplacer la casserait.
     Sans tracé, en revanche, une voiture restée à Lagny ferait partir le
     premier point posé de l'autre bout de la carte ;
   - CHEZ L'ÉLÈVE, jamais : c'est l'exercice qui choisit où l'on est.

   La position n'est demandée que sur une adresse sûre (https) : sur le réseau
   de la maison, le navigateur la refuse de toute façon. */
let dejaTouche = false;

function ouvrirOuJeSuis() {
  if (modeEleve || !navigator.geolocation || !window.isSecureContext) return;
  navigator.geolocation.getCurrentPosition(function (pos) {
    if (dejaTouche || modeEleve) return;
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    if (!seance.points.length) {
      const p = projeter(lat, lon);
      seance.voiture.x = p.x; seance.voiture.y = p.y;
      seance.voiture.absente = false;
      seance.voiture.repris = false;           // le premier calage reprend la main
      /* En roulant, le GPS donne le cap : la voiture est posée dans le sens
         où l'on va. À l'arrêt il n'en donne pas — le calage sur la route s'en
         chargera. (Boussole : 0 au nord ; ici : 0 à l'est, 90 au sud.) */
      const h = pos.coords.heading;
      if (h != null && !isNaN(h) && (pos.coords.speed || 0) > 1.5) capRepos = h - 90;
      caleSurLaRoute(0);
    }
    centrer(lat, lon, 1.4);
    redessiner();
    annoncer('Vous êtes ici.');
  }, function () {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

/* La voiture posée au point GPS se range dans sa voie dès que les routes du
   secteur sont arrivées. Elles se chargent après le déplacement de la carte :
   on repasse quelques fois, puis on laisse tomber — la voiture reste alors au
   point GPS, ce qui n'est déjà pas loin. */
function caleSurLaRoute(essai) {
  if (dejaTouche || seance.voiture.repris || seance.points.length) return;
  if (reseauPour(seance.voiture)) {
    recalerPrise({ type: 'voiture' }, true);
    redessiner();
    return;
  }
  if (essai < 12) setTimeout(function () { caleSurLaRoute(essai + 1); }, 700);
}

/* =================================================================
   Le doigt : un doigt pose et déplace, deux doigts se déplacent sur
   la carte et l'agrandissent.
   ================================================================= */
const doigts = new Map();
let geste = null;
let glisse = null;          // déplacement de la carte à un seul doigt
let glisseFait = 0;         // combien ce doigt a déjà traîné, en pixels
/* Pixels d'écran en deçà desquels un doigt est considéré comme immobile. */
const GLISSE_MINI = 8;

/* L'APPUI LONG SUR UN POINT OUVRE LE PAVÉ DES VITESSES.

   Il avait été essayé, puis abandonné : sur iOS, un doigt immobile déclenchait
   la loupe du système, qui ANNULE le geste en cours — le minuteur partait avec,
   et rien ne s'ouvrait. Le remplaçant était l'appui simple.

   Deux choses ont changé depuis. Le plateau porte maintenant
   `-webkit-touch-callout:none` et `user-select:none`, qui empêchent cette loupe.
   Et le minuteur ne dépend plus du relâchement : il part tout seul, ouvre le
   pavé, et ce qui arrive ensuite au geste n'y change plus rien.

   C'est aussi le geste que le propriétaire avait demandé dès le départ — « un
   appui long sur le point, on peut rentrer les kilomètres-heure » — et c'est
   plus sûr qu'un appui simple : au doigt, un appui simple sur un point qu'on
   voulait seulement déplacer ouvrirait le pavé à tout bout de champ. */
const APPUI_LONG = 420;      // ms
let minuterieVitesse = 0;

function armerAppuiLong(pris) {
  clearTimeout(minuterieVitesse);
  if (!pris || (pris.type !== 'point' && pris.type !== 'pointObstacle'
                && pris.type !== 'obstacle')) return;
  minuterieVitesse = setTimeout(function () {
    if (!saisie || saisie !== pris || saisie.bouge) return;
    saisie.ouvert = true;            // le doigt ne déplacera plus rien
    if (pris.type === 'obstacle') ouvrirChoixVehicule(pris.i);
    else ouvrirChoixVitesse(pris);
  }, APPUI_LONG);
}
let pointNeuf = false;

function majCurseur() {
  els.plateau.classList.toggle('main', outil === 'main');
  els.plateau.classList.remove('tire');
}

/* La loupe : un rond posé au-dessus du doigt, qui montre agrandi ce que le
   doigt cache. Poser un point au doigt, c'est viser un endroit qu'on ne voit
   plus au moment où on le touche — et une trajectoire se joue au mètre.

   Elle ne déplace rien et ne change aucune règle : elle montre, c'est tout.
   Le contenu est le MÊME calque monde, repris par `<use>` : rien n'est
   recalculé, le navigateur redessine la portion découpée. */
const LOUPE = { rayon: 58, zoom: 2.4, ecart: 96 };

function majLoupe(ev) {
  if (!ev) { els.loupe.setAttribute('hidden', ''); return; }
  const q = versEcran(ev);
  const r = LOUPE.rayon;
  /* Au-dessus du doigt, sauf tout en haut de l'écran où elle passe dessous. */
  let cy = q.y - LOUPE.ecart;
  if (cy - r < 8) cy = q.y + LOUPE.ecart;
  const cx = Math.max(r + 8, Math.min(largeur - r - 8, q.x));
  [els.loupeFond, els.loupeBord, els.loupeCoupeCercle].forEach(function (e) {
    e.setAttribute('cx', cx.toFixed(1)); e.setAttribute('cy', cy.toFixed(1));
  });
  els.loupeMonde.setAttribute('href', '#monde');
  els.loupeMonde.setAttribute('transform',
    'translate(' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ') scale(' + LOUPE.zoom + ') '
    + 'translate(' + (-q.x).toFixed(2) + ' ' + (-q.y).toFixed(2) + ')');
  // une croix au centre : le point visé, celui qui est sous le doigt
  const b = 11;
  els.loupeCroix.setAttribute('d',
    'M' + (cx - b).toFixed(1) + ' ' + cy.toFixed(1) + 'h' + (b - 3)
    + 'M' + (cx + 3).toFixed(1) + ' ' + cy.toFixed(1) + 'h' + (b - 3)
    + 'M' + cx.toFixed(1) + ' ' + (cy - b).toFixed(1) + 'v' + (b - 3)
    + 'M' + cx.toFixed(1) + ' ' + (cy + 3).toFixed(1) + 'v' + (b - 3));
  els.loupe.removeAttribute('hidden');
}

function versMonde(ev) {
  const m = els.monde.getScreenCTM();
  if (!m) return null;
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
  return { x: p.x + ancre.x, y: p.y + ancre.y };
}
function versEcran(ev) {
  const r = els.plateau.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

function chercherPrise(c) {
  /* EN ESSAI, LE DOIGT NE VOIT QUE SON TRACÉ. Le décor — véhicules, panneaux,
     camemberts, la voiture au départ — appartient à l'exercice : le déplacer,
     ce serait changer la question en même temps qu'on y répond. */
  if (vueEleve) {
    let m = null, dm = auDoigt(LV * 0.68);
    /* SES carrés aussi : un appui de travers sur la télécommande posait un
       geste dont on ne pouvait plus se défaire — ni à la gomme, ni par ↶.
       « En exercice un élève ne peut pas supprimer les carrés. » */
    if (etat === 'arret' && chemin) {
      essai.gestes.forEach(function (g, i) {
        const q = posGeste(g);
        const d = Math.hypot(q.x - c.x, q.y - c.y);
        if (d < dm) { dm = d; m = { type:'geste', i:i }; }
      });
    }
    essai.points.forEach(function (p, i) {
      if (p.auto && outil !== 'main' && outil !== 'gomme') return;
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < dm) { dm = d; m = { type:'point', i:i }; }
    });
    return m;
  }
  // la poignée passe avant tout le reste : elle est posée par-dessus l'objet
  const cib = cibleRotation();
  if (cib) {
    const h = positionPoignee();
    if (Math.hypot(h.x - c.x, h.y - c.y) < cib.R * 0.52) return { type:'rotation' };
  }
  /* Les poignées du camembert passent avant tout le reste : elles sont petites,
     et posées sur un objet qui, lui, est grand. Le DEDANS de la part, en
     revanche, ne prend rien : on doit pouvoir poser un point et attraper un
     véhicule au travers, sinon la part masquerait la scène qu'elle commente. */
  const gr = grippeCam();
  for (let i = seance.camemberts.length - 1; i >= 0; i--) {
    const cm = seance.camemberts[i];
    for (let k = 0; k < 3; k++) {
      const b = boutCam(cm, k);
      if (Math.hypot(b.x - c.x, b.y - c.y) < gr)
        return k === 2 ? { type:'camArc', i:i } : { type:'camBord', i:i, k:k };
    }
    if (Math.hypot(cm.x - c.x, cm.y - c.y) < gr) return { type:'camPointe', i:i };
  }

  let meilleur = null, dmin = auDoigt(LV * 0.68);

  /* LES GESTES NE S'ATTRAPENT QU'EN ÉDITION. Ils ne sont même pas dessinés
     pendant la lecture : rien du montage ne doit rester à l'écran, et rien ne
     doit pouvoir bouger par mégarde pendant qu'on montre. */
  if (etat === 'arret' && chemin) {
    mesGestes().forEach(function (g, i) {
      const q = posGeste(g);
      const d = Math.hypot(q.x - c.x, q.y - c.y);
      if (d < dmin) { dmin = d; meilleur = { type:'geste', i:i }; }
    });
  }

  /* Quand un véhicule obstacle est sélectionné, le doigt ne voit QUE lui et sa
     propre trajectoire. Sans ce cloisonnement, peupler un giratoire est
     impossible : chaque point posé tombe sur le tracé du voisin, l'attrape au
     lieu d'en créer un, et change de véhicule sans prévenir.

     La voiture auto-école, elle, reste TOUJOURS attrapable : c'est par elle
     qu'on revient à sa propre trajectoire. */
  const gris = obstacleActif >= 0;

  if (!gris) {
    seance.points.forEach(function (p, i) {
      /* Un point semé par le suivi de route n'est pas une cible — sauf avec la
         MAIN. Avec l'outil point, une rue suivie serait un collier de perles où
         l'on ne peut plus rien poser ; avec la main, on ne pose rien, on
         corrige. Et quand la route est mal tracée dans OpenStreetMap — ça
         arrive, et aucun calcul ne le rattrape — c'est le seul moyen de remettre
         le tracé où il doit être. */
      if (p.auto && outil !== 'main' && outil !== 'gomme') return;
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < dmin) { dmin = d; meilleur = { type:'point', i:i }; }
    });
  }
  if (!seance.voiture.absente) {
    const dv = Math.hypot(seance.voiture.x - c.x, seance.voiture.y - c.y);
    if (dv < dmin) { dmin = dv; meilleur = { type:'voiture' }; }
  }

  /* Un obstacle s'attrape sur sa propre taille : un camion est long, un piéton
     tient dans un mouchoir. On les passe en dernier pour qu'ils ne volent pas la
     prise à un point de trajectoire posé dessus. */
  seance.obstacles.forEach(function (ob, i) {
    const o = obstacleDe(ob.t);
    const r = auDoigt(Math.max(LV * 0.45, (o.L / mParU) * 0.52));
    const dd = Math.hypot(ob.x - c.x, ob.y - c.y);
    if (dd < r && (!meilleur || dd < dmin)) { dmin = dd; meilleur = { type:'obstacle', i:i }; }
    if (gris && i !== obstacleActif) return;      // les points des autres ne se touchent pas

    (ob.points || []).forEach(function (p, j) {
      const d2 = Math.hypot(p.x - c.x, p.y - c.y);
      if (d2 < auDoigt(LV * 0.68) && (!meilleur || d2 < dmin)) {
        dmin = d2; meilleur = { type:'pointObstacle', i:i, j:j };
      }
    });
  });
  /* Les panneaux en dernier, comme les véhicules : posés sur la trajectoire,
     ils ne doivent pas voler la prise au point qu'on visait. En mode
     trajectoire de véhicule, ils ne se touchent pas du tout — on trace. */
  if (!gris) {
    /* La cible d'un panneau, au doigt : sa demi-taille ne fait que 13 px au
       zoom courant. Le doigt tombait à côté, aucun panneau n'était trouvé, et
       avec l'outil feu actif l'appui en POSAIT UN NOUVEAU au lieu d'ouvrir le
       choix de couleur de celui qu'on visait. */
    const rp = auDoigt(taillePanneau() * 0.5);
    seance.panneaux.forEach(function (q, i) {
      const d = Math.hypot(q.x - c.x, q.y - c.y);
      if (d < rp && (!meilleur || d < dmin)) { dmin = d; meilleur = { type:'panneau', i:i }; }
    });
    /* Le relevé en tout dernier. Il ne se prend PAS d'un simple appui — il
       n'appartient pas à la scène — mais un double appui le fait passer de
       notre côté (voir le pointerdown). */
    if (!meilleur) panneauxOSM().forEach(function (q) {
      if (!montre(q.signe)) return;
      const w = positionPanneau(q);
      const d = Math.hypot(w.x - c.x, w.y - c.y);
      if (d < rp && (!meilleur || d < dmin)) { dmin = d; meilleur = { type:'panneauOSM', q:q, w:w }; }
    });
  }
  return meilleur;
}

function demarrerGeste() {
  const l = [...doigts.values()];
  const a = versEcran(l[0]), b = versEcran(l[1]);
  geste = { d: Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)),
            cx: (a.x+b.x)/2, cy: (a.y+b.y)/2,
            ang: Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI,
            tourne: false };
}

/* LA TÉLÉCOMMANDE RÉPOND À L'APPUI, PAS AU CLIC.

   « Sur le téléphone, quand j'appuie sur play, je peux pas mettre le cligno ou
   les rétros, il prend pas les deux touchers. »

   Deux causes, et il fallait les deux pour que ça marche. D'abord
   `touch-action:manipulation` sur les touches, sans quoi le navigateur retient
   le second doigt le temps de voir s'il commence un pincement. Ensuite le
   `click` lui-même : il n'arrive qu'au RELÂCHEMENT, et un clic issu d'un second
   doigt pendant qu'un premier est tenu se perd facilement.

   L'appui, lui, part tout de suite — ce qui est aussi ce qu'on veut d'une
   télécommande : le clignotant se met À L'INSTANT où le pouce touche, pas quand
   il se relève. Le clavier reste servi à part, pour qui pilote à l'ordinateur. */
function surAppui(b, faire) {
  b.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();          // pas de clic de compatibilité derrière
    ev.stopPropagation();
    faire();
  });
  /* Entrée seulement : la barre d'espace est la pédale, partout et sans
     exception — même quand une touche de la télécommande a le focus. */
  b.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    ev.preventDefault(); ev.stopPropagation(); faire();
  });
}

surAppui(els.clignoG, () => poserCligno('gauche'));
surAppui(els.clignoD, () => poserCligno('droite'));
els.telecommande.querySelectorAll('[data-geste]').forEach(function (b) {
  surAppui(b, function () { poserGeste(b.dataset.geste, b.dataset.cote); });
});

els.trottoirs.querySelectorAll('[data-trottoirs]').forEach(function (b) {
  b.addEventListener('click', function () {
    montrerTrottoirs = b.dataset.trottoirs === 'oui';
    els.trottoirs.querySelectorAll('[data-trottoirs]').forEach(function (a) {
      a.setAttribute('aria-pressed', String((a.dataset.trottoirs === 'oui') === montrerTrottoirs));
    });
    if (montrerTrottoirs)
      lireParcelles(caseVisee).then(function () { redessiner(); },
                                    function () { annoncer('Cadastre indisponible ici.'); });
    majSource();
    redessiner();
  });
});

els.axes.querySelectorAll('[data-axes]').forEach(function (b) {

    });

els.suivis.querySelectorAll('[data-suivi]').forEach(function (b) {
  b.addEventListener('click', function () {
    suivreRoute = b.dataset.suivi === 'oui';

els.encarts.querySelectorAll('[data-encart]').forEach(function (b) {

      a.setAttribute('aria-pressed', String((a.dataset.encart === 'oui') === encart));

    majCommandes(); placerVoiture();

els.plateau.addEventListener('pointerdown', function (ev) {
  if (consigneOuverte) { ev.preventDefault(); return; }
  dejaTouche = true;
  if (ev.target.closest('.flottant, .pile')) return;
  if (!els.tiroir.hidden) return;
  ev.preventDefault();
  doigts.set(ev.pointerId, ev);

  if (doigts.size === 2) {
    majLoupe(null);                       // deux doigts : on cadre, on ne pose plus
    if (pointNeuf && saisie && saisie.type === 'point') {
      mesPoints().splice(saisie.i, 1);
      redessiner();
    }
    saisie = null; pointNeuf = false; glisse = null;
    els.plateau.classList.remove('tire');
    demarrerGeste();
    return;
  }
  if (doigts.size > 2) return;

  // à la souris, le bouton du milieu ou de droite déplace la carte
  if (ev.pointerType === 'mouse' && ev.button !== 0) { geste = null; return; }

  /* POUSSER LA VOITURE. Le doigt posé dessus pendant l'animation la fait
     avancer le long de son tracé, et la scène entière avec. C'est ce qui rend
     le rythme au moniteur : on avance de trois mètres, on explique, on repart.
     La lecture passe en pause d'elle-même — on ne se bat pas avec le moteur. */
  if ((etat === 'lecture' || etat === 'pause' || etat === 'fin') && chemin) {
    const c0 = versMonde(ev), q0 = surChemin(s);
    if (c0 && Math.hypot(c0.x - q0.x, c0.y - q0.y) < auDoigt(LV * 0.7)) {
      /* `arreterRejeu()` s'appelait ici — le rejeu image par image est parti
         avec le bouton ⏺, mais l'appel est resté. Il levait une ReferenceError
         à chaque doigt posé sur la voiture pendant la lecture, ce qui coupait
         le reste du geste : pousser la voiture ne marchait plus du tout. */
      try { els.plateau.setPointerCapture(ev.pointerId); } catch (e) {}
      if (etat === 'lecture') {
        if (trame) cancelAnimationFrame(trame);
        trame = 0; etat = 'pause';
      }
      pousse = true; suivi = false;      // le doigt tient la voiture : la carte ne bouge plus
      els.plateau.classList.add('tire');
      majCommandes();
      return;
    }
  }

  try { els.plateau.setPointerCapture(ev.pointerId); } catch (e) {}

  const c = versMonde(ev);
  if (!c) return;
  let prise = chercherPrise(c);

  /* PENDANT L'ANIMATION, ON PEUT RETOUCHER. Attraper un point, un véhicule, un
     panneau, et le déplacer : la trajectoire se refait sous les yeux et la
     voiture reste où elle en est. C'est le cas courant en leçon — on voit que
     le tracé passe deux mètres trop à gauche, on le corrige, on continue.

     Ce qu'on ne peut pas, c'est en CRÉER : la palette n'est pas à l'écran, et
     un doigt sur le vide doit déplacer la carte, pas semer des points qu'on ne
     verrait pas venir. Pour ajouter, on appuie sur ⏹.

     Premier jet : tout était gelé, et seul l'outil main déplaçait la carte —
     si bien qu'avec un outil de tracé en poche, la carte était clouée. */
  if (etat !== 'arret') {
    if (prise && prise.type !== 'rotation') {
      saisie = prise; pointNeuf = false; memoriserAvant(saisie);
      saisie.ecran0 = versEcran(ev);
      if (!pointNeuf) armerAppuiLong(saisie);
      if (prise.type === 'obstacle' || prise.type === 'pointObstacle') obstacleActif = prise.i;
      else if (prise.type === 'voiture' || prise.type === 'point') obstacleActif = -1;
      majLoupe(ev);
      return;
    }
    glisse = versEcran(ev); glisseFait = 0;
    els.plateau.classList.add('tire');
    return;
  }

  /* Avec l'outil trajectoire, toucher le véhicule DÉJÀ choisi pose un point sur
     lui : c'est ainsi qu'on ferme un circuit. Toucher un AUTRE véhicule le
     choisit, comme d'habitude. Déplacer un véhicule se fait alors avec la main
     ou avec son propre outil — l'outil trajectoire, lui, trace. */
  if (prise && prise.type === 'obstacle' && prise.i === obstacleActif
      && outil === 'point') prise = null;

  if (outil === 'gomme') {
    /* La gomme efface un objet à la fois : on tape ce qu'on veut retirer.

       La voiture auto-école aussi, depuis qu'elle est un véhicule comme les
       autres. Elle était protégée parce qu'elle est le DÉPART du trajet — mais
       protéger n'expliquait rien : on tapait dessus avec la gomme et il ne se
       passait strictement rien. Elle s'efface donc, et sa trajectoire avec
       elle, puisque celle-ci partait d'elle. On la repose depuis la palette. */
    if (prise && prise.type === 'voiture') {
      /* On vide la liste SANS la remplacer : le journal tient les tableaux par
         référence, et un tableau neuf laisserait ses entrées dans le vide. */
      const l = seance.points, anciens = l.slice();
      seance.voiture.absente = true;
      l.length = 0;
      obstacleActif = -1;
      noter(function () {
        seance.voiture.absente = false;
        anciens.forEach(function (p) { l.push(p); });
      });
      annoncer('Voiture auto-école retirée — reposez-la depuis la palette Véhicule.');
    }
    else if (prise && prise.type === 'point') {
      const l = mesPoints(), i = prise.i, p = l[i];
      /* UN SUIVI DE ROUTE S'EFFACE D'UN SEUL COUP.

         Les points semés par la route portent tous le MÊME numéro d'ordre : ils
         ont été posés d'un seul appui, ils s'effacent d'un seul aussi. Les
         effacer un par un, ce ne serait pas une action, ce serait une punition
         — une rue suivie en sème un tous les neuf mètres.

         Et jusqu'ici il n'y en avait aucune : le doigt ne les voyait qu'avec la
         MAIN, donc on pouvait les déplacer, mais pas les retirer. Un coude au
         milieu du tracé, et rien à faire — « j'ai aucune action sur ça ». */
      let a = i, b = i;
      if (p.auto) {
        const o = p.ordre || 0;
        while (a > 0 && l[a-1].auto && (l[a-1].ordre || 0) === o) a--;
        while (b + 1 < l.length && l[b+1].auto && (l[b+1].ordre || 0) === o) b++;
      }
      const retires = l.slice(a, b + 1);
      l.splice(a, retires.length);
      noter(function () {
        Array.prototype.splice.apply(l, [a, 0].concat(retires));
      });
      if (p.auto) annoncer(retires.length > 1
        ? retires.length + ' points du suivi de route retirés — la ligne est droite entre vos deux points.'
        : 'Point du suivi de route retiré — la ligne est droite.');
    }
    else if (prise && prise.type === 'pointObstacle') {
      seance.obstacles[prise.i].points.splice(prise.j, 1);
      majCircuit(seance.obstacles[prise.i]);
    }
    else if (prise && prise.type === 'obstacle') {
      seance.obstacles.splice(prise.i, 1); obstacleActif = -1;
    }
    else if (prise && prise.type === 'geste') {
      const l = mesGestes(), i = prise.i, g = l[i];
      l.splice(i, 1);
      noter(function () { l.splice(i, 0, g); rangerGestes(); });
    }
    else if (prise && prise.type === 'panneau') {
      const i = prise.i, q = seance.panneaux[i];
      seance.panneaux.splice(i, 1);
      if (q && q.deOSM) reprisOSM.delete(q.deOSM);
      noter(function () {
        seance.panneaux.splice(i, 0, q);
        if (q && q.deOSM) reprisOSM.add(q.deOSM);
      });
    }
    else if (prise && prise.type.slice(0, 3) === 'cam') {
      const i = prise.i, cm = seance.camemberts[i];
      seance.camemberts.splice(i, 1);
      noter(function () { seance.camemberts.splice(i, 0, cm); });
    }
    else {
      /* Le camembert s'efface en tapant DEDANS : viser une poignée pour le
         retirer serait un jeu d'adresse. Il passe en dernier pour qu'un
         véhicule posé dessus s'efface en premier — c'est celui-là qu'on visait. */
      const i = camembertSous(c);
      if (i >= 0) {
        const cm = seance.camemberts[i];
        seance.camemberts.splice(i, 1);
        noter(function () { seance.camemberts.splice(i, 0, cm); });
      }
    }
    saisie = null; retoucher(); return;
  }

  /* DOUBLE APPUI sur un panneau : on le reprend en main.

     Sur un panneau relevé, il quitte le relevé et devient nôtre — c'est la
     seule façon de rattraper un déport qui tombe à côté. Sur un panneau déjà
     posé, il cesse d'être recalé : le geste qui suit le laisse exactement où on
     le met. Dans les deux cas le doigt est déjà dessus, donc on peut le traîner
     dans la foulée, sans relâcher. */
  if (prise && (prise.type === 'panneau' || prise.type === 'panneauOSM')) {
    const cle = prise.type === 'panneauOSM' ? 'osm:' + prise.q.id : 'moi:' + prise.i;
    const deux = cle === appuiPrecedent.cle
              && performance.now() - appuiPrecedent.t < DOUBLE_APPUI;
    appuiPrecedent = { cle: cle, t: performance.now() };

    if (prise.type === 'panneauOSM') {
      if (!deux) prise = null;          // un simple appui glisse au travers du relevé
      else {
        reprisOSM.add(prise.q.id);
        seance.panneaux.push({ x: prise.w.x, y: prise.w.y, t: prise.q.signe,
                               cap: prise.q.capFleche, repris: true,
                               deOSM: prise.q.id, ordre: ++compteurPose });
        prise = { type:'panneau', i: seance.panneaux.length - 1 };
        annoncer('Panneau repris — vous pouvez le déplacer.');
      }
    } else if (deux) {
      seance.panneaux[prise.i].repris = true;
      annoncer('Panneau libéré — il restera où vous le posez.');
    }
  }


  /* Un sens unique déjà posé, touché avec l'outil sens unique : sa flèche se
     retourne. L'application devine le sens au moment de la pose, d'après le
     bord choisi ; quand elle se trompe, un appui suffit.
     `change` dit au relâchement que ce geste réglait le panneau et ne le
     déplaçait pas : sans ça le recalage repasserait derrière et remettrait la
     flèche comme il l'avait devinée. */
  if (prise && prise.type === 'panneau' && estFleche(outil)
      && estFleche(seance.panneaux[prise.i].t)) {
    const q = seance.panneaux[prise.i];
    q.cap = (q.cap || 0) + 180; prise.change = true;
  }

  /* En essai, on ne pose que sa trajectoire : le reste est la question, et on
     ne réécrit pas la question pendant qu'on y répond. */
  if (vueEleve && !prise && outil !== 'main'
      && (outil === AUTOECOLE || estObstacle(outil) || estPanneau(outil)
          || outil === 'camembert')) {
    annoncer('Essai : on ne pose que sa trajectoire — le décor est celui de l’exercice.');
    return;
  }

  if (prise) {
    // un point, un obstacle ou la voiture se prend au doigt, quel que soit l'outil
    saisie = prise; pointNeuf = false; memoriserAvant(saisie);
      saisie.ecran0 = versEcran(ev);
      if (!pointNeuf) armerAppuiLong(saisie);
    if (prise.type === 'obstacle' || prise.type === 'pointObstacle') obstacleActif = prise.i;
    /* Toucher la voiture auto-école ou l'un de ses points, c'est revenir à
       elle : les points suivants seront les siens. */
    else if (prise.type === 'voiture' || prise.type === 'point') obstacleActif = -1;
  } else if (outil === AUTOECOLE) {
    /* Il n'y en a qu'une : on la DÉPLACE, on ne l'ajoute pas. Les points déjà
       posés restent où ils sont — c'est le départ du trajet qui bouge, et la
       trajectoire se recalcule depuis là. */
    seance.voiture.x = c.x; seance.voiture.y = c.y;
    seance.voiture.repris = false;      // reposée : le recalage reprend la main
    seance.voiture.absente = false;     // et elle revient si on l'avait effacée
    obstacleActif = -1;                 // et c'est d'elle qu'on s'occupe désormais
    saisie = { type:'voiture' };
    pointNeuf = false;
  } else if (estObstacle(outil)) {
    /* Posé là où le doigt l'a mis, et nulle part ailleurs. Il prend le cap de la
       voiture auto-école pour ne pas arriver de travers, et la poignée fait le
       reste — c'est un choix de mise en scène, pas de règle de circulation. */
    seance.obstacles.push({ x:c.x, y:c.y, cap:capRepos, t:outil,
                            couleur:couleurLibre(), points:[], s:0,
                            ordre: ++compteurPose });
    obstacleActif = seance.obstacles.length - 1;
    saisie = { type:'obstacle', i:obstacleActif };
    pointNeuf = false;
  } else if (estPanneau(outil)) {
    /* Posé où le doigt le met, et nulle part ailleurs : un panneau n'a pas de
       voie à respecter, et le moniteur sait où il veut le montrer. */
    seance.panneaux.push({ x:c.x, y:c.y, t:outil, ordre: ++compteurPose });
    saisie = { type:'panneau', i:seance.panneaux.length - 1 };
    pointNeuf = true;
  } else if (outil === 'camembert') {
    /* La pointe se pose où le doigt appuie, et on TIRE pour donner la direction
       et la portée : un seul geste dessine la part, comme au tableau.
       Un simple appui, sans tirer, la pose à GAUCHE de la voiture, à la portée
       par défaut : dans un giratoire, celui qui a la priorité arrive par là. */
    const cm = { x:c.x, y:c.y, a1:0, a2:CAMEMBERT.ouverture, R:0,
                 ordre: ++compteurPose };
    /* Posé sur un giratoire connu : la pointe va d'elle-même au CENTRE et le
       rayon prend celui de l'anneau. Viser le centre au doigt, sur un
       téléphone, était le geste le plus pénible de l'outil — et depuis que la
       ligne d'engagement vient du giratoire lui-même, cette position n'a plus
       aucun effet sur la règle : elle n'est plus qu'un repère à l'écran.
       Il ne reste alors qu'à tourner le secteur du côté d'où arrive la
       circulation. */
    const tour = giratoireSous(c, true);
    if (tour) { cm.x = tour.centre.x; cm.y = tour.centre.y; }
    orienterCam(cm, capRepos - 90,
                tour ? tour.rayonExt : CAMEMBERT.portee / mParU);
    if (tour) annoncer('Camembert posé sur le giratoire — tournez-le vers la circulation.');
    seance.camemberts.push(cm);
    saisie = { type:'camArc', i:seance.camemberts.length - 1 };
    pointNeuf = false;
  } else if (outil === 'main') {
    // main, sur le vide : c'est la carte qui suit le doigt
    glisse = versEcran(ev); glisseFait = 0;
    els.plateau.classList.add('tire');
    return;
  } else {
    /* LE POINT VA AU VÉHICULE SÉLECTIONNÉ. C'est ce qui remplace les quatre
       outils de trajectoire : on touche un véhicule, on pose ses points ; on
       touche la voiture auto-école, on revient aux siens. Rien à choisir dans
       un menu, et on sait toujours pour qui l'on trace — c'est le véhicule
       dont la trajectoire est en trait plein. */
    /* En essai, il n'y a pas de véhicule à qui donner un point : le doigt ne
       peut plus en choisir un, et celui d'avant a été lâché à l'entrée. */
    const ob = vueEleve ? null : seance.obstacles[obstacleActif];
    const liste = ob ? ob.points : mesPoints();
    const ordre = ++compteurPose;

    /* Entre le dernier point et celui-ci, on suit la route. Les points semés
       portent le MÊME numéro d'ordre : ils ont été posés d'un seul geste, et
       ↶ doit les reprendre d'un seul geste. */
    const depart = liste.length ? liste[liste.length - 1] : (ob || seance.voiture);
    const suivi = pointsSurRoute(depart, c);
    if (suivi) suivi.etapes.forEach(function (e) {
      liste.push({ x:e.x, y:e.y, v:null, auto:true, ordre:ordre });
    });

    /* Le point posé rejoint la voie du tronçon quand il en était tout près :
       `surRoute` dit au recalage de ne pas le déplacer une seconde fois, avec
       sa propre idée de la voie la plus proche. */
    const bout = suivi && suivi.fin ? suivi.fin : c;
    liste.push({ x:bout.x, y:bout.y, v:null, ordre:ordre,
                 surRoute: !!(suivi && suivi.fin) });
    saisie = ob ? { type:'pointObstacle', i:obstacleActif, j:liste.length - 1 }
                : { type:'point', i:liste.length - 1 };
    pointNeuf = true;
  }
  retoucher();
  if (saisie) majLoupe(ev);      // on pose ou on attrape : on montre ce qu'on cache
});

els.plateau.addEventListener('pointermove', function (ev) {
  if (!doigts.has(ev.pointerId)) return;
  /* Un « pointerup » perdu — menu contextuel, geste système, fenêtre qui
     passe au second plan — laisserait le point collé au curseur et le ferait
     glisser à chaque survol. Si plus aucun bouton n'est enfoncé, on relâche. */
  if (ev.pointerType === 'mouse' && ev.buttons === 0) { relacher(ev); return; }
  doigts.set(ev.pointerId, ev);

  if (geste && doigts.size >= 2) {
    const l = [...doigts.values()];
    const a = versEcran(l[0]), b = versEcran(l[1]);
    const d = Math.max(1, Math.hypot(b.x-a.x, b.y-a.y));
    const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
    deplacer(cx - geste.cx, cy - geste.cy);
    geste.cx = cx; geste.cy = cy;

    /* Rotation : seulement au-delà d'un quart de tour de poignet franc,
       sinon chaque pincement ferait pivoter la carte par accident. */
    const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI;
    let ecart = ((ang - geste.ang + 540) % 360) - 180;
    if (!geste.tourne && Math.abs(ecart) > 12) geste.tourne = true;
    if (geste.tourne) { tourner(ecart); geste.ang = ang; }

    zoomer(d / geste.d, cx, cy);
    geste.d = d;
    return;
  }
  if (pousse) { glisserVoiture(ev); return; }
  if (glisse) {
    const q = versEcran(ev);
    deplacer(q.x - glisse.x, q.y - glisse.y);
    /* Seul un vrai déplacement coupe le suivi de la voiture — pas le zoom, ni
       un simple appui. Et il faut que le doigt ait franchement traîné : sinon
       le premier doigt d'un pincement suffirait à le couper, alors que le
       moniteur voulait seulement s'approcher. */
    glisseFait += Math.hypot(q.x - glisse.x, q.y - glisse.y);
    if (glisseFait > GLISSE_MINI) suivi = false;
    glisse = q;
    cadrer();
    return;
  }

  if (!saisie) return;
  const c = versMonde(ev);
  if (!c) return;

  /* UN DOIGT NE TIENT PAS EN PLACE.

     N'importe quel `pointermove` déclarait un glissement. À la souris c'est
     vrai ; au doigt, non — un appui posé bouge toujours de un à trois pixels,
     et l'appui était donc TOUJOURS lu comme un déplacement. Sur téléphone, le
     pavé des vitesses ne s'ouvrait jamais : « quand je clique sur un point pour
     régler la vitesse ça marche pas ». Il marchait sur ordinateur, où la souris
     reste immobile — ce qui l'a fait passer inaperçu.

     En deçà de ce seuil, on ne bouge rien et on ne déclare rien : l'appui reste
     un appui. Le seuil est celui qui sert déjà à couper le suivi de la voiture,
     pour que les deux gestes aient la même tolérance. */
  if (saisie.ouvert) return;            // le pavé est ouvert : on ne traîne plus le point
  if (saisie.ecran0 && !saisie.bouge) {
    const e = versEcran(ev);
    if (Math.hypot(e.x - saisie.ecran0.x, e.y - saisie.ecran0.y) <= GLISSE_MINI) return;
    clearTimeout(minuterieVitesse);     // ça glisse : ce n'est plus un appui long
  }

  if (saisie.type === 'rotation') {
    const cib = cibleRotation();
    if (cib) {
      const a = Math.atan2(c.y - cib.p.y, c.x - cib.p.x) * 180 / Math.PI;
      if (cib.p === seance.voiture) capRepos = a; else cib.p.cap = a;
    }
  } else if (saisie.type === 'geste') {
    /* Le doigt va où il veut ; le geste, lui, reste sur le tracé. On ne range
       la liste qu'au relâcher : trier pendant qu'on tire changerait l'indice
       sous le doigt. */
    const g = mesGestes()[saisie.i];
    if (g) g.s = absciseProche(c);
  }
  else if (saisie.type === 'voiture') { seance.voiture.x = c.x; seance.voiture.y = c.y; }
  else if (saisie.type === 'obstacle') {
    const ob = seance.obstacles[saisie.i];
    if (ob) { ob.x = c.x; ob.y = c.y; }
  }
  else if (saisie.type === 'pointObstacle') {
    const ob = seance.obstacles[saisie.i];
    const p = ob && ob.points[saisie.j];
    if (p) { p.x = c.x; p.y = c.y; }
  }
  else if (saisie.type === 'panneau') {
    const q = seance.panneaux[saisie.i];
    if (q) { q.x = c.x; q.y = c.y; }
  }
  else if (saisie.type === 'camPointe') {
    const cm = seance.camemberts[saisie.i];
    if (cm) { cm.x = c.x; cm.y = c.y; }
  }
  else if (saisie.type === 'camArc') {
    const cm = seance.camemberts[saisie.i];
    const d = cm ? Math.hypot(c.x - cm.x, c.y - cm.y) : 0;
    /* Trop près de la pointe, la direction n'a plus de sens et la part
       tressauterait : on la laisse telle quelle. C'est aussi ce qui fait qu'un
       simple appui, qui bouge toujours un peu, garde la part par défaut. */
    if (cm && d >= rayonMiniCam())
      orienterCam(cm, Math.atan2(c.y - cm.y, c.x - cm.x) * 180 / Math.PI, d);
  }
  else if (saisie.type === 'camBord') {
    /* Un bord se règle SEUL, l'autre ne bouge pas : c'est ainsi qu'on fait
       tenir la part entre la branche d'où arrive la circulation et celle par
       laquelle on entre. Les bornes empêchent de la refermer sur elle-même —
       sans elles, un bord poussé au-delà de l'autre retournerait la part. */
    const cm = seance.camemberts[saisie.i];
    if (cm) {
      const a = angleNorm(Math.atan2(c.y - cm.y, c.x - cm.x) * 180 / Math.PI);
      const ouv = saisie.k === 0 ? angleNorm(cm.a2 - a) : angleNorm(a - cm.a1);
      if (ouv >= CAMEMBERT.mini && ouv <= CAMEMBERT.maxi) {
        if (saisie.k === 0) cm.a1 = a; else cm.a2 = a;
      }
    }
  }
  else { const l = mesPoints(); l[saisie.i].x = c.x; l[saisie.i].y = c.y; }
  saisie.bouge = true;      // voir recalerPrise : un appui sans glissement ne recale rien

  majLoupe(ev);
  retoucher();
});

function relacher(ev) {
  majLoupe(null);
  clearTimeout(minuterieVitesse);      // relâché avant l'heure : pas d'appui long
  if (pousse) {
    pousse = false; els.plateau.classList.remove('tire');
    try { els.plateau.releasePointerCapture(ev.pointerId); } catch (e) {}
  }
  doigts.delete(ev.pointerId);
  if (doigts.size < 2) geste = null;
  if (glisse) { glisse = null; els.plateau.classList.remove('tire'); }
  if (!saisie) return;
  const pris = saisie, neuf = pointNeuf;
  saisie = null; pointNeuf = false;
  try { els.plateau.releasePointerCapture(ev.pointerId); } catch (e) {}
  recalerPrise(pris, neuf);
  /* DÉPLACÉ, DONC ANNULABLE. Pas à la pose — celle-ci se défait par son numéro
     d'ordre — et pas sur un appui qui n'a rien bougé. */
  if (!neuf && pris.bouge) noter(pris.remettre);
  /* Un geste tiré derrière un autre change l'ordre de la manœuvre : la liste se
     remet en ordre d'abscisse au relâcher, jamais pendant. */
  if (pris.type === 'geste') rangerGestes();

  /* Un APPUI sur un feu déjà posé — sans le déplacer — ouvre le choix de sa
     couleur. Un premier jet demandait un appui long : sur téléphone, iOS
     surtout, un doigt immobile déclenche la loupe du système, qui ANNULE le
     geste en cours — le minuteur partait avec, et rien ne s'ouvrait. C'était
     aussi un geste qu'on ne devine pas. Glisser reste un déplacement ; seul
     l'appui immobile ouvre le choix. On ne l'ouvre pas à la pose elle-même :
     on pose d'abord, on colore ensuite. */
  if (pris.type === 'panneau' && !pris.bouge && !neuf && ev.type === 'pointerup') {
    const q = seance.panneaux[pris.i];
    if (q && estFeu(q.t)) ouvrirChoixFeu(pris.i);
  }
  redessiner();
}
els.plateau.addEventListener('pointerup', relacher);
els.plateau.addEventListener('pointercancel', relacher);
els.plateau.addEventListener('lostpointercapture', relacher);
els.plateau.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

els.plateau.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  const p = versEcran(ev);
  zoomer(ev.deltaY < 0 ? 1.15 : 1/1.15, p.x, p.y);
}, { passive:false });

/* ---------- commandes ---------- */
/* LA PÉDALE. Le gros bouton n'est plus un interrupteur : la voiture avance
   TANT QU'ON APPUIE, et s'arrête à la seconde où le doigt se lève.

   C'est le même geste qu'au volant, et c'est surtout le bon outil pour parler :
   on avance de trois mètres, on relâche, on explique, on repuie. Avec un
   interrupteur il fallait viser Pause au bon moment — donc regarder le bouton
   au lieu de regarder la carte, et arriver toujours un peu trop tard.

   ⏹ termine et rend la palette de tracé. */
let pedale = false;

function prendrePedale(ev) {
  if (els.btnLecture.disabled || pedale || consigneOuverte) return;
  if (ev.preventDefault) ev.preventDefault();

  /* Cours ouvert : interrupteur, pas pédale. On ne tient pas le doigt pendant
     trois minutes de démonstration — on la lance, et on parle. */
  if (ev.pointerId != null) {
    try { els.btnLecture.setPointerCapture(ev.pointerId); } catch (e) {}
  }
  pedale = true;
  els.btnLecture.classList.add('roule');
  if (etat === 'pause') lancer(false);
  else if (etat !== 'lecture') lancer(true);
}

function lacherPedale() {
  if (!pedale) return;
  pedale = false;
  els.btnLecture.classList.remove('roule');
  if (etat === 'lecture') suspendre();
}

els.btnLecture.addEventListener('pointerdown', prendrePedale);
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) {
  els.btnLecture.addEventListener(t, lacherPedale);
});
/* LA BARRE D'ESPACE EST LA PÉDALE. Sur ordinateur — vidéoprojecteur en salle,
   écran d'ordinateur portable — viser un bouton à la souris pendant qu'on
   parle à la classe n'a aucun sens : la main reste sur le clavier, le pouce
   sur la barre. On tient, ça roule ; on lâche, ça s'arrête.

   Elle marche partout dans la page, pas seulement quand le bouton a le focus —
   sauf, bien sûr, quand on est en train d'écrire : une vitesse dans le pavé,
   une adresse dans la recherche. */
function dansUnChamp(cible) {
  if (!cible) return false;
  const n = (cible.nodeName || '').toLowerCase();
  return n === 'input' || n === 'textarea' || n === 'select' || cible.isContentEditable;
}
document.addEventListener('keydown', function (ev) {
  if (ev.key !== ' ' && ev.key !== 'Spacebar') return;
  if (ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (dansUnChamp(ev.target)) return;
  ev.preventDefault();              // sinon la page défile, ou le bouton visé se déclenche
  prendrePedale(ev);
});
document.addEventListener('keyup', function (ev) {
  if (ev.key === ' ' || ev.key === 'Spacebar') lacherPedale();
});

/* ↶ annule LE DERNIER AJOUT, quel qu'il soit.

   Premier jet : il ne connaissait que les points, et seulement ceux de l'élève.
   Deuxième : tous les points, ceux des véhicules compris. Il restait la même
   faute d'un cran plus loin — on pose une voiture obstacle, on fait ↶ pour la
   retirer, et il allait manger la trajectoire de l'élève à l'autre bout de
   l'écran. Un appui de plus, un point de plus, et le parcours y passait.

   Tout ce qui se pose porte donc son rang de pose : points, véhicules,
   panneaux, camemberts. ↶ retire celui de rang le plus élevé, point final. */
function dernierPose() {
  let pris = null;
  const voir = function (liste, quoi, ob) {
    (liste || []).forEach(function (p, i) {
      const o = p.ordre || 0;
      if (!pris || o > pris.ordre) pris = { liste: liste, i: i, quoi: quoi, ob: ob, ordre: o };
    });
  };
  /* En essai, ↶ ne défait que l'essai : le montage du cours n'est pas en jeu. */
  if (vueEleve) { voir(essai.points, 'point'); voir(essai.gestes, 'geste'); return pris; }
  voir(seance.points, 'point');
  voir(seance.obstacles, 'vehicule');
  seance.obstacles.forEach(ob => voir(ob.points, 'pointVehicule', ob));
  voir(seance.panneaux, 'panneau');
  voir(seance.camemberts, 'camembert');
  voir(seance.gestes, 'geste');
  return pris;
}

els.btnAnnuler.addEventListener('click', function () {
  const d = dernierPose();
  /* Le plus RÉCENT des deux, pose ou modification — les deux portent un numéro
     du même compteur, donc ils se comparent. */
  const j = journal.length ? journal[journal.length - 1] : null;
  if (j && (!d || j.ordre > d.ordre)) {
    journal.pop();
    j.defaire();
    retoucher();
    return;
  }
  if (!d) return;
  const objet = d.liste[d.i];
  /* Un seul appui a pu poser TOUT un tronçon de route suivi. Ces points-là
     portent le même numéro d'ordre : on les reprend ensemble, sinon il
     faudrait trente ↶ pour défaire un geste. */
  let combien = 1;
  while (d.i + combien < d.liste.length
         && (d.liste[d.i + combien].ordre || 0) === d.ordre) combien++;
  d.liste.splice(d.i, combien);

  if (d.quoi === 'vehicule') {
    /* La poignée de rotation désigne un véhicule par son INDICE : retirer
       celui d'avant la ferait porter sur le voisin. */
    if (obstacleActif === d.i) obstacleActif = -1;
    else if (obstacleActif > d.i) obstacleActif -= 1;
  }
  // un circuit qui perd son point de fermeture s'ouvre
  if (d.quoi === 'pointVehicule') majCircuit(d.ob);
  // un panneau repris au relevé y retourne : on n'a pas effacé, on a annulé
  if (d.quoi === 'panneau' && objet.deOSM) reprisOSM.delete(objet.deOSM);

  retoucher();
});
/* La voiture compte, maintenant qu'elle s'efface aussi : sans ça, une planche
   où il ne reste qu'elle laissait le bouton grisé, et on aurait juré que
   « tout effacer » l'oubliait encore. */
function plancheVide() {
  return seance.points.length === 0 && seance.obstacles.length === 0
      && seance.camemberts.length === 0 && seance.panneaux.length === 0
      && seance.voiture.absente;
}

function toutEffacer() {
  /* En essai, « tout effacer » efface SON essai, pas l'exercice. */
  if (vueEleve) {
    essai.points.length = 0; essai.gestes.length = 0;
    viderJournal(); fermerBilan();
    arreter(); redessiner();
    annoncer('Essai effacé — la question est toujours là.');
    return;
  }
  /* TOUT, y compris la voiture auto-école. Elle en était exemptée du temps où
     elle n'était pas un véhicule comme les autres : on effaçait « tout » et
     elle restait plantée là, ce qui n'est pas ce que dit le bouton. On la
     repose depuis la palette Véhicule. */
  seance.points.length = 0; essai.points.length = 0; essai.gestes.length = 0;
  seance.obstacles = []; seance.camemberts = [];
  seance.panneaux = []; seance.gestes = []; reprisOSM.clear(); obstacleActif = -1;
  viderJournal();
  seance.voiture.absente = true;
  arreter(); redessiner();
  annoncer('Planche vide — reposez la voiture depuis la feuille d’outils.');
}

/* TOUT CE QU'ON POSE tient dans une seule feuille, rangée par sections. Le
   bouton d'outil ne montre que ce qu'on tient — un appui ouvre le reste. La
   gomme et la main n'y sont pas : ce sont les deux gestes qui ne posent rien,

const JETON_POINT =
  '<svg viewBox="0 0 22 22" aria-hidden="true">'
  + '<path d="M2.6 16.5C7 16.5 9 5.5 19.4 5.5" fill="none" stroke="currentColor"'
  + ' stroke-width="1.7" stroke-linecap="round" stroke-opacity=".5"/>'

  + '<circle cx="11" cy="11" r="8.3" fill="none" stroke="currentColor" stroke-width="1.7"/>'
  + '<path d="M11 11V2.7A8.3 8.3 0 0 1 19.3 11Z" fill="currentColor"/></svg>';

const SECTIONS = [
  { id:'trajet', nom:'Trajectoire',
    membres: [{ id:'point', nom:'Point', jeton: JETON_POINT }] },
  /* UN SEUL VÉHICULE DANS LA FEUILLE. Les quatre sortes y tenaient quatre
     lignes, alors qu'on choisit la sorte APRÈS avoir posé — c'est le même geste
     que pour l'allure d'un point : on pose, on reste appuyé, on choisit. Les
     autres restent connus de l'application (`cache`) pour que le bouton d'outil
     sache écrire « Camion » quand c'est un camion qu'on pose.

     La voiture auto-école, elle, ne paraît que si elle n'est pas sur la carte :
     il n'y en a qu'une, et la reposer est la seule raison d'aller la chercher. */
  { id:'vehicule', nom:'Véhicules',
    membres: [{ id:AUTOECOLE, nom:'Voiture auto-école', jeton:ICONE_AUTOECOLE,
                siAbsente:true }]
      .concat(OBSTACLES.map(function (o, k) {
        return { id:o.id, nom:o.nom, cache: k > 0,
                 jeton:'<svg class="objet" viewBox="0 0 22 22" aria-hidden="true">' + o.icone + '</svg>' };
      })) },
  { id:'panneau', nom:'Signalisation', cochable: true,
    membres: PANNEAUX.map(function (q) {
      return { id:q.id, nom:q.nom, jeton: jetonSigne(q.id) };
    }) },
  { id:'zone', nom:'À contrôler',
    membres: [{ id:'camembert', nom:'Camembert', jeton: JETON_CAMEMB }] }
];
const TOUS_MEMBRES = SECTIONS.reduce((l, s) => l.concat(s.membres), []);
/* Le dernier outil de pose choisi : la gomme et la main ne l'effacent pas, on y
   revient d'un appui. */
let outilPose = 'point';

const COCHE =
  '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor"'
  + ' stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
  + '<rect x="3.2" y="3.2" width="15.6" height="15.6" rx="4.6"/>'
  + '<path class="marque" d="m6.9 11.3 2.9 2.9 5.3-6.1"/></svg>';

/* Le choix de couleur d'un feu : quatre boutons au-dessus de lui — rouge,
   orange, vert, éteint. Un appui choisit et referme ; un appui ailleurs
   referme sans rien changer. */
const COULEURS_FEU = [
  { id:'feuR', nom:'Rouge' }, { id:'feuO', nom:'Orange' },
  { id:'feuV', nom:'Vert' },  { id:'feu',  nom:'Éteint' }
];
let feuEnChoix = -1;

function ecranDe(p) {
  const m = els.monde.getScreenCTM();
  const q = new DOMPoint(p.x - ancre.x, p.y - ancre.y).matrixTransform(m);
  const r = els.plateau.getBoundingClientRect();
  return { x: q.x - r.left, y: q.y - r.top };
}

/* =================================================================
   Le pavé des vitesses
   =================================================================
   Un appui sur un point déjà posé — sans le déplacer — ouvre le pavé. Appui
   court ou appui long, c'est pareil : ce qui compte, c'est que le doigt n'ait
   pas glissé. Le même mécanisme que le choix de couleur d'un feu, et pour la
   même raison — sur iPhone, un doigt immobile déclenche la loupe du système,
   qui annule un vrai appui long.

   On ÉCRIT le nombre. Un premier jet alignait les huit valeurs des panneaux
   français en gros boutons : onze touches pour saisir un nombre, ça prenait
   plus de place que la carte et ça restait faux dès qu'on voulait 45. Un champ
   et trois touches suffisent.

   Le champ VIDE veut dire « la vitesse de la route » : c'est l'état de
   naissance d'un point, et c'est le cas le plus fréquent. */
let vitesseEnChoix = null;

/* =================================================================
   ↶ DÉFAIT LE DERNIER GESTE, PAS LE DERNIER OBJET
   =================================================================
   Il ne savait défaire qu'une POSE : il cherchait le plus grand numéro d'ordre
   et retirait l'objet qui le portait. Déplacer un point, changer sa vitesse,
   tourner un véhicule, gommer — tout cela ne laissait aucune trace, et ↶
   sautait par-dessus pour aller retirer un point posé trois gestes plus tôt.
   « Le bouton annuler n'annule pas une modification de trajectoire. »

   Il y a donc un JOURNAL : chaque modification y dépose de quoi se défaire —
   une fermeture qui remet les champs comme ils étaient. Les poses, elles,
   continuent de se défaire par leur numéro d'ordre ; c'est le même compteur qui
   estampille les deux, donc on sait toujours lequel des deux est le plus
   récent. ↶ prend le plus récent, quel qu'il soit.

   Le journal se vide quand ce à quoi il renvoie n'existe plus : ouvrir un autre
   cours, tout effacer, passer du modèle à l'essai. Défaire un geste qui portait
   sur une autre scène ne veut rien dire. */
const journal = [];
const JOURNAL_MAX = 80;      // au-delà, on oublie : ce n'est pas une archive

function noter(defaire) {
  if (!defaire) return;
  journal.push({ ordre: ++compteurPose, defaire: defaire });
  if (journal.length > JOURNAL_MAX) journal.shift();
  majCommandes();
}
function viderJournal() { journal.length = 0; }

/* Ce que le doigt tient, quel qu'il soit. */
function objetDeLaPrise(pris) {
  if (!pris) return null;
  const t = pris.type;
  if (t === 'point') return mesPoints()[pris.i];
  if (t === 'pointObstacle') {
    const ob = seance.obstacles[pris.i];
    return ob && ob.points ? ob.points[pris.j] : null;
  }
  if (t === 'obstacle') return seance.obstacles[pris.i];
  if (t === 'panneau') return seance.panneaux[pris.i];
  if (t.slice(0, 3) === 'cam') return seance.camemberts[pris.i];
  if (t === 'geste') return mesGestes()[pris.i];
  if (t === 'voiture') return seance.voiture;
  if (t === 'rotation') { const c = cibleRotation(); return c ? c.p : null; }
  return null;
}

/* Les champs qui bougent. On les copie tels quels, et on les remet tels quels :
   pas besoin de savoir de quel objet il s'agit. `capRepos` voyage à part, parce
   que la voiture auto-école porte son cap dehors. */
const CHAMPS_MOBILES = ['x', 'y', 'cap', 'a1', 'a2', 'R', 's', 'v', 'surRoute'];

function instantane(pris) {
  const o = objetDeLaPrise(pris);
  if (!o) return null;
  const avant = {};
  CHAMPS_MOBILES.forEach(function (k) { if (k in o) avant[k] = o[k]; });
  const capAvant = capRepos;
  return function () {
    const q = objetDeLaPrise(pris);
    if (!q) return;
    Object.keys(avant).forEach(function (k) { q[k] = avant[k]; });
    if (q === seance.voiture) capRepos = capAvant;
    if (pris.type === 'pointObstacle') majCircuit(seance.obstacles[pris.i]);
  };
}

/* Où le point était avant qu'on le tire : c'est la mesure de la correction.
   Et, du même geste, de quoi le remettre là si ↶ le demande. */
function memoriserAvant(pris) {
  const q = pointDeLaPrise(pris);
  if (q) pris.avant = { x: q.x, y: q.y };
  pris.remettre = instantane(pris);
}

/* La normale à la marche, au droit du point d'indice i d'une liste. */
function normaleDe(liste, i, depart) {
  const a = i > 0 ? liste[i-1] : depart;
  const b = i + 1 < liste.length ? liste[i+1] : liste[i];
  const cap = Math.atan2(b.y - a.y, b.x - a.x);
  return { x: -Math.sin(cap), y: Math.cos(cap) };
}

function pointDeLaPrise(pris) {
  if (!pris) return null;
  if (pris.type === 'point') return mesPoints()[pris.i];
  if (pris.type === 'pointObstacle') {
    const ob = seance.obstacles[pris.i];
    return ob && ob.points ? ob.points[pris.j] : null;
  }
  return null;
}

let vAvantChoix = null;

function fermerChoixVitesse() {
  const pris = vitesseEnChoix, avant = vAvantChoix;
  vitesseEnChoix = null;
  els.choixVitesse.hidden = true;
  const p = pointDeLaPrise(pris);
  if (p && p.v !== avant) noter(function () {
    const q = pointDeLaPrise(pris);
    if (q) q.v = avant;
  });
}

function ouvrirChoixVitesse(pris) {
  const p = pointDeLaPrise(pris);
  if (!p) return;
  vitesseEnChoix = pris;
  /* La vitesse d'AVANT l'ouverture : le champ se saisit chiffre par chiffre, et
     noter chaque frappe remplirait le journal de faux gestes. On note une fois,
     à la fermeture, et seulement si le nombre a changé. */
  vAvantChoix = p.v === undefined ? null : p.v;
  const b = els.choixVitesse;
  b.textContent = '';
  const limite = limiteSous(p);

  const tete = document.createElement('p');
  tete.className = 'entete';
  b.appendChild(tete);

  const ligne = document.createElement('div');
  ligne.className = 'vitLigne';
  const champ = document.createElement('input');
  champ.type = 'number'; champ.className = 'vitChamp';
  champ.inputMode = 'numeric'; champ.min = '0'; champ.max = '130'; champ.step = '5';
  champ.placeholder = String(limite);
  champ.setAttribute('aria-label', 'Vitesse en km/h');
  const unite = document.createElement('span');
  unite.className = 'vitUnite'; unite.textContent = 'km/h';
  ligne.appendChild(champ); ligne.appendChild(unite);
  b.appendChild(ligne);

  /* On ne reconstruit pas le pavé à chaque changement : le champ perdrait le
     curseur au milieu d'une frappe. On remet juste à jour ce qui a bougé. */
  function rafraichir() {
    const q = pointDeLaPrise(vitesseEnChoix);
    if (!q) return;
    tete.textContent = q.v == null
      ? (q.vh != null ? 'Vide = ' + q.vh + ' km/h, comme les deux points qui l’encadrent'
                      : 'Vide = vitesse de la route (' + limite + ' km/h)')
      : (q.v === 0 ? 'Arrêt marqué — 3 secondes' : 'Consigne : ' + q.v + ' km/h');
    if (document.activeElement !== champ) champ.value = q.v == null ? '' : String(q.v);
  }

  function poser(v) {
    const q = pointDeLaPrise(vitesseEnChoix);
    if (!q) return;
    q.v = v == null ? null : Math.max(0, Math.min(130, Math.round(v)));
    rafraichir();
    redessiner();
  }

  champ.addEventListener('input', function () {
    const t = champ.value.trim();
    if (t === '') poser(null);
    else { const n = parseInt(t, 10); poser(isNaN(n) ? 0 : n); }
  });
  champ.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });

  const touche = function (texte, classe, faire) {
    const bt = document.createElement('button');
    bt.type = 'button';
    bt.className = 'vit' + (classe ? ' ' + classe : '');
    bt.textContent = texte;
    bt.addEventListener('click', function (ev) { ev.stopPropagation(); faire(); });
    b.appendChild(bt);
  };
  const actuelle = () => { const q = pointDeLaPrise(vitesseEnChoix);
                           return q && q.v != null ? q.v : limite; };
  touche('− 5', '', function () { poser(actuelle() - 5); });
  touche('+ 5', '', function () { poser(actuelle() + 5); });
  touche('Arrêt', 'large', function () { poser(0); });
  touche('Route', 'large', function () { poser(null); });

  rafraichir();
  b.hidden = false;
  const e = ecranDe(p);
  const L = b.offsetWidth, H = b.offsetHeight, marge = 30;
  let x = e.x - L / 2, y = e.y - H - marge;
  if (y < 8) y = e.y + marge;
  x = Math.max(8, Math.min(largeur - L - 8, x));
  b.style.left = x.toFixed(0) + 'px';
  b.style.top = y.toFixed(0) + 'px';
}

function ouvrirChoixFeu(i) {
  const q = seance.panneaux[i];
  if (!q) return;
  feuEnChoix = i;
  const b = els.choixFeu;
  b.textContent = '';
  COULEURS_FEU.forEach(function (c) {
    const bt = document.createElement('button');
    bt.type = 'button'; bt.className = 'pastel';
    bt.title = c.nom; bt.setAttribute('aria-label', 'Feu ' + c.nom.toLowerCase());
    bt.setAttribute('aria-pressed', String(q.t === c.id));
    bt.innerHTML = jetonSigne(c.id);
    bt.addEventListener('click', function (ev) {
      ev.stopPropagation();
      const f = seance.panneaux[feuEnChoix];
      if (f) f.t = c.id;
      fermerChoixFeu();
      redessiner();
    });
    b.appendChild(bt);
  });
  b.hidden = false;
  /* Au-dessus du feu, centré, sans sortir de l'écran — et dessous s'il est
     trop près du haut. */
  const e = ecranDe(q);
  const L = b.offsetWidth, H = b.offsetHeight, marge = 34;
  let x = e.x - L / 2, y = e.y - H - marge;
  if (y < 8) y = e.y + marge;
  x = Math.max(8, Math.min(largeur - L - 8, x));
  b.style.left = x.toFixed(0) + 'px';
  b.style.top = y.toFixed(0) + 'px';
}

function fermerChoixFeu() {
  feuEnChoix = -1;
  els.choixFeu.hidden = true;
}

/* LE CHOIX DU VÉHICULE. Même geste que le pavé des vitesses : on reste appuyé
   sur ce qu'on a posé, et on dit ce que c'est. Choisir ici change AUSSI l'outil,
   pour que le véhicule suivant soit du même genre — peupler un giratoire de
   camions ne doit pas demander un appui long par camion. */
let vehiculeEnChoix = -1;
function fermerChoixVehicule() {
  vehiculeEnChoix = -1;
  els.choixVehicule.hidden = true;
}

function ouvrirChoixVehicule(i) {
  const ob = seance.obstacles[i];
  if (!ob) return;
  vehiculeEnChoix = i;
  const b = els.choixVehicule;
  b.textContent = '';
  OBSTACLES.forEach(function (o) {
    const bt = document.createElement('button');
    bt.type = 'button'; bt.className = 'pastel';
    bt.title = o.nom; bt.setAttribute('aria-label', o.nom);
    bt.setAttribute('aria-pressed', String(ob.t === o.id));
    bt.innerHTML = '<svg class="objet" viewBox="0 0 22 22" aria-hidden="true">' + o.icone + '</svg>';
    bt.addEventListener('click', function (ev) {
      ev.stopPropagation();
      const v = seance.obstacles[vehiculeEnChoix];
      if (v) v.t = o.id;
      outil = o.id; outilPose = o.id;
      fermerChoixVehicule();
      majCurseur(); redessiner();
    });
    b.appendChild(bt);
  });
  b.hidden = false;
  /* Au-dessus du véhicule, centré, sans sortir de l'écran — et dessous s'il est
     trop près du haut. */
  const e = ecranDe(ob);
  const L = b.offsetWidth, H = b.offsetHeight, marge = 34;
  let x = e.x - L / 2, y = e.y - H - marge;
  if (y < 8) y = e.y + marge;
  x = Math.max(8, Math.min(largeur - L - 8, x));
  b.style.left = x.toFixed(0) + 'px';
  b.style.top = y.toFixed(0) + 'px';
}

/* Deux appuis à moins d'un tiers de seconde sur le même panneau : c'est un
   double appui. Au-delà, ce sont deux gestes distincts. */
const DOUBLE_APPUI = 340;
let appuiPrecedent = { cle: '', t: 0 };

let voletOuvert = false;

const ICONE_TOUT =
  '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor"'
  + ' stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M19 11a8 8 0 1 1-2.4-5.7"/><path d="M19.4 3.2v4.4h-4.4"/></svg>';

function estUnOutilDePose(id) { return TOUS_MEMBRES.some(m => m.id === id); }

/* LA FEUILLE D'OUTILS. Toutes les sections d'un coup, avec leur titre : on y
   descend comme dans un sélecteur, et on en ressort dès qu'on a choisi. */
function ouvrirVolet(ouvert) {
  voletOuvert = !!ouvert;
  els.volet.hidden = !voletOuvert;
  OUTIL.setAttribute('aria-expanded', String(voletOuvert));
  if (!voletOuvert) return;
  els.volet.textContent = '';

  /* EN ESSAI, LA FEUILLE NE MONTRE QUE LA TRAJECTOIRE. Un outil qu'on peut
     choisir et qui refuse de poser est un outil de trop : « faut enlever le
     fait que l'élève puisse poser un obstacle ou une voiture auto-école ».
     Les véhicules, les panneaux et le camembert sont la QUESTION — celui qui
     répond n'y touche pas. Il trace, c'est tout ce qu'on lui demande. */
  SECTIONS.filter(s => !vueEleve || s.id === 'trajet').forEach(function (s) {
    const titre = document.createElement('p');
    titre.className = 'voletTitre';
    titre.textContent = s.nom;
    els.volet.appendChild(titre);

    /* Une ligne d'en-tête qui commande toutes les encoches d'un coup. Elle est
       cochée quand TOUT est montré ; l'appui bascule alors tout d'un côté ou de
       l'autre — sept appuis pour éteindre le relevé, ça n'allait pas. */
    if (s.cochable) {
      const tous = s.membres.every(m => montre(m.id));
      const tete = document.createElement('div');
      tete.className = 'ligne entete';
      const t2 = document.createElement('span');
      t2.className = 'titre';
      t2.textContent = 'Relevé de la carte';
      tete.appendChild(t2);
      const ct = document.createElement('button');
      ct.type = 'button'; ct.className = 'coche';
      ct.setAttribute('role', 'switch');
      ct.setAttribute('aria-checked', String(tous));
      ct.title = tous ? 'Masquer tout le relevé' : 'Afficher tout le relevé';
      ct.setAttribute('aria-label', ct.title);
      ct.innerHTML = COCHE;
      ct.addEventListener('click', function (ev) {
        ev.stopPropagation();
        s.membres.forEach(function (m) { VISIBLES[m.id] = !tous; });
        redessiner();
        ouvrirVolet(true);             // les encoches du dessous suivent
      });
      tete.appendChild(ct);
      els.volet.appendChild(tete);
    }

    s.membres.forEach(function (m) {
      if (m.cache) return;
      if (m.siAbsente && !seance.voiture.absente) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pastel';
      b.dataset.type = m.id; b.title = m.nom;
      b.setAttribute('aria-label', m.nom);
      b.setAttribute('aria-pressed', String(outil === m.id));
      b.innerHTML = m.jeton + '<span class="etiq"></span>';
      b.querySelector('.etiq').textContent = m.nom;
      b.addEventListener('click', function () {
        outil = m.id; outilPose = m.id;
        ouvrirVolet(false); majCurseur(); majCommandes();
      });
      if (!s.cochable) { els.volet.appendChild(b); return; }

      /* L'encoche vit à côté du bouton, pas dedans : imbriquer deux boutons ne
         marche pas, et on veut pouvoir décocher SANS changer d'outil ni refermer
         la feuille — on en décoche souvent plusieurs d'affilée. */
      const ligne = document.createElement('div');
      ligne.className = 'ligne';
      ligne.appendChild(b);
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'coche';
      c.setAttribute('role', 'switch');
      c.setAttribute('aria-checked', String(montre(m.id)));
      c.title = 'Afficher les ' + m.nom.toLowerCase() + ' relevés sur la carte';
      c.setAttribute('aria-label', c.title);
      c.innerHTML = COCHE;
      c.addEventListener('click', function (ev) {
        ev.stopPropagation();
        VISIBLES[m.id] = !montre(m.id);
        c.setAttribute('aria-checked', String(montre(m.id)));
        redessiner();
      });
      ligne.appendChild(c);
      els.volet.appendChild(ligne);
    });
  });

  /* TOUT EFFACER : rare, et sans retour. Il descend au fond de la feuille et
     demande deux appuis — pas une boîte de dialogue du navigateur, qui a l'air
     d'une erreur de page plutôt que d'une question de l'application. */
  const tout = document.createElement('button');
  tout.type = 'button'; tout.className = 'voletTout';
  tout.setAttribute('aria-pressed', 'false');
  tout.innerHTML = ICONE_TOUT + '<span>Tout effacer</span>';
  tout.disabled = plancheVide();
  if (tout.disabled) tout.style.opacity = '.4';
  let arme = false;
  tout.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (!arme) {
      arme = true;
      tout.setAttribute('aria-pressed', 'true');
      tout.querySelector('span').textContent = 'Sûr ? Appuyez encore';
      return;
    }
    ouvrirVolet(false);
    toutEffacer();
  });
  els.volet.appendChild(tout);

  els.volet.style.left = '9px';
}

/* LE BOUTON D'OUTIL. Il montre ce qu'on tient — jeton et nom — et ouvre tout le
   reste. Un appui ne fait pas toujours la même chose :

     - on tient la main ou la gomme -> il REPREND l'outil de pose, sans feuille.
       On passe sans arrêt de l'un à l'autre ; redemander la feuille à chaque
       fois pour rechoisir ce qui est déjà écrit sur le bouton était une
       manipulation de trop ;
     - on tient déjà cet outil -> la feuille s'ouvre, puisque cette fois on veut
       en changer. */
const OUTIL = document.createElement('button');
OUTIL.type = 'button'; OUTIL.className = 'outilCourant groupe';
OUTIL.setAttribute('aria-haspopup', 'true');
OUTIL.setAttribute('aria-expanded', 'false');
OUTIL.setAttribute('aria-pressed', 'false');
OUTIL.innerHTML = '<span class="dedans"></span><span class="nom"></span>'
  + '<svg class="chevron" viewBox="0 0 12 12" aria-hidden="true" fill="none"'
  + ' stroke="currentColor" stroke-width="1.8" stroke-linecap="round"'
  + ' stroke-linejoin="round"><path d="M2.4 7.6 6 4l3.6 3.6"/></svg>';
OUTIL.addEventListener('click', function (ev) {
  ev.stopPropagation();
  if (voletOuvert) { ouvrirVolet(false); return; }
  if (!estUnOutilDePose(outil)) {
    outil = outilPose; majCurseur(); majCommandes(); return;
  }
  ouvrirVolet(true);
});
els.palette.appendChild(OUTIL);

function majGroupes() {
  const m = TOUS_MEMBRES.find(x => x.id === outilPose) || TOUS_MEMBRES[0];
  OUTIL.querySelector('.dedans').innerHTML = m.jeton;
  OUTIL.querySelector('.nom').textContent = m.nom;
  OUTIL.setAttribute('aria-pressed', String(estUnOutilDePose(outil)));
  OUTIL.title = 'Outil : ' + m.nom + ' — appuyez pour en changer';
  OUTIL.setAttribute('aria-label', OUTIL.title);
}

/* La gomme n'efface plus tout : c'est un outil, on tape ce qu'on retire. Elle
   se range avec la main, à droite : ce sont les deux gestes qui ne posent rien,
   et le pouce les trouve sans traverser l'écran. */
const GOMME = document.createElement('button');
GOMME.type = 'button'; GOMME.className = 'pastel seul';
GOMME.dataset.type = 'gomme';
GOMME.title = 'Gomme : effacer un point ou un obstacle';
GOMME.setAttribute('aria-label', GOMME.title);
GOMME.setAttribute('aria-pressed', 'false');
GOMME.innerHTML =
  '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor"'
  + ' stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M9.5 18.2h9.3"/>'
  + '<path d="m13.2 4.3 5 5a1.6 1.6 0 0 1 0 2.3l-6.6 6.6H7.9l-4.4-4.4'
  + 'a1.6 1.6 0 0 1 0-2.3l7-7.2a1.6 1.6 0 0 1 2.7 0Z"/>'
  + '<path d="m6.6 8.1 5.9 5.9"/></svg>';
GOMME.addEventListener('click', function () { outil = 'gomme'; majCurseur(); majCommandes(); });
els.outil.insertBefore(GOMME, MAIN);

Object.keys(SOURCES).forEach(function (id) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'fond'; b.dataset.source = id;
  b.setAttribute('aria-pressed', String(id === source));
  b.innerHTML = '<span class="titre"></span><span class="detail"></span>';
  b.querySelector('.titre').textContent = SOURCES[id].nom;
  b.querySelector('.detail').textContent = SOURCES[id].detail;
  b.addEventListener('click', function () { changerSource(id); });
  els.fonds.appendChild(b);
});

if (window.ResizeObserver) new ResizeObserver(dimensionner).observe(els.plateau);
else window.addEventListener('resize', dimensionner);

document.getElementById('version').textContent = 'Version ' + VERSION;
majSource();
dimensionner();
centrer(DEPART.lat, DEPART.lon, 1.4);
capRepos = 90;                      // posée sur la branche nord, face au sud
majEchelle();
dessinerVoiture();
majCurseur();
majCommandes();

/* La liste des séances gardées, et la reprise de celle qui était en cours.

   Rouvrir l'application sur ce qu'on avait sous les yeux est ce qu'on attend
   d'un carnet : on ne referme pas un carnet en arrachant la page. Si rien n'a
   été gardé — première visite, stockage refusé — on reste sur la scène
   d'origine, et rien ne le signale : il n'y a rien à dire. */
/* On reprend le cours sur lequel on travaillait, s'il est toujours là. */
/* UN LIEN D'EXERCICE OUVRE LA PARTIE ÉLÈVE, et rien du moniteur ne se charge :
   ni son cours ouvert, ni la carte qu'il avait laissée. */
const codeExercice = (location.hash.match(/^#exo=(.+)$/) || [])[1] || null;

(function reprendreCoursOuvert() {
  if (codeExercice) return;
  const id = lire(CLE_OUVERT);
  if (!id) return;
  if (!coursPar(lireBiblio(), id)) { ecrire(CLE_OUVERT, null); return; }
  coursCourant = id;
})();
/* ET ON OUVRE SUR LA CARTE, prête à tracer. L'application ouvrait sur un
   accueil : « une explication / mes cours / mes élèves ». Mais expliquer en
   leçon est ce qui arrive le plus souvent, et c'est toujours urgent — passer
   par un menu pour choisir « une explication » était une porte pour rien. */
majBandeau();
if (codeExercice) ouvrirExerciceEleve(codeExercice);
else {
  if (chargerSeance(lire(CLE_COURANTE))) annoncer('Reprise de la séance en cours.');
  ouvrirOuJeSuis();
}

if ('serviceWorker' in navigator) {
  /* Si un service worker contrôlait déjà la page, son remplacement signifie
     qu'une nouvelle version vient d'être installée : on recharge une fois,
     sinon l'écran resterait sur l'ancienne. Le drapeau évite la boucle. */
  if (navigator.serviceWorker.controller) {
    let recharge = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (recharge) return;
      recharge = true;
      location.reload();
    });
  }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('service worker non enregistré :', e && e.message);
    });
  });
}
</script>
