  + dessinSigne(id) + '</svg>';

/* Un panneau est un SYMBOLE, pas un objet posé sur la chaussée : il garde une
   taille lisible à l'écran quand on s'éloigne, et grandit avec la photo quand
   on s'approche — sinon il devient un timbre-poste au milieu d'un carrefour. */
/* Le plancher était de 26 px, et il se voyait trop : un panneau ne rétrécit
   plus dès qu'on passe sous le zoom de travail, pendant que tout le reste
   rétrécit. Mesuré le 18/09/2026 sur un giratoire de 12 m de rayon : le panneau
   en couvrait 13 % au zoom de travail, et **61 %** dézoomé à fond — un feu
   aussi large que le rond-point. À 12 px il suit la carte bien plus loin, et
   reste reconnaissable à sa forme quand il ne l'est plus à son texte.
   La CIBLE, elle, reste au doigt (24 px) : dessiné petit, il se touche aussi
   bien. */
const PANNEAU_MINI = 12;   // pixels
function taillePanneau() { return Math.max(3.2 / mParU, PANNEAU_MINI / vue.k); }

/* Combien on s'écarte du bord de chaussée pour planter le mât : la largeur d'un
   trottoir, en gros. La demi-chaussée s'y ajoute, elle vient de la route. */
const BORD_ROUTE = 1.7;   // mètres
/* De combien on rentre dans la rue pour planter un sens interdit : posé sur le
   nœud du carrefour, il tomberait au milieu du croisement. */
const RETRAIT_ENTREE = 5; // mètres

/* Sortir de SA chaussée ne suffit pas toujours à être sur le trottoir.

   Deux cas s'en chargent. Près d'un carrefour, un stop est posé à quelques
   mètres du croisement : l'écarter latéralement de sa propre rue le fait
   entrer dans la rue d'en face, et il se retrouve en plein milieu du bitume.
   Ailleurs, c'est la largeur qui trompe — OpenStreetMap étiquette rarement
   `width`, on suppose 3,25 m par voie, et une avenue avec ses places de
   stationnement en fait bien plus.

   On pousse donc le panneau jusqu'à ce qu'il soit dégagé de TOUTE chaussée, par
   pas d'un mètre, sans jamais dépasser neuf mètres de rab — au-delà il ne
   désignerait plus rien. */
const DEGAGEMENT = 0.8;    // m : le jeu qu'on laisse au bord de la chaussée
const POUSSEE_MAXI = 9;    // m : au-delà, le panneau ne montre plus sa rue

function sousLaChaussee(x, y, voies, marge) {
  for (const v of voies) {
    const demi = (v.total * v.largeur / 2 + marge) / mParU;
    for (let i = 0; i < v.pts.length - 1; i++) {
      const a = v.pts[i], b = v.pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
      if (!l2) continue;
      const u = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / l2));
      if (Math.hypot(x - (a.x + dx * u), y - (a.y + dy * u)) < demi) return true;
    }
  }
  return false;
}

/* Les rues qui passent à portée du panneau : inutile de mesurer la ville
   entière à chaque pas. */
function voiesAutour(x, y, voies, rayon) {
  const r2 = (rayon / mParU) * (rayon / mParU);
  return voies.filter(v => v.pts.some(q =>
    (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y) < r2));
}

function ecartDegage(x, y, capBord, ecart, voies) {
  const proches = voiesAutour(x, y, voies, ecart + POUSSEE_MAXI + 30);
  const essai = function (cap) {
    const a = cap * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
    for (let e = ecart; e <= ecart + POUSSEE_MAXI; e += 0.5) {
      const q = e / mParU;
      if (!sousLaChaussee(x + ux * q, y + uy * q, proches, DEGAGEMENT)) return e;
    }
    return null;
  };
  const droite = essai(capBord);
  if (droite !== null) return droite;

  /* Coincé à droite : entre deux rues parallèles, ou dans l'îlot d'un
     carrefour, il n'y a pas de trottoir de ce côté-là. On passe en face — un
     panneau du mauvais côté reste lisible, un panneau au milieu du bitume, non.
     L'écart négatif dit simplement « de l'autre côté ». */
  const gauche = essai(capBord + 180);
  if (gauche !== null) return -gauche;

  // nulle part où se mettre : on le laisse près de sa rue plutôt qu'au loin
  return ecart;
}

/* Un panneau relevé porte sa position d'axe et son déport : on l'assemble au
   dessin, parce que le déport se compte en mètres et que l'échelle, elle,
   dépend de la latitude où l'on se trouve. */
function positionPanneau(q) {
  if (q.capBord == null) return { x: q.x, y: q.y };
  const a = q.capBord * Math.PI / 180, e = q.ecart / mParU;
  return { x: q.x + Math.cos(a) * e, y: q.y + Math.sin(a) * e };
}

/* Et il reste DROIT quand la carte tourne : un stop à l'envers ne se lit pas.
   C'est pour ça que `tourner()` redessine, maintenant. */
function poserSigne(pere, id, x, y, T, opacite, cap) {
  /* Un panneau qui montre une direction tourne avec la RUE (cap du monde) ;
     tous les autres tournent à l'envers de la carte pour rester d'aplomb. */
  const a = estFleche(id) ? (cap || 0) : -vue.cap;
  const g = el('g', { transform:
    'translate(' + ax(x).toFixed(3) + ' ' + ay(y).toFixed(3) + ') '
    + 'rotate(' + a.toFixed(2) + ') scale(' + T.toFixed(4) + ')' });
  if (opacite) g.setAttribute('opacity', opacite);
  g.innerHTML = dessinSigne(id);
  pere.appendChild(g);
  return g;
}

/* Ce qu'OpenStreetMap connaît autour de nous, dans les cases déjà lues. Un
   même panneau peut se trouver dans deux cases voisines — elles se chevauchent
   pour que le recalage ne tombe pas dans un trou : on le compte une fois. */
function panneauxOSM() {
  const c = centreMonde();
  const portee = Math.hypot(largeur, hauteur) / (2 * vue.k) * 1.15;
  const vus = new Set(), sortie = [];
  reseaux.forEach(function (d) {
    (d.panneaux || []).forEach(function (q) {
      if (vus.has(q.id) || reprisOSM.has(q.id)) return;
      if (Math.hypot(q.x - c.x, q.y - c.y) > portee) return;
      vus.add(q.id); sortie.push(q);
    });
  });
  return sortie;
}

function dessinerPanneaux() {
  els.panneaux.textContent = '';
  if (vueEleve) return;
  const T = taillePanneau();
  // le relevé d'abord, plus petit et estompé : c'est un indice, pas une décision
  panneauxOSM().forEach(function (q) {
    if (!montre(q.signe)) return;
    const w = positionPanneau(q);
    poserSigne(els.panneaux, q.signe, w.x, w.y, T * 0.8, '.68', q.capFleche);
  });
  seance.panneaux.forEach(function (q) {
    poserSigne(els.panneaux, q.t, q.x, q.y, T, null, q.cap);
  });
}

/* Deux véhicules gris côte à côte ne se racontent pas : « celui-là… non,
   l'autre » ne s'enseigne pas. Chaque véhicule posé prend donc une carrosserie
   différente, pour qu'une phrase suffise — « la bleue te doit le passage ».

   Les teintes ne veulent rien dire : elles ne servent qu'à NOMMER. Elles
   restent donc franches et distinctes entre elles, et à l'écart du blanc de la
   voiture auto-école comme du rouge vif de l'accident.

   Le nom s'accorde : une voiture est bleue, un camion est bleu. */
const COULEURS_VEHICULE = [
  { id:'gris',      m:'gris',      f:'grise',     fond:'#7f8a97' },
  { id:'bleu',      m:'bleu',      f:'bleue',     fond:'#3f7fd0' },
  { id:'rouge',     m:'rouge',     f:'rouge',     fond:'#c8443e' },
  { id:'jaune',     m:'jaune',     f:'jaune',     fond:'#d8a41d' },
  { id:'violet',    m:'violet',    f:'violette',  fond:'#8f5cc6' },
  { id:'turquoise', m:'turquoise', f:'turquoise', fond:'#1fa79b' },
  { id:'rose',      m:'rose',      f:'rose',      fond:'#d2649f' },
  { id:'marron',    m:'marron',    f:'marron',    fond:'#8d6242' }
];

/* La couleur du prochain véhicule : la MOINS employée de la palette, la
   première en cas d'égalité. Un simple compteur qui avance ferait aussi
   l'affaire, mais il laisserait un trou : le bleu effacé, le suivant serait
   jaune et l'on n'aurait plus jamais de bleu. Là, la couleur rendue revient. */
function couleurLibre() {
  let choix = COULEURS_VEHICULE[0], mini = Infinity;
  COULEURS_VEHICULE.forEach(function (c) {
    const n = seance.obstacles.filter(o => o.couleur === c.id).length;
    if (n < mini) { mini = n; choix = c; }
  });
  return choix.id;
}

const couleurVehicule = ob => COULEURS_VEHICULE.find(c => c.id === ob.couleur);
function fondVehicule(ob) {
  const c = couleurVehicule(ob);
  const o = obstacleDe(ob.t);
  return c ? c.fond : (o ? o.teinte : '#7f8a97');
}

/* « Accident — voiture bleue » plutôt que « Accident — voiture » : quand il y
   en a trois sur la planche, le nom seul ne dit pas laquelle. */
function nomVehicule(ob) {
  const o = obstacleDe(ob.t);
  const c = couleurVehicule(ob);
  const n = o ? o.nom.toLowerCase() : 'véhicule';
  return c ? n + ' ' + (o && o.genre === 'f' ? c.f : c.m) : n;
}

/* Allures, en grandeurs réelles. Plus d'étalonnage au jugé : la carte
   donne l'échelle, on roule en mètres par seconde. */
const ALLURE = {
  normale:  13.5,   // m/s ≈ 48 km/h
  lente:     4.5,   // m/s ≈ 16 km/h, le pas d'un « cédez le passage ». Un tiers.
  rapide:   25.0,   // m/s = 90 km/h : l'allure qu'on vise au bout d'une voie d'insertion
  frein:     3.2,   // m/s²
  /* La relance était plus douce que le freinage : 2,3 m/s², soit 134 m pour
     monter de zéro à 90. Trop mou pour montrer une insertion — c'est justement
     le moment où l'on demande à l'élève d'accélérer franchement. Portée à
     3,5 m/s² : 89 m et sept secondes, ce qu'une auto-école fait en appuyant. */
  relance:   3.5,   // m/s², la relance franche d'une voie d'insertion
  laterale:  3.2    // m/s² — n'est plus employé : voir « plus de bridage en courbe »
};
const LONGUEUR_VOITURE = 4.0;   // mètres

const SVG_NS = 'http://www.w3.org/2000/svg';

const els = {};
['calque','plateau','monde','tuiles','trace','reperes','gestes','drapeau','voiture','poignee','palette','etat',
 'poste','buste','epaules','crane','visage','nez','oeil','orG','orD',
 'regard','regardTrait','regardHalo',
 'source','btnInfo','indication','pastille','btnLieu','btnPosition',
 'btnReglages','reglages',
 'tiroir','recherche','resultats','outil','btnNord','aiguille','btnLecture','icoLecture',
 'btnAnnuler','btnArret','obstacles','camemberts','panneaux','volet',
 'loupe','loupeMonde','loupeFond','loupeBord','loupeCroix','loupeCoupeCercle','choixFeu',
 'telecommande','rangTrace','clignoG','clignoD','encarts','edition','marche',
 'choixVitesse','choixVehicule','suivis','fonds','serres','axes','trottoirs',
 'btnAction','btnGarder','btnBiblio','actions','feuilleGarder','bilan',
 'pageCours','voileCours','pcRetour','pcRanger','pcListe',
 'btnPartager','btnColler','echangeTexte'].forEach(id => { els[id] = document.getElementById(id); });

/* =================================================================
   Projection Web Mercator. Tout ce que l'application stocke — la
   voiture, les points — est en unités monde « U » au zoom 19, donc
   indépendant du cadrage.
   ================================================================= */
function projeter(lat, lon) {
  const s = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * Math.PI / 180)));
  return {
    x: (lon + 180) / 360 * MONDE,
    y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * MONDE
  };
}
function deprojeter(x, y) {
  const n = Math.PI - 2 * Math.PI * y / MONDE;
  return {
    lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))),
    lon: x / MONDE * 360 - 180
  };
}
/* Combien de mètres vaut une unité U, à cette latitude. */
function metresParU(lat) {
  return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, Z0);
}

/* On ouvre sur un giratoire de Lagny-sur-Marne : la voiture est déjà posée
   sur la branche ouest, il n'y a plus qu'à poser des points. */
const DEPART = { lat: 48.87167, lon: 2.71786 };
const seance = { voiture: projeter(48.87176, 2.717833), points: [],
                 obstacles: [], camemberts: [], panneaux: [], gestes: [] };
let obstacleActif = -1;            // celui qui porte la poignée de rotation

/* Le rang de pose, tamponné sur chaque point au moment où on le pose. Le bouton
   « annuler » retire LE DERNIER POINT POSÉ, et il y a maintenant plusieurs
   listes de points : celle de l'élève et celle de chaque véhicule. Sans ce
   tampon, annuler après avoir tracé le chemin d'un véhicule rongeait la
   trajectoire de l'élève, à l'autre bout de l'écran.
   Un compteur plutôt qu'une pile : une pile garde des indices, et un point
   effacé à la gomme les décale tous. Un rang, lui, reste juste. */
let compteurPose = 0;

let outil   = 'main';      // on arrive sur la carte : on se déplace d'abord
let etat    = 'arret';
let chemin  = null;
let s       = 0;
let freine  = false;
let saisie  = null;
let pousse  = false;   // le doigt tient la voiture et la pousse sur son tracé
let trame   = 0;
let dernierT = 0;
let redessinPrevu = false;
/* La voiture auto-école est arrivée au bout de son tracé, mais la lecture
   continue : la circulation, elle, tourne encore. C'est le moment où le
   moniteur explique — et il durait zéro seconde avant, parce que l'arrivée
   coupait tout. */
let arrive = false;

/* La ligne d'engagement : là où la trajectoire de l'élève passe à hauteur de la
   pointe d'un camembert. C'est la ligne du « cédez le passage » — ce qu'on
   franchit, ou pas, selon ce qu'il y a dans la part. */
/* La POINTE du camembert est le CENTRE du giratoire — c'est comme ça qu'on le
   dessine au tableau. Mais **ce n'est pas le camembert qui dit où l'on cède le
   passage** : c'est le giratoire lui-même, celui qu'OpenStreetMap connaît.

   Le faire dépendre du rayon de la part était bancal, et ça s'est vu : agrandir
   la part déplaçait la ligne, et changer d'entrée ne correspondait plus à rien.
   Le camembert ne sert donc qu'à dire **ce qu'il faut contrôler** ; l'anneau,
   lui, dit **où**. Une part dessinée large ou serrée ne bouge plus la ligne.

   Trois jets pour s'y résoudre, tous les trois à chercher la ligne dans la
   part : au plus près de la pointe (qui est au centre, donc ça posait la ligne
   au milieu du rond-point), puis à l'entrée du secteur (où l'on ne passe
   jamais : il couvre la gauche, d'où viennent les autres), puis au bord du
   disque (qui dépend de la taille qu'on a donnée à la part). */

/* Le giratoire sous un point. `large` accepte tout ce qui tombe sur l'anneau,
   et pas seulement sur l'îlot central : c'est ce qu'il faut quand le doigt vise
   un rond-point sans chercher son centre au pixel près. */
function giratoireSous(p, large) {
  const d = reseauPour(p);
  if (!d) return null;
  let pres = null, dmin = Infinity;
  (d.tours || []).forEach(function (t) {
    const e = Math.hypot(t.centre.x - p.x, t.centre.y - p.y);
    if (e < (large ? t.rayonExt : t.rayon) && e < dmin) { dmin = e; pres = t; }
  });
  return pres;
}
const giratoireSousLaPart = cm => giratoireSous(cm, false);

/* « RALENTI », C'EST RALENTI POUR CETTE RUE.

   Le seuil était absolu : trente km/h à la ligne, et l'on était censé avoir
   cherché. Ça marche sur une rue à cinquante. Ça ne veut plus rien dire sur une
   zone 30, où arriver à trente, c'est arriver à l'allure de la rue —
   c'est-à-dire n'avoir rien fait du tout :

   > « sur une route à 30 km/h avec une priorité à droite, et que j'ai pas lancé
   > de ralentissement pour faire ma prio, alors accident »

   Il a raison, et c'est tout l'intérêt de la chose : ce qui s'enseigne n'est pas
   une vitesse, c'est un RALENTISSEMENT. Le seuil se prend donc sur la limite de
   la rue, et reste borné à trente en haut — sur une départementale à 80, se
   présenter à 48 km/h à un cédez-le-passage n'est pas un contrôle.

   La part a d'abord été posée à six dixièmes, ce qui donnait 18 km/h en zone 30.
   Verdict du propriétaire, qui enseigne le geste tous les jours : « *en vrai,
   seul à 20, c'est ok* ». Sept dixièmes, donc — 21 km/h en zone 30, et rien ne
   change ailleurs, le plafond de 30 continuant de commander dès 50.

   | rue | seuil |
   |---|---|
   | 20 (zone de rencontre) | 14 km/h |
   | 30 (zone 30) | **21 km/h** — 20 passe, 25 non |
   | 50 (ville) | 30 km/h |
   | 80 et plus | 30 km/h — plafonné | */
const CONTROLE_KMH = 30;       // km/h : le plafond, quelle que soit la rue
const CONTROLE_PART = 0.7;     // et au plus sept dixièmes de la limite du lieu
const CONTROLE_PLANCHER = 8;   // km/h : en deçà, plus personne ne peut rien montrer

/* Le seuil du contrôle à cet endroit-là de la carte. */
function seuilControle(p) {
  return Math.max(CONTROLE_PLANCHER,
                  Math.min(CONTROLE_KMH, limiteSous(p) * CONTROLE_PART));
}

/* CE QU'ON JUGE, C'EST L'APPROCHE, PAS LA LIGNE.

   Le jugement lisait la vitesse À L'INSTANT du croisement. Relevé sur la séance
   du propriétaire, avec un point à 15 km/h posé dix mètres avant le carrefour —
   c'est-à-dire exactement où un moniteur le pose :

   | à −30 m | −25 | −20 | −15 | −10 | −5 | **0 (la ligne)** |
   |---|---|---|---|---|---|---|
   | 15 | 15 | 15 | 15 | **15** | 25 | **30** |

   Il avait ralenti à 15, franchement, et la voiture avait repris son allure au
   moment de franchir : l'application lisait 30 et déclarait l'engagement sans
   contrôle. « *Pourquoi quand je ralentis à 15 ou en dessous j'ai quand même un
   accident ?* » — parce qu'on regardait au mauvais endroit.

   Ce qui s'enseigne n'est pas une vitesse au pied de la ligne, c'est un
   RALENTISSEMENT à l'approche. On prend donc le minimum sur les vingt-cinq
   derniers mètres : la distance sur laquelle on ralentit vraiment pour un
   cédez-le-passage en ville. */
const APPROCHE_M = 25;

function allureDApproche(sCible) {
  const debut = Math.max(0, sCible - APPROCHE_M / mParU);
  let mini = Infinity;
  for (let i = 0; i < chemin.abs.length; i++) {
    if (chemin.abs[i] < debut) continue;
    if (chemin.abs[i] > sCible) break;
    if (chemin.vAff[i] < mini) mini = chemin.vAff[i];
  }
  if (mini === Infinity) mini = chemin.vAff[indexA(sCible, chemin)];
  return mini * mParU * 3.6;
}
let engagements = [];
let camembertsOrphelins = 0;   // posés, mais qui ne mordent sur rien
let attenteCam = null;         // la part qui nous retient en ce moment

function calerEngagements() {
  engagements = [];
  camembertsOrphelins = 0;
  if (!chemin) return;
  seance.camemberts.forEach(function (cm) {
    /* Le bord de l'anneau réel. L'axe du giratoire, dans OpenStreetMap, passe
       au MILIEU de la chaussée annulaire : on ressort d'une demi-chaussée pour
       tomber sur la ligne du cédez-le-passage.
       Pas de giratoire connu à cet endroit — planche hors réseau, ou rond-point
       absent des données : on retombe sur le disque de la part, faute de mieux. */
    const tour = giratoireSousLaPart(cm);
    const centre = tour ? tour.centre : cm;
    const rayon = tour ? tour.rayonExt : cm.R;
    cm.surAnneau = !!tour;
    let mieux = -1;
    for (let i = 0; i < chemin.pts.length; i++) {
      const q = chemin.pts[i];
      if (Math.hypot(q.x - centre.x, q.y - centre.y) <= rayon) { mieux = i; break; }
    }
    if (mieux < 0) { camembertsOrphelins++; return; }
    /* Ralentie ou normale ? C'est l'allure **tracée** qui répond (`vAff`, la
       consigne), et non la vitesse réalisable à cet endroit (`vRle`). Au ras
       d'un giratoire la courbe fait tomber la vitesse réalisable toute seule :
       une trajectoire orange y serait lue comme ralentie, et l'élève qui fonce
       sans regarder s'en tirerait sans une égratignure. */
    /* « Arrivé au pas », ce n'est plus une couleur de trajectoire mais un
       ralentissement : on se présente nettement sous l'allure de la rue, sinon
       on s'est engagé sans chercher. Voir `seuilControle`. */
    const kmh = allureDApproche(chemin.abs[mieux]);
    const seuil = seuilControle(chemin.pts[mieux]);
    const lente = kmh <= seuil;
    /* On s'arrête PARE-CHOCS sur la ligne, pas le milieu de la voiture dessus :
       une voiture arrêtée à cheval sur la ligne a déjà le nez dans l'anneau. */
    engagements.push({ cm: cm, s: Math.max(0, chemin.abs[mieux] - LV * 0.5),
                       lente: lente, kmh: Math.round(kmh), seuil: Math.round(seuil) });
  });
}
let attenteJusqu = 0;                  // fin de l'arrêt marqué en cours
let attenteDuree = 3000;               // sa durée, pour savoir où l'on en est
const arretsFranchis = new Set();      // arrêts déjà honorés sur ce passage

/* Échelle : recalculée d'après la latitude de la voiture, pour que la
   taille du véhicule et les allures restent justes. */
let mParU = metresParU(DEPART.lat);
let LV = LONGUEUR_VOITURE / mParU;           // longueur de la voiture, en U
function majEchelle() {
  mParU = metresParU(deprojeter(seance.voiture.x, seance.voiture.y).lat);
  LV = LONGUEUR_VOITURE / mParU;
}

/* =================================================================
   La vue
   ================================================================= */
const vue = { k: 1.4, tx: 0, ty: 0, cap: 0 };   // cap : rotation de la carte, en degrés

/* La carte tourne autour du centre de l'écran. Les positions restent stockées
   sans rotation ; on la remet à l'endroit pour interpréter un geste. */
function sansRotation(x, y) {
  const a = -vue.cap * Math.PI / 180;
  const dx = x - largeur / 2, dy = y - hauteur / 2;
  return { x: largeur / 2 + dx * Math.cos(a) - dy * Math.sin(a),
           y: hauteur / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
}
function ecartSansRotation(dx, dy) {
  const a = -vue.cap * Math.PI / 180;
  return { x: dx * Math.cos(a) - dy * Math.sin(a), y: dx * Math.sin(a) + dy * Math.cos(a) };
}
function deplacer(dx, dy) {
  const e = ecartSansRotation(dx, dy);
  vue.tx += e.x; vue.ty += e.y;
}
function tourner(d) {
  vue.cap = ((vue.cap + d) % 360 + 360) % 360;
  els.aiguille.setAttribute('transform', 'rotate(' + vue.cap.toFixed(1) + ' 11 11)');
  els.btnNord.hidden = vue.cap < 0.5 || vue.cap > 359.5;
  cadrer();
  redessiner();      // les panneaux se remettent d'aplomb : un stop à l'envers ne se lit pas
}
let largeur = 1, hauteur = 1;

/* Une unité monde vaut 0,2 m, et le monde en fait 134 millions de côté : au
   zoom 19 les coordonnées valent des dizaines de millions. Le moteur SVG ne
   dessine pas à cette précision — rien ne s'affiche. On dessine donc tout
   relativement à un point d'ancrage, recalé dès que la vue s'en éloigne ;
   les nombres écrits dans le document restent alors petits. */
let ancre = { x: 0, y: 0 };
const ax = v => v - ancre.x;
const ay = v => v - ancre.y;

function centreMonde() {
  return { x: (largeur / 2 - vue.tx) / vue.k, y: (hauteur / 2 - vue.ty) / vue.k };
}
function recaler() {
  const c = centreMonde();
  if (Math.abs(c.x - ancre.x) * vue.k > 2000 || Math.abs(c.y - ancre.y) * vue.k > 2000) {
    ancre = c;
    return true;
  }
  return false;
}

function centrer(lat, lon, k) {
  couchePlancher = 0;
  const p = projeter(lat, lon);
  if (k) vue.k = Math.max(Math.pow(2, ZMIN - Z0), Math.min(3, k));
  vue.tx = largeur / 2 - p.x * vue.k;
  vue.ty = hauteur / 2 - p.y * vue.k;
  cadrer();
}

function dimensionner() {
  const r = els.plateau.getBoundingClientRect();
  const nl = Math.max(1, r.width), nh = Math.max(1, r.height);
  // on garde le même point au centre quand l'écran change de taille
  vue.tx += (nl - largeur) / 2;
  vue.ty += (nh - hauteur) / 2;
  largeur = nl; hauteur = nh;
  els.calque.setAttribute('viewBox', '0 0 ' + largeur + ' ' + hauteur);
  cadrer();
}

function cadrer() {
  vue.ty = Math.min(hauteur - 4, Math.max(4 - MONDE * vue.k, vue.ty));
  const neuf = recaler();
  if (neuf) { tuiles.forEach(im => im.remove()); tuiles.clear(); }
  els.monde.setAttribute('transform',
    'rotate(' + vue.cap.toFixed(2) + ' ' + (largeur/2).toFixed(1) + ' ' + (hauteur/2).toFixed(1) + ') '
    + 'translate(' + (vue.tx + ancre.x * vue.k).toFixed(3) + ' '
                   + (vue.ty + ancre.y * vue.k).toFixed(3) + ') scale(' + vue.k.toFixed(7) + ')');
  majTuiles();
  veillerReseau();
  if (neuf) redessiner();
}

function zoomer(facteur, cxEcran, cyEcran) {
  const q = sansRotation(cxEcran, cyEcran);
  const cx = q.x, cy = q.y;
  const avant = vue.k;
  vue.k = Math.max(Math.pow(2, ZMIN - Z0), Math.min(3, vue.k * facteur));
  const r = vue.k / avant;
  if (r === 1) return;
  vue.tx = cx - (cx - vue.tx) * r;
  vue.ty = cy - (cy - vue.ty) * r;
  cadrer();
  redessiner();
}

/* =================================================================
   Les tuiles
   ================================================================= */
const tuiles = new Map();

function poserCouche(im, n, z, r, c) {
  const S = SOURCES[source];
  im.dataset.couche = n;
  if (S.cors) im.setAttribute('crossorigin', 'anonymous');
  else im.removeAttribute('crossorigin');
  im.setAttribute('href', S.lien(n, z, r, c));
}

function tuileRatee(im, z, r, c) {
  /* Une tuile déjà retirée de l'affichage peut encore signaler son échec :
     la prendre en compte ferait reculer le millésime sans raison. */
  if (!im.isConnected) return;
  if (!SOURCES[source].chaine) return;         // un seul millésime chez ce fournisseur
  const n = (+im.dataset.couche) + 1;
  if (n >= COUCHES.length) return;             // plus rien à essayer
  if (couchePlancher < n) couchePlancher = n;
  poserCouche(im, n, z, r, c);
  majSource();
}

/* Le millésime annoncé est celui que portent réellement les tuiles à
   l'écran, pas une intention. */
function majSource() {
  const compte = new Array(COUCHES.length).fill(0);
  tuiles.forEach(function (im) { compte[+im.dataset.couche] += 1; });
  let n = couchePlancher, max = 0;
  compte.forEach(function (v, i) { if (v > max) { max = v; n = i; } });
  els.source.textContent = SOURCES[source].mention(n)
    + (montrerTrottoirs ? ' · trottoirs : © IGN — Parcellaire Express — Licence Ouverte 2.0' : '');
  /* Seulement les boutons du fond de carte : le tiroir porte depuis trois
     autres réglages qui empruntent la même allure, et une recherche sur toute
     la page les remettait tous à « non choisi » au premier rafraîchissement. */
  els.fonds.querySelectorAll('.fond').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.source === source));
  });
}

function changerSource(id) {
  if (!SOURCES[id] || id === source) return;
  source = id;
  couchePlancher = 0;
  tuiles.forEach(im => im.remove());
  tuiles.clear();
  cadrer();
}

function majTuiles() {
  const z = Math.max(ZMIN, Math.min(ZMAX, Math.round(Z0 + Math.log2(vue.k))));
  const pas = COTE * Math.pow(2, Z0 - z);      // côté d'une tuile, en U
  const n = Math.pow(2, z);

  // les quatre coins de l'écran, remis à l'endroit : un écran tourné déborde
  const coins = [[0,0],[largeur,0],[0,hauteur],[largeur,hauteur]].map(function (p) {
    const q = sansRotation(p[0], p[1]);
    return { x: (q.x - vue.tx) / vue.k, y: (q.y - vue.ty) / vue.k };
  });
  const xs = coins.map(p => p.x), ys = coins.map(p => p.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const c0 = Math.max(0, Math.floor(x0 / pas)), c1 = Math.min(n - 1, Math.floor(x1 / pas));
  const r0 = Math.max(0, Math.floor(y0 / pas)), r1 = Math.min(n - 1, Math.floor(y1 / pas));
  if ((c1 - c0 + 1) * (r1 - r0 + 1) > 340) return;

  const voulues = new Set();
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const cle = z + '/' + c + '/' + r;
      voulues.add(cle);
      if (tuiles.has(cle)) continue;
      const im = document.createElementNS(SVG_NS, 'image');
      im.setAttribute('x', ax(c * pas).toFixed(3));
      im.setAttribute('y', ay(r * pas).toFixed(3));
      im.setAttribute('width', pas.toFixed(3));
      im.setAttribute('height', pas.toFixed(3));
      im.setAttribute('preserveAspectRatio', 'none');
      poserCouche(im, couchePlancher, z, r, c);
      im.addEventListener('error', function () { tuileRatee(im, z, r, c); });
      els.tuiles.appendChild(im);
      tuiles.set(cle, im);
    }
  }
  tuiles.forEach(function (im, cle) {
    if (!voulues.has(cle)) { im.remove(); tuiles.delete(cle); }
  });
  majSource();
}

/* =================================================================
   Géométrie : spline de Catmull-Rom centripète
   ================================================================= */
function noeud(t, a, b) {
  return t + Math.max(Math.pow(Math.hypot(b.x - a.x, b.y - a.y), 0.5), 1e-4);
}
function entre(a, b, k) { return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }; }

function surSegment(p0, p1, p2, p3, u) {
  const t0 = 0, t1 = noeud(t0, p0, p1), t2 = noeud(t1, p1, p2), t3 = noeud(t2, p2, p3);
  const t = t1 + (t2 - t1) * u;
  const A1 = entre(p0, p1, (t - t0) / (t1 - t0));
  const A2 = entre(p1, p2, (t - t1) / (t2 - t1));
  const A3 = entre(p2, p3, (t - t2) / (t3 - t2));
  const B1 = entre(A1, A2, (t - t0) / (t2 - t0));
  const B2 = entre(A2, A3, (t - t1) / (t3 - t1));
  return entre(B1, B2, (t - t1) / (t2 - t1));
}

/* =================================================================
   Chemin et profil d'allure
   ================================================================= */
/* Le même calcul sert à la voiture auto-école et à chaque véhicule obstacle :
   seuls changent le point de départ et la liste de points. */
function construireChemin(depart, liste, ferme) {
  /* Pas de voiture auto-école posée, pas de trajectoire d'élève. Celles des
     véhicules obstacles continuent d'exister : ils ont leur propre départ. */
  if (!depart && seance.voiture.absente) return null;
  depart = depart || seance.voiture;
  liste = liste || mesPoints();
  if (liste.length === 0) return null;
  majEchelle();
  heriterVitesses(liste);

  /* DEUX SOMMETS CONFONDUS FONT UNE BOUCLE. La courbe de Catmull-Rom tire ses
     tangentes de la corde entre le point d'avant et celui d'après : deux
     sommets au même endroit, ou presque, et cette corde s'annule — la courbe
     part en crosse de plusieurs mètres au lieu de passer droit.

     Ça se produisait à l'arrivée d'un tronçon suivi, quand le dernier point
     semé tombait pile sur le point posé. La cause a été traitée là-bas, mais le
     garde-fou est ici, où le mal se fait : un sommet à moins de 40 cm du
     précédent ne sert à rien et se jette. Le dernier, lui, se garde toujours —
     c'est celui que le moniteur a posé, et il porte sa consigne. */
  const bruts = [depart].concat(liste);
  const mini = LV * 0.1;
  const sommets = [bruts[0]];
  for (let i = 1; i < bruts.length; i++) {
    const q = sommets[sommets.length - 1];
    const loin = Math.hypot(bruts[i].x - q.x, bruts[i].y - q.y) > mini;
    if (loin) sommets.push(bruts[i]);
    else if (i === bruts.length - 1) sommets[sommets.length - 1] = bruts[i];
  }
  const n = sommets.length;
  if (n < 2) return null;

  /* La spline a besoin d'un point AVANT le premier et d'un point APRÈS le
     dernier pour connaître ses tangentes aux deux bouts.

     Chemin ouvert : on les invente en miroir, ce qui donne une entrée et une
     sortie droites — c'est ce qu'on veut, la voiture part dans l'axe.

     Chemin fermé (un circuit) : il n'y a pas de bout. On les prend **de l'autre
     côté de la boucle**, ce qui rend la courbe périodique. Sans ça le tour est
     lisse partout sauf là où il se referme, où un angle net apparaît — et sur un
     giratoire, c'est précisément l'endroit qu'on regarde. */
  const P = (ferme && n > 3)
    ? [ sommets[n-2], ...sommets, sommets[1] ]
    : [ { x: 2*sommets[0].x - sommets[1].x, y: 2*sommets[0].y - sommets[1].y },
        ...sommets,
        { x: 2*sommets[n-1].x - sommets[n-2].x, y: 2*sommets[n-1].y - sommets[n-2].y } ];

  const pas = Math.max(0.6, LV * 0.08);
  const pts = [{ x: sommets[0].x, y: sommets[0].y }];
  const sSommet = [0];
  for (let i = 0; i < n - 1; i++) {
    const corde = Math.hypot(P[i+2].x - P[i+1].x, P[i+2].y - P[i+1].y);
    const div = Math.min(140, Math.max(8, Math.ceil(corde / pas)));
    for (let j = 1; j <= div; j++) pts.push(surSegment(P[i], P[i+1], P[i+2], P[i+3], j / div));
    sSommet.push(pts.length - 1);
  }

  const m = pts.length;
  const abs = new Float64Array(m);
  for (let i = 1; i < m; i++) {
    abs[i] = abs[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
  }
  const total = abs[m-1];
  if (!(total > LV * 0.2)) return null;

  // des mètres par seconde aux unités monde par seconde
  const q = 1 / mParU;
  const vN = ALLURE.normale * q, vL = ALLURE.lente * q, vR = ALLURE.rapide * q;
  const aF = ALLURE.frein * q, aR = ALLURE.relance * q;

  /* Chaque point fixe la vitesse que la voiture doit avoir EN L'ATTEIGNANT.
     Entre deux points, le plafond est la plus élevée des deux : on ralentit en
     arrivant sur un point lent, on reprend en le quittant. Un point sans
     consigne prend la vitesse de la route sous lui. */
  /* Sur un circuit, un point sans consigne prend l'allure d'un giratoire, pas
     celle de l'avenue d'à côté. */
  const kmhIci = p => (ferme && p.v == null && p.vh == null)
    ? Math.min(BOUCLE_KMH, limiteSous(p)) : kmhDuPoint(p);

  const cible = new Float64Array(n);
  for (let k = 1; k < n; k++) cible[k] = uParSec(kmhIci(liste[k-1]));
  // la voiture part dans l'allure du premier point — sauf si c'est un arrêt,
  // auquel cas elle doit bien rouler pour aller s'y arrêter
  cible[0] = cible[1] > 0 ? cible[1]
           : uParSec(ferme ? Math.min(BOUCLE_KMH, limiteSous(depart)) : limiteSous(depart));

  const regime = new Float64Array(m);
  for (let k = 0; k < n - 1; k++) {
    const plafond = Math.max(cible[k], cible[k+1]);
    for (let i = sSommet[k]; i <= sSommet[k+1]; i++) regime[i] = plafond;
  }
  for (let k = 0; k < n; k++) regime[sSommet[k]] = cible[k];

  /* PLUS DE BRIDAGE EN COURBE.

     Il y avait ici un plafond calculé sur la courbure : rayon serré, vitesse
     limitée, pour que la voiture « ne dérape pas ». L'intention était bonne, le
     résultat non — la moindre irrégularité du relevé d'OpenStreetMap devenait
     un virage, et la voiture se retrouvait à 64 km/h au milieu d'une insertion
     à 90, ou à 30 sur un trajet plus long. Le moniteur écrivait un nombre sur
     un point, et l'application ne le suivait pas.

     Or la vitesse est ce qu'il enseigne. Elle vient de lui, et d'une seule
     chose : ce qu'il écrit sur les points, ou à défaut la vitesse de la route.
     Le freinage et la relance restent, eux — ils ne décident de rien, ils
     rendent seulement le passage d'une vitesse à l'autre réaliste. */
  const plafond = regime;

  /* Le tracé montre la consigne ; la voiture part et s'arrête à l'arrêt, ce qui
     relève du mouvement et non de ce que le moniteur a demandé.

     Sauf sur un CIRCUIT : il n'a pas de bouts. Lui imposer l'arrêt aux deux
     extrémités faisait ralentir puis réaccélérer le véhicule à chaque tour,
     toujours au même endroit — un freinage sans raison au milieu d'un
     giratoire, que rien ne justifiait à l'écran. */
  /* ELLE PART À L'ARRÊT, ELLE NE FREINE PAS À LA FIN.

     Le profil imposait zéro aux DEUX bouts : la voiture passait son temps à
     accélérer puis à freiner, et sur un tronçon de deux cents mètres à 90 elle
     n'atteignait jamais 90.

     Au départ, l'arrêt est juste : une leçon de conduite commence à l'arrêt, on
     démarre. À l'arrivée, non : le tracé s'arrête là où le moniteur a cessé de
     poser des points, pas là où la voiture devrait s'arrêter. Un arrêt voulu
     s'écrit — « Arrêt » sur le dernier point.

     Un CIRCUIT n'a pas de bouts : ni l'un ni l'autre. */
  const vAff = lisser(regime, abs, aF, aR, false, false);
  const vRle = lisser(plafond, abs, aF, aR, !ferme, false);

  /* LE VIRAGE SE PREND À LA VITESSE ÉCRITE, PAS À CELLE D'UN FREINAGE OU D'UNE
     RELANCE.

     « J'ai mis 25 avant le virage et 20 dans le virage, et accident à 27 — je
     peux rien y faire. » Il avait raison, et c'était l'application. Un point
     fixe la vitesse EN L'ATTEIGNANT : la voiture freinait donc jusqu'au dernier
     mètre avant le sommet du virage, et relançait dès le premier mètre après —
     à 3,5 m/s², franchement. Or la courbe qui passe par un coin est la plus
     serrée justement autour de son sommet. Relevé sur un angle droit : rayon
     de 6 m, la voiture à 26 km/h trois mètres après le point à 20, 8,3 m/s² —
     glissade. Le moniteur avait écrit une vitesse juste ; c'est le passage
     d'une vitesse à l'autre qui ne l'était pas.

     Ce n'est pas le retour du bridage en courbe, retiré parce qu'il décidait
     des vitesses à la place du moniteur. Celui-ci ne touche à AUCUNE vitesse
     écrite ; il ne règle que les transitions, comme le ferait un conducteur :

     - en FREINANT vers un point plus lent, on arrive au virage déjà ralenti —
       on freine plus tôt, jamais plus bas que la vitesse écrite au point ;
     - en RELANÇANT, on n'accélère pas plus vite que le virage ne le tient —
       on attend qu'il s'ouvre.

     Une vitesse ÉCRITE trop forte pour le virage, elle, passe telle quelle, et
     la glissade arrive : c'est sa décision, et c'est elle qu'on juge. Une marge
     de 8 % sous l'adhérence sépare les deux, pour que la transition ne frôle
     jamais la limite qui punit. */
  const MARGE_TENUE = 0.92;
  const geo = { pts: pts, abs: abs, total: total, vRle: regime };
  const tenue = new Float64Array(m);
  for (let i = 0; i < m; i++) {
    const c = rayonCourbure(geo, abs[i]);
    tenue[i] = isFinite(c.R) ? Math.sqrt(ADHERENCE * MARGE_TENUE * c.R * mParU) / mParU : Infinity;
  }
  // la vitesse écrite au point vers lequel on roule
  const vise = new Float64Array(m);
  for (let k = 0; k < n - 1; k++)
    for (let i = sSommet[k]; i <= sSommet[k+1]; i++) vise[i] = cible[k+1];
  for (let i = 0; i < m; i++) vRle[i] = Math.min(vRle[i], Math.max(tenue[i], vise[i]));
  for (let i = m - 2; i >= 0; i--) {
    const d = abs[i+1] - abs[i];
    vRle[i] = Math.min(vRle[i], Math.sqrt(vRle[i+1] * vRle[i+1] + 2 * aF * d));
  }
  for (let i = 1; i < m; i++) {
    const d = abs[i] - abs[i-1];
    let v = Math.min(vRle[i], Math.sqrt(vRle[i-1] * vRle[i-1] + 2 * aR * d));
    if (v > vRle[i-1] && v > tenue[i]) v = Math.max(vRle[i-1], tenue[i]);
    vRle[i] = v;
  }

  /* Les arrêts marqués : un point à zéro, c'est un stop. Trois secondes, le
     temps de regarder à droite puis à gauche. */
  const arrets = [];
  for (let k = 1; k < n; k++) {
    if (kmhDuPoint(liste[k-1]) < ARRET_KMH)
      arrets.push({ k: k, s: abs[sSommet[k]], duree: 3 });
  }
  return { pts, abs, total, vAff, vRle, vN, vL, vR, arrets };
}

/* Les deux bouts se commandent séparément : la voiture PART à l'arrêt — c'est
   une leçon de conduite, on démarre — mais elle n'a aucune raison de FREINER à
   la fin. Le tracé s'arrête là où le moniteur a cessé de poser des points, pas
   là où la voiture devrait s'arrêter ; lui imposer un freinage d'arrivée la
   ralentissait sur les cent derniers mètres sans que personne l'ait demandé.
   Un arrêt voulu s'écrit : « Arrêt » sur le dernier point. */
function lisser(source, abs, aF, aR, zeroDebut, zeroFin) {
  const m = source.length;
  const v = Float64Array.from(source);
  if (zeroDebut) v[0] = 0;
  if (zeroFin) v[m-1] = 0;
  for (let i = m - 2; i >= 0; i--) {
    const d = abs[i+1] - abs[i];
    v[i] = Math.min(v[i], Math.sqrt(v[i+1] * v[i+1] + 2 * aF * d));
  }
  for (let i = 1; i < m; i++) {
    const d = abs[i] - abs[i-1];
    v[i] = Math.min(v[i], Math.sqrt(v[i-1] * v[i-1] + 2 * aR * d));
  }
  return v;
}

function indexA(q, ch) {
  const abs = (ch || chemin).abs;
  let lo = 0, hi = abs.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (abs[mid] <= q) lo = mid; else hi = mid; }
  return lo;
}
function positionSeule(sd, ch) {
  ch = ch || chemin;
  const { pts, abs, total } = ch;
  const q = Math.max(0, Math.min(total, sd));
  const lo = indexA(q, ch), hi = lo + 1;
  const d = abs[hi] - abs[lo];
  return entre(pts[lo], pts[hi], d > 1e-12 ? (q - abs[lo]) / d : 0);
}
function surChemin(sd, ch) {
  ch = ch || chemin;
  const { pts, abs, total, vRle } = ch;
  const q = Math.max(0, Math.min(total, sd));
  const lo = indexA(q, ch), hi = lo + 1;
  const d = abs[hi] - abs[lo];
  const u = d > 1e-12 ? (q - abs[lo]) / d : 0;
  const p = entre(pts[lo], pts[hi], u);
  const v = vRle[lo] + (vRle[hi] - vRle[lo]) * u;
  const delta = LV * 0.35;
  const a = positionSeule(Math.max(0, q - delta), ch);
  const b = positionSeule(Math.min(total, q + delta), ch);
  const cap = Math.hypot(b.x - a.x, b.y - a.y) < 1e-9 ? 0 : Math.atan2(b.y - a.y, b.x - a.x);
  return { x:p.x, y:p.y, v:v, cap:cap };
}


/* =================================================================
   Les clignotants et les contrôles : plus rien n'est déduit
   =================================================================
   Il y a eu ici, pendant une semaine, de quoi lire une trajectoire et en
   déduire les gestes : le giratoire repéré dans OpenStreetMap avec son entrée,
   son anneau et sa sortie ; le carrefour réellement traversé, reconnu sur la
   topologie ; l'insertion sur autoroute ; le déboîtement et le rabattement ;
   l'allumage calé sur « le clignotant se met lorsque tu vois où tu vas », en
   remontant la trajectoire tant que le carrefour restait dans le champ de
   vision.

   Tout est parti, et dans cet ordre : le déboîtement, l'insertion, puis le
   reste — giratoires et carrefours compris.

   La raison est toujours la même, et elle a été dite dès le premier retrait :
   l'application voit une ligne sur une photo. Elle ne sait pas ce que le
   moniteur veut MONTRER. Quand elle se trompait, c'est lui qui passait pour
   celui qui raconte n'importe quoi devant l'élève ; et quand elle avait
   raison, elle parlait avant lui. Le cours n'est pas à elle.

   Ce qui reste automatique, et que le propriétaire a gardé : le **tracé** —
   l'itinéraire qui suit la route entre deux points posés. Celui-là ne décide
   rien, il dessine ce qui existe.

   Ce qui est lu sur la carte sert donc encore, mais à autre chose : recaler
   les points dans leur voie, planter les panneaux sur le trottoir, relever la
   signalisation, connaître la vitesse des routes, et trouver le chemin d'un
   point à l'autre.
   ================================================================= */
/* L'écart entre deux caps, ramené dans [-180, 180]. Il servait aux règles de
   manœuvre, qui sont parties ; le relevé du réseau s'en sert toujours pour
   regrouper les branches d'un giratoire et orienter les panneaux. */
function ecartAngle(a, b) { return ((a - b + 540) % 360) - 180; }

const reseaux = new Map();   // bbox déjà analysée -> routes du secteur
const chargements = new Map(); // bbox en cours de lecture



/* =================================================================
   L'insertion : ce que l'application ne gère plus
   =================================================================
   Il y avait ici toute la séquence enseignée — on sait qu'on est sur une voie
   d'insertion, on ACCÉLÈRE, premier contrôle rétro extérieur gauche puis angle
   mort, clignotant, toujours en accélération, second contrôle, et si personne
   on s'insère. Elle se calait sur la fin de la bretelle dans OpenStreetMap,
   qui marque le point d'insertion, et remontait les gestes en TEMPS plutôt
   qu'en distance pour tomber juste à 50 comme à 90 km/h.

   Retiré le 21/09/2026, à la demande du propriétaire :

   > « je ne veux pas que l'app gère l'insertion, je préfère que ce soit le
   > moniteur pour qu'il puisse gérer son entrée là où il veut »

   Et il a raison : le point d'insertion d'OpenStreetMap est la fin d'un tronçon
   dans une base de données, pas l'endroit où CE moniteur veut montrer que
   l'élève doit s'insérer. Selon le trafic, la longueur de la voie
   d'accélération, le niveau de l'élève, ce n'est pas le même endroit — et c'est
   précisément ce qu'il enseigne.

   L'insertion se montre donc comme tout le reste : on pose ses points où l'on
   veut entrer, on règle les vitesses, et on donne les gestes à la
   télécommande. */



/* Une bbox lue une fois ne se relit pas : ni dans la session, ni sur le
   réseau. Les clés étant calées sur une grille fixe (voir cleCase), le service
   worker garde les mêmes URL d'une fois sur l'autre — c'est ce qui rend le
   recalage possible en leçon, sans réseau, sur un secteur déjà parcouru. */
function lireReseau(cle) {
  if (reseaux.has(cle)) return Promise.resolve(reseaux.get(cle));
  if (chargements.has(cle)) return chargements.get(cle);
  const attente = analyserReseau(cle);
  chargements.set(cle, attente);
  attente.then(function (d) { reseaux.set(cle, d); limitesVues.clear(); redessiner(); },
               function () {})
         .then(function () { chargements.delete(cle); });
  return attente;
}

async function analyserReseau(cle) {
  const r = await fetch('https://api.openstreetmap.org/api/0.6/map?bbox=' + cle);
  if (!r.ok) throw new Error('OSM ' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/xml');

  const noeuds = new Map();
  /* Les panneaux sont des NŒUDS étiquetés, là où tout le reste de ce fichier ne
     lit que des ways. Un feu de passage piéton porte aussi `traffic_signals` :
     on l'écarte, ce n'est pas un feu de carrefour. */
  // la carte ne sait pas de quelle couleur est un feu : il arrive éteint
  const SIGNE = { stop:'stop', give_way:'cedez', traffic_signals:'feu' };
  const signes = new Map();
  const passages = [];          // les passages piétons : un feu se tient DERRIÈRE
  /* L'ÉTENDUE RÉELLE DES DONNÉES, ET NON LA BOÎTE DEMANDÉE.

     OpenStreetMap rend une rue ENTIÈRE dès qu'un seul de ses nœuds tombe dans la
     boîte : une case de 1,1 km ramène donc des rues qui débordent largement. Or
     `reseauPour` cherchait le réseau dont la boîte DEMANDÉE contient le point, et
     rendait `null` pour tout ce qui dépassait — `limiteSous` retombait alors sur
     les 50 km/h par défaut. Mesuré : **22 rues sur 163, 13 %**, toutes des zones
     30 rendues à 50. La voiture y roulait à 50, et le seuil du cédez-le-passage
     avec. On garde donc l'étendue de ce qu'on a vraiment reçu. */
  let laMin = Infinity, laMax = -Infinity, loMin = Infinity, loMax = -Infinity;
  doc.querySelectorAll('node').forEach(n => {
    const id = n.getAttribute('id');
    const la = parseFloat(n.getAttribute('lat')), lo = parseFloat(n.getAttribute('lon'));
    if (la < laMin) laMin = la;
    if (la > laMax) laMax = la;
    if (lo < loMin) loMin = lo;
    if (lo > loMax) loMax = lo;
    const p = projeter(la, lo);
    noeuds.set(id, p);
    const t = {};
    n.querySelectorAll('tag').forEach(x => { t[x.getAttribute('k')] = x.getAttribute('v'); });
    if (t.highway === 'crossing' || t.footway === 'crossing') passages.push(p);
    const signe = SIGNE[t.highway];
    if (signe && !t.crossing)
      signes.set(id, { id: id, x: p.x, y: p.y, signe: signe,
                       direction: t.direction || null, cap: null });
  });

  const ROULABLE = new Set(['motorway','trunk','primary','secondary','tertiary',
    'unclassified','residential','living_street','road','motorway_link','trunk_link',
    'primary_link','secondary_link','tertiary_link']);

  const axes = [], anneaux = [], voies = [], fleches = [], sorties = [];
  const entrees = new Set();
  const voisins = new Map();        // topologie du réseau : id -> ids adjacents
  const dansAnneau = new Set();
  const relier = (a, b) => {
    if (!voisins.has(a)) voisins.set(a, new Set());
    voisins.get(a).add(b);
  };

  /* LE GRAPHE ROUTIER : de quoi chercher un chemin d'un endroit à un autre.
     `voisins` ne suffisait pas — il ignore le sens de circulation, et c'est
     justement ce qu'il ne faut pas ignorer quand on trace un itinéraire. Ici
     chaque arc est ORIENTÉ, et porte la vitesse de sa route. */
  const arcs = new Map();
  const brancher = (a, b, d, voie) => {
    if (!arcs.has(a)) arcs.set(a, []);
    arcs.get(a).push({ vers: b, d: d, limite: voie.limite, voie: voie });
  };
  doc.querySelectorAll('way').forEach(w => {
    const tags = {};
    w.querySelectorAll('tag').forEach(t => { tags[t.getAttribute('k')] = t.getAttribute('v'); });
    if (!ROULABLE.has(tags.highway)) return;
    const refs = [...w.querySelectorAll('nd')].map(nd => nd.getAttribute('ref'))
      .filter(r => noeuds.has(r));
    if (refs.length < 2) return;
    for (let i = 0; i < refs.length - 1; i++) { relier(refs[i], refs[i+1]); relier(refs[i+1], refs[i]); }
    const pts = refs.map(r => noeuds.get(r));
    const rond = tags.junction === 'roundabout' || tags.junction === 'circular';
    const decrit = decrireVoies(pts, tags);

    /* Un giratoire est à sens unique même sans l'étiquette : c'est la règle,
       et OpenStreetMap compte dessus. Sans ça, un itinéraire prendrait
       l'anneau à contresens pour gagner dix mètres. */
    const unique = decrit.sens || rond;
    const envers = tags.oneway === '-1';
    for (let i = 0; i < refs.length - 1; i++) {
      const a = refs[i], b = refs[i + 1];
      const pa = noeuds.get(a), pb = noeuds.get(b);
      const long = Math.hypot(pb.x - pa.x, pb.y - pa.y);
      if (!unique || !envers) brancher(a, b, long, decrit);
      if (!unique ||  envers) brancher(b, a, long, decrit);
    }
    if (rond) {
      /* La largeur de la chaussée annulaire : c'est elle qui dit où est le BORD
         de l'anneau, donc la ligne du cédez-le-passage. Un giratoire à trois
         voies fait une dizaine de mètres de large ; un forfait de 5 m arrêtait
         la voiture une voie trop loin, déjà sur l'anneau extérieur. */
      anneaux.push({ pts: pts, largeur: decrit.total * decrit.largeur });
      refs.forEach(r => dansAnneau.add(r));
    }
    else { axes.push(pts); voies.push(decrit); }

    /* Le nœud d'un panneau est posé SUR l'axe de la route. Pour le planter au
       bord, il faut savoir où passe cette route et quelle largeur elle fait :
       c'est ici, et nulle part ailleurs, qu'on le sait. */
    refs.forEach(function (r, i) {
      const sg = signes.get(r);
      if (!sg || sg.cap !== null) return;          // le premier way qui le porte suffit
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      if (a === b) return;
      sg.cap = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      sg.largeur = decrit ? decrit.total * decrit.largeur : 6;
    });

    /* Le sens unique n'est pas un nœud étiqueté : c'est une PROPRIÉTÉ de la rue
       (`oneway`). On pose donc une flèche au milieu de chaque tronçon, dans le
       sens où l'on a le droit de rouler — `oneway=-1` veut dire à rebours du
       tracé. */
    if (decrit && decrit.sens) {
      const n = pts.length;
      const i = Math.max(1, Math.floor(n / 2));
      const a = pts[i - 1], b = pts[i];
      let cap = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      if (decrit.inverse) cap += 180;
      const ecart = decrit.total * decrit.largeur / 2 + BORD_ROUTE;
      const idw = 'w' + w.getAttribute('id');
      fleches.push({ id: idw, signe: 'sens', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
                     capFleche: cap, capBord: cap + 90, ecart: ecart,
                     demi: ecart - BORD_ROUTE, aDegager: true });
      /* Le bout par lequel la circulation SORT : c'est là, et nulle part
         ailleurs, qu'on pourrait entrer à contresens. On garde le nœud, on
         verra plus bas si c'est un vrai carrefour. */
      const k = decrit.inverse ? 0 : n - 1;
      sorties.push({ id: idw + 'i', ref: refs[k], x: pts[k].x, y: pts[k].y,
                     cap: cap, ecart: ecart });
      // et le bout par lequel elle SE REMPLIT : voir plus bas, il annule un B1
      entrees.add(refs[decrit.inverse ? n - 1 : 0]);
    }
  });

  /* Un carrefour n'est pas une étiquette dans OpenStreetMap : c'est un nœud
     partagé par trois branches ou plus. C'est de la topologie, donc exact — là
     où lire seulement le cap de la trajectoire confond un carrefour avec une
     simple courbe de route.
     Comme OSM découpe un même carrefour en plusieurs nœuds, on regroupe : reliés
     par la route, à moins de 15 m, et sans jamais dépasser 30 m d'amas. */
  const candidats = [...voisins.keys()].filter(i => voisins.get(i).size >= 3 && !dansAnneau.has(i));
  const restants = new Set(candidats);
  const carrefours = [];
  while (restants.size) {
    const germe = restants.values().next().value;
    restants.delete(germe);
    const groupe = [germe];
    let change = true;
    while (change) {
      change = false;
      for (const i of [...restants]) {
        if (Math.hypot(noeuds.get(i).x - noeuds.get(germe).x,
                       noeuds.get(i).y - noeuds.get(germe).y) * mParU > 30) continue;
        if (groupe.some(j => voisins.get(j).has(i) &&
              Math.hypot(noeuds.get(i).x - noeuds.get(j).x,
                         noeuds.get(i).y - noeuds.get(j).y) * mParU <= 15)) {
          groupe.push(i); restants.delete(i); change = true;
        }
      }
    }
    const bras = new Set();
    groupe.forEach(i => voisins.get(i).forEach(v => { if (!groupe.includes(v)) bras.add(v); }));
    if (bras.size < 3) continue;
    const centre = { x: groupe.reduce((a, i) => a + noeuds.get(i).x, 0) / groupe.length,
                     y: groupe.reduce((a, i) => a + noeuds.get(i).y, 0) / groupe.length };
    const etendue = Math.max.apply(null, groupe.map(i =>
      Math.hypot(noeuds.get(i).x - centre.x, noeuds.get(i).y - centre.y)));
    carrefours.push({ centre, branches: bras.size, rayon: etendue + 12 / mParU });
  }

  // un giratoire peut être découpé : on recolle par proximité des extrémités
  const tours = [];
  anneaux.forEach(a => {
    const proche = tours.find(t => t.pts.some(q =>
      a.pts.some(r2 => Math.hypot(q.x - r2.x, q.y - r2.y) < 2 / mParU)));
    if (proche) { proche.pts = proche.pts.concat(a.pts);
                  proche.largeur = Math.max(proche.largeur, a.largeur); }
    else tours.push({ pts: a.pts.slice(), largeur: a.largeur });
  });
  tours.forEach(t => {
    t.centre = { x: t.pts.reduce((a, p) => a + p.x, 0) / t.pts.length,
                 y: t.pts.reduce((a, p) => a + p.y, 0) / t.pts.length };
    t.rayon = t.pts.reduce((a, p) => a + Math.hypot(p.x - t.centre.x, p.y - t.centre.y), 0) / t.pts.length;
    // angles des branches : les points d'axe qui touchent l'anneau
    const bruts = [];
    axes.forEach(a => [a[0], a[a.length - 1]].forEach(b => {
      const d = Math.hypot(b.x - t.centre.x, b.y - t.centre.y);
      if (Math.abs(d - t.rayon) < Math.max(t.rayon * 0.45, 6 / mParU)) {
        bruts.push(Math.atan2(b.y - t.centre.y, b.x - t.centre.x) * 180 / Math.PI);
      }
    }));

    /* Le BORD de l'anneau : la ligne qu'on ne franchit qu'après avoir cédé le
       passage. Le rayon relevé situe l'AXE de la chaussée annulaire, il faut
       donc lui ajouter une demi-chaussée. Trois tentatives pour la trouver :

       - **le nombre de voies d'OpenStreetMap** : étiqueté sur la moitié des
         giratoires seulement (16 sur 31 au Val d'Europe), et presque toujours
         `lanes=2`, même sur ceux de 40 m de rayon. Sur un trois-voies, la
         voiture s'arrêtait une voie trop loin, déjà sur l'anneau extérieur ;
       - **le raccordement des branches** : elles se raccordent sur l'AXE, pas
         sur le bord — écarts relevés de +0,2 à +0,7 m, et un cas aberrant à
         +18 m ;
       - **la taille de l'anneau lui-même**, retenue ici : une chaussée
         annulaire s'élargit avec le giratoire, et ça, on le mesure.

       Et on se trompe volontairement **du bon côté** : s'arrêter un mètre trop
       tôt ne se voit pas, un mètre trop tard met la voiture sur l'anneau. */
    const rayonM = t.rayon * mParU;
    const demi = Math.min(15, Math.max(3.5, (t.largeur || 6) / 2, rayonM * ANNEAU_LARGE));
    t.rayonExt = (rayonM + demi + RETRAIT_CEDEZ) / mParU;
    /* Une branche physique arrive souvent en deux tronçons OSM — l'entrée et la
       sortie séparées par un îlot. Sans les fusionner, « la sortie qui précède
       la sienne » tombe sur l'autre moitié de sa propre sortie, et le clignotant
       droit s'allume beaucoup trop tard. */
    t.branches = [];
    bruts.sort((x, y) => x - y).forEach(a => {
      const proche = t.branches.find(g => Math.abs(ecartAngle(a, g.moy)) < 18);
      if (proche) { proche.n += 1; proche.moy += ecartAngle(a, proche.moy) / proche.n; }
      else t.branches.push({ moy: a, n: 1 });
    });
    t.branches = t.branches.map(g => g.moy);
  });

  /* On plante enfin chaque panneau sur le bas-côté, à DROITE de ceux qu'il
     regarde — c'est le côté français.

     Qui regarde-t-il ? Le tag `direction` le dit quand il existe. Quand il
     manque, le carrefour le plus proche répond : un stop regarde toujours ceux
     qui arrivent dessus, donc le sens de marche est celui qui va vers lui.
     Sans carrefour à proximité, on s'en tient au sens de tracé du way — le
     panneau est alors du bon côté une fois sur deux, mais il est au bord, ce
     qui vaut toujours mieux qu'au milieu de la chaussée. */
  signes.forEach(function (sg) {
    if (sg.cap === null) return;
    let marche = sg.cap;
    if (sg.direction === 'backward') marche += 180;
    else if (sg.direction !== 'forward') {
      let pres = null, dmin = 60 / mParU;
      carrefours.concat(tours).forEach(function (c) {
        const d2 = Math.hypot(c.centre.x - sg.x, c.centre.y - sg.y);
        if (d2 < dmin) { dmin = d2; pres = c.centre; }
      });
      if (pres) {
        const vers = Math.atan2(pres.y - sg.y, pres.x - sg.x) * 180 / Math.PI;
        if (Math.abs(ecartAngle(vers, marche)) > 90) marche += 180;
      }
    }
    sg.capBord = marche + 90;                       // la droite : l'écran a l'y vers le bas
    sg.marche = marche;                             // le sens dans lequel on l'aborde
    if (sg.signe === 'feu') reculerDerriereLePassage(sg, marche, passages);
    sg.ecart = ecartDegage(sg.x, sg.y, sg.capBord,
                           (sg.largeur || 6) / 2 + BORD_ROUTE, voies);
  });
  /* Le cadastre arrive ici, et pas plus tôt : il ne sert qu'à rentrer les
     panneaux dans le domaine public, et on ne veut pas qu'ils SAUTENT une
     seconde après avoir été posés. S'il tarde ou s'il tombe, on s'en passe —
     le réseau, lui, ne doit jamais attendre. */
  const parc = await Promise.race([
    lireParcelles(cle).catch(function () { return null; }),
    new Promise(function (r) { setTimeout(function () { r(null); }, TROT_ATTENTE); })
  ]);

  /* Le sens interdit se dresse à l'entrée qu'on n'a pas le droit de prendre :
     au bout par lequel la rue à sens unique se vide, et **seulement si ce bout
     est un carrefour** — au milieu d'une rue, personne ne peut tourner dedans,
     et un B1 planté là ne voudrait rien dire.

     Il est reculé de quelques mètres DANS la rue : posé sur le nœud même, il
     tomberait au milieu du croisement. Et il regarde celui qui voudrait
     entrer, donc sa droite est celle du sens interdit. */
  fleches.forEach(function (f) {
    if (f.aDegager) f.ecart = ecartDegage(f.x, f.y, f.capBord, f.ecart, voies);
    f.ecart = rentrerDansLeDomaine(parc, f.x, f.y, f.capBord, f.ecart, f.demi || 0);
  });
  signes.forEach(function (sg) {
    if (sg.ecart == null || sg.capBord == null) return;
    sg.ecart = rentrerDansLeDomaine(parc, sg.x, sg.y, sg.capBord, sg.ecart,
                                    (sg.largeur || 6) / 2);
  });

  const interdits = [];
  sorties.forEach(function (o) {
    const v = voisins.get(o.ref);
    if (!v || v.size < 3) return;
    /* OpenStreetMap découpe une rue à chaque carrefour : le « bout » d'un
       tronçon à sens unique est le plus souvent le DÉBUT du tronçon suivant, et
       la rue continue dans le même sens. Y planter un sens interdit serait
       faux — on n'en met que là où plus rien ne repart. */
    if (entrees.has(o.ref)) return;
    const a = o.cap * Math.PI / 180, d2 = RETRAIT_ENTREE / mParU;
    const x = o.x - Math.cos(a) * d2, y = o.y - Math.sin(a) * d2;
    const e = ecartDegage(x, y, o.cap + 270, o.ecart, voies);
    interdits.push({ id: o.id, signe: 'interdit', x: x, y: y, capBord: o.cap + 270,
      ecart: rentrerDansLeDomaine(parc, x, y, o.cap + 270, e,
                                  Math.max(0, o.ecart - BORD_ROUTE)) });
  });

  /* Un carrefour à feux en a un PAR ENTRÉE. OpenStreetMap ne les met pas
     toujours tous : sur les quatre carrefours à feux de la case d'essai, l'un
     a quatre branches et un seul nœud. On complète les branches manquantes. */
  const feuxAjoutes = completerLesFeux(signes, noeuds, voisins, carrefours, tours,
                                       voies, passages, parc);

  const panneaux = [...signes.values()].concat(fleches, interdits, feuxAjoutes);

  const b = cle.split(',').map(Number);
  return { tours, axes, carrefours, voies, panneaux,
           graphe: { noeuds: noeuds, arcs: arcs },
           bbox: { loMin: Math.min(b[0], loMin), laMin: Math.min(b[1], laMin),
                   loMax: Math.max(b[2], loMax), laMax: Math.max(b[3], laMax) } };
}

/* =================================================================
   LES FEUX D'UN CARREFOUR
   =================================================================
   « *Y a des intersections où tu as mis un feu, mais ce feu est en réalité
   quatre feux qui doivent être chacun sur un trottoir.* » C'est exact, et
   OpenStreetMap en est la cause : un nœud `highway=traffic_signals` marque la
   ligne d'arrêt d'UNE entrée, et rien n'oblige à les cartographier toutes.
   Relevé sur la case d'essai, quatre carrefours à feux :

   | carrefour | branches | nœuds dans OSM |
   |---|---|---|
   | 48.877977, 2.744890 | 4 | 5 |
   | 48.878028, 2.749149 | 6 | 5 |
   | **48.878233, 2.755767** | **4** | **1** |
   | 48.877879, 2.740501 | — | 2 |

   Un carrefour à feux avec un seul feu dessiné n'apprend rien à l'élève : il
   faut voir celui qui LE concerne, à sa droite, avant la ligne d'arrêt. On
   complète donc les branches muettes — sans jamais doubler celles qu'OSM
   renseigne déjà. */
const RECUL_FEU = 3;         // m au-delà du bord du carrefour
const AMAS_FEU = 45;         // m : deux feux plus proches sont le même carrefour
const BRANCHE_VUE = 35;      // degrés : en deçà, la branche a déjà son feu
const PASSAGE_PORTEE = 25;   // m : au-delà, le passage piéton n'est pas le nôtre
const PASSAGE_LARGE = 6;     // m : écart latéral max pour être sur NOTRE rue
const PASSAGE_RETRAIT = 2;   // m en arrière de la bande
const CENTRE_FEU = 6;        // m : un feu plus près du centre ne désigne aucune entrée

/* LE FEU SE TIENT DERRIÈRE LE PASSAGE PIÉTON.

   L'ordre sur une entrée de carrefour est toujours le même : le feu et sa ligne
   d'arrêt, puis le passage piéton, puis le carrefour. Quand le nœud d'OSM se
   trouve de l'autre côté de la bande — « *celui qui est sur le passage piéton
   du haut n'est pas au bon endroit* » — on le remonte juste avant elle. On ne
   touche à rien quand il est déjà du bon côté : OSM a raison la plupart du
   temps, et un feu qu'on recule sans raison finit au milieu de la rue. */
function reculerDerriereLePassage(sg, marche, passages) {
  const a = marche * Math.PI / 180;
  const ux = Math.cos(a), uy = Math.sin(a);
  let devant = null;                       // le passage le plus proche, vers l'avant
  passages.forEach(function (q) {
    const dx = q.x - sg.x, dy = q.y - sg.y;
    const le = (dx * ux + dy * uy) * mParU;        // le long de la marche
    const tr = Math.abs(-dx * uy + dy * ux) * mParU;
    if (tr > PASSAGE_LARGE || Math.abs(le) > PASSAGE_PORTEE) return;
    if (le >= 0) return;                   // déjà derrière nous : rien à faire
    if (!devant || le > devant) devant = le;
  });
  if (devant === null) return;             // aucun passage franchi : on n'y touche pas
  const recul = (-devant + PASSAGE_RETRAIT) / mParU;
  sg.x -= ux * recul; sg.y -= uy * recul;
}

/* La largeur de la rue sous un point : on prend celle de la voie la plus
   proche, faute de savoir à quel way il appartient. */
function largeurSous(x, y, voies) {
  let best = null, dmin = 25 / mParU;
  voies.forEach(function (v) {
    v.pts.forEach(function (q) {
      const d = Math.hypot(q.x - x, q.y - y);
      if (d < dmin) { dmin = d; best = v; }
    });
  });
  return best ? best.total * best.largeur : 6;
}

function completerLesFeux(signes, noeuds, voisins, carrefours, tours, voies, passages, parc) {
  const feux = [...signes.values()].filter(s => s.signe === 'feu' && s.cap !== null);
  if (!feux.length) return [];

  /* Les feux d'un même carrefour, regroupés : c'est le carrefour qu'on complète,
     pas le feu. */
  const reste = new Set(feux);
  const amas = [];
  while (reste.size) {
    const germe = reste.values().next().value;
    reste.delete(germe);
    const groupe = [germe];
    let change = true;
    while (change) {
      change = false;
      for (const f of [...reste]) {
        if (groupe.some(g => Math.hypot(g.x - f.x, g.y - f.y) * mParU < AMAS_FEU)) {
          groupe.push(f); reste.delete(f); change = true;
        }
      }
    }
    amas.push(groupe);
  }

  const ajouts = [];
  amas.forEach(function (groupe) {
    const cx = groupe.reduce((s, f) => s + f.x, 0) / groupe.length;
    const cy = groupe.reduce((s, f) => s + f.y, 0) / groupe.length;

    // à quel carrefour appartient cet amas, et quel est son rayon ?
    let carre = null, dmin = 60 / mParU;
    carrefours.concat(tours).forEach(function (c) {
      const d = Math.hypot(c.centre.x - cx, c.centre.y - cy);
      if (d < dmin) { dmin = d; carre = c; }
    });
    if (!carre) return;
    const C = carre.centre;
    const rayon = (carre.rayonExt || carre.rayon || 0) + RECUL_FEU / mParU;

    /* Les nœuds du carrefour, puis les BRANCHES : les voisins qui en sortent.
       Un carrefour est un amas de nœuds, pas un point — OSM le découpe. */
    const dedans = new Set();
    voisins.forEach(function (_, id) {
      const q = noeuds.get(id);
      if (q && Math.hypot(q.x - C.x, q.y - C.y) < rayon) dedans.add(id);
    });
    if (!dedans.size) return;
    const branches = new Map();          // id sortant -> le nœud du carrefour d'où il part
    dedans.forEach(function (id) {
      (voisins.get(id) || new Set()).forEach(function (v) {
        if (!dedans.has(v) && noeuds.has(v)) branches.set(v, id);
      });
    });

    /* UN FEU POSÉ AU CENTRE NE DIT PAS « un feu ici », IL DIT « carrefour à
       feux ». Relevé Grande Rue : le nœud d'OSM est pile au milieu du croisement,
       à zéro mètre du centre. Sa position ne désigne aucune entrée et son sens
       n'en désigne qu'une par hasard. On s'en sert comme déclencheur, et dès
       qu'on a su poser les vrais feux d'entrée, on le retire : sinon il reste
       planté au milieu du carrefour, en cinquième feu d'un croisement à quatre. */
    const auCentre = groupe.filter(f =>
      Math.hypot(f.x - C.x, f.y - C.y) * mParU < CENTRE_FEU);
    const utiles = groupe.filter(f => auCentre.indexOf(f) < 0);

    const poses = [];        // ce que l'on ajoute à CE carrefour, et à lui seul
    branches.forEach(function (depuis, sortant) {
      const A = noeuds.get(depuis), B = noeuds.get(sortant);
      const vers = Math.atan2(B.y - C.y, B.x - C.x) * 180 / Math.PI;

      /* QUELLE ENTRÉE UN FEU COMMANDE-T-IL ? Pas celle vers laquelle il est
         posé — relevé sur le carrefour de la Grande Rue, le nœud d'OSM est
         PILE au centre, et sa position ne désigne alors aucune branche. C'est
         son SENS qui le dit : on l'aborde en roulant vers le carrefour, donc
         l'entrée qu'il commande est derrière lui, à `marche + 180`. */
      const deja = utiles.some(function (f) {
        const sert = (f.marche != null)
          ? f.marche + 180
          : Math.atan2(f.y - C.y, f.x - C.x) * 180 / Math.PI;
        return Math.abs(ecartAngle(sert, vers)) < BRANCHE_VUE;
      }) || poses.some(function (f) {
        return Math.abs(ecartAngle(f.marche + 180, vers)) < BRANCHE_VUE;
      });
      if (deja) return;

      /* On sort du carrefour le long de la branche, jusqu'à dépasser son bord.
         Si la branche est trop courte, on s'arrête à son bout : mieux vaut un
         feu un peu près qu'un feu chez le voisin. */
      const L = Math.hypot(B.x - A.x, B.y - A.y);
      if (L < 1e-9) return;
      const ux = (B.x - A.x) / L, uy = (B.y - A.y) / L;
      const dA = Math.hypot(A.x - C.x, A.y - C.y);
      const pas = Math.min(L, Math.max(0, rayon - dA));
      const x = A.x + ux * pas, y = A.y + uy * pas;
      if (Math.hypot(x - C.x, y - C.y) * mParU < 4) return;   // trop au centre

      /* Il regarde celui qui ARRIVE : la marche va de la branche vers le
         carrefour, et sa droite est le trottoir où le feu se dresse. */
      const marche = Math.atan2(C.y - y, C.x - x) * 180 / Math.PI;
      const largeur = largeurSous(x, y, voies);
      const feu = { id: 'feu+' + sortant, signe: 'feu', x: x, y: y,
                    cap: marche, marche: marche, largeur: largeur, capBord: marche + 90 };
      reculerDerriereLePassage(feu, marche, passages);
      feu.ecart = ecartDegage(feu.x, feu.y, feu.capBord, largeur / 2 + BORD_ROUTE, voies);
      feu.ecart = rentrerDansLeDomaine(parc, feu.x, feu.y, feu.capBord, feu.ecart, largeur / 2);
      poses.push(feu); ajouts.push(feu);
    });
    if (poses.length) auCentre.forEach(function (f) { signes.delete(f.id); });
  });
  return ajouts;
}

/* Ce qu'il faut savoir d'une chaussée pour y poser une voiture : combien de
   voies dans notre sens, et leur largeur. OpenStreetMap les étiquette rarement
   en ville — les valeurs par défaut sont celles des routes françaises
   ordinaires. Une voie de lotissement est plus étroite qu'une départementale,
   et ça se voit à l'écran. */
/* Les bretelles manquaient à l'appel et retombaient sur les 3,0 m par défaut,
   alors qu'une voie d'autoroute en fait 3,5. */
const LARGEUR_VOIE = { motorway:3.5, trunk:3.5, primary:3.25, secondary:3.25,
                       tertiary:3.0, residential:2.9, living_street:2.7,
                       motorway_link:3.5, trunk_link:3.5,
                       primary_link:3.25, secondary_link:3.25, tertiary_link:3.0 };
function decrireVoies(pts, tags) {
  const sens = tags.oneway === 'yes' || tags.oneway === '1' || tags.oneway === '-1';
  const total = Math.max(1, parseInt(tags.lanes, 10) || (sens ? 1 : 2));
  const large = parseFloat(tags.width);
  return { pts: pts, total: total, sens: sens, inverse: tags.oneway === '-1',
           classe: tags.highway, limite: limiteDeLaRoute(tags),
           /* Le nombre de voies est-il DÉCLARÉ, ou supposé ? Relevé du
              21/09/2026 : 31 routes sur 201 portent `lanes`. Sur une même
              avenue à sens unique, six tronçons déclarent deux voies et trois
              n'en déclarent aucune — ceux-là sont alors supposés à UNE voie,
              c'est-à-dire trois mètres cinquante de large. Croire cette
              supposition, c'est rétrécir la route pour de faux. */
           suppose: !tags.lanes,
           largeur: large > 0 ? large / total : (LARGEUR_VOIE[tags.highway] || 3.0),
           // combien de ces voies vont dans notre sens
           n: sens ? total : Math.max(1, Math.floor(total / 2)) };
}


function angleAutour(t, p) {
  return Math.atan2(p.y - t.centre.y, p.x - t.centre.x) * 180 / Math.PI;
}



/* =================================================================
   Changer de voie : ce que l'application ne décide plus
   =================================================================
   Il y avait ici de quoi reconnaître un **déboîtement** (on passe sur une voie
   qui vient en face, le temps de doubler), un **rabattement** et un simple
   **changement de voie** — en comptant les voies, en suivant celle où l'on
   roule, avec une hystérésis pour ne pas confondre un louvoiement avec une
   manœuvre. De là sortaient un clignotant et des contrôles.

   Ça marchait. Ça a été retiré le 21/09/2026, à la demande du propriétaire :
   ce n'est pas à l'application de décider qu'on change de voie. Elle voit une
   ligne sur une photo ; elle ne sait pas si le moniteur montre un
   dépassement, un évitement, une voie d'insertion ou simplement une rue qui
   tourne. Quand elle se trompait, c'est le moniteur qui passait pour celui qui
   raconte n'importe quoi devant l'élève.

   Le clignotant d'un changement de voie se donne donc à la télécommande, comme
   tous les autres gestes. L'application continue d'annoncer ce qu'elle lit
   vraiment sur la carte — un giratoire, un carrefour, une bretelle qui rejoint
   l'autoroute — et rien de plus. */



/* =================================================================
   La télécommande : les gestes, c'est le moniteur qui les donne
   =================================================================
   L'application sait lire la carte et en déduire les clignotants et les
   contrôles. Elle le faisait AVANT le moniteur, et parfois à tort — un tracé
   qui frôlait l'axe d'un mètre était lu comme un dépassement. Devant l'élève,
   c'est le moniteur qui passait pour celui qui se trompe. Et même quand elle
   avait raison, elle parlait la première : le cours n'est pas à elle.

   Alors elle ne décide plus rien. Pendant l'animation, une rangée de touches
   déclenche le clignotant et les contrôles au moment où il les dit, et la
   voiture s'avance au doigt le long de son tracé, au rythme de sa phrase.

   Rien de ce qui est construit n'est perdu : le regard du conducteur, le
   bandeau, les feux de la voiture, la circulation, les accidents. Seul le
   déclencheur a changé de main. La détection reste disponible d'un réglage,
   pour préparer une séance ou se faire une idée — c'est alors elle qui
   commente, comme avant. */
const manuel = { cligno: null, geste: null };
const GESTE_TENU = 2000;       // ms : ce que dure à l'écran un contrôle déclenché

/* =================================================================
   LES GESTES SE POSENT SUR LA CARTE, ILS NE SE FILMENT PLUS
   =================================================================
   Jusqu'ici, ⏺ filmait : vingt images par seconde, chacune portant où était la
   voiture et ce qui était allumé. Le résultat était un bloc opaque — on pouvait
   le rejouer, on ne pouvait rien y toucher. Un clignotant vingt mètres trop
   tard, et il fallait refaire toute la démonstration.

   Maintenant, appuyer sur une touche pendant qu'on avance POSE UN POINT, à
   l'abscisse où la voiture se trouve. Le geste devient un objet de la scène,
   comme un panneau ou un camembert. Trois conséquences, et ce sont elles qui
   comptent :

   - la scène se gardant déjà toute seule, il n'y a plus rien à enregistrer :
     un cours est une scène, et une explication aussi ;
   - le modèle se corrige — on tire le point, on ne refait pas la démonstration ;
   - la copie d'un élève se compare POINT À POINT. « Clignotant à 34 m du
     carrefour » est une mesure ; comparer deux films joués à la main n'en
     était pas une.

   Ce qu'on perd, et il faut le dire : le rejeu ne reproduit plus les
   hésitations de la pédale. Il suit les vitesses posées sur les points — ce
   qui, pour une référence, vaut mieux.
 */

function rangerGestes() { mesGestes().sort((a, b) => a.s - b.s); }

/* CE QUI EST POSÉ SE REJOUE.

   Il y a eu une version où les carrés ne se déclenchaient jamais : ils étaient
   la grille de correction, et rien d'autre ; la démonstration se refaisait à la
   main, touche par touche, à chaque passage. « Pourquoi quand en mode cours je
   mets mes carrés cligno, contrôle, angle mort, il ne se joue pas après ? »

   Parce qu'on avait confondu deux choses. Ce qu'il ne voulait pas, c'était que
   sa démonstration s'ENREGISTRE dans son dos — et ça, c'est réglé depuis que
   la disquette existe. Poser un carré, c'est autre chose : c'est écrire le
   geste dans le cours, à l'endroit où il se fait. Un cours qu'on rouvre la
   semaine suivante doit remettre le clignotant tout seul, sinon ce n'est plus
   un cours, c'est une partition qu'il faut rejouer de mémoire.

   LE MANUEL RESTE, pour ce qui n'a pas de tracé : montrer un clignotant à
   l'arrêt, la voiture posée, sans rien avoir tracé. Et pendant la lecture, les
   deux ne se disputent pas — appuyer POSE un carré à l'abscisse où l'on est,
   donc l'appui s'allume par le carré qu'il vient de créer.

   EN ESSAI, LES CARRÉS SE TAISENT : ils sont à l'abscisse du modèle, et le
   tracé sous la voiture est celui de l'essai. Les rejouer là reviendrait à
   mettre le clignotant n'importe où. */
const REGARD_S = 1;            // secondes : un contrôle, c'est un regard

/* Ce que vaut une seconde de regard, en abscisse, à cet endroit du tracé. */
function porteeDuRegard(sd) {
  const e = surChemin(Math.max(0, Math.min(chemin.total, sd)));
  return Math.max(e.v, plancherAllure()) * REGARD_S;
}

/* Chacun rejoue LES SIENS : le cours ses carrés, l'essai les siens. Croiser les
   deux mettrait le clignotant du modèle sur le tracé de l'élève, c'est-à-dire
   n'importe où. */
function gestesJoues() {
  const l = mesGestes();
  return (chemin && l.length) ? l : null;
}

function controleA(sd) {
  const l = gestesJoues();
  if (l) {
    let trouve = null;
    l.forEach(function (g) {
      if (g.quoi === 'cligno' || g.s > sd) return;
      if (sd - g.s <= porteeDuRegard(g.s)) trouve = g;   // le dernier traversé
    });
    if (trouve) return trouve;
  }
  const g = manuel.geste;
  return (g && performance.now() < g.jusqu) ? g : null;
}

/* Le clignotant est un ÉTAT : il vaut ce que dit le dernier point d'allumage ou
   d'extinction franchi. Les carrés sont triés par abscisse — sans quoi tirer un
   carré derrière un autre inverserait la manœuvre. */
function clignotantA(sd) {
  const l = gestesJoues();
  if (!l) return manuel.cligno;
  let cl = null;
  for (let i = 0; i < l.length; i++) {
    const g = l[i];
    if (g.quoi !== 'cligno' || g.s > sd) continue;
    cl = g.on ? g.cote : null;
  }
  return cl;
}


/* =================================================================
   Recalage : un point posé au doigt revient au milieu de sa voie
   ================================================================= */

/* Le moniteur vise la rue, pas la voie. L'application fait le reste : elle
   projette le point sur l'axe de la chaussée la plus proche, lit le sens de
   marche, et le décale d'une demi-voie à DROITE de ce sens.

   Trois règles qui viennent de l'usage :
   - **à la pose, seules les voies de notre sens sont candidates**. On vise la
     rue sans faire attention, le point se met dans la bonne file ;
   - **à la reprise, toute la chaussée l'est**, voie d'en face comprise. Tirer
     un point de l'autre côté le centre donc dans la voie d'en face, avec la
     même logique — c'est ce qui rend un dépassement traçable, sans renoncer au
     centrage ;
   - **aux abords d'un carrefour, on ne touche à rien**. Une trajectoire y
     coupe les voies, c'est sa raison d'être — la recaler la détruirait.

   Limite connue : l'axe d'OpenStreetMap n'est juste qu'à deux ou trois mètres.
   Le point tombe dans la bonne voie, pas forcément sur son milieu peint. */
/* Quelle part du rayon fait la chaussée annulaire, d'un côté de son axe.
   Relevé sur la photo d'un grand giratoire à trois voies : l'anneau va de 52 à
   105 pixels du centre pour un axe à 78, soit un tiers du rayon. Les petits
   giratoires sont proportionnellement plus larges, d'où le plancher.
   C'est LE nombre à toucher si la voiture s'arrête trop tôt ou trop tard. */
const ANNEAU_LARGE = 0.30;

/* Et la ligne du cédez-le-passage n'est pas sur le bord du bitume : elle est en
   RETRAIT, quelques mètres avant, pour qu'on voie venir avant d'avoir le nez
   dedans. Sans ce retrait la voiture s'immobilisait pile sur la voie extérieure
   de l'anneau — techniquement au bord, visiblement dans le giratoire. */
const RETRAIT_CEDEZ = 5;   // mètres

const RECALAGE = {
  portee: 25,   // m : au-delà, le doigt ne visait pas une route
  marge: 12     // m : autour d'un giratoire, la zone qu'on laisse libre
};
/* SERRER À DROITE : ÉTEINT PAR DÉFAUT.

   Il avait été ajouté parce que le tracé « passait au milieu de la route ». La
   vraie cause était ailleurs — la moitié des points restaient PILE SUR L'AXE
   dans les zones de carrefour, où le recalage s'abstenait. Une fois cela
