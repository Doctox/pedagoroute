      p('rect', { x:-.5, y:-w/2, width:1, height:w, rx:w*.2,
                  fill:fond, stroke:'#11161b', 'stroke-width':.022 });
      // le pare-brise est vers l'avant : c'est lui qui dit le sens
      p('rect', { x: o.id === 'camion' ? .27 : .08, y:-w*.36,
                  width: o.id === 'camion' ? .17 : .28, height:w*.72, rx:w*.12, fill:o.vitre });
      p('rect', { x:.455, y:-w*.36, width:.045, height:w*.22, rx:.018, fill:'#ffe9a8' });
      p('rect', { x:.455, y:w*.14,  width:.045, height:w*.22, rx:.018, fill:'#ffe9a8' });
      p('rect', { x:-.5,  y:-w*.36, width:.042, height:w*.22, rx:.018, fill:'#b4483c' });
      p('rect', { x:-.5,  y:w*.14,  width:.042, height:w*.22, rx:.018, fill:'#b4483c' });
    }
    els.obstacles.appendChild(g);
  });

  /* Le choc, là où il a eu lieu. En rouge franc et en gros : c'est le seul
     endroit de l'écran qui dit que la trajectoire ne passe pas. */
  if (accident) {
    const R = Math.max(LV * 0.75, 26 / vue.k);
    const g = el('g', { transform:
      'translate(' + ax(accident.x).toFixed(3) + ' ' + ay(accident.y).toFixed(3) + ')' });
    g.appendChild(el('circle', { cx:0, cy:0, r:R.toFixed(2), fill:'#d21f1f', 'fill-opacity':'.35' }));
    g.appendChild(el('circle', { cx:0, cy:0, r:R.toFixed(2), fill:'none',
      stroke:'#ff2f2f', 'stroke-width':(R * 0.16).toFixed(2) }));
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      g.appendChild(el('path', {
        d:'M' + (Math.cos(a)*R*1.05).toFixed(2) + ' ' + (Math.sin(a)*R*1.05).toFixed(2)
         + 'L' + (Math.cos(a)*R*1.55).toFixed(2) + ' ' + (Math.sin(a)*R*1.55).toFixed(2),
        stroke:'#ff2f2f', 'stroke-width':(R * 0.16).toFixed(2), 'stroke-linecap':'round' }));
    }
    els.obstacles.appendChild(g);
  }

  /* La part de camembert se redessine AVEC les véhicules : sa couleur ne dit pas
     où elle est, elle dit ce qu'il y a dedans. Elle change donc exactement
     quand un véhicule bouge, et à aucun autre moment. */
  dessinerCamemberts();
}

/* =================================================================
   Le camembert : la part qu'on contrôle avant de s'engager
   =================================================================
   Au tableau, pour expliquer quand entrer dans un giratoire, on dessine la
   part de camembert qui part de l'entrée et couvre ce qui arrive par la
   gauche : s'il y a quelque chose dedans, on n'entre pas.

   Ce n'est pas un objet de la chaussée, c'est une zone de décision : elle ne se
   recale sur rien, le moniteur la pose où il veut et de la taille qu'il veut.

   Elle se retient par ses DEUX BORDS et sa portée, et non par un centre et une
   ouverture, parce que les deux bords ne disent pas la même chose : l'un longe
   l'anneau d'où arrive celui qui a la priorité, l'autre coupe la branche par
   laquelle on entre. Ils ne font pas un angle rond, et ils se règlent
   séparément.

   Sa couleur n'est pas un décor, c'est la règle écrite à l'écran : VERTE tant
   qu'elle est vide, ROUGE dès qu'un véhicule y entre — à l'arrêt pendant qu'on
   plante la situation, comme en lecture pendant qu'elle se joue. */
const CAMEMBERT = {
  ouverture: 90,    // degrés : la part de quart qu'on dessine au tableau
  portee:    30,    // mètres : la portée d'une part posée d'un simple appui
  mini:      12,    // degrés : en deçà, la part n'a plus de surface
  maxi:     350     // degrés : au-delà, ce n'est plus une part mais un disque
};

const angleNorm = a => ((a % 360) + 360) % 360;
function ouvertureCam(cm) { const d = angleNorm(cm.a2 - cm.a1); return d < 1e-6 ? 360 : d; }

/* Les poignées gardent une taille constante à l'écran : une part de 15 m et une
   part de 80 m se règlent du même doigt. Et le rayon minimal est celui en deçà
   duquel la pointe et l'arc se confondent — on ne saurait plus ni dans quel
   sens ni de quelle taille. */
/* 20 px de rayon, soit 40 px de cible : c'est la taille d'un doigt. À 15 px on
   ratait la poignée une fois sur trois sur un téléphone. Le rond dessiné reste
   plus petit que la cible — on ne veut pas d'une pastille encombrante. */
function grippeCam()    { return Math.max(LV * 0.42, 20 / vue.k); }
function rayonMiniCam() { return Math.max(LV * 1.1,  26 / vue.k); }

/* Les trois points par lesquels on la tient : les deux bords, et le milieu de
   l'arc, qui l'oriente et l'allonge d'un seul geste. */
function boutCam(cm, k) {
  const a = (k === 0 ? cm.a1 : k === 1 ? cm.a2 : cm.a1 + ouvertureCam(cm) / 2)
            * Math.PI / 180;
  return { x: cm.x + Math.cos(a) * cm.R, y: cm.y + Math.sin(a) * cm.R };
}

/* Tourner la part sans changer son ouverture : c'est la bissectrice qui suit le
   doigt, les deux bords gardent leur écart. */
function orienterCam(cm, bis, R) {
  const ouv = ouvertureCam(cm);
  cm.a1 = angleNorm(bis - ouv / 2);
  cm.a2 = angleNorm(cm.a1 + ouv);
  if (R != null) cm.R = R;
}

function dansCamembert(cm, x, y, r) {
  const dx = x - cm.x, dy = y - cm.y;
  const d = Math.hypot(dx, dy);
  if (d > cm.R + (r || 0)) return false;
  if (d < 1e-9) return true;
  /* Un véhicule n'est pas un point : vu de la pointe, un disque de rayon r
     déborde de ± asin(r/d) en angle. Sans cette marge, une voiture qui mord le
     bord de la part serait déclarée dehors alors qu'elle empiète dessus. */
  const marge = r ? Math.asin(Math.min(1, r / d)) * 180 / Math.PI : 0;
  const e = angleNorm(Math.atan2(dy, dx) * 180 / Math.PI - cm.a1);
  return e <= ouvertureCam(cm) + marge || e >= 360 - marge;
}

/* Où est un véhicule MAINTENANT : là où on l'a posé, ou là où son chemin l'a
   mené si la lecture est lancée.
   À ne pas confondre avec `poseObstacle(ob, recul)`, plus bas, qui remonte le
   temps pour retrouver l'instant du choc : celle-ci lit l'écran, celle-là
   rejoue le passé. */
function poseActuelle(ob) {
  if (ob.chemin && etat !== 'arret') {
    const e = surChemin(ob.s || 0, ob.chemin);
    return { x: e.x, y: e.y, cap: e.cap * 180 / Math.PI };
  }
  return { x: ob.x, y: ob.y, cap: ob.cap };
}

/* « S'il y a quelque chose dans le camembert, tu n'entres pas. » Quelque chose,
   c'est n'importe quel véhicule posé — voiture, camion, vélo, piéton — pris sur
   toute sa carrure et non sur son seul centre : un camion entre dans la part
   par le capot bien avant d'y entrer par le milieu. La voiture auto-école, elle,
   ne compte pas : c'est elle qui regarde. */

/* Le véhicule qui occupe la part, maintenant ou pendant qu'on s'y insérerait.
   À l'arrêt il n'y a pas d'avenir à examiner : rien ne roule.

   **Seuls les véhicules qui ROULENT comptent.** Le camembert demande « est-ce
   que quelqu'un arrive qui a la priorité ? » — un véhicule à l'arrêt n'arrive
   nulle part. Deux façons d'être à l'arrêt, et les deux figeaient la planche :

   - **sans trajectoire** : c'est du décor, il ne bougera jamais ;
   - **au bout de sa trajectoire** : il a roulé, il est arrivé, il est garé là.
     Celui-là a bien une trajectoire, et c'est le cas qui trompe.

   Dans les deux cas la part restait rouge pour toujours et la voiture
   auto-école attendait sans fin au cédez-le-passage. Un circuit, lui, ne finit
   jamais : il roule tant que la lecture dure.

   Le véhicule à l'arrêt reste un obstacle, et le choc le rattrape si la
   trajectoire lui passe dessus — mais ce n'est pas au camembert de le dire. */
function enCirculation(ob) {
  if (!ob.points || !ob.points.length) return false;   // du décor
  if (ob.absent) return false;                         // sorti de la scène
  return true;                                         // sinon il roule : son trajet se rejoue
}

function vehiculeDansCamembert(cm) {
  return seance.obstacles.find(function (ob) {
    const o = obstacleDe(ob.t);
    if (!o || !enCirculation(ob)) return false;
    const q = poseActuelle(ob);
    /* La chaîne de disques couvre EXACTEMENT la longueur du véhicule, et
       `dansCamembert` compte un disque qui effleure le bord. La part rougit
       donc à l'instant où le CAPOT touche le premier trait, et ne reverdit que
       lorsque le BOUT DU COFFRE a passé le second. Pas d'anticipation : ce
       qu'on voit est ce qui décide. */
    return disques(q.x, q.y, q.cap, o.L, o.l)
             .some(d => dansCamembert(cm, d.x, d.y, d.r));
  }) || null;
}

const camembertOccupe = cm => !!vehiculeDansCamembert(cm);

function camembertSous(c) {
  for (let i = seance.camemberts.length - 1; i >= 0; i--)
    if (dansCamembert(seance.camemberts[i], c.x, c.y, 0)) return i;
  return -1;
}

/* Les gestes posés, le long du tracé.

   ILS NE SE VOIENT QU'EN ÉDITION, comme le tracé et les points : dès que la
   lecture commence, la carte ne montre plus que la route. On pose en roulant,
   on regarde et on corrige à l'arrêt — et c'est aussi là, et seulement là, que
   les carrés se tirent. Pendant une démonstration, rien du montage ne doit
   rester à l'écran, et rien ne doit pouvoir bouger par mégarde. */
/* LA TÉLÉCOMMANDE EST LA LÉGENDE DES FAISCEAUX. Une touche et le cône qu'elle
   allume portent la même couleur — sinon il faut apprendre deux codes pour un
   seul geste. */
const COULEUR_GESTE = { 'cligno': '#ffab1a', 'regard': '#c07bff',
                        'rétro intérieur': '#2fd6c4', 'rétro extérieur': '#ffd24a' };

/* Où se pose le carré d'un geste : décalé perpendiculairement au tracé, du côté
   du geste — un contrôle à gauche se lit à gauche. On rend aussi son ancre sur
   le tracé, parce que c'est elle qu'on relie par un trait. */
function posGeste(g) {
  const e = surChemin(Math.max(0, Math.min(chemin.total, g.s)));
  const n = { x: -Math.sin(e.cap), y: Math.cos(e.cap) };
  const sens = g.cote === 'droite' ? 1 : -1;
  const d = LV * 0.62;
  return { x: e.x + n.x * d * sens, y: e.y + n.y * d * sens, ancre: e };
}

/* L'abscisse du point du tracé le plus proche d'un endroit donné. C'est ce qui
   permet de tirer un geste SANS LE DÉCOLLER : un geste appartient au trajet,
   pas à la carte. On le fait glisser d'avant en arrière, on ne le déplace pas
   au travers du décor. */
function absciseProche(c, ch) {
  ch = ch || chemin;
  if (!ch) return 0;
  const pts = ch.pts, abs = ch.abs;
  let best = 0, dmin = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const x0 = pts[i-1].x, y0 = pts[i-1].y;
    const bx = pts[i].x - x0, by = pts[i].y - y0;
    const L2 = bx * bx + by * by;
    let u = L2 > 1e-12 ? ((c.x - x0) * bx + (c.y - y0) * by) / L2 : 0;
    u = Math.max(0, Math.min(1, u));
    const px = x0 + bx * u, py = y0 + by * u;
    const d = (px - c.x) * (px - c.x) + (py - c.y) * (py - c.y);
    if (d < dmin) { dmin = d; best = abs[i-1] + (abs[i] - abs[i-1]) * u; }
  }
  return best;
}
function dessinerGestes() {
  if (!els.gestes) return;
  els.gestes.textContent = '';
  const liste = mesGestes();
  if (enMarche() || obstacleActif >= 0 || !chemin || !liste.length) return;
  const R = LV * 0.3;
  liste.forEach(function (g) {
    const q = posGeste(g), e = q.ancre;
    const cx = q.x, cy = q.y;
    const teinte = COULEUR_GESTE[g.quoi] || '#4aa3ff';
    /* CARRÉS. Les points de trajectoire sont ronds : un geste ne doit pas leur
       ressembler, sinon on tire l'un en croyant tirer l'autre. Rond, on roule ;
       carré, on fait quelque chose. */
    const grp = el('g', { transform:
      'translate(' + ax(cx).toFixed(3) + ' ' + ay(cy).toFixed(3) + ')' });
    /* Le trait qui rattache le point au tracé : sans lui on ne sait pas d'où
       il part, et deux gestes voisins se confondent. */
    grp.appendChild(el('path', {
      d: 'M' + (ax(e.x) - ax(cx)).toFixed(2) + ' ' + (ay(e.y) - ay(cy)).toFixed(2) + 'L0 0',
      stroke: teinte, 'stroke-opacity': '.55',
      'stroke-width': (LV * 0.055).toFixed(3), 'stroke-linecap': 'round' }));
    grp.appendChild(el('rect', {
      x: (-R).toFixed(3), y: (-R).toFixed(3),
      width: (R * 2).toFixed(3), height: (R * 2).toFixed(3), rx: (R * 0.3).toFixed(3),
      fill: (g.quoi === 'cligno' && g.on === false) ? '#11161b' : teinte,
      stroke: teinte, 'stroke-width': (LV * 0.075).toFixed(3) }));
    if (g.quoi === 'cligno') {
      /* Un chevron dans le sens du clignotant ; creux quand c'est l'extinction. */
      const k = (g.cote === 'gauche' ? -1 : 1) * R * 0.46;
      grp.appendChild(el('path', {
        d: 'M' + (-k).toFixed(2) + ' ' + (-R * 0.42).toFixed(2)
         + 'L' + (k).toFixed(2) + ' 0L' + (-k).toFixed(2) + ' ' + (R * 0.42).toFixed(2),
        fill: 'none', stroke: g.on === false ? teinte : '#11161b',
        'stroke-width': (LV * 0.07).toFixed(3),
        'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    } else if (g.quoi === 'angle mort') {
      grp.appendChild(el('circle', { r: (R * 0.36).toFixed(3), fill: '#11161b' }));
    } else {
      grp.appendChild(el('rect', { x: (-R * 0.46).toFixed(2), y: (-R * 0.2).toFixed(2),
        width: (R * 0.92).toFixed(2), height: (R * 0.4).toFixed(2),
        rx: (R * 0.14).toFixed(2), fill: '#11161b' }));
    }
    els.gestes.appendChild(grp);
  });
}

/* =================================================================
   Le drapeau d'arrivée
   =================================================================
   Tant que le tracé est là, l'arrivée n'a pas besoin d'exister : c'est le bout
   du trait, on la voit. Un exercice, lui, part SANS le tracé — « dans
   l'exercice y a la zone map, la voiture auto-école, le point de fin de la
   trajectoire (genre petit drapeau), et en vrai c'est tout ». Le bout doit donc
   survivre au trait qui le portait : il devient un objet à lui, et la seule
   chose qui dise où l'on va.

   Il se voit AUSSI EN LECTURE, contrairement aux points et aux carrés : on ne
   cache pas le but à celui qui roule vers lui.

   Il se remet d'aplomb quand la carte tourne (`rotate(-vue.cap)`), comme les
   panneaux : un damier penché ne se reconnaît plus. */
const DRAPEAU_MINI = 13;     // pixels : en deçà, on ne voit plus où l'on va

/* =================================================================
   La vue élève
   =================================================================
   « Dans les exercices on enregistre tout, mais rien n'est visible sauf la
   voiture auto-école et les obstacles. » Un exercice, ce n'est donc pas une
   scène plus pauvre : c'est la même scène, avec le modèle caché.

   Ce qui disparaît est exactement ce que l'élève doit produire : le tracé, ses
   vitesses, les carrés. Et ce que le moniteur a posé pour s'aider : les
   camemberts, les panneaux — ils font partie de la question.

   Ce qui reste est la situation : la photo, la voiture au départ, les autres
   véhicules, et le drapeau qui dit où l'on va. */
let vueEleve = false;
/* Ouverte par un lien d'exercice : la partie élève. Voir « LA PARTIE ÉLÈVE ». */
let modeEleve = false;

/* L'ESSAI. La vue élève n'est pas un aperçu, c'est un BANC D'ESSAI : « pour moi
   la vue élève côté moniteur permet au moniteur de tester son cours — faut
   qu'il puisse faire comme s'il devait résoudre l'exercice pour voir ce qui
   marche ou pas ».

   Il trace donc, il joue, il se fait accrocher s'il s'engage mal — sur SON
   tracé à lui, pas sur le modèle. D'où deux listes de points qui ne se touchent
   jamais : `seance.points` est le cours, `essai.points` est la copie qu'on
   rend. Tout ce qui dessine, attrape, joue et efface passe par `mesPoints()`.

   L'essai ne s'enregistre nulle part — `etatSeance()` ne le lit pas — et il
   survit à l'aller-retour modèle/élève, pour qu'on puisse comparer les deux
   tracés sans refaire le sien. */
const essai = { points: [], gestes: [] };
function mesPoints() { return vueEleve ? essai.points : seance.points; }
function mesGestes() { return vueEleve ? essai.gestes : seance.gestes; }

function poserVueEleve(v) {
  if (modeEleve) return;                   // l'élève ne sort pas de l'essai
  if (vueEleve !== !!v) viderJournal();    // on change de feuille, pas de geste
  /* CE QU'ON ATTEND SE RELÈVE AVANT DE PARTIR. Les critères se lisent dans le
     modèle — ses engagements, ses carrés, son arrivée — et une fois en essai,
     `chemin` est le tracé de l'élève : il serait trop tard. */
  if (!vueEleve && v) releverAttendu();
  fermerBilan();
  vueEleve = !!v;
  /* ON ENTRE EN ESSAI LES MAINS VIDES. Un véhicule resté sélectionné emportait
     les points de l'essai dans SA trajectoire : on appuyait, rien n'apparaissait
     — `dessinerPoints` se tait quand un véhicule est choisi — et le tracé de
     l'élève allait grossir celui d'une voiture obstacle. « Les points en mode
     exercice ne réagissent pas comme les points de trajectoire normaux. »
     En essai il n'y a qu'un tracé possible, le sien : on le dit ici. */
  obstacleActif = -1;
  /* L'outil en cours ne suit pas dans l'essai : on y entrait le camion au bout
     du doigt, et la feuille d'outils ne le proposait même plus. */
  if (vueEleve && outil !== 'main' && outil !== 'point') {
    outil = 'point'; outilPose = 'point';
    ouvrirVolet(false); majCurseur();
  }
  arreter();
  redessiner();
}

function dessinerDrapeau() {
  if (!els.drapeau) return;
  els.drapeau.textContent = '';
  /* Le drapeau n'existe que dans la vue élève : ailleurs, le bout du tracé se
     voit tout seul, et un damier de plus ne dirait rien de nouveau. */
  const a = vueEleve ? boutDuTrace() : null;
  if (!a) return;
  /* Il ne rétrécit pas indéfiniment : c'est la seule chose qui dise où l'on va,
     elle doit rester trouvable quand on dézoome pour chercher son chemin. */
  const R = Math.max(LV * 0.3, DRAPEAU_MINI / vue.k);
  const g = el('g', { transform:
    'translate(' + ax(a.x).toFixed(3) + ' ' + ay(a.y).toFixed(3) + ') '
    + 'rotate(' + (-vue.cap).toFixed(2) + ') scale(' + R.toFixed(4) + ')' });
  const p = (nom, at) => g.appendChild(el(nom, at));
  p('ellipse', { cx:0, cy:.16, rx:.72, ry:.3, fill:'rgba(0,0,0,.45)' });   // posé au sol
  /* La hampe se double d'un trait sombre : du blanc seul sur une photo aérienne
     disparaît dès qu'il passe sur un champ clair ou un marquage au sol. */
  p('path', { d:'M0 .1V-3.2', stroke:'#11161b', 'stroke-width':.5,
              'stroke-linecap':'round' });
  p('path', { d:'M0 .1V-3.2', stroke:'#ffffff', 'stroke-width':.26,
              'stroke-linecap':'round' });
  /* Un damier : « arrivée » se lit sans légende, dans toutes les langues. */
  p('rect', { x:.12, y:-3.26, width:1.92, height:1.28, fill:'#ffffff',
              stroke:'#11161b', 'stroke-width':.18 });
  p('rect', { x:.12, y:-3.26, width:.96, height:.64, fill:'#11161b' });
  p('rect', { x:1.08, y:-2.62, width:.96, height:.64, fill:'#11161b' });
  p('circle', { cx:0, cy:.1, r:.34, fill:'#ffffff', stroke:'#11161b',
                'stroke-width':.18 });
  els.drapeau.appendChild(g);
}

/* L'ARRIVÉE EST CELLE DU MODÈLE, toujours. En essai, `chemin` est le tracé de
   l'essai : y lire le drapeau le ferait courir devant le doigt, et le but se
   déplacerait à mesure qu'on avance vers lui. On la lit donc dans le cours. */
function boutDuTrace() {
  const l = seance.points;
  if (l.length) return { x: l[l.length - 1].x, y: l[l.length - 1].y };
  /* Chez l'élève il n'y a pas de tracé du modèle — il est resté chez le
     moniteur. L'arrivée est venue avec le lien. */
  return (attendu && attendu.arrivee) ? { x: attendu.arrivee.x, y: attendu.arrivee.y } : null;
}

function dessinerCamemberts() {
  els.camemberts.textContent = '';
  if (vueEleve) return;
  seance.camemberts.forEach(function (cm) {
    const ouv = ouvertureCam(cm), R = cm.R;
    const occupe = camembertOccupe(cm);
    const teinte = occupe ? '#d21f1f' : '#17a45a';
    const g = el('g', { transform:
      'translate(' + ax(cm.x).toFixed(3) + ' ' + ay(cm.y).toFixed(3) + ')' });
    const P = a => [Math.cos(a * Math.PI/180) * R, Math.sin(a * Math.PI/180) * R];
    const p1 = P(cm.a1), p2 = P(cm.a1 + ouv);

    g.appendChild(el('path', {
      d: 'M0 0L' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2)
       + 'A' + R.toFixed(2) + ' ' + R.toFixed(2) + ' 0 ' + (ouv > 180 ? 1 : 0)
       + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) + 'Z',
      fill: teinte, 'fill-opacity': occupe ? '.24' : '.14',
      stroke: teinte, 'stroke-opacity': '.95',
      'stroke-width': (LV * 0.11).toFixed(3), 'stroke-linejoin': 'round' }));

    // les hachures du tableau : elles disent que la part est une SURFACE
    const n = Math.max(2, Math.min(9, Math.round(ouv / 14)));
    for (let i = 1; i < n; i++) {
      const q = P(cm.a1 + ouv * i / n);
      g.appendChild(el('path', {
        d: 'M0 0L' + q[0].toFixed(2) + ' ' + q[1].toFixed(2), stroke: teinte,
        'stroke-opacity': '.42', 'stroke-width': (LV * 0.05).toFixed(3) }));
    }

    /* Les poignées ne servent qu'à régler : pendant la lecture elles n'ont plus
       rien à faire là, comme la poignée de rotation des véhicules. */
    if (etat === 'arret') {
      const gr = grippeCam();
      const pastille = function (px, py, regle) {
        g.appendChild(el('circle', { cx: px.toFixed(2), cy: py.toFixed(2),
          r: (gr * 0.48).toFixed(2), fill: regle ? '#ffffff' : teinte,
          stroke: regle ? '#11161b' : '#ffffff', 'stroke-width': (gr * 0.13).toFixed(3) }));
      };
      /* Blanches, les trois qui RÈGLENT la part : les deux bords et l'arc.
         Pleine, celle qui la DÉPLACE : la pointe. Deux gestes, deux allures. */
      for (let k = 0; k < 3; k++) {
        const b = boutCam(cm, k);
        pastille(b.x - cm.x, b.y - cm.y, true);
      }
      pastille(0, 0, false);
    }
    els.camemberts.appendChild(g);
  });
}

let capRepos = 0;
let capTete = 0, capYeux = 0, capLeve = 0;   // orientation courante, lissée
let suivi = false;                          // la vue suit-elle la voiture ?

/* Le poste de conduite, vu de derrière.

   La tête est un VOLUME qu'on projette, pas un disque qu'on décore : quand elle
   tourne, sa masse se déporte du côté visé, sa silhouette s'élargit (on la voit
   de plus en plus dans sa longueur), l'oreille opposée passe derrière, et le
   nez puis l'œil finissent par sortir du profil. Un premier jet promenait un
   repère de nez autour d'un cercle fixe : rien ne tournait, et ça se voyait.

   Tout part d'un seul nombre, `capTete`. Les cinq constantes ci-dessous sont
   les seules à toucher pour retoucher le conducteur. */
const TETE = {
  A:   15.5,   // demi-largeur du crâne, d'une oreille à l'autre
  B:   19.0,   // demi-longueur, de la nuque au front
  C:   17.0,   // demi-hauteur
  D:    4.2,   // le crâne est en avant de l'axe du cou : la masse se déplace
  NEZ:  7.0    // saillie du nez au-delà du front
};
const MIROIRS = { i: [62, 12], g: [11, 46], d: [113, 46] };   // où viser, dans le dessin
const borne = (v, a, b) => Math.max(a, Math.min(b, v));
let visX = 62, visY = 58, visA = 0;          // la cible du regard, lissée

function majPoste(vise) {
  /* Toujours visible : c'est un élément de l'interface, pas un surgissement de
     la lecture. Au repos le conducteur regarde droit devant. */
  els.poste.hidden = false;
  const T = TETE, CX = 62, CY = 58;
  const yaw = borne(capTete, -92, 92);
  const p = yaw * Math.PI / 180, sp = Math.sin(p), cp = Math.cos(p);
  const sgn = sp >= 0 ? 1 : -1, asp = Math.abs(sp);

  const cx = CX + T.D * sp;
  const rx = Math.sqrt(T.A * T.A * cp * cp + T.B * T.B * sp * sp);
  const cy = CY - capLeve * 6;                  // lever la tête vers l'intérieur
  const ry = T.C * (1 - capLeve * 0.06);
  els.crane.setAttribute('cx', cx.toFixed(2));
  els.crane.setAttribute('cy', cy.toFixed(2));
  els.crane.setAttribute('rx', rx.toFixed(2));
  els.crane.setAttribute('ry', ry.toFixed(2));

  /* Le côté visage : un croissant clair qui s'ouvre du côté où il tourne, entre
     le bord du profil et une courbe qui glisse vers la nuque. La courbe doit
     rejoindre le bord quand l'angle est nul, sinon un demi-visage se voit à
     l'arrêt — d'où le facteur 2 sur le point de contrôle. */
  const w = rx * asp * 0.66;
  els.visage.setAttribute('d',
    'M' + cx.toFixed(2) + ' ' + (cy - ry).toFixed(2)
    + 'A' + rx.toFixed(2) + ' ' + ry.toFixed(2) + ' 0 0 ' + (sgn > 0 ? 1 : 0) + ' '
    + cx.toFixed(2) + ' ' + (cy + ry).toFixed(2)
    + 'Q' + (cx + sgn * 2 * (rx - w)).toFixed(2) + ' ' + cy.toFixed(2) + ' '
    + cx.toFixed(2) + ' ' + (cy - ry).toFixed(2) + 'Z');
  els.visage.style.opacity = borne(asp / 0.10, 0, 1).toFixed(2);

  /* On penche un peu la tête, et l'épaule suit : à 132 pixels, l'inclinaison se
     lit avant la rotation. */
  els.buste.setAttribute('transform',
    'rotate(' + (yaw * 0.11).toFixed(2) + ' ' + CX + ' ' + (CY + 20) + ')');
  els.epaules.setAttribute('transform',
    'rotate(' + (yaw * 0.05).toFixed(2) + ' ' + CX + ' 95)');

  /* Les oreilles sont accrochées à la frontière visage / nuque — c'est
     exactement ce qu'est une oreille. Celle du côté visé rentre donc vers le
     centre à mesure que le visage s'ouvre, l'autre passe derrière la tête. */
  [[els.orD, 1], [els.orG, -1]].forEach(function (o) {
    const e = o[0], c = o[1], vu = c * sp;      // vu > 0 : tournée vers nous
    e.setAttribute('transform',
      'translate(' + (cx + c * (rx - 1.2 - (c === sgn ? w : 0))).toFixed(2)
      + ' ' + (cy - 1.5).toFixed(2) + ')'
      + ' scale(' + (c * (0.78 + 0.22 * borne(vu, 0, 1))).toFixed(3) + ' 1)');
    e.style.opacity = borne((vu + 0.34) / 0.42, 0, 1).toFixed(2);
  });

  /* Le nez est dessiné DERRIÈRE le crâne : seule la part qui dépasse se voit,
     donc il n'y a aucun raccord à cacher. Il est accroché au FRONT — à B du
     centre — et se raccourcit avec l'angle, comme toute saillie vue de biais.
     Il ne sort donc qu'au-delà de ~50° : de dos, on ne voit pas le nez d'une
     tête à peine tournée, et c'est ce qui distingue l'angle mort du reste. */
  els.nez.setAttribute('transform',
    'translate(' + (cx + T.B * sp).toFixed(2) + ' ' + (cy + 2).toFixed(2) + ')'
    + ' scale(' + (sgn * asp * T.NEZ / 7).toFixed(3) + ' 1)');

  // l'œil apparaît au bord du profil, et seulement pour l'angle mort
  const te = (150 - Math.abs(yaw)) * Math.PI / 180;      // azimut de l'œil proche
  els.oeil.setAttribute('transform',
    'translate(' + (cx + sgn * T.A * Math.sin(te)).toFixed(2) + ' ' + (cy - 2).toFixed(2) + ')'
    + ' scale(' + (0.4 + 0.6 * borne(Math.cos(te), 0, 1)).toFixed(3) + ' 1)');
  els.oeil.style.opacity = borne(Math.cos(te) / 0.22, 0, 1).toFixed(2);

  /* Le regard va jusqu'à ce qu'il vise : le rétroviseur lui-même, ou, pour
     l'angle mort, un point en arrière par-dessus l'épaule. Le relier au miroir
     vaut mieux qu'un trait dans le vide — on voit d'un coup d'œil où il va. */
  let tx, ty;
  if (vise.miroir) { tx = MIROIRS[vise.miroir][0]; ty = MIROIRS[vise.miroir][1]; }
  else {
    const a = (yaw + capYeux) * Math.PI / 180;
    tx = cx + Math.sin(a) * 33; ty = cy + Math.abs(Math.sin(a)) * 19;
  }
  /* La cible glisse d'un contrôle à l'autre au lieu de sauter : sans ce
     lissage, le rayon quitte le rétroviseur d'un coup dès que le contrôle est
     fini, alors que la tête, elle, revient doucement. */
  visX += (tx - visX) * 0.25; visY += (ty - visY) * 0.25;
  visA += (((vise.miroir || Math.abs(yaw + capYeux) > 8) ? 1 : 0) - visA) * 0.25;
  tx = visX; ty = visY;
  const f = Math.atan2(ty - cy, tx - cx);
  const r0 = (rx * ry) / Math.hypot(ry * Math.cos(f), rx * Math.sin(f)) + 2.5;
  const d = 'M' + (cx + Math.cos(f) * r0).toFixed(2) + ' ' + (cy + Math.sin(f) * r0).toFixed(2)
          + 'L' + tx.toFixed(2) + ' ' + ty.toFixed(2);
  els.regardTrait.setAttribute('d', d);
  els.regardHalo.setAttribute('d', d);
  els.regard.style.opacity = visA.toFixed(3);

  els.poste.classList.toggle('vise-i', vise.miroir === 'i');
  els.poste.classList.toggle('vise-g', vise.miroir === 'g');
  els.poste.classList.toggle('vise-d', vise.miroir === 'd');
}

/* Où regarde le conducteur, selon le contrôle en cours. Angles en repère
   voiture : 0 = droit devant, négatif = vers la gauche du conducteur. */
function cibleRegard(c) {
  if (!c) return { tete: 0, yeux: 0, leve: 0, miroir: '' };
  const g = c.cote === 'gauche';
  // l'intérieur se cherche en LEVANT la tête, pas en la tournant
  if (c.quoi === 'rétro intérieur')
    return { tete: 0, yeux: 0, leve: 1, miroir: 'i' };
  // l'extérieur, d'un petit mouvement de côté
  if (c.quoi === 'rétro extérieur')
    return { tete: g ? -22 : 22, yeux: 0, leve: .2, miroir: g ? 'g' : 'd' };
  if (c.quoi === 'regard')
    return { tete: g ? -48 : 48, yeux: g ? -10 : 10, leve: 0, miroir: '' };
  // l'angle mort : la tête tourne franchement, et les yeux vont au-delà
  return { tete: g ? -70 : 70, yeux: g ? -26 : 26, leve: 0, miroir: '' };
}

/* Poignée de rotation : elle n'a de sens que tant qu'aucun point n'est posé.
   Dès qu'il y en a un, c'est la trajectoire qui donne le cap de la voiture,
   et afficher une poignée laisserait croire le contraire. */
/* Une seule poignee a l'ecran a la fois : celle de l'obstacle qu'on vient de
   poser s'il y en a un, sinon celle de la voiture auto-ecole — et cette
   derniere n'a de sens que tant qu'aucun point n'est pose, puisque c'est
   ensuite la trajectoire qui donne le cap. */
function cibleRotation() {
  // avec la gomme, la poignée n'a rien à faire là : elle volerait l'appui à
  // l'objet qu'on veut retirer
  if (etat !== 'arret' || outil === 'gomme') return null;
  /* En essai, la voiture au départ est posée par l'exercice : on ne la tourne
     pas, pas plus qu'on ne déplace un panneau pendant qu'on répond. */
  if (vueEleve) return null;
  const ob = seance.obstacles[obstacleActif];
  if (ob) return { p: ob, cap: ob.cap, R: rayonPoignee(ob) };
  if (mesPoints().length === 0 && !seance.voiture.absente)
    return { p: seance.voiture, cap: capRepos, R: LV * 1.05 };
  return null;
}

function positionPoignee() {
  const c = cibleRotation();
  if (!c) return { x: 0, y: 0 };
  const a = c.cap * Math.PI / 180;
  return { x: c.p.x + Math.cos(a) * c.R, y: c.p.y + Math.sin(a) * c.R };
}

function dessinerPoignee() {
  els.poignee.textContent = '';
  const c = cibleRotation();
  if (!c) return;
  const R = c.R;
  const g = el('g', { transform:
    'translate(' + ax(c.p.x).toFixed(3) + ' ' + ay(c.p.y).toFixed(3)
    + ') rotate(' + c.cap.toFixed(2) + ')' });
  g.appendChild(el('circle', {
    cx:0, cy:0, r:R.toFixed(3), fill:'none', stroke:'#ffffff', 'stroke-opacity':'.7',
    'stroke-width':(R*0.048).toFixed(3),
    'stroke-dasharray': (R*0.152).toFixed(2) + ' ' + (R*0.124).toFixed(2)
  }));
  g.appendChild(el('circle', {
    cx:R.toFixed(3), cy:0, r:(R*0.285).toFixed(3), fill:'#ffffff',
    stroke:'#11161b', 'stroke-width':(R*0.048).toFixed(3)
  }));
  // un chevron dans la poignée : elle marque le nez de la voiture
  g.appendChild(el('path', {
    d:'M' + (R*0.914).toFixed(2) + ' ' + (-R*0.105).toFixed(2)
      + 'L' + (R*1.105).toFixed(2) + ' 0'
      + 'L' + (R*0.914).toFixed(2) + ' ' + (R*0.105).toFixed(2),
    fill:'none', stroke:'#11161b', 'stroke-width':(R*0.048).toFixed(3),
    'stroke-linecap':'round', 'stroke-linejoin':'round'
  }));
  els.poignee.appendChild(g);
}

/* =================================================================
   Le geste, montré sur la voiture
   =================================================================
   L'encart du conducteur, en haut à gauche, était juste — et il était
   AILLEURS. L'élève regarde la carte, le doigt du moniteur est sur la carte,
   et le geste se jouait dans un coin de l'écran : deux endroits à suivre au
   lieu d'un.

   Le geste se dessine donc sur la voiture elle-même :

   - **rétroviseur extérieur** : le miroir de ce côté s'allume, et une flèche
     part vers l'arrière le long de la caisse — c'est ce que le miroir montre ;
   - **rétroviseur intérieur** : une flèche droit derrière, dans l'axe ;
   - **angle mort** : une flèche franche par-dessus l'épaule, vers l'arrière et
     de côté, en bleu — la couleur qu'il a déjà dans le bandeau ;
   - **regard** (arrêt marqué, cédez-le-passage) : une flèche sur le côté, à
     l'horizontale : on regarde d'où ça vient.

   L'encart, lui, n'est pas supprimé : il est masqué, et se rallume d'un
   réglage. Il a coûté assez de travail pour qu'on ne le jette pas sur une
   impression — et à deux écrans, au vidéoprojecteur, il peut encore servir.

   Les flèches gardent une taille plancher à l'écran, comme les obstacles et
   les panneaux : prendre du champ ne doit pas effacer le geste. */
let gGeste = null;
let encart = false;                 // le conducteur en haut à gauche : masqué par défaut
const GESTE_MINI = 52;              // px : la flèche ne descend pas sous ça
const LAMPE_MINI = 6.5;             // px : le rayon d'un clignotant à l'écran
const FLUO_MIROIR = '#ffd24a';
const FLUO_ANGLE  = '#4aa3ff';
/* TROIS FAMILLES, TROIS COULEURS. Le regard direct partageait le jaune des
   rétroviseurs ; ce sont pourtant deux gestes qu'un moniteur ne confond jamais
   — l'un lit un miroir, l'autre tourne la tête vers la rue. Le violet ne se
   rencontre ni sur une chaussée, ni dans un champ, ni dans le reste de
   l'application : ni l'ambre du clignotant, ni le bleu de l'angle mort, ni le
   vert du tracé, ni le rouge de l'accident. */
const FLUO_REGARD = '#c07bff';
/* Et le rétroviseur INTÉRIEUR n'est pas l'extérieur : l'un regarde derrière
   dans l'axe, l'autre le long de la voiture. Deux gestes, deux couleurs. */
const FLUO_RETRO_INT = '#2fd6c4';

/* Le geste en cours, et il n'y en a qu'une source : ce qui est POSÉ sur le
   tracé, ou ce qu'on vient d'appuyer.

   L'application en fabriquait deux toute seule : un regard à gauche pendant
   qu'on attend devant un camembert occupé, et deux regards alternés pendant un
   arrêt marqué. C'était du temps où la télécommande n'avait pas de touche
   Regard — elle en a deux maintenant, et « faut que t'enlèves le truc sur les
   giratoires qui fait les regards solo ».

   Il a raison, et c'est la même règle que partout ailleurs ici : l'application
   ne joue pas le cours à la place du moniteur. Un regard qu'il n'a pas demandé
   est un regard qu'il n'enseigne pas — et, depuis le verdict, un regard que
   l'élève verrait se faire tout seul sans avoir rien fait. */
function gesteActuel() {
  if (etat === 'arret') return null;
  return controleA(s);
}

function dessinerGeste(ge) {
  if (!gGeste) return;
  gGeste.textContent = '';
  if (!ge) return;

  /* Échelle propre au geste : celle de la voiture tant qu'on la voit bien, un
     plancher en pixels au-delà. `k` est donc la voiture, mesurée dans ce
     repère-là — elle vaut 1 au zoom de travail et rapetisse ensuite. */
  const E = Math.max(LV, GESTE_MINI / vue.k);
  const k = LV / E;
  const g = el('g', { transform: 'scale(' + E.toFixed(4) + ')' });
  const cy = ge.cote === 'gauche' ? -1 : 1;   // la gauche du conducteur est en y négatif

  /* UN FAISCEAU, PAS UNE FLÈCHE.

     C'étaient des flèches pleines, cernées de noir : « les flèches elles sont
     moches de fou ». Elles l'étaient, et pour une raison de fond — une flèche
     est un signe d'interface, posé sur la scène ; un regard n'est pas un signe,
     c'est quelque chose qui part des yeux et qui se perd. Un cône qui s'éteint
     en s'éloignant dit la même chose sans rien poser sur la photo.

     Il garde le même plancher de taille à l'écran que les flèches : prendre du
     champ ne doit pas effacer le geste. */
  function faisceau(x0, y0, ang, lg, ouv, id) {
    const a = ouv / 2 * Math.PI / 180;
    const x1 = (lg * Math.cos(-a)).toFixed(3), y1 = (lg * Math.sin(-a)).toFixed(3);
    const x2 = (lg * Math.cos(a)).toFixed(3),  y2 = (lg * Math.sin(a)).toFixed(3);
    const d = 'M0 0L' + x1 + ' ' + y1 + 'A' + lg.toFixed(3) + ' ' + lg.toFixed(3)
            + ' 0 0 1 ' + x2 + ' ' + y2 + 'Z';
    const gg = el('g', { transform: 'translate(' + x0.toFixed(3) + ' ' + y0.toFixed(3)
                                  + ') rotate(' + ang.toFixed(1) + ')' });
    /* Un voile sombre dessous : sur un toit blanc ou un passage piéton, du
       jaune transparent ne se voit plus du tout. */
    gg.appendChild(el('path', { d:d, fill:'#11161b', 'fill-opacity':'.18' }));
    gg.appendChild(el('path', { d:d, fill:'url(#' + id + ')' }));
    g.appendChild(gg);
  }

  // le miroir qui s'allume, à sa place sur la caisse
  function allumer(cote) {
    const y = cote * .247 * k;
    g.appendChild(el('circle', { cx:(.1375 * k).toFixed(3), cy:y.toFixed(3),
                                 r:'.13', fill:FLUO_MIROIR, opacity:'.3' }));
    g.appendChild(el('rect', { x:(.10 * k).toFixed(3), y:(y - .03 * k).toFixed(3),
                               width:(.075 * k).toFixed(3), height:(.06 * k).toFixed(3),
                               rx:(.022 * k).toFixed(3), fill:FLUO_MIROIR,
                               stroke:'#11161b', 'stroke-width':.024 }));
  }

  if (ge.quoi === 'rétro extérieur') {
    allumer(cy);
    // le champ du miroir : étroit, vers l'arrière, en s'écartant un peu
    faisceau(.10 * k, cy * .247 * k, 180 - cy * 13, .95, 26, 'faisceauMiroir');
  }
  else if (ge.quoi === 'rétro intérieur') {
    faisceau(.02 * k, 0, 180, 1.05, 24, 'faisceauRetroInt');  // droit derrière, dans l'axe
  }
  else if (ge.quoi === 'regard') {
    // la tête tourne vers la rue : large, et pas très loin
    faisceau(.10 * k, cy * .14 * k, cy > 0 ? 88 : -88, .95, 44, 'faisceauRegard');
  }
  else {
    // l'angle mort : par-dessus l'épaule, vers l'arrière et de côté
    faisceau(.04 * k, cy * .14 * k, 180 - cy * 46, 1.15, 34, 'faisceauAngle');
  }
  gGeste.appendChild(g);
}

function placerVoiture() {
  let x = seance.voiture.x, y = seance.voiture.y, cap = capRepos;
  if (glissade) { x = glissade.x; y = glissade.y; cap = glissade.cap * 180 / Math.PI; }
  else if (chemin) {
    const e = surChemin(etat === 'arret' ? 0 : s);
    cap = e.cap * 180 / Math.PI;
    if (etat !== 'arret') { x = e.x; y = e.y; }
  }
  els.voiture.setAttribute('transform',
    'translate(' + ax(x).toFixed(3) + ' ' + ay(y).toFixed(3) + ') rotate(' + cap.toFixed(2) + ')');
  els.voiture.classList.toggle('freine', freine);
  const cl = (etat === 'arret') ? null : clignotantA(s);
  els.voiture.classList.toggle('cligno-gauche', cl === 'gauche');
  els.voiture.classList.toggle('cligno-droite', cl === 'droite');

  const ge = gesteActuel();
  dessinerGeste(ge);

  /* L'encart suit le même geste. On continue de lisser ses angles même masqué :
     le rallumer en pleine lecture ne doit pas faire sauter la tête. */
  const vise = cibleRegard(ge);
  capTete += (vise.tete - capTete) * 0.22;
  capYeux += (vise.yeux - capYeux) * 0.28;
  capLeve += ((vise.leve || 0) - capLeve) * 0.24;
  if (encart) majPoste(vise);

  dessinerPoignee();
}

/* =================================================================
   Lecture
   ================================================================= */
/* Tous les véhicules ont-ils fini leur chemin ? Un circuit ne finit jamais :
   c'est de la circulation, elle s'arrête à la Pause. */
/* Un véhicule qui a un trajet ne finit JAMAIS : il repart. La lecture ne
   s'arrête donc plus d'elle-même dès qu'il y a de la circulation — c'est le
   bouton ⏹ qui la coupe, et c'est bien ainsi : le moniteur explique pendant
   que ça tourne. */
function obstaclesFinis() {
  return seance.obstacles.every(ob => !ob.chemin);
}

/* Amener la voiture à un endroit de son tracé, et TOUT le reste avec : la
   circulation est calée sur l'heure de la voiture. Pousser la voiture, c'est
   donc pousser la scène entière — sinon le moniteur ferait avancer une voiture
   seule dans un monde figé. */
function amenerA(sd) {
  if (!chemin) return;
  s = Math.max(0, Math.min(chemin.total, sd));
  attenteJusqu = 0; attenteCam = null; freine = false; accident = null;
  glissade = null;
  arretsFranchis.clear();
  chemin.arrets.forEach(function (a) { if (a.s < s - 1e-9) arretsFranchis.add(a.k); });
  const t = tempsA(chemin, s);
  seance.obstacles.forEach(function (ob) { ob.horloge = t; });
  avancerObstacles(0);
  if (suivi) suivreVoiture();
  placerVoiture(); majIndication();
}

/* Le doigt posé sur la voiture la pousse le long de son tracé. On cherche
   l'abscisse la plus proche du doigt, mais seulement AUTOUR de là où elle est :
   sur un tracé qui repasse sur lui-même — un tour de giratoire — elle sauterait
   d'une boucle à l'autre. */
function glisserVoiture(ev) {
  const c = versMonde(ev);
  if (!c || !chemin) return;
  const fenetre = 30 / mParU, pas = Math.max(LV * 0.08, 0.5);
  let mieux = s, dmin = Infinity;
  for (let q = Math.max(0, s - fenetre); q <= Math.min(chemin.total, s + fenetre); q += pas) {
    const e = positionSeule(q);
    const d = Math.hypot(e.x - c.x, e.y - c.y);
    if (d < dmin) { dmin = d; mieux = q; }
  }
  amenerA(mieux);
}

function boucle(t) {
  if (etat !== 'lecture') { trame = 0; return; }
  const dt = Math.min(0.05, dernierT ? (t - dernierT) / 1000 : 0.016);
  dernierT = t;

  /* Pas de trajectoire de l'élève : seuls les véhicules roulent. Sa voiture
     reste où elle est posée, et il n'y a ni contrôle ni accident à juger — il
     n'y a pas de conduite. */
  if (!chemin) {
    avancerObstacles(dt);
    /* placerVoiture() n'a pas que la voiture à sa charge : c'est lui qui
       redessine la poignée de rotation. Sans cet appel elle restait figée à
       l'écran pendant toute la lecture, et même après désélection du véhicule. */
    placerVoiture();
    if (obstaclesFinis()) { etat = 'fin'; majCommandes(); trame = 0; return; }
    majIndication();
    trame = requestAnimationFrame(boucle);
    return;
  }

  const q = 1 / mParU;

  /* En glissade, il n'y a plus de trajectoire : plus d'arrêt marqué, plus
     d'engagement, plus de consigne. Il n'y a qu'une voiture qui finit sa
     course. */
  if (glissade) {
    const fini = avancerGlissade(dt);
    avancerObstacles(dt);
    if (suivi) suivreVoiture();
    placerVoiture(); dessinerObstacles(); majIndication();
    if (fini) { etat = 'fin'; majCommandes(); trame = 0; return; }
    trame = requestAnimationFrame(boucle);
    return;
  }

  /* Arrêt marqué en cours : la voiture ne bouge pas, feux stop allumés. */
  if (attenteJusqu) {
    if (t < attenteJusqu) {
      /* Nous sommes à l'arrêt, pas les autres : le monde continue de tourner,
         et le calage des rencontres compte bien nos trois secondes. */
      freine = true; avancerObstacles(dt); placerVoiture(); majIndication();
      trame = requestAnimationFrame(boucle); return;
    }
    attenteJusqu = 0; freine = false;
  }

  const e = surChemin(s);
  /* Le profil impose l'arrêt aux deux bouts : à l'abscisse zéro la vitesse
     vaut exactement zéro, et « s += v × dt » ne décollerait jamais. */
  const mini = ALLURE.lente * q * 0.09;
  const v = Math.max(e.v, mini);
  const apres = surChemin(Math.min(chemin.total, s + v * dt + LV * 0.05));
  freine = apres.v < e.v - 0.5 * q;

  /* LE PNEU TIENT-IL ? Avant tout le reste : si l'on a déjà lâché, le
     cédez-le-passage d'après n'a plus de sens. */
  const lat = demandeLaterale(chemin, s, v);
  if (lat.a > ADHERENCE) {
    partirEnGlissade(e, v, lat);
    trame = requestAnimationFrame(boucle);
    return;
  }

  /* Un point rouge sur le chemin : on s'y pose exactement, puis on attend. */
  const prochain = chemin.arrets.find(a => !arretsFranchis.has(a.k) && a.s > s + 1e-9);
  if (prochain && s + v * dt >= prochain.s) {
    s = prochain.s;
    arretsFranchis.add(prochain.k);
    attenteDuree = prochain.duree * 1000;
    attenteJusqu = t + attenteDuree;
    freine = true;
    if (suivi) suivreVoiture();
    placerVoiture(); majIndication();
    trame = requestAnimationFrame(boucle); return;
  }

  /* ---- le camembert : on s'engage, ou pas ----

     Ce n'est pas un réglage, c'est la règle du tableau. À la ligne
     d'engagement, si quelque chose est dans la part :

     - **arrivé à allure ralentie**, on s'arrête et on attend qu'elle se libère.
       C'est le cédez-le-passage fait correctement, et il n'y a rien à reprocher ;
     - **arrivé à allure normale**, on s'engage sans avoir cherché : accident.
       C'est très exactement ce qu'on veut faire comprendre à l'élève, et ça ne
       se décide pas dans un menu — ça découle de l'allure qu'il a tracée.

     Part libre : on passe, quelle que soit l'allure. */
  const barrage = engagements.find(g => s <= g.s + 1e-9 && s + v * dt >= g.s);
  if (barrage) {
    /* Une priorité à droite n'a pas de part à surveiller : il n'y a rien à
       « occuper », seulement quelqu'un qui arrive. */
    const gene = barrage.cm ? vehiculeDansCamembert(barrage.cm) : null;
    if (gene && barrage.lente) {
      if (!attenteCam) signaler('Camembert occupé — on n’entre pas', '#d21f1f');
      attenteCam = barrage;
      s = barrage.s; freine = true;
      /* Nous attendons, pas les autres : sans cette ligne la circulation se
         fige avec nous, la part ne se libère jamais, et la voiture reste au
         cédez-le-passage jusqu'à la fin des temps. */
      avancerObstacles(dt);
      if (suivi) suivreVoiture();
      placerVoiture(); majIndication();
      trame = requestAnimationFrame(boucle); return;
    }
    /* La rencontre est calée : on LAISSE ROULER. Le choc aura lieu quelques
       mètres plus loin, au vrai point de croisement, et c'est le détecteur de
       contact qui le constatera. S'arrêter ici le rendrait impossible. */
    if (!barrage.lente && barrage.force) {
      if (!barrage.dit) {
        barrage.dit = true;
        signaler(motDeLaFaute(barrage), '#d21f1f');
      }
    }
    else if (!barrage.lente && barrage.muet) {
      if (!barrage.dit) {
        barrage.dit = true;
        signaler('Sans contrôle — ' + barrage.muet, '#e08a2e');
      }
    }
    /* Personne à caler — le véhicule n'a pas de trajectoire, ou elle ne croise
       pas la nôtre — mais quelqu'un occupe la part : l'ancienne annonce reste,
       faute de pouvoir montrer le choc. */
    else if (gene) {
      const q = surChemin(barrage.s);
      s = barrage.s; attenteCam = null;
      accident = { x: q.x + Math.cos(q.cap) * LV * 0.5,
                   y: q.y + Math.sin(q.cap) * LV * 0.5,
                   quoi: nomVehicule(gene) + ' — engagement sans contrôle' };
      etat = 'fin'; freine = true;
      placerVoiture(); dessinerObstacles(); majCommandes(); majIndication();
      trame = 0; return;
    }
    /* ON DIT TOUJOURS CE QUI A ÉTÉ JUGÉ. Un engagement réussi passait en
       silence : quand rien ne se produisait, impossible de savoir si
       l'application avait vu un contrôle ou n'avait rien vu du tout. La
       phrase porte les deux nombres — l'allure tenue et le seuil du lieu —
       parce que c'est exactement ce qui se discute avec l'élève. */
    else if (barrage.lente) {
      if (!barrage.dit) {
        barrage.dit = true;
        signaler((barrage.prio ? 'Priorité à droite contrôlée — ' : 'Contrôlé — ')
                 + barrage.kmh + ' km/h (seuil ' + barrage.seuil + ')', '#17a45a');
      }
    }
    if (attenteCam && !gene) signaler('Camembert libre — on s’engage', '#17a45a');
  }
  attenteCam = null;

  s += v * dt;
  /* En toute fin de parcours l'allure tend vers zéro : on termine franchement.
     Le test est borné à la dernière demi-longueur de voiture — sinon un arrêt
     marqué au-delà de la moitié du trajet téléporterait la voiture à l'arrivée. */
  if (s > chemin.total - LV * 0.5 && e.v < ALLURE.lente * q * 0.4) s = chemin.total;

  if (s >= chemin.total) {
    s = chemin.total; freine = true;
    /* Si quelque chose roule encore — et un circuit ne s'arrête jamais — la
       lecture continue sans nous. La voiture reste où elle est arrivée, et
       c'est le bouton Arrêt qui met fin à la séquence. */
    if (obstaclesFinis()) { etat = 'fin'; placerVoiture(); majCommandes(); trame = 0; return; }
    if (!arrive) { arrive = true; majCommandes(); }
    avancerObstacles(dt);
    placerVoiture(); majIndication();
    trame = requestAnimationFrame(boucle);
    return;
  }
  if (suivi) suivreVoiture();
  avancerObstacles(dt);

  const choc = chercherAccident();
  if (choc) {
    accident = reculerAuContact(choc.ob, dt);
    /* Un choc ordinaire dit contre quoi ; celui-là dit POURQUOI. C'est la
       phrase que le moniteur va répéter à l'élève, autant qu'elle soit à
       l'écran. */
    if (accident && choc.ob.forcee) accident.quoi += ' — ' + choc.ob.forcee;
    if (choc.ob.chemin) choc.ob.s = absciseA(choc.ob.chemin, choc.ob.horloge || 0);
    etat = 'fin'; freine = true;
    placerVoiture(); dessinerObstacles(); majCommandes(); majIndication();
    trame = 0; return;
  }

  placerVoiture(); majIndication();
  trame = requestAnimationFrame(boucle);
}

/* Deux véhicules au même endroit au même instant, c'est un accident : on arrête
   tout et on le montre. C'est le seul moment où l'application juge la
   trajectoire du moniteur — et c'est justement ce qu'il veut montrer : un
   dépassement entrepris trop tard ne se raconte pas, il se voit.

   Chaque véhicule est approché par une file de disques le long de sa longueur,
   du diamètre de sa largeur. Deux rectangles orientés se recouvrent rarement
   sans qu'un disque de l'un touche un disque de l'autre, et c'est dix fois plus
   simple à calculer qu'un vrai test de recouvrement. */
function disques(x, y, cap, L, l) {
  /* Les disques des deux bouts sont centrés à une demi-largeur du pare-chocs :
     la chaîne couvre alors EXACTEMENT la longueur du véhicule. Espacés
     régulièrement à partir du centre, ils laissaient 12 cm de jeu à chaque bout,
     et les capots se touchaient un quart de mètre trop tôt. */
  const n = Math.max(2, Math.ceil(L / l));
  const a = cap * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
  const r = (l / 2) / mParU, demi = (L / 2 - l / 2) / mParU;
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = -demi + (2 * demi * i) / (n - 1);
    out.push({ x: x + ux * d, y: y + uy * d, r: r });
  }
  return out;
}

/* ---- la rencontre : deux trajectoires qui se coupent finissent au choc ----

   Si les deux chemins se croisent quelque part, l'application **cale le départ**
   du véhicule obstacle pour qu'il soit au point de croisement à la seconde où
   nous y sommes. Le choc est donc certain, et c'est voulu : une trajectoire qui
   coupe celle d'un autre est un accident, peu importe le minutage qu'on aurait
   pu trouver en bricolant les points.

   Deux véhicules qui respectent chacun leur voie ont des chemins parallèles :
   ils ne se coupent jamais, donc rien n'est forcé et rien ne se passe. Le
   forcage ne touche que les tracés qui se coupent réellement. */
/* Le temps qu'il faut pour atteindre une abscisse, et l'abscisse atteinte au
   bout d'un temps. Les arrêts marqués comptent : trois secondes d'attente
   décalent tout ce qui suit.

   Ces trois-là sont le cœur de l'horloge des véhicules : c'est par elles qu'un
   obstacle sait où il en est, qu'on pousse la voiture au doigt, et qu'un
   enregistrement se rejoue. */
function plancherAllure() { return ALLURE.lente / mParU * 0.09; }

function tempsA(ch, sCible) {
  const mini = plancherAllure();
  let t = 0;
  for (let i = 1; i < ch.abs.length && ch.abs[i - 1] < sCible; i++) {
    const d = Math.min(ch.abs[i], sCible) - ch.abs[i - 1];
    t += d / Math.max((ch.vRle[i - 1] + ch.vRle[i]) / 2, mini);
  }
  (ch.arrets || []).forEach(function (a) { if (a.s < sCible) t += a.duree; });
  return t;
}

function absciseA(ch, tCible) {
  if (tCible <= 0) return 0;
  const mini = plancherAllure();
  let t = 0;
  for (let i = 1; i < ch.abs.length; i++) {
    const d = ch.abs[i] - ch.abs[i - 1];
    const dt = d / Math.max((ch.vRle[i - 1] + ch.vRle[i]) / 2, mini);
    if (t + dt >= tCible) return ch.abs[i - 1] + d * (tCible - t) / dt;
    t += dt;
  }
  return ch.total;
}

/* LA TRAJECTOIRE NE TIENT PLUS COMPTE DES VÉHICULES.

   Il y avait ici tout un appareillage : on cherchait le point de CROISEMENT
   entre le tracé de l'élève et celui de chaque véhicule, on décidait qui avait
   la PRIORITÉ d'après les deux caps, et on décalait l'heure de départ du
   véhicule pour que la rencontre tombe juste — il attend, ou il passe devant,
   ou les deux s'y retrouvent.

   C'était l'application qui montait la scène à la place du moniteur, et en
   silence : deux tracés identiques donnaient deux situations différentes selon
   ce qu'elle avait calculé. Or le moniteur SAIT ce qu'il veut montrer, et il a
   maintenant tout ce qu'il faut pour le montrer lui-même — la vitesse de
   chaque point, la pédale, et le doigt qui pousse la voiture.

   Chaque véhicule part donc à l'heure zéro et roule son trajet, point. La
   rencontre a lieu si le moniteur l'a tracée ainsi, et pas autrement.

   Ce qui reste, et qui n'est pas la même chose : l'ACCIDENT (le contact se
   constate, il ne se décide pas) et le CAMEMBERT (c'est une règle du tableau,
   posée exprès, et visible).

   Cette règle-là a été reprise une fois, pour forcer le choc d'une priorité à
   droite — puis rendue, définitivement. Voir « PERSONNE NE RÈGLE L'HEURE DES
   AUTRES », plus bas. */
function calerRencontres() {
  seance.obstacles.forEach(function (ob) {
    ob.horloge = 0; ob.absent = false;
  });
}

/* =================================================================
   PERSONNE NE RÈGLE L'HEURE DES AUTRES
   =================================================================
   Il y a eu ici, pendant un temps, une machine à faire tomber le choc juste :
   on cherchait par la méthode de la sécante l'heure de départ du véhicule
   prioritaire qui amenait le contact sur notre flanc, puis on balayait neuf
   allures — jusqu'au triple de la sienne — pour qu'il nous touche phare contre
   phare. C'était demandé, et c'était joli :

   > « faut que tu force l'accident avec la voiture obstacle […] fasse partir
   > la voiture obstacle à la tempo qui fait qu'elle tape »

   Elle est retirée. Le verdict est du même homme, et il est plus fort :

   > « la trajectoire obstacle prend en compte un autre obstacle, ça faut pas,
   > on s'en fout, faut juste que la trajectoire suive les points posés »

   Ce qu'on avait mal vu : ce n'était pas un réglage, c'était une SECONDE MAIN
   sur la scène. Le moniteur pose six véhicules, il en retrouve un qui part en
   retard ou traverse à trois fois son allure, et rien à l'écran ne le lui dit.
   Deux montages identiques ne jouaient pas pareil. Une application qui corrige
   en silence ce qu'on lui a donné n'est plus un tableau : c'est un avis.

   Donc : **chaque véhicule part à l'heure zéro et roule ses points.** Le choc
   a lieu si le moniteur l'a tracé ainsi — c'est à lui de le monter, avec les
   vitesses de ses points, et il sait le faire mieux que nous.

   Ce qui reste, et qui n'est pas la même chose : l'ACCIDENT se constate (les
   chaînes de disques, le recul au premier instant de contact, la croix à
   l'endroit exact) ; le CAMEMBERT est une règle du tableau, posée exprès et
   visible ; et la priorité à droite se LIT sur les tracés. Constater, ce n'est
   pas mettre en scène. */
const CROISE_MAXI = 6;       // m : au-delà, les deux tracés ne se croisent pas

/* =================================================================
   LA PRIORITÉ À DROITE, LUE SUR LA SCÈNE
   =================================================================
   La séance « prio a droite » du propriétaire, ouverte ici : 103 m de tracé,
   tous les points à l'allure de la rue (30), un véhicule dont le trajet croise
   le sien **à 16 centimètres** — et zéro camembert. Rien ne se produisait, et
   c'était logique : tout le jugement pendait au camembert, c'est-à-dire à un
   objet qu'il faut penser à poser.

   Or la scène dit déjà tout. Deux tracés qui se croisent, un véhicule qui
   arrive **de notre droite**, et rien qui nous donne la priorité : c'est une
   priorité à droite, et ça se lit. Le moniteur a posé la voiture et tracé son
   passage — il a déjà dit ce qu'il voulait montrer.

   CE QUE L'APPLICATION NE FAIT TOUJOURS PAS : inventer du trafic. Sans véhicule
   posé dont le trajet croise le nôtre, il ne se passe rien, quelle que soit
   l'allure. Elle lit une règle sur une scène montée, elle ne monte pas la
   scène.

   ET CE QU'ELLE REFUSE DE JUGER : un carrefour à feux. La carte ne sait pas de
   quelle couleur est le feu — il arrive éteint — donc elle se tait. */
const PRIO_CROISE = 2.5;     // m : au-delà, les deux tracés ne se croisent pas
const PRIO_ANGLE = 30;       // degrés : en deçà, on se suit, on ne se croise pas
const PRIO_DROITE = 75;      // degrés de part et d'autre du travers droit
const PRIO_SIGNE = 30;       // m : un panneau plus loin ne commande pas ce croisement
const PRIO_FACE = 55;        // degrés : le panneau regarde-t-il ce conducteur ?

/* La phrase qui décrit la faute, telle que le moniteur la redira. */
function motDeLaFaute(g) {
  if (!g.prio) return 'Engagement sans contrôle';
  if (g.raison === 'refus') return 'Il refuse la priorité — et vous n’avez pas ralenti';
  if (g.raison === 'feu') return 'Carrefour à feux — vous n’avez pas ralenti';
  return 'Priorité à droite non cédée';
}

/* La même chose en un groupe de mots : le bandeau d'accident écrit déjà
   « Accident — voiture grise », un tiret de plus ferait litanie. */
function fauteCourte(g) {
  if (!g.prio) return 'engagement sans contrôle';
  if (g.raison === 'refus') return 'refus de priorité, sans ralentir';
  if (g.raison === 'feu') return 'carrefour à feux, sans ralentir';
  return 'priorité à droite non cédée';
}

/* Le cap du tracé à une abscisse, en degrés. */
function capA(ch, sd) { return surChemin(sd, ch).cap * 180 / Math.PI; }

/* Le plus proche croisement entre notre tracé et celui d'un véhicule. */
function croisementDesTraces(ob) {
  if (!ob.chemin || !chemin) return null;
  let best = null;
  for (let i = 0; i < chemin.pts.length; i++) {
    const a = chemin.pts[i];
    for (let j = 0; j < ob.chemin.pts.length; j++) {
      const b = ob.chemin.pts[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (!best || d < best.d) best = { d: d, sNous: chemin.abs[i], sLui: ob.chemin.abs[j] };
    }
  }
  if (!best || best.d * mParU > PRIO_CROISE) return null;
  best.capNous = capA(chemin, best.sNous);
  best.capLui = capA(ob.chemin, best.sLui);
  best.x = surChemin(best.sNous).x; best.y = surChemin(best.sNous).y;
  return best;
}

/* Vient-il de notre droite ? La direction D'OÙ il vient est son cap à l'envers ;
   notre droite est à cap + 90, l'écran ayant l'y vers le bas. */
function deNotreDroite(capNous, capLui) {
  return Math.abs(ecartAngle(capLui + 180, capNous + 90)) < PRIO_DROITE;
}

/* Un panneau du relèvement commande-t-il ce conducteur-là, près d'ici ? */
function signeQuiCommande(x, y, cap, types) {
  const d = reseauPour({ x: x, y: y });
  if (!d) return null;
  return d.panneaux.find(function (q) {
    return types.indexOf(q.signe) >= 0 && q.marche != null
        && Math.hypot(q.x - x, q.y - y) * mParU < PRIO_SIGNE
        && Math.abs(ecartAngle(q.marche, cap)) < PRIO_FACE;
  }) || null;
}

/* Les croisements où nous devons céder, sans qu'aucun camembert ne le dise. */
function ajouterPrioritesADroite() {
  if (!chemin) return;
  seance.obstacles.forEach(function (ob) {
    const c = croisementDesTraces(ob);
    if (!c) return;
    // deux tracés qui se suivent ne se cèdent rien
    if (Math.abs(ecartAngle(c.capLui, c.capNous)) < PRIO_ANGLE) return;
    if (!deNotreDroite(c.capNous, c.capLui)) return;
    /* C'EST LE TRACÉ QUI FAIT FOI, PAS LA BASE DE DONNÉES.

       Première version : un stop relevé en face de lui nous donnait la priorité,
       et l'application se taisait. Sur la séance « prio a droite », OSM place
       effectivement un stop à 3,9 m en amont du véhicule — tout était donc
       correct, et rien ne se passait.

       Sauf que le moniteur avait tracé ce véhicule TRAVERSANT, sans arrêt. Dans
       sa démonstration, cette voiture ne s'arrête pas : c'est lui qui l'a voulu,
       et c'est ça qu'il montre. Laisser un panneau de la base contredire le
       geste du moniteur, ce serait reprendre d'une main ce qu'on lui a donné de
       l'autre.

       On regarde donc SON tracé à LUI : s'il porte un arrêt avant le
       croisement, il s'arrête et personne ne se touche. Sinon il passe, quoi
       qu'en dise la carte — et le panneau relevé ne sert plus qu'à NOMMER la
       faute : priorité à droite non cédée, ou refus de priorité de sa part. */
    let ilSArrete = (ob.chemin.arrets || []).some(function (a) {
      return Math.abs(a.s - c.sLui) < 25 / mParU;
    });
    if (!ilSArrete) {
      const fenetre = 20 / mParU;
      for (let i = 0; i < ob.chemin.abs.length; i++) {
        if (ob.chemin.abs[i] < c.sLui - fenetre || ob.chemin.abs[i] > c.sLui + 2 / mParU) continue;
        if (ob.chemin.vAff[i] * mParU * 3.6 < ARRET_KMH) { ilSArrete = true; break; }
      }
    }
    if (ilSArrete) return;                 // il s'arrête : le moniteur l'a tracé ainsi
    // un camembert couvre déjà ce croisement : c'est lui qui commande
    if (seance.camemberts.some(cm => dansCamembert(cm, c.x, c.y, 0))) return;
    /* Qui avait la priorité sur le papier ? Ça ne change pas le choc, ça change
       la phrase — et c'est la phrase que le moniteur répétera à l'élève. */
    const aLui = signeQuiCommande(c.x, c.y, c.capLui, ['stop', 'cedez']);
    const feu = signeQuiCommande(c.x, c.y, c.capNous, ['feu'])
             || signeQuiCommande(c.x, c.y, c.capLui, ['feu']);
    const raison = feu ? 'feu' : (aLui ? 'refus' : 'prio');

    const kmh = allureDApproche(c.sNous);
    const seuil = seuilControle({ x: c.x, y: c.y });
    engagements.push({ cm: null, prio: true, ob: ob, croise: c, raison: raison,
                       s: Math.max(0, c.sNous - LV * 0.5),
                       lente: kmh <= seuil, kmh: Math.round(kmh), seuil: Math.round(seuil) });
  });
}

/* Où le tracé d'un véhicule passe-t-il au plus près du nôtre, DANS la part ? */
function croisementDansLaPart(ob, cm) {
  if (!ob.chemin || !chemin) return null;
  let best = null;
  for (let i = 0; i < chemin.pts.length; i++) {
    const a = chemin.pts[i];
    if (!dansCamembert(cm, a.x, a.y, 0)) continue;
    for (let j = 0; j < ob.chemin.pts.length; j++) {
      const b = ob.chemin.pts[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (!best || d < best.d) best = { d: d, sNous: chemin.abs[i], sLui: ob.chemin.abs[j] };
    }
  }
  return (best && best.d * mParU < CROISE_MAXI) ? best : null;
}

/* Ce qui reste de l'ancien « forcer les rencontres » : on ne CALE plus rien,
   on NOMME. Quel véhicule est en jeu à cet engagement, et quelle faute on est
   en train de commettre — pour que la phrase soit prête si le choc a lieu, et
   pour dire pourquoi il n'a pas lieu quand rien ne croise la part. */
function lireLesRencontres() {
  seance.obstacles.forEach(function (ob) { ob.forcee = false; });
  ajouterPrioritesADroite();
  engagements.forEach(function (g) {
    g.force = null; g.dit = false; g.muet = null;
    if (g.lente) return;                  // il a ralenti : rien à lui reprocher
    let choisi = null;
    if (g.prio) choisi = { ob: g.ob, c: g.croise };     // le croisement est déjà connu
    else seance.obstacles.forEach(function (ob) {
      const c = croisementDansLaPart(ob, g.cm);
      if (c && (!choisi || c.d < choisi.c.d)) choisi = { ob: ob, c: c };
    });
    /* RIEN EN FACE : ON LE DIT. Sans ça, un engagement raté où aucun véhicule
       ne croise la part se déroule dans le silence le plus complet, et on
       cherche en vain ce qui a bien pu empêcher le choc. */
    if (!choisi) {
      g.muet = seance.obstacles.some(o => o.chemin)
        ? 'aucun véhicule ne croise la part'
        : 'aucun véhicule n’a de trajet';
      return;
    }
    choisi.ob.forcee = fauteCourte(g);
    g.force = choisi.ob;
  });
}

/* À allure ralentie, il n'y a pas d'accident — même avec une trajectoire
   accident. C'est la règle du propriétaire, et elle est juste : au pas d'un
   cédez-le-passage on voit venir, on s'arrête, on laisse passer. Le choc ne
   s'enseigne que sur une allure où l'on ne peut plus rien.

   **Le même seuil que le camembert**, et pour la même raison qu'avant : les deux
   règles ne peuvent pas se contredire sous les yeux de l'élève. Il valait
   (vL + vN) / 2, soit 32 km/h fixes, hérités des allures ralentie/normale
   d'avant les km/h écrits — et sur une zone 30, rouler à l'allure de la rue
   désarmait l'accident. */
function auPas(v, p) {
  return v * mParU * 3.6 <= seuilControle(p);
}

let accident = null;

/* =================================================================
   LA COURBE NE PARDONNE PAS
   =================================================================
   > « Quand on prend un giratoire à plus de 30 km/h, faut que soit on perde le
   > contrôle du véhicule, soit qu'il y ait un accident. »

   Jusqu'ici l'allure d'un point était une consigne sans conséquence : on
   pouvait écrire 70 dans un anneau de quinze mètres et la voiture le prenait
   sagement. Une application qui laisse faire ça n'enseigne pas la vitesse,
   elle l'autorise.

   Ce n'est pas une règle de plus à régler : c'est de la physique, et elle se
   lit sur le tracé. Un virage de rayon R pris à la vitesse v demande au pneu
   une accélération latérale de v²/R. Au-delà de ce qu'il tient, la voiture ne
   tourne plus — elle continue tout droit.

   LE SEUIL EST CALÉ SUR SA PHRASE, ET MESURÉ SUR UN VRAI TRACÉ. Le crayon dit
   qu'un anneau de douze mètres pris à 30 km/h demande 5,8 m/s² ; la mesure dit
   6,3. La courbe qui passe par les points posés n'est pas un cercle parfait —
   son rayon respire entre onze et douze mètres et demi, et c'est le creux qui
   décide. Un seuil calculé au crayon faisait donc lâcher la voiture à 30 pile,
   c'est-à-dire à l'allure que le moniteur enseigne.

   La limite est donc relevée, pas calculée : 7,0 m/s², c'est-à-dire ce qu'il
   faut pour qu'un anneau de douze mètres — dont le tracé creuse à dix — passe
   à 30 sans trembler, et lâche dès 32.

   Ce que ça donne ailleurs, et c'est voulu : un anneau serré se rate plus tôt,
   un grand giratoire pardonne un peu plus.

   | rayon de la voie | ça lâche à |
   |---|---|
   | 10 m | 30 km/h |
   | 12 m | 33 km/h |
   | 15 m | 37 km/h |
   | 20 m | 43 km/h |

   C'est exactement ce que dit la route, et ce qu'un moniteur explique.

   ET ON NE BRIDE PAS, ON PUNIT. L'application a eu, à un moment, un limiteur
   qui ralentissait tout seul en courbe ; il a été retiré parce qu'il décidait à
   la place du moniteur. Ici, rien n'est décidé : la voiture fait ce qui est
   écrit, et ce qui arrive arrive. */
const ADHERENCE = 7.0;        // m/s² : au-delà, le pneu lâche
const FENETRE_COURBE = 5;     // m de part et d'autre : moins, c'est du bruit de tracé
const GLISSE_FREIN = 5.5;     // m/s² : ce qui ralentit une voiture en travers
const GLISSE_TOURNE = 55;     // degrés par seconde : elle part en tête-à-queue

/* Le rayon du virage à cet endroit, en U. On le mesure sur le CAP, pas sur
   trois points : le tracé est subdivisé finement, et trois sommets voisins
   donnent des cercles circonscrits absurdes dès qu'ils sont presque alignés. */
function rayonCourbure(ch, sd) {
  const d = FENETRE_COURBE / mParU;
  const s1 = Math.max(0, sd - d), s2 = Math.min(ch.total, sd + d);
  const ds = s2 - s1;
  if (ds < 1e-6) return Infinity;
  let da = surChemin(s2, ch).cap - surChemin(s1, ch).cap;
  while (da > Math.PI) da -= 2 * Math.PI;
  while (da < -Math.PI) da += 2 * Math.PI;
  const k = Math.abs(da) / ds;
  return { R: k < 1e-9 ? Infinity : 1 / k, sens: da >= 0 ? 1 : -1 };
}

/* Ce que le pneu doit tenir ici, en m/s². v est en U/s. */
function demandeLaterale(ch, sd, v) {
  const c = rayonCourbure(ch, sd);
  if (!isFinite(c.R)) return { a: 0, sens: c.sens };
  return { a: v * v * mParU / c.R, sens: c.sens };
}

/* LA GLISSADE. La voiture garde le cap qu'elle avait à l'instant où elle a
   lâché, et continue tout droit pendant que la route, elle, tourne : c'est le
   sous-virage, et c'est ce qui sort du giratoire par l'extérieur. Elle pivote
   en glissant, parce qu'une voiture qui perd l'avant finit rarement droite. */
let glissade = null;

function partirEnGlissade(e, v, a) {
  const kmh = Math.round(v * mParU * 3.6);
  glissade = { x: e.x, y: e.y, cap: e.cap, v: v,
               sens: a.sens, kmh: kmh,
               R: Math.round(rayonCourbure(chemin, s).R * mParU) };
  freine = true;
  signaler('Perte de contrôle — ' + kmh + ' km/h dans la courbe', '#ff2f2f');
}

function avancerGlissade(dt) {
  const g = glissade;
  g.x += Math.cos(g.cap) * g.v * dt;
  g.y += Math.sin(g.cap) * g.v * dt;
  g.cap += g.sens * GLISSE_TOURNE * Math.PI / 180 * dt;
  g.v -= GLISSE_FREIN / mParU * dt;
  if (g.v > 0) return false;
  accident = { x: g.x, y: g.y,
               quoi: 'perte de contrôle — ' + g.kmh + ' km/h dans un virage de '
                     + g.R + ' m' };
  return true;
}

/* Où en est un véhicule obstacle si l'on remonte le temps de `recul` secondes. */
function poseObstacle(ob, recul) {
  if (!ob.chemin) return { x: ob.x, y: ob.y, cap: ob.cap };
  const q = surChemin(absciseA(ob.chemin, (ob.horloge || 0) - recul), ob.chemin);
  return { x: q.x, y: q.y, cap: q.cap * 180 / Math.PI };
}

/* Se touchent-ils, `recul` secondes plus tôt ? Renvoie le point de contact, ou
   null. Rejouable à volonté : c'est ce qui permet de revenir au contact exact. */
function contactA(ob, recul) {
  const o = obstacleDe(ob.t);
  if (!o) return null;
  const e0 = surChemin(s);
  const sr = Math.max(0, s - Math.max(e0.v, plancherAllure()) * recul);
  const e = surChemin(sr);
  const nous = disques(e.x, e.y, e.cap * 180 / Math.PI, LONGUEUR_VOITURE, 1.8);
  const p = poseObstacle(ob, recul);
  const eux = disques(p.x, p.y, p.cap, o.L, o.l);
  let pres = null;
  for (const a of nous) for (const b of eux) {
    const d = Math.hypot(a.x - b.x, a.y - b.y) - a.r - b.r;
    if (d < 0 && (!pres || d < pres.d))
      pres = { d: d, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, sNous: sr };
  }
  return pres ? { x: pres.x, y: pres.y, sNous: pres.sNous, quoi: nomVehicule(ob) } : null;
}

function chercherAccident() {
  if (!chemin) return null;
  const ici = surChemin(s);
  if (auPas(ici.v, ici)) return null;
  for (const ob of seance.obstacles) {
    if (ob.absent) continue;              // il n'est pas là : on ne peut pas le heurter
    const c = contactA(ob, 0);
    if (c) return { ob: ob, contact: c };
  }
  return null;
}

/* Le choc est vu à l'image près : à 27 m/s de vitesse de rapprochement, une
   image de 33 ms vaut presque un mètre, et les deux voitures se retrouvent
   encastrées. On remonte donc le temps jusqu'au PREMIER instant de contact —
   capot contre capot, et non l'une dans l'autre. Une dichotomie sur le recul
   suffit : vingt tours placent le contact au dixième de millimètre. */
function reculerAuContact(ob, dt) {
  let bas = 0, haut = dt;
  if (!contactA(ob, haut)) {
    for (let k = 0; k < 20; k++) {
      const mi = (bas + haut) / 2;
      if (contactA(ob, mi)) bas = mi; else haut = mi;
    }
  }
  const c = contactA(ob, bas) || contactA(ob, 0);
  s = c.sNous;
  if (ob.chemin) ob.horloge = Math.max(0, (ob.horloge || 0) - bas);
  return c;
}

/* Les véhicules obstacles avancent sur leur propre chemin, à la même horloge.
   Ils partent en même temps que la voiture auto-école : caler les départs pour
   qu'ils se rencontrent vraiment au croisement est le chantier suivant. */
/* LA CIRCULATION NE S'ARRÊTE PAS. Un véhicule obstacle qui arrivait au bout de
   son trajet se garait là et n'en bougeait plus. Pour montrer un carrefour, ce
   n'est pas ce qu'on veut : on veut qu'il passe, qu'il s'en aille, et qu'un
   autre arrive — autant de fois qu'il faut pour que l'élève comprenne.

   Il sort donc de la scène au bout de son trajet, reste absent une seconde,
   et reparaît au départ. Le vide est ce qui fait la différence entre « une
   voiture qui repasse » et « une voiture qui se téléporte » : sans lui, elle
   saute d'un bout à l'autre sous les yeux de l'élève.

   Un CIRCUIT fermé, lui, ne sort jamais : il tourne, et c'est déjà ce qu'on
   lui demande. */
const RESPAWN = 1.0;         // s d'absence entre la sortie et le retour

function avancerObstacles(dt) {
  let bouge = false;
  seance.obstacles.forEach(function (ob) {
    if (!ob.chemin) return;
    /* On avance par le TEMPS, et non de proche en proche : c'est ce qui évite
       que l'écart se creuse au fil des images. Et c'est SON temps à lui : plus
       d'heure de départ décalée, plus d'allure multipliée — il roule ses
       points, et rien d'autre ne le pousse. */
    ob.horloge = (ob.horloge || 0) + dt;
    let q = ob.horloge;
    ob.absent = false;
    if (enBoucle(ob)) {
      // un circuit se rejoue : on ramène le temps dans la durée d'un tour
      const tour = tempsA(ob.chemin, ob.chemin.total);
      if (tour > 0.1) q = ((q % tour) + tour) % tour;
    } else {
      const duree = tempsA(ob.chemin, ob.chemin.total);
      const cycle = duree + RESPAWN;
      if (cycle > 0.1 && q > 0) {
        const t = q % cycle;
        ob.absent = t > duree;
        q = ob.absent ? duree : t;
      }
    }
    ob.s = absciseA(ob.chemin, q);
    bouge = true;
  });
  if (bouge) dessinerObstacles();
}

/* Au lancement, on revient au-dessus de la voiture : après avoir cherché un
   lieu ou promené la carte, on ne sait plus où elle est. Le zoom est conservé. */
function centrerSurVoiture() {
  const g = deprojeter(seance.voiture.x, seance.voiture.y);
  centrer(g.lat, g.lon);
}

/* Puis la vue la suit — tant qu'on ne la déplace pas au doigt.

   La voiture n'est pas au centre de l'écran mais à SA GAUCHE : posée pile au
   milieu, elle n'a que la moitié de l'écran devant elle. Décalée, on voit venir
   ce sur quoi elle arrive.

   Le calcul passe par le repère d'avant rotation : la carte pivote autour du
   centre de la fenêtre, donc « à gauche de l'écran » n'est « à gauche » dans
   ce repère que si le nord est en haut. */
/* OÙ SE TIENT LA VOITURE À L'ÉCRAN. Elle ne se tient pas au milieu : ce qui
   intéresse, c'est ce qui arrive DEVANT elle. Un premier jet la décalait
   toujours vers la gauche — ce qui va bien quand le trajet part vers la droite,
   et très mal quand il monte : on voyait alors le chemin déjà parcouru.

   Elle se place donc À CONTRE-SENS de sa marche, d'un cinquième d'écran : vers
   la droite, elle se tient à gauche ; vers le haut, elle se tient en bas. Le
   décalage suit la rotation de la carte, puisqu'il se mesure à l'écran. */
const SUIVI_AVANT = 0.20;    // fraction d'écran gardée devant la voiture

/* LA VOITURE NE PASSE PAS SOUS LA TÉLÉCOMMANDE.

   Le suivi place la voiture en retrait de son propre cap, pour qu'on voie
   devant elle. Quand elle descend vers le bas de l'écran, ce retrait la pousse
   donc vers le BAS — c'est-à-dire dans le coin où vit la télécommande, et elle
   disparaissait dessous.

   On garde le retrait, mais on interdit la zone des boîtes : la voiture est
   remontée juste au-dessus de la plus haute d'entre elles. Le plafond est
   mesuré sur les boîtes réelles plutôt que deviné — elles changent de taille
   selon l'écran, et la télécommande remplaçant la boîte d'édition n'a pas la
   même hauteur qu'elle. */
const MARGE_SUIVI = 46;      // px : une demi-voiture au-dessus des boîtes
let plafondVu = 0, plafondQuand = 0;

function plafondDuSuivi() {
  const t = performance.now();
  if (t - plafondQuand < 250 && plafondVu) return plafondVu;
  plafondQuand = t;
  const p = els.plateau.getBoundingClientRect();
  let y = hauteur;
  [els.telecommande, els.marche, els.edition].forEach(function (b) {
    if (!b || b.hidden) return;
    const r = b.getBoundingClientRect();
    if (r.height > 0 && r.top - p.top < y) y = r.top - p.top;
  });
  plafondVu = Math.max(hauteur * 0.4, y - MARGE_SUIVI);
  return plafondVu;
}

function suivreVoiture() {
  if (!chemin) return;
  const e = surChemin(s);
  const a = vue.cap * Math.PI / 180;

  // le cap de la voiture tel qu'on le voit : celui du monde, tourné avec la carte
  const h = e.cap + a;
  let bx = -Math.cos(h) * largeur * SUIVI_AVANT;
  let by = -Math.sin(h) * hauteur * SUIVI_AVANT;

  /* Où la voiture tombera à l'écran, et où elle a le droit de tomber. */
  const py = hauteur / 2 + by;
  const plafond = plafondDuSuivi();
  if (py > plafond) by = plafond - hauteur / 2;
  else if (py < MARGE_SUIVI) by = MARGE_SUIVI - hauteur / 2;

  /* Le décalage est donné à l'écran ; il faut le ramener dans le repère du
     monde, qui est tourné de `vue.cap`. */
  vue.tx = largeur / 2 + (bx * Math.cos(a) + by * Math.sin(a)) - e.x * vue.k;
  vue.ty = hauteur / 2 + (-bx * Math.sin(a) + by * Math.cos(a)) - e.y * vue.k;
  cadrer();
}

function lancer(depuisDebut) {
  chemin = construireChemin();
  seance.obstacles.forEach(function (ob) { ob.chemin = cheminObstacle(ob); });
  if (!chemin && !seance.obstacles.some(o => o.chemin)) return;
  if (depuisDebut) {
    manuel.cligno = null; manuel.geste = null;
    s = 0; freine = false; arrive = false; attenteCam = null;
    arretsFranchis.clear(); attenteJusqu = 0;
    evenement = null; accident = null;
    fermerBilan();
    seance.obstacles.forEach(function (ob) { ob.s = 0; ob.horloge = 0; ob.absent = false; });
    calerEngagements();
    if (camembertsOrphelins)
      annoncer(camembertsOrphelins > 1
        ? camembertsOrphelins + ' camemberts sont à côté de la trajectoire : ils ne commandent rien.'
        : 'Le camembert est à côté de la trajectoire : il ne commande rien.');
    calerRencontres();
    lireLesRencontres();
    centrerSurVoiture();
  }
  etat = 'lecture'; dernierT = 0;
  dessinerCamemberts();             // les poignées de réglage s'effacent le temps de la lecture
  suivi = true;                     // Lecture comme Reprendre rendent la main au suivi
  if (!trame) trame = requestAnimationFrame(boucle);
  majCommandes();
}
/* Reprendre la lecture à un endroit précis n'a plus de bouton : on POUSSE la
   voiture au doigt, ce qui fait la même chose et se devine. Le double appui sur
   un point, qui rejouait depuis là, servait aussi de rival au pavé des
   vitesses — un même geste ne peut pas faire deux choses. */

/* Reprendre la lecture à un endroit précis n'a pas de bouton : on POUSSE la
   voiture au doigt, ce qui fait la même chose et se devine.

   IL N'Y A PLUS D'ENREGISTREMENT. Pendant des semaines, ⏺ filmait la
   démonstration — vingt images par seconde, chacune portant la position de la
   voiture et l'état de ses feux. Depuis que les gestes se posent sur la carte,
   il n'y a plus rien à filmer : la scène PORTE la démonstration, et la scène se
   garde toute seule. Un cours est une scène, une explication aussi.

   Sont partis avec : le bouton ⏺, le rejeu image par image, la compression en
   colonnes de nombres, le lexique de gestes embarqué, et les modèles rangés
   sous leur propre clé. Plus de trois cents lignes, et surtout un concept de
   moins à expliquer. */

function retoucher() {
  if (etat === 'arret') { arreter(); redessiner(); return; }
  const avant = chemin ? chemin.total : 0;
  const part = avant > 1e-9 ? s / avant : 0;
  chemin = construireChemin();
  seance.obstacles.forEach(function (ob) { ob.chemin = cheminObstacle(ob); });
  if (chemin) s = Math.max(0, Math.min(chemin.total, part * chemin.total));
  else s = 0;
  calerEngagements();
  calerRencontres();
  lireLesRencontres();
  placerVoiture();
  redessiner();
}

function suspendre() {
  etat = 'pause';
  if (trame) { cancelAnimationFrame(trame); trame = 0; }
  majCommandes();
}
function arreter() {
  if (trame) { cancelAnimationFrame(trame); trame = 0; }
  manuel.cligno = null; manuel.geste = null; glissade = null;
  etat = 'arret'; s = 0; freine = false; arrive = false; attenteCam = null;
  arretsFranchis.clear(); attenteJusqu = 0;
  evenement = null; accident = null;
  seance.obstacles.forEach(function (ob) { ob.s = 0; ob.horloge = 0; ob.absent = false; });
}

/* =================================================================
   Interface
   ================================================================= */
