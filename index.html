/* Y a-t-il quelque chose à faire rouler ? La trajectoire de l'élève, ou celle
   d'un véhicule — montrer la circulation d'un giratoire avant même d'avoir posé
   la voiture auto-école est un usage légitime. */
function quelqueChoseARouler() {
  return (!seance.voiture.absente && mesPoints().length > 0)
      || seance.obstacles.some(o => (o.points || []).length > 0);
}

function majCommandes() {
  /* On passe ici à chaque changement d'état : c'est donc l'endroit où l'on
     s'aperçoit que ça vient de partir, ou de s'arrêter. */
  if (traceDessineeEnMarche !== enMarche()) { dessinerTrace(); dessinerPoints(); }
  const jouable = quelqueChoseARouler();
  els.btnLecture.disabled = !jouable;
  els.btnAnnuler.disabled = !dernierPose() && !journal.length;

  /* La course est finie — arrivé, accroché, ou parti en glissade : c'est le
     moment de dire ce que ça valait. Une seule fois : `bilan` sert de témoin. */
  if (vueEleve && attendu && !bilan && (etat === 'fin' || arrive)) montrerBilan();

  /* LE MENU NE PARAÎT QUE QUAND IL A QUELQUE CHOSE À DIRE. Un bouton qui ouvre
     sur du vide est une promesse en l'air — et il en restait un cas : une
     explication sans tracé, où le volet n'avait plus rien à proposer depuis que
     la disquette enregistre seule. « Fais-le disparaître quand il sert à rien
     et apparaître quand il est utile. »

     Utile veut dire : un cours ou un exercice est ouvert (l'envoyer, le
     renommer, le refermer), ou il y a un tracé (passer l'exercice), ou l'on est
     en essai (revenir au modèle). */
  const menuUtile = !modeEleve && (!!coursCourant || !!chemin || vueEleve);
  els.btnAction.hidden = !menuUtile;
  if (!menuUtile) ouvrirActions(false);
  els.btnArret.disabled = etat === 'arret';

  /* La télécommande remplace la palette pendant l'animation : à l'arrêt on
     prépare le tracé, en lecture on montre. Deux choses à ne pas mélanger, et
     un téléphone n'a pas la place de porter les deux. */
  const anime = etat === 'lecture' || etat === 'pause' || etat === 'fin';
  const aLaMain = anime;
  els.poste.hidden = !encart;
  /* Construire ou montrer : jamais les deux à la fois, et toujours au même
     coin — le pouce gauche n'a qu'un endroit à connaître. */
  els.edition.hidden = anime;
  els.telecommande.hidden = !aLaMain;
  majTelecommande();

  /* Pas d'icône Pause : on ne met pas en pause, on relâche — le triangle reste
     le même, et c'est la couleur du bouton qui dit si ça roule. */
  els.icoLecture.firstElementChild.setAttribute('d', 'M7 4.2 21 13 7 21.8Z');
  const lib = etat === 'lecture' ? 'Avance — relâcher pour arrêter'
                                 : 'Maintenir pour faire avancer';
  els.btnLecture.title = lib;
  els.btnLecture.setAttribute('aria-label', lib);

  document.querySelectorAll('.pastel[data-type]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.type === outil));
  });
  majGroupes();
  majIndication();
}

/* Le clignotant est un GESTE, pas un état. L'afficher tout du long ne dit pas
   quoi faire : ce qui s'enseigne, c'est le moment où on le met et le moment où
   on le coupe. Le bandeau montre donc ces deux instants, et se tait entre les
   deux — la voiture, elle, continue de clignoter à l'écran. */

let evenement = null;                  // { texte, couleur, jusqu, peremption }
function signaler(texte, couleur) {
  evenement = { texte: texte, couleur: couleur, jusqu: 0,
                peremption: performance.now() + 4500 };
}

/* Un geste attend son tour : le bandeau ne dit qu'une chose à la fois, et un
   contrôle passe avant — c'est la même contrainte que la tête du conducteur,
   qui ne peut regarder qu'un endroit à la fois. Son compte à rebours ne part
   qu'une fois affiché ; passé quelques secondes il est périmé, parce qu'un
   geste montré trop tard trompe plus qu'il n'apprend. */
function evenementVisible() {
  if (!evenement) return null;
  const t = performance.now();
  if (!evenement.jusqu && t < evenement.peremption) evenement.jusqu = t + 1500;
  if (t > Math.min(evenement.jusqu || Infinity, evenement.peremption)) { evenement = null; return null; }
  return evenement;
}


/* Les touches. Le clignotant est un INTERRUPTEUR — on l'allume, on le coupe,
   comme la manette — et le même côté appuyé deux fois le coupe. Un contrôle,
   lui, est un geste : il se joue, puis la tête revient. */
function surLeTrace() { return !!chemin && etat !== 'arret'; }

function poserCligno(cote) {
  manuel.cligno = manuel.cligno === cote ? null : cote;
  const allume = !!manuel.cligno;
  if (surLeTrace()) {
    mesGestes().push({ s: s, quoi: 'cligno', cote: cote,
                       on: allume, ordre: ++compteurPose });
    rangerGestes();
  }
  signaler(allume ? 'Clignotant ' + cote : 'Clignotant coupé',
           allume ? '#ffab1a' : '#8e9aa6');
  placerVoiture(); majTelecommande(); majIndication(); animerPoste(); dessinerGestes();
}

function poserGeste(quoi, cote) {
  manuel.geste = { quoi: quoi, cote: cote || null,
                   jusqu: performance.now() + GESTE_TENU };
  if (surLeTrace()) {
    mesGestes().push({ s: s, quoi: quoi, cote: cote || null,
                       ordre: ++compteurPose });
    rangerGestes();
  }
  placerVoiture(); majTelecommande(); majIndication(); animerPoste(); dessinerGestes();
}

/* En pause, la boucle d'animation ne tourne plus : un contrôle déclenché à
   l'arrêt ne ferait pas bouger la tête d'un pixel, puisque c'est elle qui
   lisse le mouvement d'une trame à l'autre. On relance donc quelques trames,
   le temps du geste ET du retour au centre. */
let trameGeste = 0;
function animerPoste() {
  if (etat === 'lecture' || trameGeste) return;
  const pas = function () {
    trameGeste = 0;
    if (etat === 'lecture') return;          // la lecture a repris, elle s'en charge
    placerVoiture(); majTelecommande(); majIndication();
    const g = manuel.geste;
    const bouge = (g && performance.now() < g.jusqu)
               || Math.abs(capTete) > 0.4 || Math.abs(capYeux) > 0.4 || capLeve > 0.015;
    if (bouge) trameGeste = requestAnimationFrame(pas);
  };
  trameGeste = requestAnimationFrame(pas);
}

function majTelecommande() {
  if (!els.telecommande) return;
  const cl = clignotantA(s);
  els.clignoG.setAttribute('aria-pressed', String(cl === 'gauche'));
  els.clignoD.setAttribute('aria-pressed', String(cl === 'droite'));
  const g = controleA(s);
  els.telecommande.querySelectorAll('[data-geste]').forEach(function (b) {
    b.classList.toggle('actif', !!g && b.dataset.geste === g.quoi
                                && (b.dataset.cote || null) === (g.cote || null));
  });
}

let annonceTexte = '', annonceJusqu = 0;
function annoncer(t) {
  annonceTexte = t;
  annonceJusqu = performance.now() + 3200;
  majIndication();
  setTimeout(majIndication, 3300);
}

function majIndication() {
  /* Le bandeau ne s'affiche que s'il a quelque chose à dire : pendant la
     lecture, ou pour un message bref. Au repos il disparaît — la carte n'a pas
     à porter un mode d'emploi en permanence. */
  const annonce = performance.now() < annonceJusqu;
  const utile = annonce || accident
             || (chemin && (etat === 'lecture' || etat === 'pause'));
  els.etat.hidden = !utile;
  if (!utile) return;

  let texte, couleur = 'var(--bordure)';
  /* L'accident passe avant tout : plus rien d'autre n'a d'importance une fois
     que la voiture est dedans. */
  if (accident) { texte = 'Accident — ' + accident.quoi; couleur = '#ff2f2f'; }
  else if (performance.now() < annonceJusqu) { texte = annonceTexte; }
  else if (etat === 'lecture' || etat === 'pause') {
    const e = surChemin(s);
    const ctl = controleA(s);
    const ev = ctl ? null : evenementVisible();   // le compte à rebours ne part qu'à l'affichage
    if (ctl) {
      texte = ctl.quoi + (ctl.cote ? ' ' + ctl.cote : '')
            + (ctl.cause ? ' — ' + ctl.cause : '');
      couleur = COULEUR_GESTE[ctl.quoi] || '#4aa3ff';
    }
    else if (ev) { texte = ev.texte; couleur = ev.couleur; }
    else if (attenteJusqu) {
      /* Le bandeau disait « Arrêt — regard à droite », puis « à gauche » : la
         dernière trace des regards que l'application faisait toute seule. Il
         compte maintenant les secondes, et c'est au moniteur de dire où l'on
         regarde — il a deux touches pour ça. */
      const reste = Math.max(0, attenteJusqu - performance.now()) / 1000;
      texte = 'Arrêt marqué — ' + reste.toFixed(1) + ' s';
      couleur = '#d21f1f';
    }
    else if (attenteCam) { texte = 'Camembert occupé — on attend'; couleur = '#d21f1f'; }
    else if (arrive) { texte = 'Arrivée — la circulation continue'; couleur = '#8b97a4'; }
    else if (freine) { texte = 'Freinage — feux stop allumés'; couleur = '#ff2f2f'; }
    else {
      /* LE COMPTEUR. « Allure ralentie » nommait un des trois types de
         trajectoire, qui n'existent plus : il ne restait qu'à afficher ce que
         la voiture fait vraiment. On arrondit à 5 km/h — au km près, le nombre
         danserait à chaque image sans rien apprendre à personne. */
      const kmh = Math.round(e.v * mParU * 3.6 / 5) * 5;
      texte = kmh + ' km/h';
      couleur = couleurAllure(e.v * mParU * 3.6);
    }
    if (etat === 'pause') texte += ' — en pause';
  } else {
    texte = annonceTexte;
  }
  els.indication.textContent = texte;
  els.pastille.style.background = couleur;
}

function redessiner() {
  if (redessinPrevu) return;
  redessinPrevu = true;
  requestAnimationFrame(function () {
    redessinPrevu = false;
    majEchelle();
    chemin = construireChemin();
    seance.obstacles.forEach(function (ob) {
      ob.chemin = cheminObstacle(ob);
    });
    // un tracé raccourci sous la voiture ne doit pas la laisser au-delà du bout
    if (chemin && s > chemin.total) s = chemin.total;
    garderCourante();           // le filet : on ne perd pas un montage sur un verrouillage
    dessinerVoiture();
    dessinerTrace();
    dessinerPoints();
    dessinerObstacles();
    dessinerPanneaux();
    dessinerGestes();
    dessinerDrapeau();
    majCommandes();
  });
}

/* =================================================================
   Garder une séance
   =================================================================
   Un carrefour bien monté — le tracé, les véhicules, les panneaux, le
   camembert — se remonte à l'identique la semaine suivante, pour un autre
   élève. Le refaire à chaque fois, c'est exactement le temps que
   l'application est censée faire gagner.

   Tout tient déjà dans un seul objet, `seance`. On l'écrit donc tel quel dans
   le stockage du navigateur, avec le cadrage : une séance rouvre là où on
   l'avait laissée, au même zoom et dans le même sens.

   « Planche » est déjà pris par les fiches PDF du dossier `planches/` : ici
   c'est une SÉANCE.

   Deux choses ne sont PAS gardées, et c'est voulu :
   - les **réglages** (qui commande les gestes, serrer à droite, suivre la
     route) : ils appartiennent au moniteur, pas à la séance ;
   - l'**enregistrement** de la démonstration : une démonstration de dix
     minutes pèse plus que tout le reste réuni, et se refait en direct. */
const CLE_SEANCES = 'pedago.seances.v1';
const CLE_COURANTE = 'pedago.courante.v1';

/* Le stockage peut être refusé — navigation privée, quota plein. Rien de tout
   cela ne doit faire tomber l'application : au pire, on ne garde pas. */
function lire(cle) {
  try { const t = localStorage.getItem(cle); return t ? JSON.parse(t) : null; }
  catch (e) { return null; }
}
function ecrire(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); return true; }
  catch (e) { return false; }
}

const copiePoint = p => ({ x:p.x, y:p.y, v:p.v == null ? null : p.v,
                           auto: p.auto ? 1 : 0, ordre: p.ordre || 0 });

function etatSeance() {
  const c = centreMonde(), g = deprojeter(c.x, c.y);
  return {
    v: 1,
    vue: { lat: g.lat, lon: g.lon, k: vue.k, cap: vue.cap },
    capRepos: capRepos,
    voiture: { x: seance.voiture.x, y: seance.voiture.y,
               absente: !!seance.voiture.absente, repris: !!seance.voiture.repris },
    points: seance.points.map(copiePoint),
    /* Surtout pas l'objet tel quel : un véhicule porte son `chemin` calculé,
       qui pèse des milliers de points et se refait tout seul. */
    obstacles: seance.obstacles.map(function (o) {
      return { x:o.x, y:o.y, cap:o.cap, t:o.t, couleur:o.couleur, ordre:o.ordre || 0,
               points: (o.points || []).map(copiePoint) };
    }),
    camemberts: seance.camemberts.map(function (m) {
      return { x:m.x, y:m.y, a1:m.a1, a2:m.a2, R:m.R, ordre:m.ordre || 0 };
    }),
    /* Les gestes tiennent en quelques nombres : une abscisse le long du tracé,
       ce qu'on a fait, de quel côté. Trente secondes de démonstration filmée
       pesaient treize kilo-octets ; six gestes en pèsent deux cents. */
    gestes: seance.gestes.map(function (g) {
      return { s:g.s, quoi:g.quoi, cote:g.cote || null,
               on: g.on === undefined ? undefined : !!g.on, ordre:g.ordre || 0 };
    }),
    panneaux: seance.panneaux.map(function (q) {
      return { x:q.x, y:q.y, t:q.t, cap:q.cap == null ? null : q.cap,
               deOSM: q.deOSM || null, repris: !!q.repris, ordre: q.ordre || 0 };
    })
  };
}

function chargerSeance(d) {
  if (!d || d.v !== 1) return false;
  arreter();

  seance.voiture.x = d.voiture.x; seance.voiture.y = d.voiture.y;
  seance.voiture.absente = !!d.voiture.absente;
  seance.voiture.repris = !!d.voiture.repris;
  capRepos = d.capRepos || 0;

  const vrai = p => ({ x:p.x, y:p.y, v:p.v == null ? null : p.v,
                       auto: !!p.auto, ordre: p.ordre || 0 });
  seance.points = (d.points || []).map(vrai);
  essai.points = []; essai.gestes = [];   // on ne garde pas l'essai d'un autre exercice
  viderJournal();                  // et on ne défait pas les gestes d'une autre scène
  seance.obstacles = (d.obstacles || []).map(function (o) {
    return { x:o.x, y:o.y, cap:o.cap || 0, t:o.t, couleur:o.couleur,
             ordre:o.ordre || 0, points:(o.points || []).map(vrai), s:0, horloge:0 };
  });
  seance.camemberts = (d.camemberts || []).map(m => Object.assign({}, m));
  seance.gestes = (d.gestes || []).map(g => Object.assign({}, g));
  seance.panneaux = (d.panneaux || []).map(q => Object.assign({}, q));

  /* Le compteur d'ordre doit repartir AU-DESSUS de ce qui est chargé, sinon le
     prochain objet posé partagerait son numéro avec un ancien et ↶ reprendrait
     les deux. */
  let haut = 0;
  const voir = l => (l || []).forEach(o => { if ((o.ordre || 0) > haut) haut = o.ordre; });
  voir(seance.points); voir(seance.obstacles); voir(seance.camemberts);
  voir(seance.panneaux); voir(seance.gestes);
  seance.obstacles.forEach(o => voir(o.points));
  compteurPose = haut;

  // les panneaux repris au relevé doivent rester repris, sinon ils reviennent en double
  reprisOSM.clear();
  seance.panneaux.forEach(q => { if (q.deOSM) reprisOSM.add(q.deOSM); });

  obstacleActif = -1;
  if (d.vue) {
    vue.k = d.vue.k; vue.cap = d.vue.cap || 0;
    centrer(d.vue.lat, d.vue.lon);
  }
  majEchelle(); redessiner(); majCommandes();
  return true;
}

/* La séance en cours est gardée toute seule, un peu après chaque changement :
   un téléphone qui se verrouille, une page rechargée, et tout le montage
   serait perdu. Ce n'est pas une sauvegarde nommée — c'est un filet. */
let minuterieCourante = 0;
function garderCourante() {
  /* L'élève n'écrit rien chez le moniteur. Sur un même téléphone — c'est le
     cas de l'essai — le lien ouvrirait sinon l'exercice PAR-DESSUS la carte
     que le moniteur avait laissée. */
  if (modeEleve) return;
  clearTimeout(minuterieCourante);
  minuterieCourante = setTimeout(function () {
    const etat = etatSeance();
    ecrire(CLE_COURANTE, etat);
  }, 1200);
}

function listeSeances() { return lire(CLE_SEANCES) || []; }

/* =================================================================
   Les cours enregistrés
   =================================================================
   Une démonstration ne vivait qu'en mémoire : un rechargement, et elle était
   perdue - « y a aucun moyen de le récupérer ». Elle est maintenant gardée
   dès qu'on appuie sur ⏹, sans rien demander : on vient de la jouer, on ne va
   pas la refaire pour le plaisir de la nommer.

   Un cours, c'est la SCÈNE et la DÉMONSTRATION ensemble. L'une sans l'autre ne
   veut rien dire : des clignotants sans le tracé sur lequel ils ont été mis ne
   se rejouent pas.

   Les images sont rangées en COLONNES DE NOMBRES plutôt qu'en objets. Vingt
   images par seconde pendant cinq minutes font six mille objets ; les mêmes
   valeurs en tableaux parallèles tiennent dans le dixième de la place, et le
   stockage d'un navigateur n'est pas sans fond. */
const CLE_COURS = 'pedago.cours.v1';
function listeCours() { return lire(CLE_COURS) || []; }

/* =================================================================
   La bibliothèque du moniteur : des objectifs, et sous chacun ses cours
   =================================================================
   Un cours n'est plus une ligne dans une liste à plat. Il appartient à un
   OBJECTIF — « franchissement des intersections » — parce que c'est comme ça
   qu'un moniteur prépare : un objectif, et deux ou trois façons de l'aborder.
   Les neuf de départ sont ceux du moniteur, pas ceux d'un référentiel ; ils se
   renomment, se réordonnent, s'ajoutent.

   TOUT TIENT DANS L'INDEX. Du temps où une démonstration était un film, elle
   pesait des centaines de kilo-octets et dormait sous sa propre clé pour ne pas
   alourdir la liste. Les gestes posés pèsent quelques centaines d'octets : ils
   voyagent avec la scène, et il n'y a plus qu'un seul objet à lire.

   Les deux anciennes listes ne sont pas jetées : elles sont recopiées une fois,
   et laissées où elles sont. Si quelque chose tourne mal ici, rien n'est perdu. */
const CLE_BIBLIO = 'pedago.biblio.v1';
const OBJECTIFS_DEPART = [
  'Choix et changement de voie', 'Panneaux de direction',
  'Insertion sur autoroute', 'Sortie d’autoroute', 'Dépassement sur autoroute',
  'Détection des intersections', 'Franchissement des intersections',
  'Croisements difficiles', 'Giratoires et ronds-points'
];

let compteurId = 0;
function neufId(p) {
  compteurId++;
  return p + Date.now().toString(36) + '-' + compteurId.toString(36);
}
function maintenant() {
  return new Date().toLocaleString('fr-FR', { day:'2-digit', month:'2-digit',
    year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function migrerBiblio() {
  const b = { v: 1,
              objectifs: OBJECTIFS_DEPART.map(n => ({ id: neufId('o'), nom: n })),
              cours: [] };
  /* Les anciens cours avaient une démonstration filmée : on ne garde que leur
     scène. Le moniteur a tranché — « les anciens modèles, on s'en fout ». */
  listeCours().forEach(function (e) {
    b.cours.push({ id: neufId('c'), nom: e.nom, obj: null,
                   quand: e.quand, scene: e.scene });
  });
  listeSeances().forEach(function (e) {
    b.cours.push({ id: neufId('c'), nom: e.nom, obj: null,
                   quand: e.quand, scene: e.donnees });
  });
  return b;
}

/* Les démonstrations filmées dormaient chacune sous sa propre clé, et elles
   pesaient. Plus personne ne les lit : on rend la place, une fois. Un téléphone
   n'a pas un stockage sans fond, et quelques cours de dix minutes suffisaient à
   le remplir. */
(function rendreLaPlace() {
  try {
    const aJeter = [];
    for (let i = 0; i < localStorage.length; i++) {
      const c = localStorage.key(i);
      if (c && c.indexOf('pedago.modele.') === 0) aJeter.push(c);
    }
    aJeter.forEach(c => localStorage.removeItem(c));
  } catch (e) {}
})();

/* Un exercice vit à côté des cours, sous le même objectif — pas dans le cours.
   « Dans chaque chapitre, un sous-chapitre cours et un sous-chapitre
   exercice. » Il garde le lien vers celui dont il est tiré : on corrige le
   cours, l'exercice suit. */
/* ON N'ÉCRASE JAMAIS UNE BIBLIOTHÈQUE QU'ON N'A PAS SU LIRE.

   La migration se déclenchait dès que la lecture échouait — donc aussi sur un
   texte présent mais illisible (écriture interrompue, quota atteint au mauvais
   moment). Elle écrivait alors une bibliothèque neuve PAR-DESSUS, et le travail
   d'un mois partait sans un mot. Le cas est rare ; la perte, non.

   S'il y a quelque chose et qu'on ne sait pas le lire, on le met de côté sous
   son propre nom avant de repartir à zéro. Rien ne le relit encore — mais rien
   ne l'efface non plus, et ça se répare à la main. */
function lireBiblio() {
  let b = lire(CLE_BIBLIO);
  if (!b || b.v !== 1) {
    let brut = null;
    try { brut = localStorage.getItem(CLE_BIBLIO); } catch (e) {}
    if (brut) {
      try { localStorage.setItem(CLE_BIBLIO + '.illisible', brut); } catch (e) {}
      annoncer('Bibliothèque illisible — elle est mise de côté, pas effacée.');
    }
    b = migrerBiblio();
    ecrire(CLE_BIBLIO, b);
  }
  return b;
}
function ecrireBiblio(b) {
  if (ecrire(CLE_BIBLIO, b)) return true;
  annoncer('Mémoire pleine : le rangement n’a pas pu être gardé.');
  return false;
}

/* Le cours ouvert. Tant qu'il est là, ⏺⏹ enregistre SON modèle et la disquette
   remplace SA scène. Sinon on est sur une explication : elle se joue, elle
   s'envoie, mais elle ne se range nulle part. */
let coursCourant = null;
const CLE_OUVERT = 'pedago.ouvert.v1';

/* Il survit au rechargement. Sans ça, un téléphone qui se verrouille pendant
   qu'on monte une scène suffirait pour que le ⏹ suivant range la démonstration
   dans un cours tout neuf, à côté de celui qu'on était en train de construire. */
function poserCoursOuvert(id) {
  coursCourant = id;
  ecrire(CLE_OUVERT, id);
}

/* RIEN NE SE RANGE TOUT SEUL. La carte est un brouillon : on pose, on joue, on
   efface, on recommence. Ce qu'on garde et ce qu'on y met, c'est lui qui le
   dit, à la disquette — « si je veux enregistrer en tant que cours ou en tant
   qu'exercice c'est moi qui décide, avec ou sans les carrés, avec ou sans les
   points ».

   `pedago.courante.v1` continue d'exister, mais ce n'est pas une sauvegarde :
   c'est le filet qui rend la carte telle qu'on l'a laissée après un
   verrouillage de téléphone. */

function coursPar(b, id) { return id ? (b.cours.find(c => c.id === id) || null) : null; }

/* ---------- le bandeau ----------
   Il ne demande rien, il dit. Sur quoi on travaille, et ce qu'il advient de ce
   qu'on fait : en explication rien ne se range, en cours tout se range tout
   seul. C'est la seule phrase qui évite d'envoyer le mauvais truc. */
function majBandeau() {
  const e = coursPar(lireBiblio(), coursCourant);
  els.btnAction.classList.toggle('cours', !!e);
  /* Le nom ne s'écrit plus sur la carte : il tient toute la rangée. Il est dans
     le volet, en entier, à un appui — et ici pour qui lit l'écran à voix haute. */
  els.btnAction.title = e ? 'Menu — cours ouvert : ' + e.nom : 'Menu — explication';
  els.btnAction.setAttribute('aria-label', els.btnAction.title);
}

/* CE QU'ON PEUT EN FAIRE. Le volet ne propose que des PASSAGES — d'un genre à
   l'autre — parce que c'est justement ce que « gardé tout seul » ne sait pas
   faire. Modifier, lui, n'a besoin de rien : on ouvre et on change. */
function ligneAction(titre, sous, faire) {
  const b0 = document.createElement('button');
  b0.type = 'button'; b0.className = 'rangee';
  b0.innerHTML = '<span style="display:grid;gap:2px;min-width:0">'
    + '<span class="t"></span><span class="s" style="font-size:10.5px;font-weight:600;color:var(--craie-3)"></span></span>';
  b0.querySelector('.t').textContent = titre;
  b0.querySelector('.s').textContent = sous;
  if (faire) b0.addEventListener('click', function (ev) { ev.stopPropagation(); faire(); });
  else { b0.disabled = true; b0.style.opacity = '.5'; }
  return b0;
}

function ouvrirActions(ouvert) {
  if (ouvert) ouvrirFeuilleGarder(false);
  els.actions.hidden = !ouvert;
  els.btnAction.setAttribute('aria-expanded', String(ouvert));
  if (!ouvert) return;
  const b = lireBiblio();
  const e = coursPar(b, coursCourant);
  els.actions.textContent = '';

  const tete = document.createElement('div');
  tete.className = 'tete';
  tete.textContent = vueEleve ? 'Essai — comme l’élève'
    : (e ? (e.type === 'exercice' ? 'Exercice ouvert' : 'Cours ouvert') : 'Explication');
  els.actions.appendChild(tete);

  /* LE PASSAGE D'UN REGARD À L'AUTRE. C'est la même scène : on la regarde en
     moniteur — tout est là —, ou en élève — il ne reste que la situation. Et
     c'est la réponse à « comment je modifie un exercice ? » : on revient au
     modèle, on change, on réenregistre. */
  const basculer = function () {
    ouvrirActions(false);
    poserVueEleve(!vueEleve);
    annoncer(vueEleve
      ? 'À toi de tracer — le cours est caché. ▶ jouera TON tracé.'
      : 'Modèle visible — ton essai est gardé, tu peux y revenir.');
  };
  if (chemin || vueEleve) {
    els.actions.appendChild(ligneAction(vueEleve ? 'Revenir au modèle' : 'Passer l’exercice',
      vueEleve ? 'Retrouver le tracé du cours — ton essai est gardé'
               : 'Le cours se cache : à toi de tracer, comme lui', basculer));
  }
  const nom = document.createElement('div');
  nom.className = 'nomObjet';
  /* Le volet ne garde que ce qu'on ne peut pas faire ailleurs. En explication,
     il n'y a rien à faire de plus : il le dit, et il montre où appuyer. */
  nom.textContent = e ? e.nom : 'Rien n’est gardé — la disquette enregistre';
  els.actions.appendChild(nom);

  if (!e) return;

  /* ENVOYER EST UN VERBE. Un exercice n'a aucun contenu à lui : c'est cette
     scène, sans la réponse, plus des critères lus dans le cours au moment de
     l'envoi. En faire un objet obligeait à deux listes, deux noms et deux
     façons de créer — pour rien. */
  els.actions.appendChild(ligneAction('L’envoyer à un élève',
    'Un lien, sans le corrigé', function () {
      ouvrirActions(false);
      versLien(exerciceAEnvoyer(e)).then(function (code) {
        montrerEnvoi(e, location.origin + location.pathname + '#exo=' + code);
      }, function () {
        annoncer('Impossible de préparer le lien.');
      });
    }));
  els.actions.appendChild(ligneAction('Renommer, changer de chapitre',
    'Dans « Modifier »', function () {
      ouvrirActions(false);
      rangerOuvert = true;
      els.pcRanger.setAttribute('aria-pressed', 'true');
      els.pcRanger.lastChild.textContent = ' Terminé';
      ouvrirPageCours(true);
    }));
  els.actions.appendChild(ligneAction('Revenir à une explication',
    'Ce cours reste rangé, la carte ne l’alimente plus', function () {
      ouvrirActions(false);
      poserCoursOuvert(null); poserVueEleve(false); majBandeau();
      annoncer('Explication — rien n’est gardé, rien ne part.');
    }));
}

els.btnAction.addEventListener('click', function (ev) {
  ev.stopPropagation();
  ouvrirTiroir(false);
  ouvrirActions(els.actions.hidden);
});

/* ---------- les deux pages ---------- */
function ouvrirPageCours(ouvert) {
  if (ouvert) ouvrirActions(false);
  els.pageCours.hidden = !ouvert;
  els.voileCours.hidden = !ouvert;
  if (ouvert) majPageCours();
}
els.voileCours.addEventListener('click', function () { ouvrirPageCours(false); });

/* =================================================================
   La disquette : c'est lui qui décide
   =================================================================
   La carte est un brouillon. On y pose, on joue, on efface, on recommence — et
   rien ne se range tant qu'il ne l'a pas dit. Quand il le dit, il dit aussi
   QUOI : un cours ou un exercice, et ce qu'on emporte dedans.

   « Avec ou sans les carrés, avec ou sans les points » — parce qu'un exercice,
   ce n'est pas mécaniquement « le cours moins la réponse » : c'est lui qui
   choisit ce qu'il retire, donc ce qu'il demande. Retirer le tracé, c'est
   demander le trajet ; le garder et retirer les carrés, c'est ne demander que
   les gestes. */
let typeAGarder = 'cours';

/* ON GARDE TOUT, DES DEUX CÔTÉS. Il y avait cinq cases à cocher — le tracé, les
   gestes, les véhicules, les panneaux, les camemberts. Elles posaient une
   question qui n'avait pas lieu d'être : « y a pas besoin de la sélection, en
   gros dans un cours on enregistre le parcours, les tracés, les vitesses, les
   obstacles, les panneaux, les camemberts, et dans les exercices on enregistre
   tout mais rien n'est visible sauf la voiture auto-école et les obstacles ».

   Un exercice n'est donc pas une scène AMPUTÉE, c'est la MÊME scène REGARDÉE
   AUTREMENT. Et c'est heureux : la correction compare l'élève au modèle, donc
   le modèle doit partir avec. Une scène amputée n'aurait rien à quoi comparer.

   Ce qui reste à décider tient en un mot — cours ou exercice —, et ce mot ne
   dit plus ce qu'on emporte : il dit ce que l'élève verra. */
function sceneAGarder() { return etatSeance(); }

function ouvrirFeuilleGarder(ouvert) {
  els.feuilleGarder.hidden = !ouvert;
  els.btnGarder.setAttribute('aria-expanded', String(ouvert));
  if (!ouvert) return;
  ouvrirActions(false);
  const b = lireBiblio();
  const ouvertCours = coursPar(b, coursCourant);
  const f = els.feuilleGarder;
  f.textContent = '';

  const tete = document.createElement('div');
  tete.className = 'tete';
  tete.textContent = 'Enregistrer';
  f.appendChild(tete);

  /* Cours ou exercice : deux mots, et ce qu'ils veulent dire en dessous. */
  const deux = document.createElement('div');
  deux.className = 'deuxTypes';
  [['cours', 'Cours', 'À montrer en leçon'],
   ['exercice', 'Exercice', 'À envoyer à un élève']].forEach(function (x) {
    const b0 = document.createElement('button');
    b0.type = 'button'; b0.className = 'typeChoix';
    b0.setAttribute('aria-pressed', String(typeAGarder === x[0]));
    b0.innerHTML = '<b></b><i></i>';
    b0.querySelector('b').textContent = x[1];
    b0.querySelector('i').textContent = x[2];
    b0.addEventListener('click', function (ev) {
      ev.stopPropagation();
      typeAGarder = x[0];
      ouvrirFeuilleGarder(true);
    });
    deux.appendChild(b0);
  });
  f.appendChild(deux);

  const nom = document.createElement('input');
  nom.type = 'text'; nom.className = 'champ';
  nom.placeholder = typeAGarder === 'cours' ? 'Nom du cours' : 'Nom de l’exercice';
  nom.setAttribute('aria-label', nom.placeholder);
  if (ouvertCours) nom.value = ouvertCours.nom;
  f.appendChild(nom);
  f.appendChild(menuObjectifs(b, ouvertCours ? ouvertCours.obj : null));

  /* Une phrase à la place des cases : elle ne demande rien, elle dit ce qui
     va se passer. C'est la seule chose qu'on ait besoin de savoir ici. */
  const dit = document.createElement('p');
  dit.className = 'rubrique resume';
  dit.textContent = typeAGarder === 'cours'
    ? 'Tout est gardé : le tracé, les vitesses, les véhicules, les panneaux, les camemberts.'
    : 'Tout est gardé aussi — mais l’élève ne verra que la carte, la voiture au départ, le drapeau d’arrivée et les véhicules.';
  f.appendChild(dit);

  const sel = f.querySelector('select');
  const ok = document.createElement('button');
  ok.type = 'button'; ok.className = 'valider';
  ok.style.height = '52px';
  ok.textContent = ouvertCours ? 'Remplacer « ' + ouvertCours.nom + ' »' : 'Enregistrer';
  ok.addEventListener('click', function (ev) {
    ev.stopPropagation();
    garderAinsi(nom.value.trim(), sel.value || null, ouvertCours);
  });
  f.appendChild(ok);

  if (ouvertCours) {
    const neuf = document.createElement('button');
    neuf.type = 'button'; neuf.className = 'coche2';
    neuf.style.justifyContent = 'center';
    neuf.innerHTML = '<span style="font-weight:700">En faire un nouveau</span>';
    neuf.addEventListener('click', function (ev) {
      ev.stopPropagation();
      garderAinsi(nom.value.trim(), sel.value || null, null);
    });
    f.appendChild(neuf);
  }
  setTimeout(function () { nom.focus(); nom.select(); }, 0);
}

function garderAinsi(nom, obj, remplace) {
  const b = lireBiblio();
  const scene = sceneAGarder();
  let e = remplace ? b.cours.find(c => c.id === remplace.id) : null;
  if (e) {
    if (nom) e.nom = nom;
    e.obj = obj; e.type = typeAGarder; e.scene = scene; e.quand = maintenant();
  } else {
    const heure = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    e = { id: neufId('c'), nom: nom || ((typeAGarder === 'cours' ? 'Cours' : 'Exercice') + ' de ' + heure),
          obj: obj || null, type: typeAGarder, quand: maintenant(), scene: scene };
    b.cours.unshift(e);
  }
  if (!ecrireBiblio(b)) return;
  poserCoursOuvert(e.id);
  ouvrirFeuilleGarder(false);
  majBandeau(); majPageCours();
  const n = [];
  const compte = (k, un, plusieurs) => { if (k) n.push(k + ' ' + (k > 1 ? plusieurs : un)); };
  compte(scene.points.length, 'point', 'points');
  compte(scene.gestes.length, 'geste', 'gestes');
  compte(scene.obstacles.length, 'véhicule', 'véhicules');
  compte(scene.panneaux.length, 'panneau', 'panneaux');
  annoncer('« ' + e.nom + ' » enregistré' + (n.length ? ' — ' + n.join(', ') + '.' : '.')
    + (typeAGarder === 'exercice' ? ' L’élève n’en verra que la voiture, le drapeau et les véhicules.' : ''));
}

els.btnGarder.addEventListener('click', function (ev) {
  ev.stopPropagation(); ouvrirTiroir(false);
  ouvrirFeuilleGarder(els.feuilleGarder.hidden);
});

els.pcRetour.addEventListener('click', function () { ouvrirPageCours(false); });
els.btnBiblio.addEventListener('click', function (ev) {
  ev.stopPropagation(); ouvrirTiroir(false); ouvrirActions(false); ouvrirPageCours(true);
});

/* UN COURS SE CRÉE À LA DISQUETTE, ET NULLE PART AILLEURS.

   Il y avait trois portes vers la même pièce : la disquette, « En faire un
   cours » dans le menu, et le + de Mes cours. Les deux dernières ouvraient un
   petit formulaire qui enregistrait la scène sous un nom — c'est-à-dire la
   disquette, en moins bien : pas de choix entre cours et exercice, pas de
   phrase qui dit ce qui part.

   > « Ça sert à quoi ça ? Parce que maintenant on peut enregistrer
   > manuellement, donc… pourquoi faire ? »

   `nouveauCours`, `creerCours` et `blocCreation` sont partis avec elles.
   `garderAinsi`, à la disquette, est le seul endroit qui écrit un cours. */
/* =================================================================
   D'un cours, on tire des exercices
   =================================================================
   Un exercice, c'est LE COURS MOINS LA RÉPONSE. La scène reste — la carte, les
   véhicules et leurs trajets, les panneaux, les camemberts ; on retire ce que
   l'élève doit produire : la trajectoire, les vitesses, les gestes. Depuis que
   tout est posé en objets séparés, retirer la réponse est une soustraction.

   Le départ et l'arrivée ne se dessinent pas : ils sont déjà dans le cours. La
   voiture auto-école EST le départ, le dernier point du tracé EST l'arrivée.

   Et les critères ne s'inventent pas, ils se LISENT dans le modèle. Le moteur
   sait déjà juger : il cale les engagements, mesure l'allure d'approche sur les
   vingt-cinq derniers mètres, connaît son seuil, et voit les gestes posés.
   Corriger une copie, ce sera faire tourner le même moteur sur la trajectoire
   de l'élève et comparer deux verdicts.

   DEUX COUCHES, ET ELLES NE SE MÉLANGENT PAS :

   - le SOCLE, ce que dit le code — céder le passage, ne pas accrocher. Vrai
     partout, pour tout le monde, verrouillé.
   - LA MÉTHODE, ce que le moniteur exige — sous tant en arrivant, le clignotant
     tant de mètres avant. La sienne, modifiable, avec son nom dessus.

   L'élève doit voir laquelle des deux il vient de rater : sinon il croit que le
   code dit 20.

   ET ON NE JUGE PAS LA PRÉCISION, ON JUGE LA DÉCISION. Le moniteur l'a posé
   comme une règle, et elle gouverne toute la correction : « ce qui importe,
   c'est pas qu'il soit pile poil au bon endroit du point, c'est ce qu'il décide
   de faire ».

   Conséquences, et elles sont fermes :

   - aucun critère ne porte sur la FORME du tracé. Passer un mètre plus à
     gauche n'est pas une faute ; prendre le sens interdit en est une ;
   - un geste se juge à « l'a-t-il fait, et avant de décider », pas à trente-
     quatre mètres contre trente-six. La distance du modèle est une INDICATION
     qu'on affiche, pas une exigence qu'on impose ;
   - une allure se juge sur un seuil — dessous ou dessus — parce que c'est comme
     ça qu'un moniteur le dit : « ralentis en dessous de 30 » ;
   - l'arrivée se juge à deux longueurs de voiture près. On demande d'arriver,
     pas de se garer au centimètre.

   Donc : aucun score, aucun pourcentage. Chaque critère vaut oui ou non, et le
   bilan est une liste de décisions. */

/* Arriver, c'est arriver — pas viser une croix. Deux longueurs de voiture. */
const ARRIVEE_TOLERANCE = 2;

/* Les valeurs se disent rondes. « Ralentis en dessous de 30 », pas « de 26,4 » :
   un moniteur ne parle pas comme ça, et une consigne qu'on ne peut pas répéter
   de tête n'est pas une consigne. */
function rond5(x) { return Math.max(5, Math.round(x / 5) * 5); }

/* Un critère se lit à voix haute devant un élève : « rétro extérieur droite »
   n'est pas une phrase, c'est un identifiant. */
function nomDuGeste(g) {
  const c = g.cote || '';
  if (g.quoi === 'cligno') return 'Clignotant ' + c;
  if (g.quoi === 'angle mort') return 'Angle mort ' + c;
  if (g.quoi === 'rétro intérieur') return 'Rétroviseur intérieur';
  if (g.quoi === 'rétro extérieur')
    return 'Rétroviseur extérieur ' + (c === 'droite' ? 'droit' : c);
  if (g.quoi === 'regard') return 'Regard à ' + c;
  return g.quoi + (c ? ' ' + c : '');
}

function extraireCriteres() {
  const l = [];
  if (!chemin) return l;
  calerEngagements();

  l.push({ couche:'socle', quoi:'arrivee', tolerance: ARRIVEE_TOLERANCE,
           texte:'Arriver au point d’arrivée' });
  l.push({ couche:'socle', quoi:'accident',
           texte:'Sans accrochage' });

  engagements.forEach(function (e) {
    /* `tenu` dit si LE MODÈLE lui-même satisfait le critère. Un exercice dont
       la réponse est fausse n'est pas un exercice : mieux vaut le voir ici que
       devant l'élève. */
    l.push({ couche:'socle', quoi:'ceder', s:e.s, tenu:e.lente,
             texte:'Céder le passage avant de s’engager' });
    /* Le seuil du moteur, pas l'allure du modèle : si le moniteur est passé à
       12 alors que 20 suffisait, l'exercice ne doit pas exiger 12. */
    const kmh = rond5(e.seuil);
    l.push({ couche:'methode', quoi:'allure', s:e.s, kmh:kmh, tenu:e.kmh <= kmh,
             texte:'Ralentir sous ' + kmh + ' km/h en arrivant' });
  });

  /* Un geste se juge à SA DISTANCE de ce qu'il annonce. Le clignotant d'avant
     le carrefour n'a de valeur que mesuré depuis le carrefour ; posé dans le
     vide, il ne se compare à rien. */
  seance.gestes.forEach(function (g) {
    if (g.quoi === 'cligno' && g.on === false) return;    // l'extinction ne s'exige pas
    let ou = null, mini = Infinity;
    engagements.forEach(function (e) {
      const d = e.s - g.s;
      if (d >= 0 && d < mini) { mini = d; ou = e; }
    });
    const nom = nomDuGeste(g);
    if (!ou) {
      l.push({ couche:'methode', quoi:'geste', geste:g.quoi, cote:g.cote || null,
               s:g.s, texte:nom.trim() });
      return;
    }
    /* La distance du modèle est une INDICATION, pas un seuil : ce qui se juge,
       c'est que le geste vienne AVANT la décision. `mesure` s'affiche à côté du
       critère — « toi : 30 m » — et le moniteur peut en faire une exigence s'il
       le veut, mais l'application ne la lui impose pas. */
    l.push({ couche:'methode', quoi:'geste', geste:g.quoi, cote:g.cote || null,
             s:g.s, mesure:rond5(mini * mParU),
             texte:nom.trim() + ' avant le carrefour' });
  });
  return l;
}

/* =================================================================
   LE VERDICT
   =================================================================
   « J'ai testé la version élève, j'ai fait le tracé, j'ai pas mis mes cligno ni
   fait mes contrôles… et ça n'a rien dit. »

   Jusqu'ici l'essai se jouait dans le silence : la voiture partait, arrivait, et
   c'était tout. Un banc d'essai qui ne dit rien ne sert à rien.

   DEUX RELEVÉS, PAS UN. Ce qu'on attend se lit dans le MODÈLE, au moment où
   l'on passe en essai — après, `chemin` est le tracé de l'élève et le modèle
   n'est plus mesurable. Ce qui est fait se lit sur l'essai, à la fin de la
   course. Le verdict est la comparaison des deux.

   CE QUI SE COMPARE, ET COMMENT. Les engagements des deux tracés portent les
   MÊMES objets de scène — ce camembert-là, ce véhicule-là. C'est par eux qu'on
   les apparie, jamais par l'abscisse : deux tracés différents ne partagent
   aucune abscisse, et la règle de la maison est que l'on juge la décision, pas
   la géométrie.

   Un geste attendu est tenu si l'élève a fait LE MÊME (même nature, même côté)
   AVANT son propre engagement. Pas à trente-quatre mètres contre trente-six :
   avant, ou pas. */
let attendu = null;              // ce que le cours demande, relevé au départ
let bilan = null;                // ce que le dernier essai a donné

function cleEngagement(e) {
  if (e.cm) return 'cam:' + seance.camemberts.indexOf(e.cm);
  if (e.ob) return 'veh:' + seance.obstacles.indexOf(e.ob);
  return 'abs:' + Math.round(e.s);
}

function releverAttendu() {
  attendu = null;
  if (!chemin) return;
  calerEngagements();
  lireLesRencontres();
  const eng = engagements.map(function (e) {
    return { cle: cleEngagement(e), s: e.s, seuil: rond5(e.seuil),
             prio: !!e.prio };
  });
  const gestes = seance.gestes.filter(function (g) {
    return !(g.quoi === 'cligno' && g.on === false);   // l'extinction ne s'exige pas
  }).map(function (g) {
    /* L'engagement que ce geste annonce : le premier qui vient après lui. */
    let cle = null, mini = Infinity;
    eng.forEach(function (e) {
      const d = e.s - g.s;
      if (d >= 0 && d < mini) { mini = d; cle = e.cle; }
    });
    return { quoi: g.quoi, cote: g.cote || null, nom: nomDuGeste(g), avant: cle };
  });
  attendu = { arrivee: boutDuTrace(), engagements: eng, gestes: gestes };
}

function juger() {
  if (!attendu || !chemin) return null;
  const r = [];
  const fin = surChemin(chemin.total);

  /* L'arrivée se juge à deux longueurs de voiture : on demande d'arriver, pas
     de se garer au centimètre. */
  const d = attendu.arrivee
    ? Math.hypot(fin.x - attendu.arrivee.x, fin.y - attendu.arrivee.y) : null;
  r.push({ couche:'socle', texte:'Arriver au drapeau',
           ok: d != null && d <= ARRIVEE_TOLERANCE * LV,
           info: d == null ? '' : Math.round(d * mParU) + ' m' });

  r.push({ couche:'socle', texte:'Sans accrochage', ok: !accident,
           info: accident ? accident.quoi : '' });

  calerEngagements();
  lireLesRencontres();
  const siens = new Map();
  engagements.forEach(function (e) { siens.set(cleEngagement(e), e); });

  attendu.engagements.forEach(function (a) {
    const e = siens.get(a.cle);
    r.push({ couche:'socle', texte:'Céder le passage avant de s’engager',
             ok: !!(e && e.lente),
             info: e ? e.kmh + ' km/h' : 'pas passé par là' });
    r.push({ couche:'methode', texte:'Ralentir sous ' + a.seuil + ' km/h en arrivant',
             ok: !!(e && e.kmh <= a.seuil),
             info: e ? e.kmh + ' km/h' : '—' });
  });

  attendu.gestes.forEach(function (a) {
    const e = a.avant ? siens.get(a.avant) : null;
    const fait = essai.gestes.some(function (g) {
      if (g.quoi !== a.quoi || (g.cote || null) !== a.cote) return false;
      if (g.quoi === 'cligno' && g.on === false) return false;
      return !e || g.s <= e.s + LV;
    });
    r.push({ couche:'methode', texte: a.nom, ok: fait,
             info: fait ? '' : (e ? 'pas fait avant le carrefour' : 'pas fait') });
  });
  return r;
}

/* ---------- la feuille de verdict ---------- */
function fermerBilan() {
  bilan = null;
  if (els.bilan) els.bilan.hidden = true;
}

function montrerBilan() {
  bilan = juger();
  if (!bilan || !els.bilan) return;
  const f = els.bilan;
  f.textContent = '';
  const tenus = bilan.filter(c => c.ok).length;

  const tete = document.createElement('div');
  tete.className = 'tete';
  tete.textContent = 'Ce qui a été jugé';
  f.appendChild(tete);

  const score = document.createElement('div');
  score.className = 'nomObjet';
  score.textContent = tenus + ' sur ' + bilan.length
    + (tenus === bilan.length ? ' — rien à redire' : '');
  f.appendChild(score);

  [['socle', 'Le code'], ['methode', 'Ma méthode']].forEach(function (c) {
    const l = bilan.filter(x => x.couche === c[0]);
    if (!l.length) return;
    const p = document.createElement('p');
    p.className = 'rubrique';
    p.textContent = c[1];
    f.appendChild(p);
    l.forEach(function (x) {
      const d = document.createElement('div');
      d.className = 'critere' + (x.ok ? ' tenu' : '');
      d.innerHTML = '<span class="marque"></span><span class="quoi"></span>'
                  + '<span class="info"></span>';
      d.querySelector('.marque').textContent = x.ok ? '✓' : '✗';
      d.querySelector('.quoi').textContent = x.texte;
      /* LE CHIFFRE NE SE DIT QUE SUR LE CODE. « Sur ma méthode faut être un peu
         plus évasif pour que ça reste un exercice : les légers commentaires en
         gris sont trop explicites, le rouge et le vert suffisent. »

         C'est juste, et c'est la différence entre les deux couches. Le code est
         un constat — on est arrivé à tant de mètres, on a accroché — et un
         constat se chiffre. La méthode est ce qu'il y a à trouver : dire « pas
         fait avant le carrefour », c'est donner la réponse avec la question.
         Le relevé reste dans `bilan`, il n'est simplement pas écrit. */
      d.querySelector('.info').textContent =
        x.couche === 'socle' ? (x.info || '') : '';
      f.appendChild(d);
    });
  });

  /* Recommencer d'abord : c'est ce qu'on fait le plus souvent après un
     verdict, et c'est ce qui fait qu'un exercice en est un. */
  const encore = document.createElement('button');
  encore.type = 'button'; encore.className = 'valider';
  encore.textContent = 'Recommencer';
  encore.addEventListener('click', function (ev) {
    ev.stopPropagation(); fermerBilan(); toutEffacer();
  });
  f.appendChild(encore);
  const ok = document.createElement('button');
  ok.type = 'button'; ok.className = 'coche2';
  ok.style.justifyContent = 'center';
  ok.textContent = 'Fermer';
  ok.addEventListener('click', function (ev) { ev.stopPropagation(); fermerBilan(); });
  f.appendChild(ok);
  f.hidden = false;
}

/* =================================================================
   LA PARTIE ÉLÈVE
   =================================================================
   Une seule application, deux usages. Ouverte normalement, c'est celle du
   moniteur. Ouverte par un LIEN D'EXERCICE, c'est celle de l'élève : la carte,
   sa voiture au départ, les autres véhicules, le drapeau — et rien d'autre. Pas
   de disquette, pas de bibliothèque, pas de modèle à révéler.

   L'EXERCICE VOYAGE DANS LE LIEN. Pas de serveur, pas de compte : la scène
   est compressée et écrite après le `#` de l'adresse, là où un navigateur ne
   l'envoie jamais à personne. Le moniteur la passe par SMS ou WhatsApp, l'élève
   l'ouvre, c'est tout.

   ET LE CORRIGÉ NE PART PAS. Le lien porte la scène SANS le tracé ni les
   carrés du moniteur, plus ce qu'on attend — relevé sur le modèle au moment de
   l'envoi : l'arrivée, les engagements, les gestes. C'est tout ce qu'il faut
   pour juger, et un élève curieux qui décoderait le lien n'y trouverait pas la
   réponse. */
let exerciceRecu = null;
/* Tant que la consigne est à l'écran, la carte ne répond pas : « pourquoi
   l'élève peut mettre des points sur la carte alors qu'il n'a pas commencé
   l'exercice ? » Une consigne qu'on peut contourner n'est pas lue. */
let consigneOuverte = false;

/* Du texte à l'adresse, et retour. `deflate-raw` quand le navigateur le sait
   — c'est-à-dire presque partout aujourd'hui — sinon le texte tel quel. La
   première lettre dit lequel des deux. */
async function versLien(obj) {
  const texte = JSON.stringify(obj);
  let octets, prefixe;
  if (typeof CompressionStream === 'function') {
    const flux = new Blob([texte]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    octets = new Uint8Array(await new Response(flux).arrayBuffer());
    prefixe = 'z';
  } else {
    octets = new TextEncoder().encode(texte);
    prefixe = 'j';
  }
  let bin = '';
  for (let i = 0; i < octets.length; i++) bin += String.fromCharCode(octets[i]);
  return prefixe + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function depuisLien(code) {
  const prefixe = code.charAt(0);
  let b64 = code.slice(1).replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const octets = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) octets[i] = bin.charCodeAt(i);
  let texte;
  if (prefixe === 'z') {
    const flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    texte = await new Response(flux).text();
  } else texte = new TextDecoder().decode(octets);
  return JSON.parse(texte);
}

/* Ce qui part : la scène sans la réponse, et ce qu'on attend. L'attendu se
   relève sur le MODÈLE — si le moniteur est en essai à ce moment-là, on repasse
   un instant sur le cours pour le mesurer, puis on revient. */
function exerciceAEnvoyer(e) {
  const etait = vueEleve;
  vueEleve = false;
  chemin = construireChemin();
  releverAttendu();
  const a = attendu;
  vueEleve = etait;
  chemin = construireChemin();
  const sc = etatSeance();
  sc.points = [];
  sc.gestes = [];
  return { v: 1, nom: e ? e.nom : 'Exercice', scene: sc, attendu: a };
}

/* =================================================================
   LE QR CODE
   =================================================================
   « On peut pas mettre le QR code au lieu de copier le lien ? » — dans la
   voiture, c'est évidemment ça : le moniteur tend son téléphone, l'élève vise
   avec le sien, c'est ouvert. Pas de numéro à demander, pas de message à
   envoyer.

   FAIT ICI, ET PAS EMPRUNTÉ. L'application marche hors ligne, dans un seul
   fichier : une bibliothèque chargée d'un serveur tomberait précisément quand
   on n'a pas de réseau, c'est-à-dire en voiture. Le codage est donc écrit ici,
   en suivant la norme (ISO/IEC 18004) : mode octets, correction L — un écran
   ne se raye pas, et le niveau le plus bas donne les carrés les plus gros —,
   Reed-Solomon sur GF(256), les huit masques et leur pénalité.

   Vérifié sur les valeurs de la norme : le reste de « HELLO WORLD » en 1-M, les
   chaînes de format et de version, les positions des motifs d'alignement, les
   capacités. Le vrai test reste un téléphone qui le lit. */
const QR = (function () {
  // Codes de correction par bloc, et nombre de blocs, niveau L, versions 1 à 40.
  const CORR = [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,
                26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30];
  const BLOCS = [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,
                 17,18,19,19,20,21,22,24,25];

  function modulesBruts(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) {
      const n = Math.floor(v / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (v >= 7) r -= 36;
    }
    return r;
  }
  function motsDeDonnees(v) { return Math.floor(modulesBruts(v) / 8) - CORR[v] * BLOCS[v]; }

  const EXP = new Array(512), LOG = new Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1; if (x & 0x100) x ^= 0x11D;
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function generateur(deg) {
    let g = [1];
    for (let i = 0; i < deg; i++) {
      const n = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { n[j] ^= g[j]; n[j + 1] ^= mul(g[j], EXP[i]); }
      g = n;
    }
    return g;
  }
  function reste(donnees, gen) {
    const deg = gen.length - 1, r = new Array(deg).fill(0);
    donnees.forEach(function (b) {
      const f = b ^ r[0];
      r.shift(); r.push(0);
      for (let i = 0; i < deg; i++) r[i] ^= mul(gen[i + 1], f);
    });
    return r;
  }

  function alignements(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, taille = v * 4 + 17;
    const pas = (v === 32) ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const r = [6];
    for (let p = taille - 7; r.length < n; p -= pas) r.splice(1, 0, p);
    return r;
  }

  function bitsFormat(masque) {
    const d = (1 << 3) | masque;             // niveau L = 01
    let r = d;
    for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    return ((d << 10) | r) ^ 0x5412;
  }
  function bitsVersion(v) {
    let r = v;
    for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
    return (v << 12) | r;
  }

  function mots(texte) {
    const o = Array.from(new TextEncoder().encode(texte));
    let v = 1;
    for (; v <= 40; v++)
      if (4 + (v < 10 ? 8 : 16) + 8 * o.length <= motsDeDonnees(v) * 8) break;
    if (v > 40) return null;
    const bb = [];
    const mettre = function (val, n) { for (let i = n - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    mettre(4, 4); mettre(o.length, v < 10 ? 8 : 16);
    o.forEach(function (b) { mettre(b, 8); });
    const cap = motsDeDonnees(v) * 8;
    mettre(0, Math.min(4, cap - bb.length));
    while (bb.length % 8) bb.push(0);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) mettre(p, 8);
    const d = [];
    for (let i = 0; i < bb.length; i += 8) {
      let x = 0;
      for (let j = 0; j < 8; j++) x = (x << 1) | bb[i + j];
      d.push(x);
    }
    const nb = BLOCS[v], lc = CORR[v], brut = Math.floor(modulesBruts(v) / 8);
    const courts = nb - brut % nb, lgCourt = Math.floor(brut / nb), gen = generateur(lc);
    const blocs = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const lg = lgCourt - lc + (i < courts ? 0 : 1);
      const part = d.slice(k, k + lg); k += lg;
      blocs.push({ d: part, e: reste(part, gen) });
    }
    const sortie = [];
    const maxi = Math.max.apply(null, blocs.map(function (b) { return b.d.length; }));
    for (let i = 0; i < maxi; i++) blocs.forEach(function (b) { if (i < b.d.length) sortie.push(b.d[i]); });
    for (let i = 0; i < lc; i++) blocs.forEach(function (b) { sortie.push(b.e[i]); });
    return { v: v, mots: sortie };
  }

  function penalite(m, n) {
    let p = 0, sombres = 0;
    for (let a = 0; a < 2; a++) {
      for (let i = 0; i < n; i++) {
        let prec = null, run = 0;
        const ligne = [];
        for (let j = 0; j < n; j++) {
          const c = a ? m[j][i] : m[i][j];
          ligne.push(c ? 1 : 0);
          if (c === prec) run++;
          else { if (run >= 5) p += 3 + run - 5; prec = c; run = 1; }
        }
        if (run >= 5) p += 3 + run - 5;
        const s = ligne.join('');
        let k = s.indexOf('10111010000');
        while (k >= 0) { p += 40; k = s.indexOf('10111010000', k + 1); }
        k = s.indexOf('00001011101');
        while (k >= 0) { p += 40; k = s.indexOf('00001011101', k + 1); }
      }
    }
    for (let y = 0; y < n - 1; y++)
      for (let x = 0; x < n - 1; x++) {
        const c = m[y][x];
        if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3;
      }
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) sombres++;
    const total = n * n;
    p += (Math.ceil(Math.abs(sombres * 20 - total * 10) / total) - 1) * 10;
    return p;
  }

  function matrice(texte) {
    const c = mots(texte);
    if (!c) return null;
    const v = c.v, n = v * 4 + 17;
    const m = [], f = [];
    for (let i = 0; i < n; i++) { m.push(new Array(n).fill(false)); f.push(new Array(n).fill(false)); }
    const poser = function (x, y, s) { m[y][x] = s; f[y][x] = true; };

    for (let i = 0; i < n; i++) { poser(6, i, i % 2 === 0); poser(i, 6, i % 2 === 0); }
    [[3, 3], [n - 4, 3], [3, n - 4]].forEach(function (q) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = q[0] + dx, y = q[1] + dy;
        if (x < 0 || y < 0 || x >= n || y >= n) continue;
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        poser(x, y, d !== 2 && d !== 4);
      }
    });
    const al = alignements(v), na = al.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        poser(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const format = function (masque) {
      const b = bitsFormat(masque), bit = function (i) { return ((b >>> i) & 1) === 1; };
      for (let i = 0; i <= 5; i++) poser(8, i, bit(i));
      poser(8, 7, bit(6)); poser(8, 8, bit(7)); poser(7, 8, bit(8));
      for (let i = 9; i < 15; i++) poser(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) poser(n - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) poser(8, n - 15 + i, bit(i));
      poser(8, n - 8, true);
    };
    format(0);                                   // réserve la place
    if (v >= 7) {
      const b = bitsVersion(v);
      for (let i = 0; i < 18; i++) {
        const s = ((b >>> i) & 1) === 1, a = n - 11 + i % 3, bb = Math.floor(i / 3);
        poser(a, bb, s); poser(bb, a, s);
      }
    }
    let i = 0;
    const cw = c.mots;
    for (let droite = n - 1; droite >= 1; droite -= 2) {
      if (droite === 6) droite = 5;
      for (let vert = 0; vert < n; vert++)
        for (let j = 0; j < 2; j++) {
          const x = droite - j, monte = ((droite + 1) & 2) === 0;
          const y = monte ? n - 1 - vert : vert;
          if (!f[y][x] && i < cw.length * 8) {
            m[y][x] = ((cw[i >>> 3] >>> (7 - (i & 7))) & 1) === 1;
            i++;
          }
        }
    }
    const inverse = function (k, x, y) {
      switch (k) {
        case 0: return (x + y) % 2 === 0;
        case 1: return y % 2 === 0;
        case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0;
        case 4: return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
        case 5: return x * y % 2 + x * y % 3 === 0;
        case 6: return (x * y % 2 + x * y % 3) % 2 === 0;
        default: return ((x + y) % 2 + x * y % 3) % 2 === 0;
      }
    };
    const appliquer = function (k) {
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
        if (!f[y][x] && inverse(k, x, y)) m[y][x] = !m[y][x];
    };
    let meilleur = 0, mini = Infinity;
    for (let k = 0; k < 8; k++) {
      appliquer(k); format(k);
      const p = penalite(m, n);
      if (p < mini) { mini = p; meilleur = k; }
      appliquer(k);                              // le masque est son propre inverse
    }
    appliquer(meilleur); format(meilleur);
    return { n: n, m: m, v: v, masque: meilleur };
  }

  /* Le dessin : un seul chemin pour tous les carrés sombres, une marge de
     quatre modules — la norme en exige autant pour que l'appareil photo trouve
     les bords. */
  function svg(texte) {
    const q = matrice(texte);
    if (!q) return null;
    const bord = 4, cote = q.n + bord * 2;
    let d = '';
    for (let y = 0; y < q.n; y++)
      for (let x = 0; x < q.n; x++)
        if (q.m[y][x]) d += 'M' + (x + bord) + ' ' + (y + bord) + 'h1v1h-1z';
    return '<svg class="qr" viewBox="0 0 ' + cote + ' ' + cote + '" shape-rendering="crispEdges"'
         + ' role="img" aria-label="QR code de l’exercice">'
         + '<rect width="' + cote + '" height="' + cote + '" fill="#ffffff"/>'
         + '<path d="' + d + '" fill="#000000"/></svg>';
  }

  return { svg: svg, matrice: matrice, _: { reste: reste, generateur: generateur,
           bitsFormat: bitsFormat, bitsVersion: bitsVersion, alignements: alignements,
           motsDeDonnees: motsDeDonnees } };
})();

/* ---------- la feuille d'envoi ---------- */
function montrerEnvoi(e, lien) {
  const f = els.bilan;
  f.textContent = '';
  const tete = document.createElement('div');
  tete.className = 'tete';
  tete.textContent = 'Envoyer à un élève';
  f.appendChild(tete);
  const nom = document.createElement('div');
  nom.className = 'nomObjet';
  nom.textContent = e.nom;
  f.appendChild(nom);

  /* LE QR D'ABORD. En voiture, on tend son téléphone : l'élève vise avec
     l'appareil photo du sien, et l'exercice s'ouvre. Le lien à copier reste en
     dessous, plus discret — il sert quand l'élève n'est pas là, pour un
     exercice à faire chez lui. */
  const dessin = QR.svg(lien);
  if (dessin) {
    const cadre = document.createElement('div');
    cadre.className = 'cadreQr';
    cadre.innerHTML = dessin;
    f.appendChild(cadre);
  }
  const dit = document.createElement('p');
  dit.className = 'rubrique resume';
  dit.textContent = dessin
    ? 'L’élève vise avec l’appareil photo de son téléphone. L’exercice s’ouvre sans le corrigé.'
    : 'Exercice trop lourd pour un QR code — envoyez le lien.';
  f.appendChild(dit);

  const bouton = function (texte, principal, faire) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = principal ? 'valider' : 'coche2';
    if (!principal) b.style.justifyContent = 'center';
    b.textContent = texte;
    b.addEventListener('click', function (ev) { ev.stopPropagation(); faire(); });
    f.appendChild(b);
  };

  /* Partager n'existe que sur une adresse sûre (https) ; sur le réseau de la
     maison, le navigateur le refuse. On propose donc ce qui marche partout. */
  if (navigator.share) {
    bouton('Partager', true, function () {
      navigator.share({ title: e.nom, text: 'Exercice : ' + e.nom, url: lien })
        .catch(function () {});
    });
  }
  bouton('Copier le lien', !navigator.share && !dessin, function () { copierTexte(lien); });
  bouton('L’ouvrir comme l’élève', false, function () { window.open(lien, '_blank'); });
  bouton('Fermer', false, function () { fermerBilan(); });
  f.hidden = false;
}

/* Copier, là où `navigator.clipboard` n'existe pas : une adresse http de la
   maison n'est pas une « adresse sûre », et le presse-papiers moderne y est
   refusé. L'ancienne méthode — un champ sélectionné, et `execCommand` — marche
   encore partout quand c'est un doigt qui la déclenche. */
function copierTexte(txt) {
  const fini = function (ok) {
    annoncer(ok ? 'Lien copié — collez-le dans un SMS ou WhatsApp.'
                : 'Copie refusée — le lien est sélectionné, copiez-le à la main.');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(function () { fini(true); },
                                            function () { fini(false); });
    return;
  }
  const z = els.echangeTexte;
  z.hidden = false; z.value = txt; z.focus(); z.select();
  try { z.setSelectionRange(0, txt.length); } catch (err) {}
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) {}
  if (ok) { z.hidden = true; z.value = ''; }
  fini(ok);
}

/* ---------- côté élève ---------- */
async function ouvrirExerciceEleve(code) {
  modeEleve = true;
  document.body.classList.add('modeEleve');
  let x = null;
  try { x = await depuisLien(code); } catch (err) {}
  if (!x || x.v !== 1 || !x.scene || !chargerSeance(x.scene)) {
    annoncer('Ce lien d’exercice est illisible — demandez-en un autre.');
    return;
  }
  exerciceRecu = x;
  /* On entre en essai directement, sans passer par `poserVueEleve` : il n'y a
     pas de modèle à relever, l'attendu est arrivé avec le lien. */
  vueEleve = true;
  attendu = x.attendu || null;
  obstacleActif = -1;
  outil = 'point'; outilPose = 'point';
  essai.points.length = 0; essai.gestes.length = 0;
  redessiner(); majCurseur(); majCommandes();
  montrerConsigne();
}

/* La consigne, à l'ouverture : ce qu'il y a à faire, en quatre lignes, et un
   seul bouton. Elle ne décrit pas la situation — ce serait déjà répondre. */
function montrerConsigne() {
  const f = els.bilan;
  f.textContent = '';
  const tete = document.createElement('div');
  tete.className = 'tete';
  tete.textContent = 'Exercice';
  f.appendChild(tete);
  const nom = document.createElement('div');
  nom.className = 'nomObjet';
  nom.textContent = exerciceRecu ? exerciceRecu.nom : 'Exercice';
  f.appendChild(nom);
  [['Pose ton trajet', 'Appuie sur la carte, point par point, jusqu’au drapeau.'],
   ['Règle tes vitesses', 'Reste appuyé sur un point pour choisir sa vitesse.'],
   ['Montre tes gestes', 'Pendant que ça roule : clignotant, rétros, regards.'],
   ['Roule', '▶ pour voir ce que ça donne. Tu peux tout effacer et recommencer.']]
  .forEach(function (l) {
    const d = document.createElement('div');
    d.className = 'etape';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = l[0];
    d.querySelector('span').textContent = l[1];
    f.appendChild(d);
  });
  const ok = document.createElement('button');
  ok.type = 'button'; ok.className = 'valider';

  ok.addEventListener('click', function (ev) {
    ev.stopPropagation();
    f.hidden = true;
    consigneOuverte = false;
    document.body.classList.remove('enConsigne');
  });
  f.appendChild(ok);
  f.hidden = false;
  consigneOuverte = true;
  document.body.classList.add('enConsigne');
}

/* Combien de gestes porte une scène : c'est ce qui dit si un cours est prêt ou
   s'il n'est encore qu'un décor. */
function nGestes(sc) { return (sc && sc.gestes) ? sc.gestes.length : 0; }

function ouvrirCours(e) {
  if (!chargerSeance(e.scene)) { annoncer('Cours illisible.'); return; }
  poserCoursOuvert(e.id);
  /* UN EXERCICE S'OUVRE COMME L'ÉLÈVE LE VERRA. C'est ce qu'on vient vérifier
     en l'ouvrant ; le modèle est à un appui, dans le menu. */
  poserVueEleve(e.type === 'exercice');
  majBandeau(); majCommandes();
  ouvrirPageCours(false);
  const n = nGestes(e.scene);
  if (vueEleve) {
    annoncer('Exercice « ' + e.nom + ' » — à toi de tracer. Le modèle est caché.');
    return;
  }
  annoncer(n ? 'Cours « ' + e.nom + ' » ouvert — ' + n + (n > 1 ? ' gestes posés.' : ' geste posé.')
             : 'Scène « ' + e.nom + ' » ouverte — avancez et posez vos gestes.');
}

/* ---------- la liste ---------- */
let rangerOuvert = false;
const objectifsDeplies = new Set();

function boutonCorbeille(titre, faire) {
  const sup = document.createElement('button');
  sup.type = 'button'; sup.className = 'sup';
  sup.title = titre; sup.setAttribute('aria-label', titre);
  sup.innerHTML = '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="1.9" stroke-linecap="round">'
    + '<path d="M4.5 6.2h13M9 6.2V4.4h4v1.8M6.6 6.2l.8 11.4h7.2l.8-11.4"/></svg>';
  sup.addEventListener('click', function (ev) { ev.stopPropagation(); faire(); });
  return sup;
}

function menuObjectifs(b, choisi) {
  const sel = document.createElement('select');
  sel.className = 'champ';
  sel.setAttribute('aria-label', 'Chapitre');
  const vide = document.createElement('option');
  vide.value = ''; vide.textContent = 'Sans chapitre';
  sel.appendChild(vide);
  b.objectifs.forEach(function (o) {
    const op = document.createElement('option');
    op.value = o.id; op.textContent = o.nom;
    sel.appendChild(op);
  });

  if (sel.selectedIndex < 0) sel.value = '';
  return sel;
}

/* Un cours dont l'objectif a été supprimé retombe tout seul dans le groupe sans
   nom : la liste se répare en se lisant, sans migration ni ménage. */
function grouper(b) {
  const par = new Map([['', []]]);
  b.objectifs.forEach(o => par.set(o.id, []));
  b.cours.forEach(c => (par.get(c.obj || '') || par.get('')).push(c));
  return par;
}

function ligneObjectif(o, liste) {
  const b0 = document.createElement('button');
  b0.type = 'button'; b0.className = 'objL';
  const deplie = objectifsDeplies.has(o.id);
  b0.setAttribute('aria-expanded', String(deplie));
  b0.innerHTML = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="m6 9 6 6 6-6"/></svg><span class="nom"></span><span class="compte"></span>';
  b0.querySelector('.nom').textContent = o.nom;
  b0.querySelector('.compte').textContent = liste.length ? String(liste.length) : '—';
  b0.addEventListener('click', function () {
    if (deplie) objectifsDeplies.delete(o.id); else objectifsDeplies.add(o.id);
    majPageCours();
  });
  return b0;
}

/* La pastille dit l'état sans rien ouvrir : pleine, des gestes sont posés — le
   cours se tient debout ; creuse, il n'y a encore qu'un décor. Le vert —
   envoyé — attendra qu'on sache envoyer. */
function carteCours(c) {
  const b0 = document.createElement('button');
  b0.type = 'button';
  const n = nGestes(c.scene);
  b0.className = 'crs' + (n ? '' : ' brouillon');
  if (c.id === coursCourant) b0.setAttribute('aria-current', 'true');
  b0.innerHTML = '<span class="point"></span><span class="deux">'
               + '<span class="b1"></span><span class="b2"></span></span>';
  b0.querySelector('.point').className = 'point ' + (n ? 'pret' : 'brouillon');
  b0.querySelector('.b1').textContent = c.nom;
  b0.querySelector('.b2').textContent = n
    ? c.quand + ' · ' + n + (n > 1 ? ' gestes' : ' geste')
    : c.quand + ' · scène seule, pas encore de gestes';
  b0.addEventListener('click', function () { ouvrirCours(c); });
  return b0;
}

function blocCours(liste, idObjectif) {
  const d = document.createElement('div');
  d.className = 'sousCours';

  liste.forEach(c => d.appendChild(carteCours(c)));
  if (!liste.length) {
    const p = document.createElement('p');
    p.className = 'vide';
    p.textContent = 'Rien encore. Le + en bas y met la scène de la carte.';
    d.appendChild(p);
  }
  return d;
}

function boutonFleche(quoi, sens, id, bloque) {
  const b0 = document.createElement('button');
  b0.type = 'button'; b0.className = 'sup';
  b0.title = quoi; b0.setAttribute('aria-label', quoi);
  b0.disabled = bloque;
  if (bloque) b0.style.opacity = '.3';
  b0.innerHTML = '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + (sens < 0 ? '<path d="M11 16.5V6M6.5 10.5 11 6l4.5 4.5"/>'
                : '<path d="M11 5.5V16M6.5 11.5 11 16l4.5-4.5"/>') + '</svg>';
  b0.addEventListener('click', function (ev) {
    ev.stopPropagation();
    const g = lireBiblio();
    const j = g.objectifs.findIndex(x => x.id === id), k = j + sens;
    if (j < 0 || k < 0 || k >= g.objectifs.length) return;
    const garde = g.objectifs[j];
    g.objectifs[j] = g.objectifs[k];
    g.objectifs[k] = garde;
    ecrireBiblio(g); majPageCours();
  });
  return b0;
}

function ligneRangeObjectif(o, premier, dernier) {
  const d = document.createElement('div');
  d.className = 'rangeObj';
  const ch = document.createElement('input');
  ch.type = 'text'; ch.className = 'champ'; ch.value = o.nom;
  ch.setAttribute('aria-label', 'Nom du chapitre');
  ch.addEventListener('change', function () {
    const g = lireBiblio(), cible = g.objectifs.find(x => x.id === o.id);
    if (!cible) return;
    cible.nom = ch.value.trim() || cible.nom;
    ch.value = cible.nom;            // un nom vidé revient, sans tout redessiner
    ecrireBiblio(g);
  });
  d.appendChild(ch);
  d.appendChild(boutonFleche('Monter', -1, o.id, premier));
  d.appendChild(boutonFleche('Descendre', 1, o.id, dernier));
  /* Supprimer un objectif ne supprime PAS ses cours : ils retombent dans
     « Sans objectif ». On range, on ne détruit pas. */
  d.appendChild(boutonCorbeille('Supprimer le chapitre « ' + o.nom + ' »', function () {
    const g = lireBiblio();
    const j = g.objectifs.findIndex(x => x.id === o.id);
    if (j < 0) return;
    g.cours.forEach(c => { if (c.obj === o.id) c.obj = null; });
    g.objectifs.splice(j, 1);
    ecrireBiblio(g); majPageCours();
  }));
  return d;
}

function ligneRangeCours(b, c) {
  const d = document.createElement('div');
  d.className = 'rangeCrs';
  const ch = document.createElement('input');
  ch.type = 'text'; ch.className = 'champ'; ch.value = c.nom;
  ch.setAttribute('aria-label', 'Nom du cours');
  ch.addEventListener('change', function () {
    const g = lireBiblio(), cible = g.cours.find(x => x.id === c.id);
    if (!cible) return;
    cible.nom = ch.value.trim() || cible.nom;
    ch.value = cible.nom;
    ecrireBiblio(g); majBandeau();
  });
  const sel = menuObjectifs(b, c.obj);
  sel.addEventListener('change', function () {
    const g = lireBiblio(), cible = g.cours.find(x => x.id === c.id);
    if (!cible) return;
    cible.obj = sel.value || null;
    ecrireBiblio(g); majPageCours();
  });
  d.appendChild(ch);
  d.appendChild(sel);
  d.appendChild(boutonCorbeille('Supprimer le cours « ' + c.nom + ' »', function () {
    const g = lireBiblio();
    const j = g.cours.findIndex(x => x.id === c.id);
    if (j < 0) return;
    g.cours.splice(j, 1);
    ecrireBiblio(g);
    if (coursCourant === c.id) { poserCoursOuvert(null); majBandeau(); }
    majPageCours();
  }));
  return d;
}

function ligneAjout() {
  const b0 = document.createElement('button');
  b0.type = 'button'; b0.className = 'rangee';
  b0.innerHTML = '<svg viewBox="0 0 22 22" aria-hidden="true" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round"><path d="M11 5v12M5 11h12"/></svg>'
    + 'Ajouter un chapitre';
  b0.addEventListener('click', function () {
    const g = lireBiblio();
    g.objectifs.push({ id: neufId('o'), nom: 'Nouveau chapitre' });
    ecrireBiblio(g); majPageCours();
  });
  return b0;
}

function rubrique(texte) {
  const p = document.createElement('p');
  p.className = 'rubrique';
  p.textContent = texte;
  return p;
}

function majPageCours() {
  const b = lireBiblio();
  const par = grouper(b);
  els.pcListe.textContent = '';

  if (rangerOuvert) {
    b.objectifs.forEach(function (o, i) {
      els.pcListe.appendChild(ligneRangeObjectif(o, i === 0, i === b.objectifs.length - 1));
      par.get(o.id).forEach(c => els.pcListe.appendChild(ligneRangeCours(b, c)));
    });
    if (par.get('').length) {
      els.pcListe.appendChild(rubrique('Sans chapitre'));
      par.get('').forEach(c => els.pcListe.appendChild(ligneRangeCours(b, c)));
    }
    els.pcListe.appendChild(ligneAjout());
    return;
  }

  /* CE QUI EST REMPLI D'ABORD. Neuf objectifs dont huit vides, c'est quatre
     cents pixels à faire défiler avant d'atteindre son travail. Les vides ne
     disparaissent pas — on doit pouvoir y ranger — ils descendent. */
  const plein = [], vides = [];
  b.objectifs.forEach(function (o) {
    (par.get(o.id).length ? plein : vides).push(o);
  });
  const poser = function (o) {
    els.pcListe.appendChild(ligneObjectif(o, par.get(o.id)));
    if (objectifsDeplies.has(o.id))
      els.pcListe.appendChild(blocCours(par.get(o.id), o.id));
  };
  plein.forEach(poser);

  const sans = par.get('');
  if (sans.length) {
    els.pcListe.appendChild(ligneObjectif({ id: '', nom: 'Sans chapitre' }, sans));
    if (objectifsDeplies.has('')) els.pcListe.appendChild(blocCours(sans, null));
  }
  if (vides.length) {
    els.pcListe.appendChild(rubrique('Chapitres encore vides'));
    vides.forEach(poser);
  }
}

els.pcRanger.addEventListener('click', function () {
  rangerOuvert = !rangerOuvert;
  els.pcRanger.setAttribute('aria-pressed', String(rangerOuvert));
  els.pcRanger.lastChild.textContent = rangerOuvert ? ' Terminé' : ' Modifier';
