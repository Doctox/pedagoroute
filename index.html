   corrigé, le milieu de la voie est la bonne place, et le coup de pouce vers le
   bord devient un excès.

   Mesuré le 21/09/2026 : sur une bretelle à deux voies (axe au milieu de 7 m),
   le propriétaire a corrigé 23 points à la main, de 1,28 à 1,75 m de l'axe,
   **moyenne 1,49 m**. L'application les posait à 2,35 m — soit le milieu de
   voie (1,75) plus le coup de pouce (0,60). Sans lui : 1,75 m, à 26 cm de ce
   qu'il a tracé au doigt, c'est-à-dire un pixel au zoom de travail. */
const SERRER = 0.6;          // m dont on pousse vers le bord dans la voie de droite
const DEMI_VOITURE = 0.9;    // m : la demi-largeur d'une berline
let serrerDroite = false;

/* Les secteurs sont lus par cases d'environ 1,1 km de côté, calées sur une
   grille fixe : deux visites du même endroit demandent la même URL, donc le
   service worker peut la garder d'une fois sur l'autre. */
const CASE_LAT = 0.010, CASE_LON = 0.015, DEBORD = 0.002;
function cleCase(lat, lon) {
  const la = Math.floor(lat / CASE_LAT) * CASE_LAT;
  const lo = Math.floor(lon / CASE_LON) * CASE_LON;
  return [lo - DEBORD, la - DEBORD, lo + CASE_LON + DEBORD, la + CASE_LAT + DEBORD]
    .map(v => v.toFixed(4)).join(',');
}

let caseVisee = '', minuterieReseau = 0;
function veillerReseau() {
  const g = deprojeter(centreMonde().x, centreMonde().y);
  const cle = cleCase(g.lat, g.lon);
  if (cle === caseVisee) return;
  caseVisee = cle;
  clearTimeout(minuterieReseau);
  /* `lireReseau` demande lui-même le cadastre : la même case, la même clé, et
     les panneaux sont posés une seule fois, avec toute l'information. */
  minuterieReseau = setTimeout(function () { lireReseau(cle).catch(function () {}); }, 400);
}

function reseauPour(p) {
  const g = deprojeter(p.x, p.y);
  for (const d of reseaux.values()) {
    const b = d.bbox;
    if (g.lat > b.laMin && g.lat < b.laMax && g.lon > b.loMin && g.lon < b.loMax) return d;
  }
  return null;
}

/* Le sens de marche au droit d'un point : c'est le segment qui l'amène, donc
   la voiture pour le premier point et le point précédent pour les suivants.
   On prend bien la direction voiture -> point, et non l'orientation de la
   voiture au repos : une voiture laissée de travers inverserait la voie. */
function capMarche(i) {
  const l = mesPoints();
  const p = l[i];
  const av = i > 0 ? l[i - 1] : seance.voiture;
  if (Math.hypot(p.x - av.x, p.y - av.y) > LV * 0.4)
    return Math.atan2(p.y - av.y, p.x - av.x);
  return capRepos * Math.PI / 180;
}

/* Le sens de marche au droit d'un point de trajectoire d'obstacle : le véhicule
   lui-même pour le premier point, le point précédent ensuite. Même règle que
   pour la voiture auto-école. */
function capMarcheObstacle(ob, j) {
  const p = ob.points[j], av = j > 0 ? ob.points[j - 1] : ob;
  if (Math.hypot(p.x - av.x, p.y - av.y) > LV * 0.4)
    return Math.atan2(p.y - av.y, p.x - av.x);
  return ob.cap * Math.PI / 180;
}

/* L'axe de chaussée le plus proche d'un point : le segment, le pied de la
   perpendiculaire et la description de la voie. Sert au recalage des points
   comme à la pose des panneaux sur le bas-côté. */
function axePlusProche(p, d) {
  let pres = null;
  const portee = RECALAGE.portee / mParU;
  d.voies.forEach(function (v) {
    for (let i = 0; i < v.pts.length - 1; i++) {
      const a = v.pts[i], b = v.pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
      if (!l2) continue;
      const u = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
      const q = { x: a.x + dx * u, y: a.y + dy * u };
      const ecart = Math.hypot(p.x - q.x, p.y - q.y);
      if (ecart < portee && (!pres || ecart < pres.ecart))
        pres = { ecart: ecart, q: q, dx: dx, dy: dy, v: v };
    }
  });
  return pres;
}

/* Un panneau ne se plante pas au milieu de la route : il est sur le bas-côté.
   Même axe le plus proche que le recalage d'un point, mais au lieu de viser le
   milieu d'une voie on SORT de la chaussée — du côté où le doigt a lâché, ce
   qui est la façon de choisir son trottoir. */
function calerAuBord(p) {
  const d = reseauPour(p);
  if (!d) return null;
  const pres = axePlusProche(p, d);
  if (!pres) return null;
  const axe = Math.atan2(pres.dy, pres.dx);
  const nx = -Math.sin(axe), ny = Math.cos(axe);
  const cote = ((p.x - pres.q.x) * nx + (p.y - pres.q.y) * ny) >= 0 ? 1 : -1;
  const axeDeg0 = axe * 180 / Math.PI;
  const e = ecartDegage(pres.q.x, pres.q.y, axeDeg0 + (cote > 0 ? 90 : -90),
                        pres.v.total * pres.v.largeur / 2 + BORD_ROUTE, d.voies) / mParU;
  /* Le cap rendu est celui pour lequel ce bord-là est la DROITE : un panneau
     lâché sur un trottoir regarde la file qui longe ce trottoir. C'est la
     direction par défaut de la flèche d'un sens unique — et si c'est l'autre,
     un appui la retourne. */
  const axeDeg = axe * 180 / Math.PI;
  return { x: pres.q.x + nx * cote * e, y: pres.q.y + ny * cote * e,
           cap: cote > 0 ? axeDeg : axeDeg + 180 };
}

let reseauSignale = false;
function caler(p, cap, chausseeEntiere) {
  const d = reseauPour(p);
  if (!d) {
    if (!reseauSignale && reseaux.size === 0) {
      reseauSignale = true;
      annoncer('Routes pas encore chargées — les points restent où vous les posez.');
    }
    return null;
  }
  for (const c of d.carrefours)
    if (Math.hypot(p.x - c.centre.x, p.y - c.centre.y) < c.rayon) return null;
  for (const t of d.tours)
    if (Math.hypot(p.x - t.centre.x, p.y - t.centre.y) < t.rayon + RECALAGE.marge / mParU) return null;

  const pres = axePlusProche(p, d);
  if (!pres) return null;

  /* La route ne donne qu'un axe : c'est la voiture qui dit dans quel sens on
     le parcourt. */
  const axe = Math.atan2(pres.dy, pres.dx);
  const marche = Math.cos(cap - axe) >= 0 ? axe : axe + Math.PI;
  const ux = Math.cos(marche), uy = Math.sin(marche);
  const nx = -uy, ny = ux;              // la droite du conducteur : l'écran a l'y vers le bas

  // à quelle distance de l'axe le doigt a-t-il visé, compté à droite ?
  const vise = ((p.x - pres.q.x) * nx + (p.y - pres.q.y) * ny) * mParU;
  const w = pres.v.largeur, tot = pres.v.total;

  /* Repris au doigt et déposé hors de la chaussée : on n'y touche pas. C'est la
     porte de sortie quand la chaussée supposée tombe à côté de la vraie — une
     avenue sans balise `width` est supposée à 3,25 m par voie, et l'axe d'OSM
     n'est pas toujours la ligne peinte. À la POSE on recale quand même : c'est
     là qu'on vise la rue sans faire attention. */
  if (chausseeEntiere && Math.abs(vise) > tot * w / 2 + 1.0) return null;

  // à la pose on s'en tient à nos voies ; à la reprise, la chaussée entière
  const premiere = chausseeEntiere ? 0 : tot - pres.v.n;

  /* L'axe d'OpenStreetMap est le milieu de la CHAUSSÉE, pas une ligne blanche.
     On numérote donc les voies de gauche à droite sur toute la largeur — la
     voie j a son milieu à (j + 0,5 - total/2) largeurs de l'axe — et les
     nôtres sont les dernières, celles de droite. La même formule couvre alors
     tous les cas, y compris ceux où « une route = deux voies » est faux :

       double sens, 2 voies  ->  j=1        : une demi-voie à droite (le cas courant)
       double sens, 1 voie   ->  j=0        : PILE SUR L'AXE — une voie unique
                                              partagée, on roule au milieu
       double sens, 3 voies  ->  j=2        : une voie pleine à droite du terre-plein
       double sens, 2x2      ->  j=2 et 3   : deux voies au choix
       sens unique, 1 voie   ->  j=0        : sur l'axe, la chaussée est à nous
       sens unique, 2 voies  ->  j=0 et 1   : de part et d'autre de l'axe          */
  /* À ÉGALITÉ, ON PREND LA VOIE DE DROITE. Les voies sont parcourues de gauche
     à droite, et un `<` strict donnait donc la gauche en cas d'égalité parfaite.

     Ce n'est pas un cas d'école : sur une chaussée à SENS UNIQUE à deux voies —
     une bretelle d'autoroute, typiquement — toutes les voies sont à nous, et un
     point semé par le suivi de route tombe pile sur l'axe, donc à égale
     distance des deux. Relevé du 21/09/2026 sur une bretelle de l'A4 : 61 points
     sur 71 se retrouvaient à 1,50 m à GAUCHE de l'axe, c'est-à-dire dans la voie
     de gauche, avec des sauts de 3,45 m là où le secours reprenait la droite —
     le tracé zigzaguait, et l'élève doublait par la gauche sur une insertion.

     Un `<=` suffit : à égalité, c'est la dernière essayée qui gagne, et la
     dernière est la plus à droite. */
  let choix = 0, dmin = Infinity;
  for (let j = premiere; j < tot; j++) {
    const o = (j + 0.5 - tot / 2) * w;
    if (Math.abs(o - vise) <= dmin + 1e-9) { dmin = Math.abs(o - vise); choix = o; }
  }

  /* SERRER À DROITE. Le milieu de la voie, sur une rue sans marquage, se lit
     comme le milieu de la route. Mesuré le 21/09/2026 : le tracé tombait à
     1,36 m à droite de l'axe sur une chaussée supposée de 5,8 m —
     géométriquement juste, et illisible, puisque le ruban du tracé fait à lui
     seul plus d'un mètre de large.

     Et ce n'est pas qu'une affaire de dessin : ce qui s'enseigne, c'est de
     tenir sa droite, pas de tenir son milieu.

     On pousse donc vers le bord — mais seulement dans la voie la plus à
     droite, sinon on sortirait de sa file sur une 2×2 — et jamais sur le
     trottoir : au plus près, la joue droite de la voiture reste à 15 cm du
     bord de chaussée. */
  const derniere = (tot / 2 - 0.5) * w;
  if (serrerDroite && Math.abs(choix - derniere) < 1e-9) {
    const bord = tot * w / 2;
    choix = Math.max(choix, Math.min(bord - DEMI_VOITURE - 0.15, choix + SERRER));
  }

  const dU = choix / mParU;
  return { x: pres.q.x + nx * dU, y: pres.q.y + ny * dU, cap: marche * 180 / Math.PI };
}

/* =================================================================
   Suivre la route
   =================================================================
   Le vrai concurrent de l'application, c'est le carnet et le stylo : elle ne
   gagne que si un itinéraire se pose en quelques secondes, dans la voiture,
   entre deux leçons. Poser un point tous les vingt mètres pour faire tourner
   une voiture dans une rue, c'est plus long que de le dessiner à la main.

   Alors entre le dernier point et celui qu'on vient de poser, l'application
   SUIT LA ROUTE : elle cherche le chemin sur le réseau d'OpenStreetMap et
   sème elle-même les points intermédiaires. Un appui = un tronçon entier.

   Ce qu'elle rend, ce sont des points ordinaires : tout le reste de
   l'application — l'allure, les clignotants, les contrôles, les accidents — ne
   voit aucune différence.

   Deux garde-fous, parce qu'une application qui décide à votre place doit
   savoir se taire :
   - un chemin plus de trois fois plus long qu'à vol d'oiseau n'est pas celui
     qu'on voulait (demi-tour, manœuvre, parking) : on rend la ligne droite ;
   - le réglage « Suivre la route » la coupe net. */
const ROUTE = {
  portee: 40,    // m : au-delà, le point ne visait pas une route
  detour: 4.0,   // rapport au vol d'oiseau : au-delà, ce n'est pas la route qu'on voulait
  // (voir aussi LISSAGE_LATERAL, plus bas : de combien l'écart peut bouger d'un pas)
  rallonge: 120, // m : ...et seulement si le détour coûte vraiment cette distance
  pas: 9         // m : un point semé tous les neuf mètres
};
let suivreRoute = true;
/* LE CALQUE DE MISE AU POINT. Il montre ce que l'application CROIT de la route :
   l'axe d'OpenStreetMap en rouge, et les deux bords de la chaussée supposée en
   jaune. C'est le seul moyen de trancher entre « nos calculs de voie sont
   faux » et « l'axe d'OSM ne tombe pas sur le bitume de la photo » — les deux
   donnent le même symptôme à l'écran, un tracé qui n'est pas dans sa file. */
let montrerAxes = false;

/* =================================================================
   OÙ SONT LES TROTTOIRS
   =================================================================
   Sur une photo aérienne, le trottoir se confond avec la chaussée : même gris,
   et les arbres en cachent la moitié. C'est pourtant la référence du
   placement — « se tenir le long du trottoir » — et il faut donc pouvoir le
   montrer.

   PREMIÈRE PISTE, ABANDONNÉE : OpenStreetMap. Mesuré le 21/09/2026 sur une
   case de 1,2 km au Val d'Europe : **zéro** trottoir dessiné (`footway=sidewalk`),
   **4 %** des rues étiquetées `sidewalk=*` (7 sur 178), et sur les 64 chemins
   piétons présents, **8 %** seulement longent une route — les autres sont des
   allées de parc. OSM ne sait pas où sont les trottoirs ici.

   CE QUI MARCHE : LE CADASTRE. La limite de propriété borde le domaine public,
   et en ville elle passe très exactement au fond du trottoir. L'IGN la publie
   en vecteur (Parcellaire Express, Licence Ouverte). On tire donc depuis l'axe
   de la rue, perpendiculairement, et on s'arrête à la PREMIÈRE limite
   rencontrée : entre le bord de la chaussée et elle, il y a le trottoir.

   Mesuré sur 1788 sondes : 74 % touchent une limite à moins de 30 m, et la
   bande obtenue fait **3,1 m de large en médiane** (quartiles 1,4 et 4,6) —
   c'est un trottoir. Les 12 % de valeurs négatives sont des rues dont on a
   surestimé la largeur, et la longue queue au-delà de 8 m des terrains sans
   parcelle en face : dans les deux cas on ne dessine rien. Mieux vaut ne rien
   montrer que montrer un trottoir qui n'existe pas. */
const TROT_MIN = 0.4;        // m : en deçà, c'est du bruit de mesure
const TROT_MAX = 8.0;        // m : au-delà, ce n'est plus un trottoir
const TROT_PAS = 3;          // m entre deux sondes le long de la rue
const TROT_TROU = 2;         // sondes muettes tolérées sans couper la bande
const TROT_PORTEE = 30;      // m : on ne cherche pas la limite plus loin
const TROT_CASE = 40;        // m : côté d'une case de l'index
const TROT_RETRAIT = 0.4;    // m : on reste en deçà de la limite de propriété
const TROT_ATTENTE = 4000;   // ms : au-delà, on se passe du cadastre
let montrerTrottoirs = false;

/* =================================================================
   LE CADASTRE COMME GARDE-FOU
   =================================================================
   Le propriétaire a eu la bonne idée : puisqu'on a d'un côté ce qu'OpenStreetMap
   raconte de la rue et de l'autre ce que l'IGN sait du domaine public, la
   différence devrait apprendre quelque chose. Mesuré le 21/09/2026 sur une case
   entière, 173 rues, voici ce qu'elle apprend — et surtout ce qu'elle n'apprend
   pas :

   - **recentrer l'axe ?** Inutile. L'axe d'OpenStreetMap est à **0,59 m** du
     milieu du domaine public en médiane. Il est déjà bon, et le bouger pour
     un demi-mètre ferait plus de dégâts que de bien.
   - **corriger la largeur de chaussée ?** Aucun signal. Sur les rues où le
     nombre de voies est deviné, le domaine public dépasse la chaussée supposée
     de **4,2 m** — exactement deux trottoirs : le cadastre confirme la
     supposition au lieu de la corriger. Et sur les grandes routes, où OSM
     déclare le nombre de voies, il la dépasse de **18,7 m** : le domaine public
     y comprend talus, pistes cyclables et bas-côtés. Il ne dit rien du bitume.
   - **replacer la voiture ?** La marge entre elle et la limite de propriété
     est de 3,91 m en médiane ; 8 rues sur 173 passent sous 90 cm. Cinq pour
     cent de cas, pour un maximum de 1,4 m — pas de quoi toucher à la
     trajectoire, qui a déjà coûté assez cher à stabiliser.

   Reste UNE chose, et elle est nette : **8 panneaux sur 99 se plantaient
   au-delà de la limite de propriété**, c'est-à-dire dans le jardin des gens,
   de 20 cm à 4,6 m. Le cadastre sait où s'arrête le domaine public : on l'y
   rentre. Jamais plus loin que la limite, jamais sur le bitume non plus — et
   si le trottoir mesuré est trop étroit pour l'un et l'autre, on ne touche à
   rien plutôt que de déplacer un panneau sur la foi d'une mesure douteuse. */
/* AU CARREFOUR, LE TROTTOIR N'EST PAS SOUS LE PANNEAU.

   Un stop est posé sur le nœud du carrefour : le rayon tiré depuis là traverse
   la bouche de la rue transversale et ne rencontre aucune parcelle avant
   trente mètres. Résultat, on ne savait rien là où l'on avait justement besoin
   de savoir — 55 panneaux sur 99, tous groupés aux carrefours.

   Le trottoir, lui, est à quelques mètres en arrière, le long de la rue. On
   recule donc le long de l'axe jusqu'à trouver un endroit où il se mesure, et
   on applique cette largeur-là : c'est le même trottoir, il tourne au coin. */
const TROT_RECULS = [0, -5, 5, -10, 10, -15, 15];

function rentrerDansLeDomaine(parc, x, y, capBord, ecart, demi) {
  if (!parc) return ecart;
  const enFace = ecart < 0;
  const a = (capBord + (enFace ? 180 : 0)) * Math.PI / 180;
  const nx = Math.cos(a), ny = Math.sin(a);
  const ux = -ny, uy = nx;                        // le long de la rue
  const porteeU = TROT_PORTEE / mParU;
  const plancher = (demi || 0) + 0.3;             // le bord du bitume, et un peu
  for (let i = 0; i < TROT_RECULS.length; i++) {
    const r = TROT_RECULS[i] / mParU;
    const t = premiereLimite(parc, x + ux * r, y + uy * r, nx, ny, porteeU);
    if (t >= porteeU) continue;                   // rien de mesuré par là
    const limite = t * mParU - TROT_RETRAIT;
    if (limite < plancher) continue;              // trottoir trop étroit ici
    /* On vise le MILIEU du trottoir mesuré plutôt que le retrait fixe : c'est
       là qu'un panneau est réellement planté, et ça se voit dans la bande. */
    const milieu = ((demi || 0) + limite) / 2;
    const v = Math.max(plancher, Math.min(Math.max(Math.abs(ecart), milieu), limite));
    return enFace ? -v : v;
  }
  return ecart;                                   // nulle part où mesurer : on n'y touche pas
}

const parcelles = new Map();      // clé de case -> { segs, index }
const chargementsP = new Map();

function lireParcelles(cle) {
  if (parcelles.has(cle)) return Promise.resolve(parcelles.get(cle));
  if (chargementsP.has(cle)) return chargementsP.get(cle);
  const attente = analyserParcelles(cle);
  chargementsP.set(cle, attente);
  attente.then(function (d) { parcelles.set(cle, d); redessiner(); }, function () {})
         .then(function () { chargementsP.delete(cle); });
  return attente;
}

/* Le WFS de la Géoplateforme veut sa boîte en latitude d'abord ; nos clés de
   case sont en longitude d'abord, comme celles d'OpenStreetMap. */
async function analyserParcelles(cle) {
  const b = cle.split(',').map(Number);
  const boite = [b[1], b[0], b[3], b[2]].join(',');
  const u = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature'
          + '&typename=CADASTRALPARCELS.PARCELLAIRE_EXPRESS:parcelle'
          + '&outputFormat=application/json&srsName=EPSG:4326&count=4000&bbox=' + boite;
  const r = await fetch(u);
  if (!r.ok) throw new Error('cadastre ' + r.status);
  const j = await r.json();
  const segs = [];
  (j.features || []).forEach(function (f) {
    if (!f.geometry) return;
    const polys = f.geometry.type === 'MultiPolygon'
      ? f.geometry.coordinates : [f.geometry.coordinates];
    polys.forEach(function (po) {
      po.forEach(function (anneau) {
        const q = anneau.map(c => projeter(c[1], c[0]));
        for (let i = 1; i < q.length; i++) segs.push([q[i-1], q[i]]);
      });
    });
  });
  return { segs: segs, index: indexerSegments(segs) };
}

/* Sans index, chaque sonde comparerait la rue à toutes les limites de la case :
   cinq mille rayons contre seize mille segments, c'est une seconde de
   téléphone bloquée. Une grille de 40 m ramène ça à quelques dizaines de
   comparaisons par rayon. */
function indexerSegments(segs) {
  const pas = TROT_CASE / mParU;
  const g = new Map();
  segs.forEach(function (s, i) {
    const cx0 = Math.floor(Math.min(s[0].x, s[1].x) / pas);
    const cx1 = Math.floor(Math.max(s[0].x, s[1].x) / pas);
    const cy0 = Math.floor(Math.min(s[0].y, s[1].y) / pas);
    const cy1 = Math.floor(Math.max(s[0].y, s[1].y) / pas);
    for (let cx = cx0; cx <= cx1; cx++)
      for (let cy = cy0; cy <= cy1; cy++) {
        const k = cx + ':' + cy;
        if (!g.has(k)) g.set(k, []);
        g.get(k).push(i);
      }
  });
  return { pas: pas, cases: g };
}

/* La première limite rencontrée en partant de (ox,oy) dans la direction
   (dx,dy) unitaire, au plus à `maxT`. Rend `maxT` si l'on ne touche rien. */
function premiereLimite(d, ox, oy, dx, dy, maxT) {
  const idx = d.index, segs = d.segs, pas = idx.pas;
  const ex = ox + dx * maxT, ey = oy + dy * maxT;
  const cx0 = Math.floor(Math.min(ox, ex) / pas), cx1 = Math.floor(Math.max(ox, ex) / pas);
  const cy0 = Math.floor(Math.min(oy, ey) / pas), cy1 = Math.floor(Math.max(oy, ey) / pas);
  let best = maxT;
  const vus = new Set();
  for (let cx = cx0; cx <= cx1; cx++) {
    for (let cy = cy0; cy <= cy1; cy++) {
      const l = idx.cases.get(cx + ':' + cy);
      if (!l) continue;
      for (let n = 0; n < l.length; n++) {
        const i = l[n];
        if (vus.has(i)) continue;
        vus.add(i);
        const A = segs[i][0], B = segs[i][1];
        const bx = B.x - A.x, by = B.y - A.y;
        const den = dx * by - dy * bx;
        if (Math.abs(den) < 1e-12) continue;
        const t = ((A.x - ox) * by - (A.y - oy) * bx) / den;
        if (t <= 0.02 / mParU || t >= best) continue;
        const u = ((A.x - ox) * dy - (A.y - oy) * dx) / den;
        if (u < 0 || u > 1) continue;
        best = t;
      }
    }
  }
  return best;
}

/* Les bandes d'une case, calculées une fois puis gardées sur le réseau : elles
   ne changent qu'avec les données, jamais avec la vue. */
function bandesDeTrottoir(reseau, parc) {
  if (reseau.trottoirs) return reseau.trottoirs;
  const bandes = [];
  const pasU = TROT_PAS / mParU, porteeU = TROT_PORTEE / mParU;
  reseau.voies.forEach(function (v) {
    const demi = (v.total * v.largeur / 2) / mParU;
    [1, -1].forEach(function (cote) {
      let courante = null, trou = 0;
      const finir = function () {
        if (courante && courante.dedans.length > 1) bandes.push(courante);
        courante = null; trou = 0;
      };
      /* UNE SONDE MUETTE NE COUPE PAS LE TROTTOIR. Un arbre, une entrée de
         garage, un découpage de parcelle de travers : il suffisait d'un rayon
         perdu pour que la bande s'arrête net et reparte trois mètres plus loin.
         À l'écran, un trottoir en pointillés — et un panneau qui tombait dans
         un trou passait pour mal placé alors qu'il était au bon endroit.
         On enjambe donc jusqu'à deux sondes : la bande passe droit par-dessus. */
      const rater = function () { if (++trou > TROT_TROU) finir(); };
      for (let i = 1; i < v.pts.length; i++) {
        const A = v.pts[i-1], B = v.pts[i];
        const L = Math.hypot(B.x - A.x, B.y - A.y);
        if (L < 1e-9) continue;
        const ux = (B.x - A.x) / L, uy = (B.y - A.y) / L;
        const nx = -uy * cote, ny = ux * cote;
        for (let t = pasU / 2; t < L; t += pasU) {
          const ox = A.x + ux * t, oy = A.y + uy * t;
          const d = premiereLimite(parc, ox, oy, nx, ny, porteeU);
          const w = (d - demi) * mParU;
          if (d >= porteeU || w < TROT_MIN || w > TROT_MAX) { rater(); continue; }
          trou = 0;
          if (!courante) courante = { dedans: [], dehors: [] };
          courante.dedans.push({ x: ox + nx * demi, y: oy + ny * demi });
          courante.dehors.push({ x: ox + nx * d,    y: oy + ny * d });
        }
      }
      finir();
    });
  });
  reseau.trottoirs = bandes;
  return bandes;
}

function dessinerTrottoirs() {
  if (!montrerTrottoirs) return;
  const tr = q => ax(q.x).toFixed(2) + ' ' + ay(q.y).toFixed(2);
  reseaux.forEach(function (d, cle) {
    const parc = parcelles.get(cle);
    if (!parc) return;
    bandesDeTrottoir(d, parc).forEach(function (b) {
      let dd = '';
      b.dedans.forEach(function (q, i) { dd += (i ? 'L' : 'M') + tr(q); });
      for (let i = b.dehors.length - 1; i >= 0; i--) dd += 'L' + tr(b.dehors[i]);
      dd += 'Z';
      els.trace.appendChild(el('path', { d: dd, fill:'#38bdf8', 'fill-opacity':'.30',
        stroke:'#7dd8ff', 'stroke-opacity':'.55',
        'stroke-width': (LV * 0.025).toFixed(3), 'stroke-linejoin':'round' }));
    });
  });
}
/* Le pinceau de correction : jusqu'où, le long du tracé, un point tiré
   entraîne ses voisins. Soixante mètres de part et d'autre — assez pour
   redresser un tronçon mal placé, trop peu pour déplacer tout un trajet. */
const RAYON_CORRECTION = 60;
/* Combien de passes de lissage sur la ligne semée. Trois ramenaient les
   changements de côté de 32 à 11 ; six les ramènent plus bas encore, sans
   toucher à la courbure réelle de la route — elle se joue sur des centaines de
   mètres, le bruit du relevé sur quelques dizaines. */
const LISSAGE_PASSES = 6;
const LISSAGE_LATERAL = 0.45;  // m de déport au plus par pas de 9 m : une pente de 5 %

/* Une file à priorité, pour ne pas chercher le plus court chemin en O(n²) :
   un secteur d'un kilomètre porte quelques milliers de nœuds, et le moniteur
   attend le trait sous son doigt. */
function fileAPriorite() {
  const t = [];
  return {
    vide: () => t.length === 0,
    pousser: function (v, pr) {
      t.push({ v: v, p: pr });
      let i = t.length - 1;
      while (i > 0) {
        const j = (i - 1) >> 1;
        if (t[j].p <= t[i].p) break;
        const x = t[i]; t[i] = t[j]; t[j] = x; i = j;
      }
    },
    tirer: function () {
      const tete = t[0], dernier = t.pop();
      if (t.length) {
        t[0] = dernier;
        let i = 0;
        for (;;) {
          const g = 2 * i + 1, d = g + 1;
          let m = i;
          if (g < t.length && t[g].p < t[m].p) m = g;
          if (d < t.length && t[d].p < t[m].p) m = d;
          if (m === i) break;
          const x = t[i]; t[i] = t[m]; t[m] = x; i = m;
        }
      }
      return tete;
    }
  };
}

/* Le tronçon de route le plus proche d'un point, et où l'on tombe dessus. */
function accroche(p, g) {
  let mieux = null;
  const portee = ROUTE.portee / mParU;
  g.arcs.forEach(function (liste, a) {
    const pa = g.noeuds.get(a);
    if (!pa) return;
    liste.forEach(function (arc) {
      const pb = g.noeuds.get(arc.vers);
      if (!pb) return;
      const dx = pb.x - pa.x, dy = pb.y - pa.y, l2 = dx * dx + dy * dy;
      if (l2 < 1e-12) return;
      const u = Math.max(0, Math.min(1, ((p.x - pa.x) * dx + (p.y - pa.y) * dy) / l2));
      const qx = pa.x + dx * u, qy = pa.y + dy * u;
      const e = Math.hypot(p.x - qx, p.y - qy);
      if (e < portee && (!mieux || e < mieux.e))
        mieux = { e: e, q: { x: qx, y: qy }, a: a, b: arc.vers, u: u, long: Math.sqrt(l2) };
    });
  });
  return mieux;
}

const arcEntre = (g, a, b) => (g.arcs.get(a) || []).find(x => x.vers === b) || null;
const coutRoute = (d, limite) => d / Math.max(10, limite || LIMITE_DEFAUT);

/* Le plus court chemin, compté en TEMPS et non en distance : une application
   qui ferait passer l'élève par trois lotissements pour gagner cinquante
   mètres n'aurait rien compris à la conduite. */
function cheminRoutier(depart, arrivee, g) {
  const A = accroche(depart, g), B = accroche(arrivee, g);
  if (!A || !B) return null;

  /* On quitte le point de départ par l'un ou l'autre bout de son tronçon — et
     seulement du côté où le sens de circulation l'autorise. */
  const depuis = new Map();
  const aAB = arcEntre(g, A.a, A.b), aBA = arcEntre(g, A.b, A.a);
  if (aAB) depuis.set(A.b, coutRoute((1 - A.u) * A.long, aAB.limite));
  if (aBA) depuis.set(A.a, coutRoute(A.u * A.long, aBA.limite));
  if (!depuis.size) return null;

  const vers = new Map();
  const bAB = arcEntre(g, B.a, B.b), bBA = arcEntre(g, B.b, B.a);
  if (bAB) vers.set(B.a, coutRoute(B.u * B.long, bAB.limite));
  if (bBA) vers.set(B.b, coutRoute((1 - B.u) * B.long, bBA.limite));
  if (!vers.size) return null;

  const dist = new Map(), pere = new Map();
  const f = fileAPriorite();
  depuis.forEach(function (c, n) { dist.set(n, c); f.pousser(n, c); });

  let fin = null, meilleur = Infinity, tours = 0;
  while (!f.vide()) {
    const t = f.tirer();
    if (++tours > 120000) break;                    // garde-fou : on ne cherche pas l'infini
    if (t.p > (dist.has(t.v) ? dist.get(t.v) : Infinity) + 1e-12) continue;
    if (t.p > meilleur) break;
    const bout = vers.get(t.v);
    if (bout != null && t.p + bout < meilleur) { meilleur = t.p + bout; fin = t.v; }
    (g.arcs.get(t.v) || []).forEach(function (arc) {
      const c = t.p + coutRoute(arc.d, arc.limite);
      if (c < (dist.has(arc.vers) ? dist.get(arc.vers) : Infinity)) {
        dist.set(arc.vers, c); pere.set(arc.vers, t.v); f.pousser(arc.vers, c);
      }
    });
  }
  if (fin == null) return null;

  const chaine = [];
  let n = fin;
  while (n != null) { chaine.push(n); n = pere.has(n) ? pere.get(n) : null; }
  chaine.reverse();

  /* On rend aussi, pour chaque segment, LA CHAUSSÉE qu'il emprunte. Sans elle,
     chaque point semé devait rechercher « l'axe le plus proche » — et là où
     deux bretelles se longent, il ne trouvait pas toujours la même d'un point
     au suivant : le tracé tremblait. */
  const ligne = [{ x: A.q.x, y: A.q.y }];
  const voies = [];
  const premiere = arcEntre(g, chaine[0], chaine[1]) || aAB || aBA;
  voies.push(premiere ? premiere.voie : null);
  for (let i = 0; i < chaine.length; i++) {
    const q = g.noeuds.get(chaine[i]);
    if (!q) continue;
    ligne.push({ x: q.x, y: q.y });
    const suivant = i + 1 < chaine.length ? arcEntre(g, chaine[i], chaine[i+1]) : null;
    voies.push(suivant ? suivant.voie : voies[voies.length - 1]);
  }
  ligne.push({ x: B.q.x, y: B.q.y });

  /* LES DEUX BOUTS ONT LEUR PROPRE CHAUSSÉE. Le premier segment va du point
     accroché au premier nœud du chemin, et le dernier du dernier nœud au point
     visé : ni l'un ni l'autre n'appartient à un arc DU CHEMIN, et ils héritaient
     donc de la chaussée d'à côté.

     Relevé sur un tracé réel : un point posé sur l'autoroute était rapporté à
     l'axe de la BRETELLE — 79 m d'écart, que la borne ramenait de force à
     2,45 m. Le tronçon arrivait donc une voie à côté du point, et la voiture
     faisait un écart de 3,50 m pour aller le chercher. */
  const arcDebut = aAB || aBA;
  if (arcDebut) voies[0] = arcDebut.voie;
  const arcFin = arcEntre(g, B.a, B.b) || arcEntre(g, B.b, B.a);
  if (arcFin) voies[voies.length - 1] = arcFin.voie;

  oterLesPointes(ligne, voies);
  return { pts: ligne, voies: voies };
}

/* LES CROCHETS DU RÉSEAU.

   Là où une bretelle rejoint une autoroute, OpenStreetMap ne fait pas se
   toucher les deux axes : il les relie par un segment court, en biais. Relevé
   sur le tracé du propriétaire : un segment de **6,7 m** encadré de deux
   virages de **60° et 63°**, entre deux tronçons de 17 m et 136 m. Le chemin
   faisait donc un crochet latéral de six mètres en six mètres de route, et
   aucun lissage de l'écart ne pouvait le rattraper — le coude était dans l'axe,
   pas dans le décalage.

   C'est un artefact de tracé, pas une route : une voiture qui s'insère ne
   zigzague pas, elle traverse. On retire donc les sommets qui font une pointe —
   un virage franc de part et d'autre d'un segment court — et le chemin passe
   droit. Deux passes : un crochet en cache parfois un autre. */
const POINTE_COURT = 18;    // m : en deçà, un segment est un raccord, pas une route
const POINTE_ANGLE = 30;    // degrés : au-delà, c'est une pointe et non une courbe

function oterLesPointes(ligne, voies) {
  for (let passe = 0; passe < 2; passe++) {
    for (let i = 1; i < ligne.length - 1; i++) {
      const a = ligne[i-1], b = ligne[i], c = ligne[i+1];
      const d1 = Math.hypot(b.x - a.x, b.y - a.y) * mParU;
      const d2 = Math.hypot(c.x - b.x, c.y - b.y) * mParU;
      if (Math.min(d1, d2) > POINTE_COURT) continue;
      const ang = Math.abs(((Math.atan2(c.y - b.y, c.x - b.x)
                           - Math.atan2(b.y - a.y, b.x - a.x)) * 180 / Math.PI + 540) % 360 - 180);
      if (ang < POINTE_ANGLE) continue;
      /* La chaussée du segment fusionné : celle du plus long des deux, qui est
         la vraie route — le court n'est qu'un raccord. */
      voies[i-1] = (d2 > d1 ? voies[i] : voies[i-1]) || voies[i-1];
      ligne.splice(i, 1); voies.splice(i, 1);
      i--;
    }
  }
}

/* Se placer sur une chaussée dont on sait TOUT : sa largeur, son nombre de
   voies, combien sont à nous. Le point d'entrée est sur l'axe, le cap est
   celui de la marche — il n'y a plus rien à chercher, donc plus rien qui
   puisse hésiter d'un point au suivant.

   On prend la voie la plus à droite qui soit à nous : c'est `tot - 1`, puisque
   les nôtres sont les dernières. */
/* ON RESTE DANS SA VOIE. La voie se compte DEPUIS LA DROITE, et pas depuis la
   gauche : une route qui passe de trois voies à deux perd celle de gauche, et
   « la deuxième en partant de la droite » reste la même tout du long, alors que
   « la voie numéro 1 » ne veut plus rien dire.

   `dd` vaut 0 pour la voie la plus à droite. On ne descend jamais en dessous
   de la première qui soit à nous : sur une route à double sens, la voie d'en
   face n'est pas une option. */
/* De combien on se tient à droite de l'axe de CETTE chaussée-là, en mètres. */
function ecartSurLaVoie(v, dd) {
  if (!v) return 0;
  const tot = v.total, w = v.largeur;
  const j = Math.max(tot - v.n, tot - 1 - (dd || 0));
  let o = (j + 0.5 - tot / 2) * w;
  // serrer vers le bord ne vaut que dans la voie de droite : ailleurs on
  // sortirait de sa file
  if (serrerDroite && j === tot - 1)
    o = Math.max(o, Math.min(tot * w / 2 - DEMI_VOITURE - 0.15, o + SERRER));
  return o;
}

/* ON GARDE L'ÉCART EN MÈTRES, PAS UN NUMÉRO DE VOIE.

   Une voie qui s'AJOUTE à droite — une voie de sortie, une voie d'accélération,
   un tourne-à-droite — fait changer le numéro de « la voie la plus à droite »
   sans que le conducteur ait bougé d'un centimètre. En raisonnant par numéro,
   la voiture partait se ranger sur la voie de sortie, puis revenait : un S en
   plein milieu de l'autoroute, exactement là où le moniteur voulait montrer
   qu'on NE sort PAS.

   En mètres, elle ne bouge pas. On borne seulement pour rester dans nos voies
   et pour ne pas mettre la joue droite sur le bas-côté. */
function ecartTenu(v, o) {
  if (!v) return o;
  const tot = v.total, w = v.largeur;
  const gauche = ((tot - v.n) + 0.5 - tot / 2) * w;   // centre de notre voie la plus à gauche
  /* La joue droite au ras du bord — mais une largeur SUPPOSÉE ne doit pas
     rétrécir la route. Un tronçon sans `lanes` est compté pour une seule voie :
     borner dessus ramenait la voiture à 70 cm de l'axe, alors qu'elle roulait à
     2,35 m sur le tronçon d'avant. D'un tronçon à l'autre, 1,65 m d'écart : la
     voiture partait vers le milieu de la chaussée et revenait. C'est le S.
     Quand on ne sait pas, on laisse donc deux fois la place. */
  const large = v.suppose ? tot * w : tot * w / 2;
  const droite = large - DEMI_VOITURE - 0.15;
  return Math.max(Math.min(gauche, droite), Math.min(droite, o));
}

function surLaVoie(q, cap, v, dd) {
  if (!v) return q;
  const dU = ecartSurLaVoie(v, dd) / mParU;
  return { x: q.x + (-Math.sin(cap)) * dU, y: q.y + Math.cos(cap) * dU };
}

/* L'écart latéral d'un point à l'axe de sa chaussée, en mètres, compté à
   droite du sens de marche. */
function ecartMesure(p, v) {
  if (!v || !v.pts) return 0;
  let pres = null, dmin = Infinity;
  for (let i = 0; i < v.pts.length - 1; i++) {
    const a = v.pts[i], b = v.pts[i+1];
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx*dx + dy*dy;
    if (l2 < 1e-12) continue;
    const u = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
    const qx = a.x + dx*u, qy = a.y + dy*u;
    const d = Math.hypot(p.x - qx, p.y - qy);
    if (d < dmin) { dmin = d; pres = { qx:qx, qy:qy, dx:dx, dy:dy }; }
  }
  if (!pres) return 0;
  const axe = Math.atan2(pres.dy, pres.dx);
  return ((p.x - pres.qx) * (-Math.sin(axe)) + (p.y - pres.qy) * Math.cos(axe)) * mParU;
}

/* Dans quelle voie est ce point, comptée depuis la droite ? On le projette sur
   l'axe de la chaussée et on lit l'écart. */
function voieDepuisLaDroite(p, v) {
  if (!v || !v.pts) return 0;
  let pres = null, dmin = Infinity;
  for (let i = 0; i < v.pts.length - 1; i++) {
    const a = v.pts[i], b = v.pts[i+1];
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx*dx + dy*dy;
    if (l2 < 1e-12) continue;
    const u = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
    const qx = a.x + dx*u, qy = a.y + dy*u;
    const d = Math.hypot(p.x - qx, p.y - qy);
    if (d < dmin) { dmin = d; pres = { qx:qx, qy:qy, dx:dx, dy:dy }; }
  }
  if (!pres) return 0;
  const axe = Math.atan2(pres.dy, pres.dx);
  const nx = -Math.sin(axe), ny = Math.cos(axe);
  const droite = ((p.x - pres.qx) * nx + (p.y - pres.qy) * ny) * mParU;
  const tot = v.total, w = v.largeur;
  const j = Math.round(droite / w + tot / 2 - 0.5);
  return Math.max(0, Math.min(v.n - 1, tot - 1 - j));
}

/* Note laissée pour mémoire : un jet précédent recalait chaque point semé avec
   `caler()`, qui rend la main dans un carrefour et aux abords d'un giratoire.
   Le point restait alors sur l'axe d'OpenStreetMap, c'est-à-dire au milieu de
   la route — et un secteur d'un kilomètre à Montévrain porte 125 carrefours
   avec 12 m de rayon d'abstention chacun : la moitié du trajet y tombait.

   Un second jet ajoutait un secours qui cherchait « l'axe le plus proche ».
   Là où deux bretelles se longent, il n'en trouvait pas toujours la même d'un
   point au suivant, et le tracé tremblait — relevé sur une bretelle de l'A4 :
   des sauts de 3,45 m.

   `surLaVoie()` a réglé les deux d'un coup, en cessant de CHERCHER : chaque
   segment de l'itinéraire connaît la chaussée qu'il emprunte. */

/* Les points intermédiaires d'un tronçon suivi. Chacun est remis dans SA voie
   par le même recalage que les points posés au doigt — lequel rend la main de
   lui-même aux carrefours et dans les giratoires, là où la ligne médiane est
   justement la bonne. */
function pointsSurRoute(depart, arrivee) {
  if (!suivreRoute) return null;
  const d = reseauPour(arrivee) || reseauPour(depart);
  if (!d || !d.graphe) return null;
  const route = cheminRoutier(depart, arrivee, d.graphe);
  if (!route || route.pts.length < 3) return null;
  const ligne = route.pts;

  let L = 0;
  for (let i = 1; i < ligne.length; i++)
    L += Math.hypot(ligne[i].x - ligne[i-1].x, ligne[i].y - ligne[i-1].y);
  /* Deux conditions, pas une. Le seul rapport au vol d'oiseau rejetait des
     trajets parfaitement normaux : tourner au coin de la rue, c'est souvent
     quatre fois la distance à vol d'oiseau pour cinquante mètres de route. On
     ne renonce donc que si le détour est à la fois très disproportionné ET
     long pour de bon. */
  const oiseau = Math.hypot(arrivee.x - depart.x, arrivee.y - depart.y);
  if (oiseau > 1e-9 && L > oiseau * ROUTE.detour
      && (L - oiseau) * mParU > ROUTE.rallonge) return null;
  if (L * mParU < ROUTE.pas * 1.5) return null;

  /* LA VOIE DU TRONÇON : celle où l'on était déjà. C'est la règle demandée par
     le propriétaire — « qu'il reste sur sa voie tant que le point ne sort
     pas ». Sans elle, l'application semait toujours dans la voie de droite,
     et un départ pris dans une autre file faisait faire un écart à la voiture
     dès les premiers mètres, puis un second pour rejoindre le point d'arrivée. */
  /* LA VOIE DE DROITE, TOUT LE LONG.

     Trois règles ont été essayées avant celle-ci : garder le numéro de voie du
     départ, puis garder l'écart en mètres, puis se raccorder à la voie du point
     posé. Toutes les trois faisaient, à un moment ou à un autre, TRAVERSER UNE
     LIGNE à la voiture — et c'est précisément ce qu'on ne veut pas montrer à un
     élève.

     La règle du moniteur n'a pas bougé depuis le premier jour : on tient sa
     droite. C'est donc la voie la plus à droite qui soit à nous, sur chaque
     chaussée traversée, et rien d'autre. Sur une bretelle à deux voies, la
     droite ; sur l'autoroute qu'elle rejoint, la droite aussi — le passage de
     l'une à l'autre étant réparti par le lissage, ce qui dessine exactement une
     insertion.

     Un dépassement, une file de gauche : ça se trace en posant les points et en
     coupant « Suivre la route ». C'est un geste rare, et il se décide. */
  const oCible = ecartSurLaVoie(route.voies[0], 0);

  const pas = ROUTE.pas / mParU;
  const brut = [];
  let reste = pas;
  for (let i = 1; i < ligne.length; i++) {
    const a = ligne[i-1], b = ligne[i];
    const seg = Math.hypot(b.x - a.x, b.y - a.y);
    if (seg < 1e-9) continue;
    const cap = Math.atan2(b.y - a.y, b.x - a.x);
    let t = 0;
    while (seg - t > reste) {
      t += reste; reste = pas;
      brut.push({ x: a.x + (b.x - a.x) * (t / seg), y: a.y + (b.y - a.y) * (t / seg),
                  cap: cap, o: ecartSurLaVoie(route.voies[i - 1], 0) });
    }
    reste -= (seg - t);
  }

  /* UNE VOITURE NE SE DÉPORTE PAS D'UN COUP. L'écart à l'axe se calcule
     chaussée par chaussée : une bretelle à une voie, l'autoroute qu'elle
     rejoint à deux ou trois, et les axes ne sont pas au même endroit. À la
     jonction, l'écart voulu SAUTAIT de plusieurs mètres, et le tracé faisait
     un coude en plein milieu de la route.

     On limite donc la vitesse à laquelle l'écart peut changer : 45 cm par pas
     de 9 m, soit une pente de 5 %. Un déport de 3,50 m prend alors 70 m —
     c'est exactement le rabattement d'une insertion, et ça se dessine tout
     seul. Deux passes, aller puis retour, pour que le déport soit ANTICIPÉ et
     non subi : une voiture commence à se rabattre avant la fin de la bretelle,
     elle ne l'attend pas. */
  /* LE TRONÇON SE RACCORDE AU POINT POSÉ.

     Relevé sur un tracé réel du propriétaire, bretelle de l'A4 vers l'autoroute,
     53 points : les 43 premiers à +2,35 m de l'axe de la bretelle (2 voies), les
     suivants toujours à +2,35 m de l'axe de l'autoroute (4 voies) — c'est-à-dire
     la TROISIÈME voie — et son point posé à +5,85 m, c'est-à-dire la voie de
     droite. Trois mètres cinquante d'écart : une voie pleine, d'un coup, juste
     avant l'arrivée.

     La faute est de n'avoir regardé que le DÉPART. Un tronçon a deux bouts : on
     part d'une voie et on arrive dans une autre — c'est même très exactement ce
     qu'est une insertion. L'écart visé à l'arrivée est donc celui du point posé,
     tel qu'il sera recalé, et le lissage répartit le passage de l'un à l'autre :
     45 cm par pas de 9 m, la pente d'un rabattement normal.

     Le point posé, lui, ne bouge plus : c'est le moniteur qui l'a mis là. */
  /* ET LE TRONÇON PART DE LÀ OÙ L'ON EST.

     Le premier échantillon prenait l'écart de la voie de droite sans regarder
     où était le point de départ. Or celui-ci a été recalé par `caler()`, qui a
     sa propre idée de la voie la plus proche : quand les deux ne tombent pas
     d'accord — une chaussée à deux files, un axe d'OpenStreetMap décalé — le
     tracé faisait un écart d'une demi-voie dès le premier mètre, puis revenait.
     C'est le décrochement qu'on voyait à chaque point posé.

     Le lissage sait déjà rattraper 45 cm tous les 9 m, et il est écrit pour que
     le déport soit anticipé. Il n'y avait qu'à lui donner le vrai départ — ce
     qui est très exactement ce qu'on fait à l'autre bout depuis toujours. */
  if (brut.length > 1) {
    /* L'écart se mesure sur le PREMIER VRAI SEGMENT DE ROUTE, pas sur le
       premier segment de l'itinéraire : celui-là part du point posé pour
       rejoindre le graphe, et le point posé est déjà décalé dans sa voie. Le
       prendre comme référence donnait un écart nul, donc une rampe qui
       recommençait à déporter la voiture d'une demi-voie — le décrochement
       qu'on voulait justement faire disparaître. */
    const j = ligne.length > 2 ? 1 : 0;
    const a0 = ligne[j], b0 = ligne[j + 1];
    const cap0 = Math.atan2(b0.y - a0.y, b0.x - a0.x);
    brut[0].o = ((depart.x - a0.x) * (-Math.sin(cap0))
               + (depart.y - a0.y) * Math.cos(cap0)) * mParU;
  }

  const derniere = route.voies[route.voies.length - 1] || route.voies[0];
  const bF = ligne[ligne.length - 1], aF = ligne[ligne.length - 2];
  const capFin = Math.atan2(bF.y - aF.y, bF.x - aF.x);
  const oArrivee = derniere ? ecartSurLaVoie(derniere, 0) : oCible;
  if (brut.length) brut[brut.length - 1].o = oArrivee;

  /* ET LE POINT POSÉ VIENT DANS CETTE VOIE. Sinon le tronçon arrive dans la
     voie de droite et le point est ailleurs : la voiture traverse une ligne
     pour aller le chercher, juste avant de s'arrêter. Le moniteur le déplace à
     la main s'il le voulait ailleurs — un point tiré redevient un point
     ordinaire. */
  const dFin = oArrivee / mParU;
  const pose = { x: bF.x + (-Math.sin(capFin)) * dFin, y: bF.y + Math.cos(capFin) * dFin };

  /* Trois passes : le lissage doit tenir les deux bouts à la fois, et une seule
     passe dans un sens défait ce que l'autre vient de poser. */
  const MAX = LISSAGE_LATERAL;
  /* La passe arrière s'arrête à l'indice 1 : le premier échantillon est un
     ANCRE, comme le dernier. Sans ça, elle ramenait tout de suite le départ
     dans la voie de droite et l'écart réel de la voiture était perdu — c'est
     lui, pourtant, qu'il faut rattraper en pente douce. */
  const versLArriere = function () {
    for (let i = brut.length - 2; i >= 1; i--)
      brut[i].o = Math.max(brut[i+1].o - MAX, Math.min(brut[i+1].o + MAX, brut[i].o));
  };
  const versLAvant = function () {
    for (let i = 1; i < brut.length - 1; i++)
      brut[i].o = Math.max(brut[i-1].o - MAX, Math.min(brut[i-1].o + MAX, brut[i].o));
  };
  versLArriere(); versLAvant(); versLArriere();

  /* ET ON ARRONDIT LES DEUX BOUTS DE LA RAMPE. Le limiteur produit un trapèze :
     pente constante, puis arrêt net. Ces deux angles vifs sont lus par le
     profil d'allure comme un VIRAGE — le rayon y tombe à quelques dizaines de
     mètres, et la voiture se retrouvait à 64 km/h au milieu d'une insertion à
     90, voire à 30 sur un trajet plus long.

     Trois passes de moyenne changent le trapèze en S. C'est aussi ce que fait
     un conducteur : il ne braque pas d'un coup, il ouvre et referme. */
  for (let passe = 0; passe < 3; passe++) {
    const copie = brut.map(b => b.o);
    for (let i = 1; i < brut.length - 1; i++)
      brut[i].o = 0.25 * copie[i-1] + 0.5 * copie[i] + 0.25 * copie[i+1];
  }

  /* LA DIRECTION DU DÉCALAGE DOIT ÊTRE CONTINUE.

     Chaque échantillon était décalé perpendiculairement au SEGMENT qui le
     porte. Au raccord de deux chaussées — une bretelle qui rejoint une
     autoroute — ces deux segments ne pointent pas dans la même direction : la
     perpendiculaire tourne d'un coup, et le point décalé de 2,35 m saute avec
     elle, alors même que l'écart n'a pas bougé d'un centimètre.

     Relevé sur le tracé du propriétaire : les points 57 et 58 décalés de
     2,80 m et 3,13 m par rapport à leurs voisins — soit un angle de plus de
     80° entre les deux segments au raccord. C'est le décrochement qu'il voyait.

     On prend donc la direction sur les VOISINS de l'échantillon, et non sur son
     segment : une différence centrée, qui ne saute pas quand la chaussée
     change. */
  for (let i = 0; i < brut.length; i++) {
    const a = brut[Math.max(0, i - 1)], b = brut[Math.min(brut.length - 1, i + 1)];
    if (a !== b) brut[i].cap = Math.atan2(b.y - a.y, b.x - a.x);
  }

  const sortie = brut.map(function (b) {
    const dU = b.o / mParU;
    return { x: b.x + (-Math.sin(b.cap)) * dU, y: b.y + Math.cos(b.cap) * dU };
  });

  /* ET ON LISSE LA LIGNE ELLE-MÊME.

     L'axe d'OpenStreetMap est une suite de segments relevés à la main : entre
     deux sommets, la direction change d'un demi-degré par-ci, d'un degré
     par-là. Décaler cette ligne de deux mètres amplifie chacune de ces
     hésitations, et le tracé ONDULE — relevé sur un tronçon réel : **32
     changements de côté sur 72 points**, 12 cm d'écart moyen, jusqu'à 1,46 m.
     Ce n'est pas un décrochement qu'on voit, c'est un tremblement continu.

     Trois passes de moyenne pondérée (1/4, 1/2, 1/4) effacent tout ce qui est
     plus court qu'une vingtaine de mètres — donc le bruit du relevé — et ne
     touchent pas à la courbure réelle de la route, qui se joue sur des
     centaines de mètres. Les deux bouts ne bougent pas : ils tiennent le
     raccord avec le point de départ et le point posé. */
  for (let passe = 0; passe < LISSAGE_PASSES; passe++) {
    const copie = sortie.map(q => ({ x: q.x, y: q.y }));
    for (let i = 1; i < sortie.length - 1; i++) {
      sortie[i].x = 0.25 * copie[i-1].x + 0.5 * copie[i].x + 0.25 * copie[i+1].x;
      sortie[i].y = 0.25 * copie[i-1].y + 0.5 * copie[i].y + 0.25 * copie[i+1].y;
    }
  }

  /* LES DERNIERS ÉCHANTILLONS. On les jette, c'est le point posé qui porte la
     consigne — et on les jette par rapport à LUI, pas à l'endroit visé par le
     doigt : sinon un échantillon survit alors qu'il est déjà au point, voire
     au-delà. Deux sommets confondus, ou un sommet qui revient en arrière, et la
     courbe part en crosse. */
  const ux = Math.cos(capFin), uy = Math.sin(capFin);
  while (sortie.length) {
    const q = sortie[sortie.length - 1];
    const pres = Math.hypot(q.x - pose.x, q.y - pose.y) < pas * 0.8;
    const audela = (q.x - pose.x) * ux + (q.y - pose.y) * uy > 0;
    if (!pres && !audela) break;
    sortie.pop();
  }

  /* ET LES PREMIERS. Le même mal, à l'autre bout, et plus visible encore.

     Le routeur accroche le départ au nœud le plus proche du graphe — qui peut
     être DERRIÈRE nous. L'itinéraire commençait alors par un demi-tour :
     relevé sur une route droite, quinze mètres en arrière, puis demi-tour et
     tout le trajet. À l'écran, un crochet en épingle au milieu du tracé, à
     chaque point posé : « sur le mode exercice la trajectoire fait vraiment des
     trucs bizarres ».

     Le garde-fou du détour ne l'attrapait pas : quinze mètres de recul sur cent
     cinquante mètres de route, ce n'est ni trois fois le vol d'oiseau ni cent
     vingt mètres de rallonge. C'est petit, et c'est pourtant ce qu'on voit.

     On jette donc les échantillons qui sont derrière le départ, dans l'axe
     départ → point posé. Une route qui exige vraiment un demi-tour se trace en
     posant les points à la main. */
  const vx = pose.x - depart.x, vy = pose.y - depart.y;
  if (Math.hypot(vx, vy) > 1e-9) {
    while (sortie.length
           && (sortie[0].x - depart.x) * vx + (sortie[0].y - depart.y) * vy <= 0)
      sortie.shift();
  }
  if (!sortie.length) return null;

  return { etapes: sortie, fin: pose };
}

/* Le recalage se fait au LEVER du doigt, jamais pendant le glissement : un
   point qui saute d'une voie à l'autre sous le doigt est illisible. */
function recalerPrise(pris, neuf) {
  /* Un appui qui n'a RIEN déplacé n'est pas une reprise : il ne doit ni recaler
     l'objet ni consommer son droit à rester où il est. Sans ça, un simple appui
     — pour désigner un point, ou le premier des deux appuis d'un double — le
     faisait sauter dans sa voie. */
  if (!neuf && !pris.bouge) return;

  /* Un point que le suivi de route vient de placer dans SA voie n'a pas à être
     recalé une seconde fois : le recalage viserait la voie la plus proche du
     doigt, et le ferait ressortir de la file. Dès qu'on le déplace à la main,
     il redevient un point ordinaire. */
  const q0 = pointDeLaPrise(pris);
  if (q0 && q0.surRoute) { if (pris.bouge) q0.surRoute = false; else return; }

  /* UN POINT SEMÉ QU'ON DÉPLACE DEVIENT LE VÔTRE. Il cesse d'être un point de
     passage calculé : il se dessine en grand, il porte une vitesse si on lui en
     donne une, et le prochain recalcul ne le balaiera pas. */
  /* UNE CORRECTION TIRE UN BOUT DE LIGNE, PAS TOUTE LA LIGNE.

     Premier jet : corriger un point décalait tout le tracé. Bien trop — on
     corrige un endroit précis, là où l'axe d'OpenStreetMap tombe à côté du
     bitume, et ailleurs le tracé était juste.

     C'est donc un PINCEAU : le point tiré suit le doigt en entier, ses voisins
     de moins en moins, et au-delà de `RAYON_CORRECTION` mètres plus rien ne
     bouge. Le poids décroît en cosinus, ce qui raccorde sans angle des deux
     côtés — un déport qui s'ouvre et se referme, comme un évitement.

     La distance se compte LE LONG DU TRACÉ, pas à vol d'oiseau : sur un
     giratoire, deux points diamétralement opposés sont proches en ligne droite
     et très loin en roulant.

     Seul le déport LATÉRAL compte. Avancer un point le long de la route ne veut
     rien dire — c'est le même trajet — et laisser passer cette composante
     ferait glisser la ligne dans le sens de la marche. */
  /* LA MAIN CORRIGE, L'OUTIL POINT TRACE. Le pinceau se déclenche avec la
     MAIN, sur n'importe quel point du tracé — semé ou posé.

     Premier jet : seuls les points semés déclenchaient le pinceau, et les
     points posés ne bougeaient jamais. Avec plusieurs points rapprochés, ils
     servaient d'ancres de part et d'autre : la correction était écrasée entre
     deux piquets et on ne pouvait rien redresser entre eux.

     Or un point posé n'est pas une vérité : il a été mis où le doigt visait,
     puis recalé par l'application dans la voie qu'elle croyait bonne. Si toute
     la ligne est décalée, il l'est aussi. Il suit donc le pinceau comme les
     autres. Pour déplacer UN point et lui seul, on prend l'outil point. */
  if (q0 && outil === 'main' && pris.bouge && pris.avant
      && (pris.type === 'point' || pris.type === 'pointObstacle')) {
    const liste = pris.type === 'point' ? mesPoints()
                : (seance.obstacles[pris.i] || {}).points;
    const depart = pris.type === 'point' ? seance.voiture : seance.obstacles[pris.i];
    const iq = pris.type === 'point' ? pris.i : pris.j;
    if (liste && depart) {
      const n = normaleDe(liste, iq, depart);
      const dLat = (q0.x - pris.avant.x) * n.x + (q0.y - pris.avant.y) * n.y;
      if (Math.abs(dLat) * mParU > 0.05) {
        // l'abscisse de chaque point le long du tracé, en mètres
        const abs = [];
        let cumul = 0, prec = depart;
        liste.forEach(function (p) {
          cumul += Math.hypot(p.x - prec.x, p.y - prec.y) * mParU;
          abs.push(cumul); prec = p;
        });
        const R = RAYON_CORRECTION;
        let touches = 0;
        liste.forEach(function (p, j) {
          const d = Math.abs(abs[j] - abs[iq]);
          if (d >= R) return;
          const w = 0.5 * (1 + Math.cos(Math.PI * d / R));
          const nj = normaleDe(liste, j, depart);
          const base = (j === iq) ? pris.avant : p;
          p.x = base.x + nj.x * dLat * w;
          p.y = base.y + nj.y * dLat * w;
          touches++;
        });
        annoncer('Décalé de ' + Math.abs(dLat * mParU).toFixed(1) + ' m vers la '
                 + (dLat > 0 ? 'droite' : 'gauche') + ', sur ' + Math.round(2 * R) + ' m.');
      }
    }
    return;
  }

  /* Un obstacle ne se recale pas : le moniteur le pose exactement où il veut,
     et l'y laisse. Une voiture mal garée en travers, un camion qui déborde,
     un piéton entre deux voitures — c'est souvent tout l'intérêt de la
     situation, et un recalage les effacerait. L'application ne reprendra la
     main dessus que le jour où l'obstacle aura sa propre trajectoire : c'est
     elle qui le placera alors, comme elle place déjà la voiture auto-école. */
  if (pris.type === 'obstacle') return;
  if (pris.type === 'panneau') {
    /* Même règle que les points de trajectoire : la POSE et le PREMIER
       déplacement plantent le panneau sur le bas-côté, du côté où on l'a lâché.
       Le SECOND déplacement le laisse exactement où on le met — quand l'axe
       d'OpenStreetMap tombe à côté du vrai bord, il faut pouvoir reprendre la
       main, et l'application n'a plus à insister. */
    const q = seance.panneaux[pris.i];
    if (!q || q.repris || pris.change) return;
    if (!neuf) q.repris = true;
    const r = calerAuBord(q);
    if (!r) return;
    q.x = r.x; q.y = r.y;
    /* La flèche ne prend le sens de la rue qu'à la POSE. Déplacer le panneau ne
       la retourne pas : sur une rue à sens unique, les deux trottoirs longent la
       même file, et c'est un appui qui décide quand l'application s'est
       trompée. */
    if (neuf && estFleche(q.t) && r.cap != null) q.cap = r.cap;
    return;
  }
  // le camembert non plus : c'est une zone de décision, pas un objet de la chaussée
  if (pris.type.slice(0, 3) === 'cam') return;
  if (pris.type === 'pointObstacle') {
    const ob = seance.obstacles[pris.i];
    const p = ob && ob.points[pris.j];
    if (!p) return;
    if (p.repris) { majCircuit(ob); return; }
    // déplacé à la main : il reste où on le lâche (voir le point de trajectoire)
    if (!neuf) { p.repris = true; majCircuit(ob); return; }
    const r = caler(p, capMarcheObstacle(ob, pris.j), false);
    if (r) { p.x = r.x; p.y = r.y; }
    majCircuit(ob);
    return;
  }
  /* On tournait un obstacle, pas la voiture : sans ce test, lever le doigt
     après avoir tourné un camion recalait la voiture auto-école. */
  if (pris.type === 'rotation') {
    const cib = cibleRotation();
    if (!cib || cib.p !== seance.voiture) return;
  }
  if (pris.type === 'point') {
    const p = mesPoints()[pris.i];
    if (!p) return;
    /* LA POSE SE CALE, LE DÉPLACEMENT NON.

       La règle était : la pose cale le point dans sa voie, le PREMIER
       déplacement le recale — sur la chaussée entière, pour tracer un
       dépassement —, et seuls les suivants le laissaient où on le lâche. À
       l'usage, ça donnait ceci : « je pose mon point ; je veux le bouger, il se
       remet ; je le rebouge, il bouge ». Un point qu'on déplace de deux mètres
       dans sa voie était recentré… à l'endroit exact d'où on venait de le
       tirer. Le geste ne servait à rien, une fois sur deux, sans qu'on sache
       pourquoi.

       Un point qu'on déplace est un point qu'on corrige : il reste où on le
       lâche, dès la première fois. La pose, elle, continue de viser la rue et
       de se ranger dans la voie — c'est là qu'on tape sans regarder. Pour un
       dépassement, on lâche le point dans l'autre voie, et il y reste. */
    if (p.repris) return;
    if (!neuf) { p.repris = true; return; }
    const r = caler(p, capMarche(pris.i), false);
    if (r) { p.x = r.x; p.y = r.y; }
  } else {
    /* La voiture auto-école suit la même règle que les points : le PREMIER
       déplacement la recale et l'oriente, le SECOND la laisse exactement où on
       la met. Sans ça, sur une rue où l'axe d'OpenStreetMap ou la largeur
       devinée tombent à côté, elle revenait indéfiniment au même endroit faux
       et il était impossible de la poser dans sa voie.
       Le bouton « ramener la voiture ici » remet le compteur à zéro : c'est une
       repose, pas une correction. */
    if (seance.voiture.repris) return;
    seance.voiture.repris = true;

    /* Remise au milieu de sa voie ET dans le sens de la route. Le sens vient du
       premier point dès qu'il y en a un — c'est la trajectoire qui dit où l'on
       va, l'orientation au repos ne vaut que tant que rien n'est tracé. */
    const p0 = mesPoints()[0];
    const cap = p0 ? Math.atan2(p0.y - seance.voiture.y, p0.x - seance.voiture.x)
                   : capRepos * Math.PI / 180;
    const r = caler(seance.voiture, cap);
    if (r) { seance.voiture.x = r.x; seance.voiture.y = r.y; capRepos = r.cap; }
  }
}

/* =================================================================
   Dessin
   ================================================================= */
function el(nom, attrs) {
  const n = document.createElementNS(SVG_NS, nom);
  for (const c in attrs) n.setAttribute(c, attrs[c]);
  return n;
}
/* Du vert du ralenti à l'orange de l'allure normale en passant par l'ambre :
   interpolation en teinte, et non en rouge-vert-bleu, qui virerait au kaki. */
function teinte(t) {
  return 'hsl(' + (148 + (30 - 148) * t).toFixed(1) + ','
                + (75 + 13 * t).toFixed(1) + '%,' + (37 + 13 * t).toFixed(1) + '%)';
}

/* L'axe et les bords, pour les seules routes qui touchent la vue. */
function dessinerAxes() {
  if (!montrerAxes) return;
  const marge = 200 / vue.k;
  const c = centreMonde();
  const demiL = largeur / 2 / vue.k + marge, demiH = hauteur / 2 / vue.k + marge;
  const tr = q => ax(q.x).toFixed(2) + ' ' + ay(q.y).toFixed(2);
  reseaux.forEach(function (d) {
    d.voies.forEach(function (v) {
      const p0 = v.pts[0], p1 = v.pts[v.pts.length - 1];
      if (Math.min(p0.x, p1.x) > c.x + demiL || Math.max(p0.x, p1.x) < c.x - demiL) return;
      if (Math.min(p0.y, p1.y) > c.y + demiH || Math.max(p0.y, p1.y) < c.y - demiH) return;
      let dAxe = '', dG = '', dD = '';
      const demi = (v.total * v.largeur / 2) / mParU;
      v.pts.forEach(function (q, i) {
        dAxe += (i ? 'L' : 'M') + tr(q);
        const a = v.pts[Math.max(0, i - 1)], b = v.pts[Math.min(v.pts.length - 1, i + 1)];
        const cap = Math.atan2(b.y - a.y, b.x - a.x);
        const nx = -Math.sin(cap), ny = Math.cos(cap);
        dG += (i ? 'L' : 'M') + tr({ x: q.x - nx * demi, y: q.y - ny * demi });
        dD += (i ? 'L' : 'M') + tr({ x: q.x + nx * demi, y: q.y + ny * demi });
      });
      els.trace.appendChild(el('path', { d: dG, fill:'none', stroke:'#ffd24a',
        'stroke-width': (LV * 0.035).toFixed(3), 'stroke-opacity':'.85' }));
      els.trace.appendChild(el('path', { d: dD, fill:'none', stroke:'#ffd24a',
        'stroke-width': (LV * 0.035).toFixed(3), 'stroke-opacity':'.85' }));
      els.trace.appendChild(el('path', { d: dAxe, fill:'none', stroke:'#ff2f2f',
        'stroke-width': (LV * 0.045).toFixed(3), 'stroke-opacity':'.9',
        'stroke-dasharray': (LV * 0.2).toFixed(2) + ' ' + (LV * 0.14).toFixed(2) }));
    });
  });
}

/* =================================================================
   QUAND ÇA ROULE, L'ÉCHAFAUDAGE DISPARAÎT
   =================================================================
   Le tracé coloré, les points semés, la bande des trottoirs, l'axe des routes :
   rien de tout ça n'existe sur la route. Ce sont les outils du moniteur pendant
   qu'il MONTE son cours. Dès qu'il appuie sur la pédale, l'élève doit voir ce
   qu'il verra au volant — une voiture qui avance sur une photo aérienne, et
   rien d'autre.

   À PARTIR DE QUAND, EXACTEMENT ? Première version : tant que ça ROULE, et tout
   revenait dès la pédale relâchée — pour pouvoir corriger sa ligne entre deux
   explications. C'était trop malin. Capture à l'appui, démonstration en cours
   d'enregistrement, arrêtée une seconde pour parler : le tracé vert, les points
   et les étiquettes étaient tous revenus à l'écran, sous les yeux de l'élève, et
   partaient dans l'enregistrement.

   La demande disait « quand on appuie sur play », et c'est ça qu'il fallait
   entendre : la démonstration commence au premier appui et ne s'interrompt pas
   parce qu'on relâche le pouce. L'échafaudage revient au ⏹, et à lui seul. */
function enMarche() {
  return etat === 'lecture' || etat === 'pause' || etat === 'fin';
}
let traceDessineeEnMarche = false;

function dessinerTrace() {
  els.trace.textContent = '';
  traceDessineeEnMarche = enMarche();
  if (traceDessineeEnMarche) return;
  dessinerTrottoirs();
  dessinerAxes();
  if (!chemin) return;
  const { pts, total, vAff } = chemin;
  const trait = p => p.map((q, j) => (j ? 'L' : 'M') + ax(q.x).toFixed(2) + ' ' + ay(q.y).toFixed(2)).join('');

  /* Estompé quand on règle un autre véhicule : le tracé reste lisible — on a
     besoin de savoir où l'on passe — mais il ne se dispute plus l'attention
     avec celui qu'on est en train de poser. */
  els.trace.setAttribute('opacity', obstacleActif >= 0 ? '.45' : '1');
  els.trace.appendChild(el('path', {
    d: trait(pts), fill:'none', stroke:'#ffffff', 'stroke-opacity':'.9',
    'stroke-width': (LV * 0.30).toFixed(3), 'stroke-linecap':'round', 'stroke-linejoin':'round'
  }));

  /* Sous l'arrêt, on vire au rouge d'un coup plutôt que de dégrader : un
     dégradé du rouge au vert passerait par l'orange, qui veut déjà dire
     « allure ordinaire ». Le niveau -1 est la bande d'arrêt, le 10 le bleu de
     l'insertion — le dégradé ne va que du pas à l'allure ordinaire. */
  const kmhA = i => vAff[i] * mParU * 3.6;
  const niveau = i => { const v = kmhA(i);
    return v < ARRET_KMH ? -1 : v > BLEU_KMH ? 10 : Math.round(partAllure(v) * 9); };
  const couleurDe = nv => nv < 0 ? '#d21f1f' : nv > 9 ? '#2f7fd8' : teinte(nv / 9);
  const large = (LV * 0.155).toFixed(3);
  let debut = 0, nv = niveau(0);
  for (let i = 1; i <= pts.length; i++) {
    const fin = i === pts.length;
    const nvi = fin ? -99 : niveau(i);
    if (fin || nvi !== nv) {
      const tranche = pts.slice(debut, Math.min(i + 1, pts.length));
      if (tranche.length > 1) {
        els.trace.appendChild(el('path', {
          d: trait(tranche), fill:'none', stroke: couleurDe(nv), 'stroke-width': large,
          'stroke-linecap':'round', 'stroke-linejoin':'round'
        }));
      }
      debut = i - 1; nv = nvi;
    }
  }

  // chevrons : le sens de marche, comme un marquage au sol
  const ecartement = LV * 2.2, bras = LV * 0.085;
  for (let q = ecartement * 0.6; q < total - LV * 0.5; q += ecartement) {
    const a = positionSeule(Math.max(0, q - LV * 0.06));
    const b = positionSeule(Math.min(total, q + LV * 0.06));
    const p = positionSeule(q);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    els.trace.appendChild(el('path', {
      d: 'M' + (-bras).toFixed(2) + ' ' + (-bras).toFixed(2) + 'L0 0L' + (-bras).toFixed(2) + ' ' + bras.toFixed(2),
      transform: 'translate(' + ax(p.x).toFixed(2) + ' ' + ay(p.y).toFixed(2) + ') rotate(' + ang.toFixed(1) + ')',
      fill:'none', stroke:'#ffffff', 'stroke-opacity':'.95',
      'stroke-width': (LV * 0.035).toFixed(3), 'stroke-linecap':'round', 'stroke-linejoin':'round'
    }));
  }
}

/* LES POINTS SONT CEUX DU VÉHICULE CHOISI, ET D'AUCUN AUTRE.

   Cinq véhicules sur un giratoire, cinq trajectoires, et la carte se couvre de
   pastilles qui se ressemblent toutes — « ça devient le bordel de fou ». On ne
   pose jamais les points de deux véhicules à la fois : le doigt, lui, le savait
   déjà (`chercherPrise` ne voit que le véhicule sélectionné et sa propre
   trajectoire), c'est le dessin qui ne suivait pas.

   Les TRACÉS restent tous visibles — savoir où passent les autres est tout
   l'intérêt de la scène. Seules les poignées disparaissent. Et la voiture
   auto-école reste toujours attrapable : c'est par elle qu'on revient à sa
   trajectoire. */
function dessinerPoints() {
  els.reperes.textContent = '';
  if (enMarche() || obstacleActif >= 0) return;
  const R = rayonPoint(LV * 0.26);
  mesPoints().forEach(function (p, i) {
    const couleur = couleurAllure(kmhDuPoint(p));
    /* Un point semé par le suivi de route n'est pas un point qu'on a voulu :
       il se montre discrètement, sans anneau blanc ni étiquette, et le doigt
       ne le voit pas (voir chercherPrise). Sinon une rue suivie deviendrait un
       collier de perles où l'on ne peut plus rien attraper. */
    if (p.auto) {
      els.reperes.appendChild(el('circle', {
        cx:ax(p.x).toFixed(2), cy:ay(p.y).toFixed(2), r:(R*0.34).toFixed(3),
        fill: couleur, 'fill-opacity':'.8'
      }));
      return;
    }
    if (saisie && saisie.type === 'point' && saisie.i === i) {
      els.reperes.appendChild(el('circle', {
        cx:ax(p.x).toFixed(2), cy:ay(p.y).toFixed(2), r:(R*1.75).toFixed(3), fill:'none',
        stroke: couleur, 'stroke-opacity':'.55', 'stroke-width':(R*0.34).toFixed(3)
      }));
    }
    els.reperes.appendChild(el('circle', {
      cx:ax(p.x).toFixed(2), cy:ay(p.y).toFixed(2), r:R.toFixed(3), fill:'#ffffff',
      stroke:'#11161b', 'stroke-width':(R*0.16).toFixed(3)
    }));
    els.reperes.appendChild(el('circle', {
      cx:ax(p.x).toFixed(2), cy:ay(p.y).toFixed(2), r:(R*0.6).toFixed(3), fill: couleur
    }));
    /* Le nombre ne s'affiche que s'il a été SAISI. Un point qui suit la route
       n'a rien à dire — et l'écrire partout couvrirait la carte de chiffres
       qui ne demandent rien à personne. */
    if (p.v != null) {
      const h = Math.max(LV * 0.34, 12 / vue.k);
      const t = el('text', {
        x: ax(p.x).toFixed(2), y: (ay(p.y) - R * 1.5).toFixed(2),
        'text-anchor':'middle', 'font-size':h.toFixed(2), 'font-weight':'800',
        fill:'#ffffff', stroke:'#11161b', 'stroke-width':(h * 0.22).toFixed(2),
        'paint-order':'stroke', 'font-family':'inherit'
      });
      t.textContent = p.v === 0 ? 'STOP' : p.v + ' km/h';
      els.reperes.appendChild(t);
    }
  });
}

/* La voiture auto-école, dessinée en repère unitaire : 1 de long, le nez
   vers la droite, puis mise à l'échelle réelle (4 mètres). */
/* ON NE DOIT PAS AVOIR À LA CHERCHER. Une photo aérienne de campagne est pleine
   de voitures blanches sur une route grise, et la nôtre l'était : « elle se
   dissimule dans l'image, regarde ».

   Six essais lui ont été soumis sur sa propre photo — un anneau autour, un
   liseré qui l'épouse, une pastille dessous, un panneau de toit. Le verdict est
   allé au plus simple : LA PEINDRE. « J'aime bien la voiture peinte, mais
   peins le toit aussi. »

   C'est plus juste que tout ce qu'on ajoutait autour : rien n'est ajouté, la
   voiture reste une voiture, et l'orange n'existe nulle part dans un champ, une
   route ou un toit de campagne. Caisse ET toit, donc : vue du ciel, c'est le
   toit qu'on voit, et un toit gris la rendait à la photo. */
const CARROSSERIE = '#f5850a';
const TOIT = '#ffa524';         // un ton plus clair : sans lui, la voiture est une tache

function dessinerVoiture() {
  els.voiture.textContent = '';
  gGeste = null;
  if (seance.voiture.absente) { dessinerPoignee(); return; }

  const g = el('g', { transform: 'scale(' + LV.toFixed(4) + ')' });
  const p = (nom, a) => g.appendChild(el(nom, a));

  p('rect', { x:-.5, y:-.2, width:1, height:.44, rx:.1, fill:'rgba(0,0,0,.3)', transform:'translate(0 .04)' });
  p('rect', { class:'halo-stop', x:-.63, y:-.25, width:.23, height:.5, rx:.11 });
  [[-.3,-.225], [-.3,.225], [.28,-.225], [.28,.225]].forEach(function (r) {
    p('rect', { x:r[0]-.085, y:r[1]-.045, width:.17, height:.09, rx:.035, fill:'#171b20' });
  });
  p('path', {
    d:'M-.44-.205C-.485-.205-.5-.17-.5-.135L-.5.135C-.5.17-.485.205-.44.205L.34.205C.43.205.49.165.5.095L.5-.095C.49-.165.43-.205.34-.205Z',
    fill: CARROSSERIE, stroke:'#11161b', 'stroke-width':.024
  });
  p('path', {
    d:'M-.26-.165C-.29-.165-.3-.14-.3-.11L-.3.11C-.3.14-.29.165-.26.165L.18.165C.235.165.27.12.275.06L.275-.06C.27-.12.235-.165.18-.165Z',
    fill:'#33404c'
  });
  p('rect', { x:-.165, y:-.15, width:.27, height:.3, rx:.05, fill: TOIT });
  p('rect', { x:-.1, y:-.082, width:.16, height:.164, rx:.028, fill:'#0f3b86', stroke:'#ffffff', 'stroke-width':.02 });
  p('rect', { x:.45, y:-.165, width:.05, height:.075, rx:.022, fill:'#ffe9a8' });
  p('rect', { x:.45, y:.09,   width:.05, height:.075, rx:.022, fill:'#ffe9a8' });
  [-.19, .105].forEach(function (y) {
    p('rect', { class:'stop-eteint', x:-.5,   y:y,      width:.058, height:.085, rx:.022 });
    p('rect', { class:'stop-allume', x:-.505, y:y-.006, width:.07,  height:.097, rx:.026 });
  });

  /* Les rétroviseurs extérieurs : deux moignons qui dépassent de la caisse.
     Ils n'étaient pas dessinés tant que le conducteur vivait dans son encart —
     maintenant c'est sur eux que le geste s'allume. */
  [-.247, .247].forEach(function (y) {
    p('rect', { x:.10, y:(y - .03).toFixed(3), width:.075, height:.06, rx:.022,
                fill:'#e6eae7', stroke:'#11161b', 'stroke-width':.022 });
  });

  els.voiture.appendChild(g);

  /* LES CLIGNOTANTS. Une lampe de voiture fait 25 cm. Au zoom de travail, la
     voiture entière ne fait que vingt-cinq pixels de long : la lampe en fait
     donc deux, autant dire rien — et c'est pourtant LE geste qu'on montre.

     Premier essai : des chevrons qui battaient à côté de la voiture. Verdict du
     propriétaire, sans appel — « c'est HORRIBLE ». Il avait raison : ça ne
     ressemblait à rien de ce qu'on voit sur une route.

     Ce sont donc les lampes elles-mêmes qu'on grossit, halo compris. Elles
     gardent une taille PLANCHER à l'écran, comme les panneaux et les points :
     prendre du champ ne doit pas les éteindre. Et un PLAFOND, sinon à faible
     zoom elles finissaient plus grosses que la voiture.

     Les quatre sont dessinées une fois pour toutes ; c'est la classe de la
     voiture qui décide lesquelles battent, donc rien à refaire à chaque
     image. */
  const RL = Math.min(LV * 0.38, Math.max(LV * 0.085, LAMPE_MINI / vue.k));
  const gl = el('g', {});
  [['g', -1], ['d', 1]].forEach(function (c) {
    [LV * 0.46, -LV * 0.46].forEach(function (x) {
      const y = c[1] * LV * 0.20;
      gl.appendChild(el('circle', { class:'clignoHalo ' + c[0],
        cx:x.toFixed(2), cy:y.toFixed(2), r:(RL * 2.2).toFixed(2) }));
      gl.appendChild(el('circle', { class:'cligno ' + c[0],
        cx:x.toFixed(2), cy:y.toFixed(2), r:RL.toFixed(2),
        stroke:'#11161b', 'stroke-width':(RL * 0.28).toFixed(2) }));
    });
  });
  els.voiture.appendChild(gl);
  /* Le geste se dessine PAR-DESSUS la voiture, dans le même repère : il tourne
     avec elle, mais il a sa propre échelle — voir dessinerGeste. */
  gGeste = el('g', {});
  els.voiture.appendChild(gGeste);
  placerVoiture();
}

/* Un obstacle vu de dessus. Le dessin tient dans une boîte d'UNE unité de
   long, la largeur étant le rapport du véhicule : la même fonction sert donc au
   camion comme au vélo, et l'échelle fait le reste. Teintes franchement grises,
   pour qu'on ne les confonde jamais avec la voiture auto-école au
   vidéoprojecteur. */
const TAILLE_MINI = 15;      // pixels : en deçà, un obstacle ne se voit plus

/* Une cible au doigt ne se mesure pas en mètres. Un point de trajectoire vaut
   2,7 m de rayon d'attrape : confortable au zoom de travail, deux pixels dès
   qu'on prend du champ — et le point devient impossible à saisir alors qu'on le
   voit. On garde donc un plancher en PIXELS, comme pour le dessin des
   obstacles. 24 px de rayon, c'est une cible de 48 px : la pulpe d'un doigt. */
const CIBLE_DOIGT = 24;
const auDoigt = enU => Math.max(enU, CIBLE_DOIGT / vue.k);

/* Et ce qu'on ne voit plus, on ne le vise pas : les points gardent eux aussi
   une taille plancher à l'écran. */
const POINT_MINI = 6;       // pixels de rayon
const rayonPoint = enU => Math.max(enU, POINT_MINI / vue.k);

function rayonPoignee(ob) {
  const o = obstacleDe(ob.t);
  return Math.max(o.L / mParU, TAILLE_MINI / vue.k) * 0.55 + LV * 0.55;
}

/* Un chemin dont le dernier point retombe **dans le cercle de la poignée** est un
   circuit : le véhicule le refait indéfiniment. C'est ce qui permet de peupler
   un giratoire d'une circulation qui tourne, au lieu de véhicules qui s'arrêtent
   au bout de leur tracé.

   Le cercle de la poignée est déjà à l'écran : on voit donc où lâcher le point,
   au lieu de deviner un seuil. Mais ce cercle grandit quand on dézoome — il
   garde une taille constante à l'écran — et le circuit ne doit pas se faire et
   se défaire au gré du zoom. La décision est donc prise **au moment du geste**,
   quand le cercle est sous les yeux, et retenue. */
function majCircuit(ob) {
  if (!ob) return;
  const n = (ob.points || []).length;
  const d = n ? ob.points[n - 1] : null;
  ob.circuit = n >= 3 && Math.hypot(d.x - ob.x, d.y - ob.y) < rayonPoignee(ob);
}

function enBoucle(ob) {
  return !!ob.circuit && (ob.points || []).length >= 3;
}

/* Le chemin d'un véhicule. S'il boucle, on fait coïncider EXACTEMENT son dernier
   point avec son départ : sans ça le tour se rejoue avec un saut à chaque
   passage. */
function cheminObstacle(ob) {
  if (!ob.points || !ob.points.length) return null;
  let liste = ob.points;
  if (enBoucle(ob)) {
    /* Le dernier point est le GESTE de fermeture, pas un passage : il est à
       quelques mètres du véhicule, et le garder en plus du véhicule met deux
       sommets côte à côte, ce qui fait gonfler la courbe. On le remplace donc par
       le véhicule. Mesuré sur un anneau de 18 m : écart maximal 0,46 m en le
       jetant, 1,07 m en le gardant. */
    const q = liste[liste.length - 1];
    liste = liste.slice(0, -1).concat([{ x: ob.x, y: ob.y, v: q.v }]);
    return construireChemin(ob, liste, true);
  }
  return construireChemin(ob, liste);
}

function dessinerObstacles() {
  els.obstacles.textContent = '';

  /* La trajectoire du véhicule d'abord, sous lui : c'est un décor, pas un
     acteur. Trait plein pour celui qu'on vient de toucher, estompé pour les
     autres — c'est ce qui dit à qui appartient la trajectoire qu'on trace.

     Et comme le tracé de l'élève, elle s'efface dès que ça roule : le chemin
     d'une voiture qui vient n'est pas peint sur la chaussée. Les véhicules,
     eux, restent — ce sont justement eux qu'on regarde. */
  if (!enMarche()) seance.obstacles.forEach(function (ob, i) {
    if (!ob.points || !ob.points.length) return;
    const ch = ob.chemin;
    const actif = i === obstacleActif;
    if (ch) {
      let d = '';
      ch.pts.forEach(function (q, k) {
        d += (k ? 'L' : 'M') + ax(q.x).toFixed(2) + ' ' + ay(q.y).toFixed(2);
      });
      els.obstacles.appendChild(el('path', { d:d, fill:'none', stroke:GRIS_TRAJET,
        'stroke-width':(LV * 0.155).toFixed(3), 'stroke-linecap':'round',
        'stroke-linejoin':'round', 'stroke-opacity': actif ? '.95' : '.55' }));
    }
    if (!actif) return;                 // les poignées n'appartiennent qu'au véhicule choisi
    ob.points.forEach(function (q) {
      const rp = rayonPoint(LV * 0.17);
      els.obstacles.appendChild(el('circle', { cx:ax(q.x).toFixed(3), cy:ay(q.y).toFixed(3),
        r:rp.toFixed(3), fill:(q.v != null ? couleurAllure(q.v) : GRIS_VIF), stroke:'#11161b',
        'stroke-width':(rp * 0.26).toFixed(3) }));
    });
  });

  seance.obstacles.forEach(function (ob) {
    const o = obstacleDe(ob.t);
    if (!o) return;
    if (ob.absent) return;                // sorti de la scène : il n'y a rien à montrer
    const ech = Math.max(o.L / mParU, TAILLE_MINI / vue.k), w = o.l / o.L;
    const q = poseActuelle(ob);
    const px = q.x, py = q.y, pcap = q.cap;
    const g = el('g', { transform:
      'translate(' + ax(px).toFixed(3) + ' ' + ay(py).toFixed(3) + ') '
      + 'rotate(' + pcap.toFixed(2) + ') scale(' + ech.toFixed(5) + ')' });
    const p = (nom, a) => g.appendChild(el(nom, a));
    const fond = fondVehicule(ob);

    if (o.id === 'pieton') {
      p('circle', { cx:0, cy:.1, r:.46, fill:'rgba(0,0,0,.35)' });
      p('circle', { cx:0, cy:0, r:.44, fill:fond, stroke:'#11161b', 'stroke-width':.07 });
      p('circle', { cx:.19, cy:0, r:.12, fill:'#11161b' });      // le nez : il regarde quelque part
    } else if (o.id === 'velo') {
      p('rect', { x:-.5, y:-w/2 + .08, width:1, height:w, rx:w/2, fill:'rgba(0,0,0,.35)' });
      p('circle', { cx:-.33, cy:0, r:w*.62, fill:'none', stroke:'#11161b', 'stroke-width':.07 });
      p('circle', { cx:.33, cy:0, r:w*.62, fill:'none', stroke:'#11161b', 'stroke-width':.07 });
      p('rect', { x:-.34, y:-w*.42, width:.6, height:w*.84, rx:w*.42,
                  fill:fond, stroke:'#11161b', 'stroke-width':.05 });
    } else {
      p('rect', { x:-.5, y:-w/2 + w*.14, width:1, height:w, rx:w*.24, fill:'rgba(0,0,0,.35)' });
      [[-.3,-w/2], [-.3,w/2], [.3,-w/2], [.3,w/2]].forEach(function (r) {
        p('rect', { x:r[0]-.07, y:r[1]-.045, width:.14, height:.09, rx:.035, fill:'#171b20' });
      });
